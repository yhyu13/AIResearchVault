    options: ["A. 首个跨全部 Hanabi 设定（2–5 人）并发游玩的 generalist agent", "B. 文本化 reformulation 提升 zero-shot 迁移", "C. self-play 即可实现 partner generalization", "D. 可与异构算法 agent 即插即用协作", "E. 首次引入 LLM 作为 Hanabi 策略网络", "F. 与真人玩家完成大规模协作验证"],

];

const trueFalseQuestions = [

    correct: false,

      "✅ 正确理解：无 prompt 时 Peer Evaluation 中所有模型 100% 选择欺骗——scheming propensity 是自发倾向，multi-agent 部署不能假设'没被教坏就不会骗'。",
      "❌ 常见误解：把'能力需要提示激发'误当成'倾向也需要提示激发'——论文的核心就是区分 ability（prompted 近完美）与 propensity（unprompted 已自发）。"
    ],
    followup: "追问：自发 scheming 倾向会随模型规模上升还是下降？ → 答：论文未回答，这是开放问题；若随 capability 上升，则 alignment 与 capability 存在根本冲突。",
    detailLink: "01e-human-ai-interaction-latest.md#5-scheming-ability-in-llm-to-llm-strategic-interactions"
  },
  {
    paper: "Beyond Survival",
    text: "Beyond Survival 用'存活时间'作为狼人杀评测的主要指标，因为存活越久代表策略越好。",
    correct: false,
    explanations: [
      "✅ 正确理解：论文恰恰是批评 self-play + 存活时间/主观打分的粗糙指标，提出 strategy-alignment——以获胜阵营策略为 reference 的 Speech（五维 MC）+ Decision（投票/角色推断）两阶段评测。",
      "❌ 常见误解：存活时间与策略质量弱相关（苟活不等于会玩）；reference-ification 才是本文方法论贡献。"

    explanations: [
      "✅ 正确理解：R3D2 的亮点恰恰是 self-play 即可实现 partner generalization，不需 population play 等复杂 MARL 技巧——工程上很便宜；关键在文本化表示让 convention 可迁移。",

    explanations: [
      "✅ 正确理解：恰好相反——人类直接接受率仅 56.3%（AI 67.6%），人类更不可靠且更激进；这一行为差异被 reverse-engineering 成 prompting 改进（胜率 22.2% → 32.7%）。",
      "❌ 常见误解：'AI 不可信'的刻板印象在 C2C 数据上不成立；'人 vs AI 行为差异'本身是改进 AI 的信号源。"

/* ================= 引擎 ================= */
const TYPE_NAMES = { drag: "拖拽填空", single: "单选题", multi: "多选题", tf: "判断题" };
let allQuestions = [];
let state = {}; // key -> {answered, correctBool, score}
let current = { type: "drag", idx: 0 };
let selections = {}; // transient selections per question key
let dashFilter = "all";

function qKey(type, idx) { return type + "-" + idx; }
function buildAll() {
  allQuestions = [];
  dragQuestions.forEach((q, i) => allQuestions.push({ type: "drag", idx: i, paper: q.paper }));
  singleQuestions.forEach((q, i) => allQuestions.push({ type: "single", idx: i, paper: q.paper }));
  multiQuestions.forEach((q, i) => allQuestions.push({ type: "multi", idx: i, paper: q.paper }));
  trueFalseQuestions.forEach((q, i) => allQuestions.push({ type: "tf", idx: i, paper: q.paper }));
}
function getQ(type, idx) {
  return type === "drag" ? dragQuestions[idx] : type === "single" ? singleQuestions[idx] : type === "multi" ? multiQuestions[idx] : trueFalseQuestions[idx];
}
function maxScore() { return allQuestions.length; }
function curScore() { return Object.values(state).filter(s => s.correctBool).length; }

function renderQuestion() {
  const area = document.getElementById("quizArea");
  const { type, idx } = current;
  const q = getQ(type, idx);
  const key = qKey(type, idx);
  const st = state[key];
  let html = `<div class="card"><span class="qtype-tag">${TYPE_NAMES[type]}</span><span class="paper-tag">${q.paper}</span>`;

  if (type === "drag") {
    let text = q.text;
    for (let i = 0; i < q.answers.length; i++) {
      const sel = (selections[key] && selections[key][i]) || "";
      const cls = st ? (sel === q.answers[i] ? "correct" : "wrong") : (sel ? "filled" : "");
      text = text.replace("{" + i + "}", `<span class="blank ${cls}" data-blank="${i}">${sel || "（点击填入）"}</span>`);
    }
    html += `<div class="question-text">${text}</div><div class="pool">`;
    q.pool.forEach(p => {
      const used = (selections[key] || []).includes(p);
      html += `<span class="chip ${used ? "used" : ""}" data-chip="${encodeURIComponent(p)}">${p}</span>`;
    });
    html += `</div>`;
  } else if (type === "single" || type === "multi") {
    html += `<div class="question-text">${q.text}</div>`;
    const sel = selections[key] || (type === "multi" ? [] : null);
    q.options.forEach((opt, i) => {
      let cls = "";
      if (st) {
        const isCorrect = type === "single" ? i === q.correct : q.correct.includes(i);
        const chosen = type === "single" ? sel === i : sel.includes(i);
        if (isCorrect) cls = "correct";
        else if (chosen) cls = "wrong";
      } else {
        const chosen = type === "single" ? sel === i : sel.includes(i);
        if (chosen) cls = "selected";
      }
      html += `<button class="opt ${cls}" data-opt="${i}" ${st ? "disabled" : ""}>${opt}</button>`;
    });
  } else { // tf
    html += `<div class="question-text">${q.text}</div><div class="tf-row">`;
    ["✅ 正确", "❌ 错误"].forEach((label, i) => {
      const val = i === 0; // true / false
      const sel = selections[key];
      let cls = "";
      if (st) {
        if (val === q.correct) cls = "correct";
        else if (sel === val) cls = "wrong";
      } else if (sel === val) cls = "selected";
      html += `<button class="opt ${cls}" data-tf="${val}" ${st ? "disabled" : ""}>${label}</button>`;
    });
    html += `</div>`;
  }

  // explanation
  if (st) {
    html += `<div class="explain show">`;
    if (type === "drag") {
      q.explanations.forEach((e, i) => { html += `<p><b>空 ${i + 1}：</b>${e}</p>`; });
    } else if (type === "single" || type === "multi") {
      q.explanations.forEach((e, i) => {
        const cls = e.startsWith("✅") ? "good" : "bad";
        html += `<p class="${cls}"><b>${q.options[i].slice(0, 1)}.</b> ${e}</p>`;
      });
    } else {
      q.explanations.forEach(e => {
        const cls = e.startsWith("✅") ? "good" : "bad";
        html += `<p class="${cls}">${e}</p>`;
      });
      if (q.followup) html += `<div class="followup">🔗 ${q.followup}</div>`;
    }
    html += `<p style="margin-top:8px;font-size:.8rem;color:#8a7d68;">📖 详见笔记：${q.detailLink}</p></div>`;
  }

  // actions + nav
  html += `<div class="nav-row">
    <span>
      ${!st ? `<button class="primary" id="btnCheck">检查答案</button> <button id="btnReset">重置本题</button>` : ""}
    </span>
    <span>
      <button id="btnPrev">← 上一题</button>
      <button id="btnNext">下一题 →</button>
    </span></div></div>`;
  area.innerHTML = html;
  bindCard(type, idx, q, key);
  updateBar();
}

function bindCard(type, idx, q, key) {
  if (type === "drag") {
    document.querySelectorAll(".chip").forEach(c => {
      c.addEventListener("click", () => {
        if (state[key]) return;
        const val = decodeURIComponent(c.dataset.chip);
        selections[key] = selections[key] || [];
        const slot = selections[key].indexOf("");
        const target = slot >= 0 ? slot : selections[key].length;
        if (target < q.answers.length) { selections[key][target] = val; renderQuestion(); }
      });
    });
    document.querySelectorAll(".blank").forEach(b => {
      b.addEventListener("click", () => {
        if (state[key]) return;
        const i = +b.dataset.blank;
        if (selections[key] && selections[key][i]) { selections[key][i] = ""; renderQuestion(); }
      });
    });
  } else if (type === "single") {
    document.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => { selections[key] = +b.dataset.opt; renderQuestion(); }));
  } else if (type === "multi") {
    document.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.opt;
      selections[key] = selections[key] || [];
      const p = selections[key].indexOf(i);
      if (p >= 0) selections[key].splice(p, 1); else selections[key].push(i);
      renderQuestion();
    }));
  } else {
    document.querySelectorAll("[data-tf]").forEach(b => b.addEventListener("click", () => { selections[key] = b.dataset.tf === "true"; renderQuestion(); }));
  }

  const btnCheck = document.getElementById("btnCheck");
  if (btnCheck) btnCheck.addEventListener("click", () => {
    let correct = false, answered = false;
    if (type === "drag") {
      const s = selections[key] || [];
      answered = s.filter(x => x).length === q.answers.length;
      correct = answered && q.answers.every((a, i) => s[i] === a);
    } else if (type === "single") {
      answered = selections[key] !== undefined && selections[key] !== null;
      correct = answered && selections[key] === q.correct;
    } else if (type === "multi") {
      const s = selections[key] || [];
      answered = s.length > 0;
      correct = answered && s.length === q.correct.length && q.correct.every(i => s.includes(i));
    } else {
      answered = selections[key] !== undefined;
      correct = answered && selections[key] === q.correct;
    }
    if (!answered) { alert("请先作答再检查答案"); return; }
    state[key] = { answered: true, correctBool: correct };
    renderQuestion();
  });
  const btnReset = document.getElementById("btnReset");
  if (btnReset) btnReset.addEventListener("click", () => { delete selections[key]; renderQuestion(); });

  document.getElementById("btnPrev").addEventListener("click", () => step(-1));
  document.getElementById("btnNext").addEventListener("click", () => step(1));
}

function step(d) {
  const i = allQuestions.findIndex(x => x.type === current.type && x.idx === current.idx);
  const n = (i + d + allQuestions.length) % allQuestions.length;
  current = { type: allQuestions[n].type, idx: allQuestions[n].idx };
  renderQuestion();
}

function updateBar() {
  const answered = Object.keys(state).length;
  document.getElementById("scoreVal").textContent = curScore();
  document.getElementById("scoreMax").textContent = maxScore();
  const i = allQuestions.findIndex(x => x.type === current.type && x.idx === current.idx);
  document.getElementById("progressText").textContent = `第 ${i + 1} / ${allQuestions.length} 题 · 已答 ${answered}`;
  document.getElementById("progressFill").style.width = (answered / allQuestions.length * 100) + "%";
}

/* 总览面板 */
function renderDashboardGrid() {
  const grid = document.getElementById("dashGrid");
  grid.innerHTML = "";
  allQuestions.forEach((a, i) => {
    const st = state[qKey(a.type, a.idx)];
    let cls = "", status = "⬜ 未答";
    if (st && st.correctBool) { cls = "st-correct"; status = "✅ 正确"; }
    else if (st) { cls = "st-wrong"; status = "❌ 错误"; }
    if (dashFilter === "correct" && !(st && st.correctBool)) return;
    if (dashFilter === "wrong" && !(st && !st.correctBool)) return;
    if (dashFilter === "todo" && st) return;
    const cell = document.createElement("div");
    cell.className = "dash-cell " + cls;
    cell.innerHTML = `<div class="t">#${i + 1} ${TYPE_NAMES[a.type]}</div><div>${a.paper}</div><div>${status}</div>`;
    cell.addEventListener("click", () => { current = { type: a.type, idx: a.idx }; closeDash(); renderQuestion(); });
    grid.appendChild(cell);
  });
}
function openDash() { renderDashboardGrid(); document.getElementById("dashOverlay").classList.add("open"); }
function closeDash() { document.getElementById("dashOverlay").classList.remove("open"); }

/* 洗牌 */
function shuffleQuestionData(questions, isMulti) {
  questions.forEach(q => {
    const pairs = q.options.map((opt, i) => ({ opt, expl: q.explanations[i], wasCorrect: isMulti ? q.correct.includes(i) : i === q.correct }));
    for (let i = pairs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
    }
    q.options = pairs.map(p => p.opt);
    q.explanations = pairs.map(p => p.expl);
    if (isMulti) q.correct = pairs.map((p, i) => p.wasCorrect ? i : -1).filter(i => i >= 0);
    else q.correct = pairs.findIndex(p => p.wasCorrect);
  });
}

/* 结果 */
function showResult() {
  const s = curScore(), m = maxScore();
  document.getElementById("resultScore").textContent = s + " / " + m;
  const pct = s / m;
  document.getElementById("resultComment").textContent =
    pct >= 0.85 ? "🔥 优秀！可以直接去面试聊这个方向了。" :
    pct >= 0.6 ? "👍 不错，错题回笔记对应章节再精读一遍。" :
    "📚 建议先重读笔记的「方向横向观察」和各篇 AI 预读，再来二刷。";
  document.getElementById("resultBox").classList.add("show");
  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("scoreBar").classList.add("hidden");
  document.getElementById("progressBarWrap").classList.add("hidden");
}
function hideResult() {
  document.getElementById("resultBox").classList.remove("show");
  document.getElementById("quizArea").classList.remove("hidden");
  document.getElementById("scoreBar").classList.remove("hidden");
  document.getElementById("progressBarWrap").classList.remove("hidden");
}

/* 绑定工具栏 */
document.getElementById("btnDashboard").addEventListener("click", openDash);
document.getElementById("btnCloseDash").addEventListener("click", closeDash);
document.querySelectorAll(".df").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".df").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  dashFilter = b.dataset.filter;
  renderDashboardGrid();
}));
document.getElementById("btnShuffle").addEventListener("click", () => {
  if (!confirm("洗牌将打乱单选/多选选项位置，并清空所有答题记录。继续？")) return;
  shuffleQuestionData(singleQuestions, false);
  shuffleQuestionData(multiQuestions, true);
  state = {}; selections = {};
  current = { type: "drag", idx: 0 };
  hideResult(); renderQuestion();
});
document.getElementById("btnResetAll").addEventListener("click", () => {
  if (!confirm("清空全部答题记录？")) return;
  state = {}; selections = {};
  hideResult(); renderQuestion();
});
document.getElementById("btnFinish").addEventListener("click", showResult);
document.getElementById("btnResultDash").addEventListener("click", () => { hideResult(); openDash(); });
document.getElementById("btnResultContinue").addEventListener("click", hideResult);
document.getElementById("dashOverlay").addEventListener("click", e => { if (e.target.id === "dashOverlay") closeDash(); });

buildAll();
renderQuestion();
</script>
