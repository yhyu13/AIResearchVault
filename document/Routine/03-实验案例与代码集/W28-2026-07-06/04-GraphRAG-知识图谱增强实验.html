<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04-GraphRAG：知识图谱增强实验 — 互动知识卡牌</title>
<style>
  :root {
    --bg: #f6f8fb;
    --card: #ffffff;
    --primary: #2b6cb0;
    --primary-light: #ebf4ff;
    --accent: #38a169;
    --accent-light: #e6fffa;
    --danger: #e53e3e;
    --danger-light: #fff5f5;
    --warn: #d69e2e;
    --warn-light: #fffaf0;
    --text: #2d3748;
    --text-muted: #718096;
    --border: #e2e8f0;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    color: var(--primary);
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.95rem;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.92rem;
    transition: transform .08s, box-shadow .15s, background .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .score-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .score-bar .progress-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-track {
    flex: 1;
    height: 10px;
    background: #edf2f7;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), #63b3ed);
    border-radius: 999px;
    transition: width .4s ease;
  }
  .score-text { font-weight: 700; color: var(--primary); white-space: nowrap; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .badge.sc { background: var(--primary-light); color: var(--primary); }
  .badge.mc { background: var(--accent-light); color: var(--accent); }
  .badge.tf { background: var(--warn-light); color: var(--warn); }
  .badge.drag { background: #e9d8fd; color: #6b46c1; }
  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  @media (min-width: 640px) {
    .options { grid-template-columns: 1fr 1fr; }
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    background: #fff;
    transition: background .15s, border-color .15s;
  }
  .option:hover { background: #f7fafc; }
  .option input { margin-top: 3px; }
  .option.correct { border-color: var(--accent); background: var(--accent-light); }
  .option.wrong { border-color: var(--danger); background: var(--danger-light); }
  .option.missed { border-color: var(--warn); background: var(--warn-light); }
  .option.disabled { pointer-events: none; opacity: .85; }
  .explanation {
    display: none;
    margin-top: 10px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #f7fafc;
    border-left: 4px solid var(--primary);
    font-size: 0.95rem;
    color: #2d3748;
  }
  .explanation.show { display: block; }
  .nav-btns {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
  }
  .nav-btns .btn { flex: 1; }
  .drag-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
    min-height: 40px;
  }
  .drag-item {
    padding: 6px 12px;
    background: var(--primary-light);
    color: var(--primary);
    border: 1px dashed var(--primary);
    border-radius: 8px;
    cursor: grab;
    user-select: none;
    font-size: 0.92rem;
  }
  .drag-item.dragging { opacity: .5; }
  .drop-zone {
    display: inline-block;
    min-width: 120px;
    padding: 6px 10px;
    border: 2px dashed #cbd5e0;
    border-radius: 8px;
    background: #fff;
    text-align: center;
    vertical-align: middle;
    transition: border-color .2s, background .2s;
  }
  .drop-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
  .drop-zone.correct { border-color: var(--accent); background: var(--accent-light); }
  .drop-zone.wrong { border-color: var(--danger); background: var(--danger-light); }
  .drop-zone .filled { font-weight: 700; color: var(--primary); }
  .drop-sentence { line-height: 2.2; }
  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .thumb {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.9rem;
    transition: transform .1s;
  }
  .thumb:hover { transform: scale(1.05); }
  .thumb.correct { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .thumb.wrong { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
  .thumb.missed { background: var(--warn-light); border-color: var(--warn); color: var(--warn); }
  .thumb.answered { background: #e2e8f0; border-color: #a0aec0; color: #4a5568; }
  .filter-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
  }
  .filter-bar .btn { font-size: 0.85rem; padding: 6px 10px; }
  .result-panel {
    display: none;
    text-align: center;
    padding: 30px 20px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .result-panel.show { display: block; }
  .big-score { font-size: 3rem; font-weight: 800; color: var(--primary); }
  .result-msg { font-size: 1.1rem; color: var(--text-muted); margin-top: 6px; }
  .hidden { display: none !important; }
  .tf-options { display: flex; gap: 12px; margin-top: 10px; }
  .tf-option {
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    background: #fff;
  }
  .tf-option:hover { background: #f7fafc; }
  .tf-option.correct { border-color: var(--accent); background: var(--accent-light); }
  .tf-option.wrong { border-color: var(--danger); background: var(--danger-light); }
  .tf-option.disabled { pointer-events: none; opacity: .85; }
  .section-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin: 18px 0 10px; }
  .hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>04-GraphRAG：知识图谱增强实验</h1>
    <p>互动知识卡牌 · 拖拽填空 · 单选 · 多选 · 判断</p>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="btnOverview" onclick="showOverview()">📋 总览面板</button>
    <button class="btn" id="btnShuffle" onclick="shuffleAllOptions()">🎲 重新洗牌选项</button>
    <button class="btn" onclick="resetAll()">🔄 重置全部</button>
    <button class="btn accent" onclick="checkCurrent()">✅ 检查答案</button>
  </div>

  <div class="score-bar">
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressText">0 / 0</span>
    </div>
    <div class="score-text">得分: <span id="scoreNum">0</span></div>
  </div>

  <div id="quizContainer"></div>

  <div class="result-panel" id="resultPanel">
    <div class="big-score" id="finalScore">0</div>
    <div class="result-msg" id="resultMsg">继续加油！</div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;">
      <button class="btn primary" onclick="hideResult()">🔙 返回查看</button>
      <button class="btn accent" onclick="resetAll()">🔄 继续做题</button>
    </div>
  </div>

  <div class="nav-btns">
    <button class="btn" id="btnPrev" onclick="prevQuestion()">⬅️ 上一题</button>
    <button class="btn" id="btnNext" onclick="nextQuestion()">下一题 ➡️</button>
  </div>
</div>

<script>
/* ===================== 数据 ===================== */

var allQuestions = [
  // ---------- 拖拽填空 (4道) ----------
  {
    id: "D1",
    type: "drag",
    question: "请将正确的术语填入 GraphRAG Pipeline 的架构空白处：",
    sentence: "GraphRAG 的核心流程包括：① 使用 {A} 从文本中抽取实体和关系；② 将三元组存入 {B} 或 NetworkX；③ 通过 {C} 算法检测语义社区；④ 局部搜索使用 {D} 获取邻居子图；⑤ 全局搜索基于社区摘要回答主题性问题。",
    blanks: ["A","B","C","D"],
    answers: { A:"LLM", B:"Neo4j", C:"Louvain/Leiden", D:"BFS" },
    pool: ["LLM", "Neo4j", "Louvain/Leiden", "BFS", "K-Means", "TF-IDF", "反向传播", "梯度下降"],
    explanation: "GraphRAG 的标准流程：LLM 负责抽取实体/关系；Neo4j 或 NetworkX 存储图谱；Louvain/Leiden 做社区检测；局部搜索使用 BFS 逐层扩展邻居子图。"
  },
  {
    id: "D2",
    type: "drag",
    question: "将评估指标填入对应的定义空白处：",
    sentence: "{A} 衡量答案与标准答案是否一致；{B} 综合精确率和召回率；{C} 衡量查询实体在图谱中的存在比例；{D} 专门评估需要跨越多条边推理的问题。",
    blanks: ["A","B","C","D"],
    answers: { A:"Answer Accuracy", B:"F1 Score", C:"Entity Coverage", D:"Multi-hop Accuracy" },
    pool: ["Answer Accuracy", "F1 Score", "Entity Coverage", "Multi-hop Accuracy", "BLEU", "ROUGE", "Perplexity", "AUC"],
    explanation: "Answer Accuracy 是最直观的端到端指标；F1 综合精确率和召回率；Entity Coverage 是检索阶段的上限指标；Multi-hop Accuracy 专门衡量多跳推理能力。"
  },
  {
    id: "D3",
    type: "drag",
    question: "将搜索策略填入对应的适用场景空白处：",
    sentence: "事实性问答（如 'A 和 B 有什么关系？'）适合使用 {A}；主题概览（如 '这个领域有哪些关键技术？'）适合使用 {B}；当不确定问题类型时，推荐 {C} 以获得最佳效果；hops=2 是局部搜索的 {D}，能在召回与噪声间取得平衡。",
    blanks: ["A","B","C","D"],
    answers: { A:"局部搜索", B:"全局搜索", C:"Local + Global", D:"sweet spot" },
    pool: ["局部搜索", "全局搜索", "Local + Global", "sweet spot", "hops=1", "hops=3", "随机搜索", "暴力枚举"],
    explanation: "局部搜索适合事实性问答，全局搜索适合主题概览，两者结合效果最佳。hops=2 是经验上的 sweet spot，hops=1 容易遗漏间接关系，hops=3+ 噪声显著增加。"
  },
  {
    id: "D4",
    type: "drag",
    question: "将代码中的关键类/函数填入对应职责空白处：",
    sentence: "{A} 类负责存储实体节点和关系边，并提供 get_neighbor_subgraph 方法；{B} 类封装局部搜索和全局搜索逻辑；{C} 函数使用 LLM 从文本中抽取实体和关系；{D} 参数控制邻居扩展的跳数，默认值为 2。",
    blanks: ["A","B","C","D"],
    answers: { A:"KnowledgeGraph", B:"GraphRAGRetriever", C:"extract_entities_relations", D:"hops" },
    pool: ["KnowledgeGraph", "GraphRAGRetriever", "extract_entities_relations", "hops", "community_detection", "best_partition", "OpenAI", "temperature"],
    explanation: "KnowledgeGraph 是底层存储；GraphRAGRetriever 封装检索策略；extract_entities_relations 是抽取入口；hops 参数控制局部搜索的扩展深度。"
  },

  // ---------- 单选题 (10道) ----------
  {
    id: "S1",
    type: "single",
    question: "GraphRAG 实验中，哪种方法在多跳问答上取得了最高准确率？",
    options: [
      { label: "A", text: "Naive RAG" },
      { label: "B", text: "GraphRAG (Local)" },
      { label: "C", text: "GraphRAG (Global)" },
      { label: "D", text: "GraphRAG (Local + Global)" }
    ],
    correct: "D",
    explanation: "实验结果显示 GraphRAG (Local + Global) 的多跳准确率为 0.58，高于 Local 的 0.52 和 Global 的 0.48，Naive RAG 仅为 0.35。"
  },
  {
    id: "S2",
    type: "single",
    question: "在 GraphRAG 的局部搜索中，默认的 hops 值是多少？",
    options: [
      { label: "A", text: "1" },
      { label: "B", text: "2" },
      { label: "C", text: "3" },
      { label: "D", text: "4" }
    ],
    correct: "B",
    explanation: "代码中 local_search 的 hops 默认值为 2，这是经验上的 sweet spot，平衡了召回率和噪声。"
  },
  {
    id: "S3",
    type: "single",
    question: "社区检测算法 Louvain 的核心优化目标是什么？",
    options: [
      { label: "A", text: "最小化图的直径" },
      { label: "B", text: "最大化模块度（Modularity）" },
      { label: "C", text: "最小化边数" },
      { label: "D", text: "最大化节点度数" }
    ],
    correct: "B",
    explanation: "Louvain 算法基于模块度（Modularity）优化，目标是最大化社区内部边的密度相对于随机图的差异。"
  },
  {
    id: "S4",
    type: "single",
    question: "在 extract_entities_relations 函数中，temperature 被设置为 0.0 的主要目的是？",
    options: [
      { label: "A", text: "提高生成速度" },
      { label: "B", text: "保证输出确定性，避免随机性导致抽取结果不一致" },
      { label: "C", text: "降低 API 调用成本" },
      { label: "D", text: "增加抽取的实体数量" }
    ],
    correct: "B",
    explanation: "temperature=0.0 使 LLM 输出确定性最强，避免随机性导致同一文本多次抽取结果不一致，保证实验可复现性。"
  },
  {
    id: "S5",
    type: "single",
    question: "Entity Coverage（实体覆盖率）低意味着什么？",
    options: [
      { label: "A", text: "检索策略需要优化" },
      { label: "B", text: "图谱构建阶段漏抽了关键实体，后续问答不可能正确" },
      { label: "C", text: "LLM 生成答案的质量差" },
      { label: "D", text: "社区检测算法选择不当" }
    ],
    correct: "B",
    explanation: "Entity Coverage 是检索阶段的上限指标。Coverage 低说明查询中的实体在图谱中找不到，后续问答不可能正确，问题出在图谱构建阶段。"
  },
  {
    id: "S6",
    type: "single",
    question: "全局搜索（Global Search）与局部搜索（Local Search）相比，主要优势是什么？",
    options: [
      { label: "A", text: "能精确回答具体事实性问题" },
      { label: "B", text: "覆盖范围广，能回答主题概览类问题" },
      { label: "C", text: "推理路径可解释性更强" },
      { label: "D", text: "依赖实体识别的准确性更低" }
    ],
    correct: "B",
    explanation: "全局搜索基于社区摘要，粒度粗但覆盖广，适合回答'这个领域有哪些主题'等概览性问题；局部搜索精确但覆盖有限。"
  },
  {
    id: "S7",
    type: "single",
    question: "在 GraphRAG 实验中，使用 LLM 抽取实体关系的准确率大约是多少？",
    options: [
      { label: "A", text: "50-60%" },
      { label: "B", text: "75-80%" },
      { label: "C", text: "90-95%" },
      { label: "D", text: "接近 100%" }
    ],
    correct: "B",
    explanation: "实验结论明确指出：LLM 抽取实体关系的准确率约 75-80%，这是 GraphRAG 的瓶颈，错误会沿管道传播到下游问答。"
  },
  {
    id: "S8",
    type: "single",
    question: "为什么代码中使用 text[:3000] 截断输入文本？",
    options: [
      { label: "A", text: "防止网络超时" },
      { label: "B", text: "防止超长文本导致 token 超限或抽取质量下降" },
      { label: "C", text: "提高 Neo4j 的写入速度" },
      { label: "D", text: "满足社区检测算法的输入限制" }
    ],
    correct: "B",
    explanation: "代码注释明确说明：截断到 3000 字符是为了防止超长文本导致 token 超限或抽取质量下降，需要在信息量与质量间权衡。"
  },
  {
    id: "S9",
    type: "single",
    question: "在配置矩阵中，大规模生产环境（> 10 万篇）推荐的图谱存储方案是？",
    options: [
      { label: "A", text: "NetworkX（内存）" },
      { label: "B", text: "Neo4j / 图数据库" },
      { label: "C", text: "SQLite" },
      { label: "D", text: "Redis" }
    ],
    correct: "B",
    explanation: "配置矩阵明确推荐：大规模生产环境使用 Neo4j 或专业图数据库，NetworkX 仅适合快速原型和小规模场景。"
  },
  {
    id: "S10",
    type: "single",
    question: "GraphRAG 与 Naive RAG 的核心结构差异是什么？",
    options: [
      { label: "A", text: "GraphRAG 使用更大的语言模型" },
      { label: "B", text: "GraphRAG 使用显式三元组（实体-关系-实体），Naive RAG 使用隐式向量空间中的最近邻" },
      { label: "C", text: "GraphRAG 不需要检索阶段" },
      { label: "D", text: "GraphRAG 只支持英文文档" }
    ],
    correct: "B",
    explanation: "GraphRAG 的核心是显式三元组结构，天然支持多跳推理；Naive RAG 基于向量相似度，是隐式的最近邻检索。"
  },

  // ---------- 多选题 (6道) ----------
  {
    id: "M1",
    type: "multi",
    question: "GraphRAG 实验中使用的评估指标包括哪些？（多选）",
    options: [
      { label: "A", text: "Answer Accuracy" },
      { label: "B", text: "F1 Score" },
      { label: "C", text: "Multi-hop Accuracy" },
      { label: "D", text: "Entity Coverage" },
      { label: "E", text: "BLEU" },
      { label: "F", text: "Perplexity" }

/* ===================== 状态 ===================== */
var state = {
  current: 0,
  answers: {},
  checked: {},
  score: 0,
  filter: "all"
};

/* ===================== 渲染 ===================== */
function renderQuiz() {
  var container = document.getElementById("quizContainer");
  container.innerHTML = "";
  var q = allQuestions[state.current];
  if (!q) return;

  var card = document.createElement("div");
  card.className = "card";
  card.id = "card-" + q.id;

  var badge = "";
  if (q.type === "single") badge = '<span class="badge sc">单选</span>';
  else if (q.type === "multi") badge = '<span class="badge mc">多选</span>';
  else if (q.type === "tf") badge = '<span class="badge tf">判断</span>';
  else if (q.type === "drag") badge = '<span class="badge drag">拖拽</span>';

  var html = '<h3>题 ' + (state.current + 1) + ' / ' + allQuestions.length + badge + '</h3>';
  html += '<div>' + escapeHtml(q.question) + '</div>';

  if (q.type === "single") {
    html += '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = "";
      if (state.checked[q.id]) {
        if (opt.label === q.correct) cls = "correct";
        else if (state.answers[q.id] === opt.label) cls = "wrong";
        else cls = "disabled";
      }
      html += '<label class="option ' + cls + '" data-label="' + opt.label + '">';
      html += '<input type="radio" name="' + q.id + '" value="' + opt.label + '" ' + (state.answers[q.id] === opt.label ? "checked" : "") + ' ' + (state.checked[q.id] ? "disabled" : "") + '>';
      html += '<span>' + escapeHtml(opt.label + ". " + opt.text) + '</span>';
      html += '</label>';
    });
    html += '</div>';
  } else if (q.type === "multi") {
    html += '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = "";
      var ans = state.answers[q.id] || [];
      if (state.checked[q.id]) {
        var isCorrect = q.correct.indexOf(opt.label) >= 0;
        var isSelected = ans.indexOf(opt.label) >= 0;
        if (isCorrect && isSelected) cls = "correct";
        else if (!isCorrect && isSelected) cls = "wrong";
        else if (isCorrect && !isSelected) cls = "missed";
        else cls = "disabled";
      }
      html += '<label class="option ' + cls + '" data-label="' + opt.label + '">';
      html += '<input type="checkbox" name="' + q.id + '" value="' + opt.label + '" ' + (ans.indexOf(opt.label) >= 0 ? "checked" : "") + ' ' + (state.checked[q.id] ? "disabled" : "") + '>';
      html += '<span>' + escapeHtml(opt.label + ". " + opt.text) + '</span>';
      html += '</label>';
    });
    html += '</div>';
  } else if (q.type === "tf") {
    html += '<div class="tf-options">';
    var ans = state.answers[q.id];
    var clsY = "", clsN = "";
    if (state.checked[q.id]) {
      if (q.answer === true) { clsY = "correct"; clsN = (ans === false ? "wrong" : "disabled"); }
      else { clsN = "correct"; clsY = (ans === true ? "wrong" : "disabled"); }
      if (ans === true && q.answer !== true) clsY = "wrong";
      if (ans === false && q.answer !== false) clsN = "wrong";
    }
    html += '<div class="tf-option ' + clsY + '" onclick="selectTF(\'' + q.id + '\', true)">是</div>';
    html += '<div class="tf-option ' + clsN + '" onclick="selectTF(\'' + q.id + '\', false)">否</div>';
    html += '</div>';
  } else if (q.type === "drag") {
    // sentence with blanks
    var sentence = q.sentence;
    q.blanks.forEach(function(b) {
      var filled = (state.answers[q.id] && state.answers[q.id][b]) || "";
      var cls = "";
      if (state.checked[q.id]) {
        cls = filled === q.answers[b] ? "correct" : "wrong";
      }
      sentence = sentence.replace("{" + b + "}", '<span class="drop-zone ' + cls + '" data-blank="' + b + '" ondrop="drop(event)" ondragover="allowDrop(event)">' + (filled ? '<span class="filled">' + escapeHtml(filled) + '</span>' : "【" + b + "】") + '</span>');
    });
    html += '<div class="drop-sentence">' + sentence + '</div>';
    html += '<div class="hint">将下方术语拖拽到上方空白处：</div>';
    html += '<div class="drag-pool">';
    var pool = q.pool.slice();
    // shuffle pool visually each time
    pool.sort(function() { return Math.random() - 0.5; });
    pool.forEach(function(item) {
      var used = state.answers[q.id] && Object.values(state.answers[q.id]).indexOf(item) >= 0;
      if (!used) {
        html += '<div class="drag-item" draggable="true" ondragstart="drag(event)" data-val="' + escapeHtml(item) + '">' + escapeHtml(item) + '</div>';
      }
    });
    html += '</div>';
  }

  html += '<div class="explanation" id="exp-' + q.id + '">' + escapeHtml(q.explanation) + '</div>';
  card.innerHTML = html;
  container.appendChild(card);

  // bind events
  if (q.type === "single") {
    card.querySelectorAll('input[type="radio"]').forEach(function(inp) {
      inp.addEventListener("change", function() {
        state.answers[q.id] = this.value;
        updateProgress();
      });
    });
  } else if (q.type === "multi") {
    card.querySelectorAll('input[type="checkbox"]').forEach(function(inp) {
      inp.addEventListener("change", function() {
        var arr = state.answers[q.id] || [];
        if (this.checked) arr.push(this.value);
        else arr = arr.filter(function(v) { return v !== this.value; }.bind(this));
        state.answers[q.id] = arr;
        updateProgress();
      });
    });
  }

  if (state.checked[q.id]) {
    document.getElementById("exp-" + q.id).classList.add("show");
  }

  updateNav();
  updateProgress();
}

function escapeHtml(t) {
  if (!t) return "";
  return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ===================== 导航 ===================== */
function nextQuestion() {
  if (state.current < allQuestions.length - 1) {
    state.current++;
    renderQuiz();
    hideResult();
  }
}
function prevQuestion() {
  if (state.current > 0) {
    state.current--;
    renderQuiz();
    hideResult();
  }
}
function goToQuestion(idx) {
  state.current = idx;
  renderQuiz();
  hideResult();
}

function updateNav() {
  document.getElementById("btnPrev").disabled = state.current === 0;
  document.getElementById("btnNext").disabled = state.current === allQuestions.length - 1;
}

/* ===================== 进度/得分 ===================== */
function updateProgress() {
  var answered = 0;
  allQuestions.forEach(function(q) {
    if (q.type === "drag") {
      var ans = state.answers[q.id] || {};
      var filled = 0;
      q.blanks.forEach(function(b) { if (ans[b]) filled++; });
      if (filled === q.blanks.length) answered++;
    } else if (q.type === "multi") {
      var arr = state.answers[q.id] || [];
      if (arr.length > 0) answered++;
    } else {
      if (state.answers[q.id] !== undefined && state.answers[q.id] !== null) answered++;
    }
  });
  document.getElementById("progressText").textContent = answered + " / " + allQuestions.length;
  document.getElementById("progressFill").style.width = (answered / allQuestions.length * 100) + "%";
  document.getElementById("scoreNum").textContent = state.score;
}

/* ===================== 检查答案 ===================== */
function checkCurrent() {
  var q = allQuestions[state.current];
  if (!q) return;
  if (state.checked[q.id]) return;

  var correct = false;
  if (q.type === "single") {
    correct = state.answers[q.id] === q.correct;
  } else if (q.type === "multi") {
    var ans = state.answers[q.id] || [];
    correct = ans.length === q.correct.length && q.correct.every(function(v) { return ans.indexOf(v) >= 0; });
  } else if (q.type === "tf") {
    correct = state.answers[q.id] === q.answer;
  } else if (q.type === "drag") {
    var ans = state.answers[q.id] || {};
    correct = q.blanks.every(function(b) { return ans[b] === q.answers[b]; });
  }

  state.checked[q.id] = true;
  if (correct) state.score += 1;
  renderQuiz();
}

/* ===================== 判断题选择 ===================== */
function selectTF(qid, val) {
  if (state.checked[qid]) return;
  state.answers[qid] = val;
  updateProgress();
  renderQuiz();
}

/* ===================== 拖拽 ===================== */
function allowDrop(ev) { ev.preventDefault(); ev.target.closest(".drop-zone").classList.add("drag-over"); }
function drag(ev) {
  ev.dataTransfer.setData("text/plain", ev.target.getAttribute("data-val"));
  ev.target.classList.add("dragging");
}
function drop(ev) {
  ev.preventDefault();
  var zone = ev.target.closest(".drop-zone");
  if (!zone) return;
  zone.classList.remove("drag-over");
  var val = ev.dataTransfer.getData("text/plain");
  var blank = zone.getAttribute("data-blank");
  var qid = allQuestions[state.current].id;
  if (!state.answers[qid]) state.answers[qid] = {};
  state.answers[qid][blank] = val;
  updateProgress();
  renderQuiz();
}

/* ===================== 洗牌 ===================== */
function shuffleArray(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function shuffleAllOptions() {
  allQuestions.forEach(function(q) {
    if (q.type === "single" || q.type === "multi") {
      var labels = q.options.map(function(o) { return o.label; });
      var correctLabels = q.type === "single" ? [q.correct] : q.correct.slice();
      // Fisher-Yates shuffle options
      shuffleArray(q.options);
      // remap correct labels based on new positions
      var newCorrect = [];
      q.options.forEach(function(opt, idx) {
        if (correctLabels.indexOf(opt.label) >= 0) {
          newCorrect.push(String.fromCharCode(65 + idx));
        }
      });
      if (q.type === "single") q.correct = newCorrect[0];
      else q.correct = newCorrect;
      // reassign labels A-F
      q.options.forEach(function(opt, idx) {
        opt.label = String.fromCharCode(65 + idx);
      });
      // clear user answer since labels changed
      if (q.type === "single") {
        if (state.answers[q.id]) {
          var oldAns = state.answers[q.id];
          var found = q.options.find(function(o) { return o.text === oldAns; });
          if (found) state.answers[q.id] = found.label;
          else state.answers[q.id] = undefined;
        }
      } else {
        var oldArr = state.answers[q.id] || [];
        var newArr = [];
        oldArr.forEach(function(oldL) {
          var found = q.options.find(function(o) { return o.label === oldL; });
          if (found) newArr.push(found.label);
        });
        state.answers[q.id] = newArr;
      }
    }
  });
  renderQuiz();
}

/* ===================== 总览面板 ===================== */
function showOverview() {
  var container = document.getElementById("quizContainer");
  container.innerHTML = "";
  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<h3>📋 总览面板</h3><div class="filter-bar">' +
    '<button class="btn" onclick="setFilter(\'all\')">全部</button>' +
    '<button class="btn" onclick="setFilter(\'correct\')">✅ 正确</button>' +
    '<button class="btn" onclick="setFilter(\'wrong\')">❌ 错误</button>' +
    '<button class="btn" onclick="setFilter(\'unanswered\')">⭕ 未答</button>' +
    '</div><div class="overview" id="overviewGrid"></div>';
  container.appendChild(card);
  renderOverviewGrid();
}

function setFilter(f) { state.filter = f; renderOverviewGrid(); }

function renderOverviewGrid() {
  var grid = document.getElementById("overviewGrid");
  if (!grid) return;
  grid.innerHTML = "";
  allQuestions.forEach(function(q, idx) {
    var cls = "";
    var ans = state.answers[q.id];
    var checked = state.checked[q.id];
    var correct = false;
    if (checked) {
      if (q.type === "single") correct = ans === q.correct;
      else if (q.type === "multi") {
        var arr = ans || [];
        correct = arr.length === q.correct.length && q.correct.every(function(v) { return arr.indexOf(v) >= 0; });
      } else if (q.type === "tf") correct = ans === q.answer;
      else if (q.type === "drag") {
        var a = ans || {};
        correct = q.blanks.every(function(b) { return a[b] === q.answers[b]; });
      }
      cls = correct ? "correct" : "wrong";
    } else {
      var hasAns = false;
      if (q.type === "drag") {
        var a = ans || {};
        hasAns = q.blanks.every(function(b) { return a[b]; });
      } else if (q.type === "multi") {
        hasAns = (ans || []).length > 0;
      } else {
        hasAns = ans !== undefined && ans !== null;
      }
      cls = hasAns ? "answered" : "";
    }

    if (state.filter === "correct" && cls !== "correct") return;
    if (state.filter === "wrong" && cls !== "wrong") return;
    if (state.filter === "unanswered" && cls !== "" && cls !== "answered") return;

    var thumb = document.createElement("div");
    thumb.className = "thumb " + cls;
    thumb.textContent = (idx + 1);
    thumb.onclick = function() { goToQuestion(idx); };
    grid.appendChild(thumb);
  });
}

/* ===================== 结果面板 ===================== */
function showResult() {
  var total = allQuestions.length;
  var score = state.score;
  document.getElementById("finalScore").textContent = score + " / " + total;
  var msg = "";
  var pct = score / total;
  if (pct >= 0.9) msg = "🎉 太棒了！几乎全对！";
  else if (pct >= 0.7) msg = "👍 表现不错，还有提升空间！";
  else if (pct >= 0.5) msg = "💪 继续加油，巩固知识点！";
  else msg = "📚 建议重新阅读实验文档，加强理解！";
  document.getElementById("resultMsg").textContent = msg;
  document.getElementById("resultPanel").classList.add("show");
}
function hideResult() {
  document.getElementById("resultPanel").classList.remove("show");
}

/* ===================== 重置 ===================== */
function resetAll() {
  state.current = 0;
  state.answers = {};
  state.checked = {};
  state.score = 0;
  state.filter = "all";
  hideResult();
  renderQuiz();
}

/* ===================== 初始化 ===================== */
renderQuiz();
