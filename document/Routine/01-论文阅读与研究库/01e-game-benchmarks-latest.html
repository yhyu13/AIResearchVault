const singleQuestions = [
  { q:"VideoGameBench 中，最强模型（Gemini 2.5 Pro / Claude 3.7 Sonnet）在实时设置下完成的游戏进度约为多少？",

    expl:["✅ 正确：实时版最高仅 0.48%，Lite 版也仅 1.6%，而人类可轻松通关。",
          "❌ 错误：夸大了 10 倍。实际数字是 0.48%。",
          "❌ 错误：16% 远超实际水平。所有模型都无法越过大多数游戏的开局阶段。",
          "❌ 错误：48% 意味着接近一半游戏进度，与实际（<1%）相差两个数量级。"],
    link:"01e-game-benchmarks-latest.md#1-videogamebench" },

    correct:2,
    expl:["❌ 错误：视觉模态并非 Orak 首创。",

  { q:"TextQuests 允许模型使用搜索引擎等外部工具辅助解题。",

    expl:"✅ 正确理解：TextQuests 禁止一切外部工具，专测 intrinsic long-context reasoning。<br>❌ 常见误解：以为现代 agent 评测都默认带工具——TextQuests 恰恰是'自包含'设定，把工具能力从评估中剥离。",
    link:"01e-game-benchmarks-latest.md#3-textquests" },
  { q:"Orak 的 fine-tuning 数据集由人类专家玩家的游戏轨迹构成。",
    correct:false,
    expl:"✅ 正确理解：数据集由强 LLM 在多 genre 游戏中的专家轨迹构成。<br>❌ 常见误解：'专家轨迹'指专家 LLM 而非人类——这决定了 SFT 的质量上限受教师模型约束（前沿模型自己游戏进度都 <2%）。",
    link:"01e-game-benchmarks-latest.md#2-orak" },
  { q:"GVGAI-LLM 用 ASCII 紧凑表征把 spatial reasoning 从视觉感知中解耦出来单独测试。",
    correct:true,
    expl:"✅ 正确理解：ASCII 场景表征让纯文本 LLM 也能被测空间推理，无需视觉模态。若 ASCII 下依然犯错，说明问题是推理能力而非感知能力。<br>❌ 常见误解：以为测空间推理必须有像素输入。",
    link:"01e-game-benchmarks-latest.md#4-gvgai-llm" },
  { q:"FlashAdventure 的 CUA-as-a-Judge 用 computer-use agent 自动评估游戏进度、免除人工标注，但 judge 自身的评估误差会传递给被测 agent 的排名。",
    correct:true,
    expl:"✅ 正确理解：自动裁判大幅降低标注成本，但 judge 误差传递、judge 与 agent 同源的系统性偏置是论文承认的局限。<br>❌ 常见误解：以为 LLM-as-a-Judge 类方案是'免费午餐'，不需要人工抽检校准。",
    link:"01e-game-benchmarks-latest.md#5-flashadventure" }
];

// ===================== 引擎 =====================
const allQuestions = [];
dragQuestions.forEach((q,i)=>allQuestions.push({type:'drag',idx:i}));
singleQuestions.forEach((q,i)=>allQuestions.push({type:'single',idx:i}));
multiQuestions.forEach((q,i)=>allQuestions.push({type:'multi',idx:i}));
trueFalseQuestions.forEach((q,i)=>allQuestions.push({type:'tf',idx:i}));

const totalMax = allQuestions.length;
let cur = 0;
let states = allQuestions.map(()=>({answered:false, ok:false, sel:null, blanks:null}));

function shufflePairs(q){
  const pairs = q.options.map((opt,i)=>({opt, expl:q.expl[i], wasCorrect:Array.isArray(q.correct)?q.correct.includes(i):i===q.correct}));
  for(let i=pairs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pairs[i],pairs[j]]=[pairs[j],pairs[i]]; }
  q.options = pairs.map(p=>p.opt); q.expl = pairs.map(p=>p.expl);
  if(Array.isArray(q.correct)) q.correct = pairs.map((p,i)=>p.wasCorrect?i:-1).filter(i=>i>=0);
  else q.correct = pairs.findIndex(p=>p.wasCorrect);
}
function shuffleAll(){
  singleQuestions.forEach(shufflePairs);
  multiQuestions.forEach(shufflePairs);
  resetAll(false);
  alert("选项已重新洗牌，答题记录已清空。");
}

function render(){
  const meta = allQuestions[cur];
  const st = states[cur];
  const card = document.getElementById('qcard');
  document.getElementById('result-page').classList.add('hidden');
  document.getElementById('qcard').classList.remove('hidden');
  document.getElementById('progressText').textContent = `第 ${cur+1} / ${totalMax} 题`;
  document.getElementById('pbar').style.width = ((cur+1)/totalMax*100)+'%';

  if(meta.type==='drag'){
    const q = dragQuestions[meta.idx];
    if(!st.blanks) st.blanks = q.answers.map(()=>null);
    let html = `<span class="qtype">拖拽/点击填空</span><div class="qtitle">`;
    let parts = q.title.split(/\{(\d)\}/);
    parts.forEach((p,i)=>{
      if(i%2===0) html += p;
      else html += `<span class="blank ${st.blanks[+p]?'filled':''}" data-b="${p}" onclick="pickBlank(${p})">${st.blanks[+p]||'___'}</span>`;
    });
    html += `</div><div class="pool">` + q.pool.map(c=>`<span class="chip ${st.blanks.includes(c)?'used':''}" onclick="pickChip('${c}')">${c}</span>`).join('') + `</div>`;
    html += `<div class="result-box" id="resbox"></div><div class="btn-row">
      <button class="btn" onclick="checkDrag(${meta.idx})">检查答案</button>
      <button class="btn ghost" onclick="resetQ()">重置本题</button>
      <button class="btn ghost" onclick="window.open('${q.link}')">📖 详情</button></div>`;
    card.innerHTML = html;
  } else if(meta.type==='single' || meta.type==='tf'){
    const q = meta.type==='single' ? singleQuestions[meta.idx] : trueFalseQuestions[meta.idx];
    const isTF = meta.type==='tf';
    const opts = isTF ? ["✔ 正确（True）","✘ 错误（False）"] : q.options;
    html = `<span class="qtype">${isTF?'判断题':'单选题'}</span><div class="qtitle">${q.q}</div>`;
    opts.forEach((o,i)=>{
      let cls = 'opt';
      if(st.sel===i) cls += ' sel';
      if(st.answered){
        const isRight = isTF ? ((q.correct===true&&i===0)||(q.correct===false&&i===1)) : i===q.correct;
        if(isRight) cls += ' correct';
        else if(st.sel===i) cls += ' wrong';
      }
      html += `<button class="${cls}" onclick="selOpt(${i})">${o}</button>`;
      if(st.answered && !isTF) html += `<div class="expl">${q.expl[i]}</div>`;
    });
    if(st.answered && isTF) html += `<div class="result-box ${st.ok?'ok':'bad'} show">${q.expl}</div>`;
    html += `<div class="btn-row">
      <button class="btn" onclick="checkChoice('${meta.type}',${meta.idx})">检查答案</button>
      <button class="btn ghost" onclick="resetQ()">重置本题</button>
      <button class="btn ghost" onclick="window.open('${q.link}')">📖 详情</button></div>`;
    card.innerHTML = html;
  } else { // multi
    const q = multiQuestions[meta.idx];
    if(!st.sel) st.sel = [];
    html = `<span class="qtype">多选题</span><div class="qtitle">${q.q}</div>`;
    q.options.forEach((o,i)=>{
      let cls = 'opt';
      if(st.sel.includes(i)) cls += ' sel';
      if(st.answered){
        if(q.correct.includes(i)) cls += ' correct';
        else if(st.sel.includes(i)) cls += ' wrong';
      }
      html += `<button class="${cls}" onclick="toggleMulti(${i})">${o}</button>`;
      if(st.answered) html += `<div class="expl">${q.expl[i]}</div>`;
    });
    html += `<div class="btn-row">
      <button class="btn" onclick="checkChoice('multi',${meta.idx})">检查答案</button>
      <button class="btn ghost" onclick="resetQ()">重置本题</button>
      <button class="btn ghost" onclick="window.open('${q.link}')">📖 详情</button></div>`;
    card.innerHTML = html;
  }
  updateScore();
}

let activeBlank = 0;
function pickBlank(b){ activeBlank = b; }
function pickChip(c){
  const st = states[cur];
  if(st.answered) return;
  if(st.blanks.includes(c)) return;
  st.blanks[activeBlank] = c;
  activeBlank = (activeBlank+1) % st.blanks.length;
  render();
}
function selOpt(i){ const st = states[cur]; if(st.answered) return; st.sel = i; render(); }
function toggleMulti(i){ const st = states[cur]; if(st.answered) return;
  const k = st.sel.indexOf(i); if(k>=0) st.sel.splice(k,1); else st.sel.push(i); render(); }

function checkDrag(idx){
  const q = dragQuestions[idx]; const st = states[cur];
  if(st.blanks.some(b=>!b)) { alert("请先填满所有空。"); return; }
  st.ok = st.blanks.every((b,i)=>b===q.answers[i]);
  st.answered = true;
  const box = document.getElementById('resbox');
  box.className = 'result-box show ' + (st.ok?'ok':'bad');
  box.innerHTML = (st.ok?'✅ 回答正确！':'❌ 回答错误。') + '<br>' + q.explains.join('<br>');
  updateScore();
}
function checkChoice(type, idx){
  const st = states[cur];
  if(st.sel===null || (type==='multi'&&st.sel.length===0)){ alert("请先选择答案。"); return; }
  if(type==='single'){ st.ok = st.sel===singleQuestions[idx].correct; }
  else if(type==='tf'){ st.ok = (st.sel===0)===trueFalseQuestions[idx].correct; }
  else { const c = multiQuestions[idx].correct; st.ok = st.sel.length===c.length && st.sel.every(i=>c.includes(i)); }
  st.answered = true; render();
}

function updateScore(){
  const s = states.filter(st=>st.answered&&st.ok).length;
  document.getElementById('scoreBar').textContent = `得分：${s} / ${totalMax}`;
}
function resetQ(){ const st = states[cur]; st.answered=false; st.ok=false; st.sel=allQuestions[cur].type==='multi'?[]:null; st.blanks=null; render(); }
function resetAll(confirmFirst=true){
  if(confirmFirst && !confirm("确定清空所有答题记录？")) return;
  states = allQuestions.map(()=>({answered:false,ok:false,sel:null,blanks:null}));
  cur = 0; render();
}
function prevQ(){ if(cur>0){ cur--; render(); } }
function nextQ(){
  if(cur<totalMax-1){ cur++; render(); }
  else showResult();
}
function showResult(){
  const s = states.filter(st=>st.answered&&st.ok).length;
  document.getElementById('qcard').classList.add('hidden');
  const rp = document.getElementById('result-page');
  rp.classList.remove('hidden');
  document.getElementById('finalScore').textContent = `${s} / ${totalMax}`;
  const pct = s/totalMax;
  document.getElementById('finalComment').textContent =
    pct>=0.9 ? "🏆 优秀！游戏 Agent 基准方向已融会贯通。" :
    pct>=0.7 ? "👍 不错！个别细节再回笔记巩固。" :
    pct>=0.5 ? "📖 过半了，建议重读 01e 笔记的横向观察部分。" :
               "💪 建议重新精读笔记后再来挑战。";
}
function continueQuiz(){ document.getElementById('result-page').classList.add('hidden'); render(); }

function openDashboard(){
  const grid = document.getElementById('dgrid');
  grid.innerHTML = allQuestions.map((m,i)=>{
    const st = states[i];
    const label = m.type==='drag'?'填':m.type==='single'?'单':m.type==='multi'?'多':'判';
    const cls = st.answered ? (st.ok?'ok':'bad') : '';
    return `<div class="dcell ${cls}" onclick="jumpQ(${i})">${label}${i+1}</div>`;
  }).join('');
  document.getElementById('dashOverlay').classList.add('open');
}
function closeDashboard(){ document.getElementById('dashOverlay').classList.remove('open'); }
function jumpQ(i){ cur = i; closeDashboard(); render(); }

render();
</script>
