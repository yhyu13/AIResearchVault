<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05-多模态 RAG：图文检索实验 · 面试知识自测</title>
  <style>
    :root {
      --bg-body: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-warm: #F5F0E8;
      --primary: #2D5F5F;
      --primary-light: #3D7A7A;
      --accent: #4A7C59;
      --accent-light: #E8F3E8;
      --text-main: #2C2C2C;
      --text-muted: #6B6B6B;
      --border: #D8D2C8;
      --shadow: rgba(0,0,0,0.06);
      --correct: #3A8C5D;
      --correct-bg: #EAF6EE;
      --wrong: #C44B4B;
      --wrong-bg: #FCEAEA;
      --warning: #C9943A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    header .topic {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .score-bar .score {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
    }

    .score-bar .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-sm { padding: 6px 10px; font-size: 0.78rem; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-light); }

    .btn-secondary {
      background: var(--bg-warm);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #EDE8DE; }

    .btn-warning {
      background: #FFF8E6;
      color: #8A6D1F;
      border: 1px solid #F0E0B0;
    }
    .btn-warning:hover { background: #FFF0CC; }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab {
      flex: 1;
      min-width: 80px;
      text-align: center;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .tab .badge {
      display: inline-block;
      margin-left: 4px;
      background: rgba(255,255,255,0.25);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 0.72rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 16px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: #EAE5DC;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 12px;
    }

    .progress-bar .fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 18px;
      line-height: 1.7;
    }

    .question-text .blank {
      display: inline-block;
      min-width: 80px;
      padding: 3px 10px;
      margin: 0 3px;
      border: 2px dashed var(--border);
      border-radius: 6px;
      background: var(--bg-warm);
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      vertical-align: middle;
      transition: all 0.2s ease;
    }

    .question-text .blank.filled {
      border-style: solid;
      border-color: var(--primary);
      background: #F0F7F7;
      color: var(--primary);
      font-weight: 600;
    }

    .question-text .blank.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
    }

    .question-text .blank.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .draggables {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .draggable {
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: grab;
      font-size: 0.9rem;
      user-select: none;
      transition: all 0.2s ease;
    }

    .draggable:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .draggable.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }

    .draggable.used {
      opacity: 0.4;
      pointer-events: none;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--bg-card);
    }

    .option:hover { border-color: var(--primary-light); background: #F7FBFB; }

    .option input[type="radio"],
    .option input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .option .label {
      flex: 1;
      font-size: 0.95rem;
    }

    .option.correct-ans {
      border-color: var(--correct);
      background: var(--correct-bg);
    }

    .option.wrong-ans {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }

    .option .mark {
      font-size: 1.1rem;
      font-weight: 700;
      margin-left: auto;
    }

    .explanation {
      display: none;
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .explanation.show { display: block; }

    .explanation.correct-ex {
      background: var(--correct-bg);
      color: #2A6B44;
      border: 1px solid #B8E0C8;
    }

    .explanation.wrong-ex {
      background: var(--wrong-bg);
      color: #8A3333;
      border: 1px solid #F0C0C0;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-bar .btn { flex: 1; }

    .overview-btn {
      text-align: center;
      margin-top: 12px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .overlay.show { display: flex; }

    .overlay-content {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .overlay-header h2 {
      font-size: 1.15rem;
      color: var(--primary);
    }

    .grid-overview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 8px;
    }

    .grid-item {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .grid-item:hover { transform: scale(1.05); }

    .grid-item.empty { background: var(--bg-body); color: var(--text-muted); }
    .grid-item.correct { background: var(--correct-bg); color: var(--correct); border-color: #A0D8B3; }
    .grid-item.wrong { background: var(--wrong-bg); color: var(--wrong); border-color: #E8A0A0; }

    .legend {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-empty { background: #D8D2C8; }
    .dot-correct { background: var(--correct); }
    .dot-wrong { background: var(--wrong); }

    @media (max-width: 520px) {
      .container { padding: 10px; }
      header h1 { font-size: 1.3rem; }
      .card { padding: 14px; }
      .tab { font-size: 0.8rem; padding: 8px 4px; }
      .question-text { font-size: 0.97rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>05-多模态 RAG：图文检索实验 · 面试知识自测</h1>
      <div class="topic">experiment · RAG · multimodal · vision-language<br>请完成以下题目检验掌握程度</div>
    </header>

    <div class="score-bar">
      <div class="score" id="scoreDisplay">得分: 0 / 0</div>
      <div class="actions">
        <button class="btn btn-warning btn-sm" id="btnShuffle">随机选项</button>
        <button class="btn btn-secondary btn-sm" id="btnResetAll">重置所有</button>
      </div>
    </div>

    <div class="tabs" id="tabBar">
      <div class="tab active" data-type="drag">拖拽填空<span class="badge" id="badgeDrag">0</span></div>
      <div class="tab" data-type="single">单选题<span class="badge" id="badgeSingle">0</span></div>
      <div class="tab" data-type="multi">多选题<span class="badge" id="badgeMulti">0</span></div>
      <div class="tab" data-type="truefalse">判断题<span class="badge" id="badgeTrueFalse">0</span></div>
    </div>

    <div class="card" id="quizCard">
      <div class="progress-row">
        <span id="progressText">1 / 1</span>
        <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        <button class="btn btn-secondary btn-sm" id="btnOverview">总览</button>
      </div>

      <div id="questionArea"></div>

      <div id="explanationArea"></div>

      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="btnCheck">检查答案</button>
        <button class="btn btn-secondary" id="btnResetCurrent">重置当前题</button>
      </div>

      <div class="nav-bar" style="margin-top:16px;">
        <button class="btn btn-secondary" id="btnPrev">上一题</button>
        <button class="btn btn-secondary" id="btnNext">下一题</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overviewOverlay">
    <div class="overlay-content">
      <div class="overlay-header">
        <h2>题目总览</h2>
        <button class="btn btn-secondary btn-sm" id="btnCloseOverview">关闭</button>
      </div>
      <div class="grid-overview" id="overviewGrid"></div>
      <div class="legend">
        <span><span class="dot dot-empty"></span>未答</span>
        <span><span class="dot dot-correct"></span>正确</span>
        <span><span class="dot dot-wrong"></span>错误</span>
      </div>
    </div>
  </div>

  <script>
    // ===== DATA PLACEHOLDERS =====
    // DRAG_QUESTIONS_PLACEHOLDER_START
    const dragQuestions = [
    {
        "question": "在多模态 RAG 实验中，图像编码器使用 CLIP ViT-B/16，输出维度为 {0}；文本编码器使用 BAAI/bge-large-zh，输出维度为 {1}。",
        "answers": [
            "512",
            "1024"
        ],
        "options": [
            "512",
            "1024",
            "768",
            "256",
            "2048"
        ],
        "explanations": [
            "CLIP ViT-B/16 的图像特征维度为 512。",
            "BAAI/bge-large-zh 的文本嵌入维度为 1024。"
        ]
    },
    {
        "question": "在图文查询准确率上，纯文本 RAG 基线为 {0}，而使用 CLIP 的多模态 RAG 提升至 {1}。",
        "answers": [
            "0.32",
            "0.62"
        ],
        "options": [
            "0.32",
            "0.62",
            "0.45",
            "0.74",
            "0.68",
            "0.55"
        ],
        "explanations": [
            "纯文本 RAG 无法处理视觉信息，图文查询准确率仅为 0.32。",
            "Multimodal RAG (CLIP) 利用跨模态对齐空间，将图文查询准确率提升至 0.62。"
        ]
    }
];
    // DRAG_QUESTIONS_PLACEHOLDER_END

    // SINGLE_QUESTIONS_PLACEHOLDER_START
    const singleQuestions = [
    {
        "question": "MultimodalVectorStore 类中使用的 FAISS 索引类型是什么？",
        "options": [
            "IndexFlatIP（内积索引）",
            "IndexIVFFlat（倒排文件索引）",
            "IndexHNSW（图索引）",
            "IndexLSH（局部敏感哈希）"
        ],
        "correct": 0,
        "explanations": [
            "✅ 代码中使用的是 faiss.IndexFlatIP(dim)，即内积索引，并通过 L2 归一化使内积等价于余弦相似度。",
            "❌ 倒排文件索引在代码中未使用。",
            "❌ HNSW 图索引在代码中未使用。",
            "❌ LSH 索引在代码中未使用。"
        ]
    },
    {
        "question": "实验中，图像 Caption（如 BLIP-2/Qwen-VL）作为辅助手段，对图文查询准确率的影响是？",
        "options": [
            "提升至 0.72",
            "降至 0.58",
            "保持 0.62 不变",
            "提升至 0.65"
        ],
        "correct": 1,
        "explanations": [
            "❌ Caption 辅助并未达到 0.72，实际结果为 0.58。",
            "✅ Multimodal RAG + Caption 的图文查询准确率为 0.58，低于纯 CLIP 的 0.62，因为 Caption 质量不稳定会引入噪声。",
            "❌ Caption 改变了结果，不是保持不变。",
            "❌ Caption 没有提升至 0.65。"
        ]
    },
    {
        "question": "在代码中，query() 方法使用哪个编码器来编码查询文本？",
        "options": [
            "encode_text (BAAI/bge-large-zh)",
            "encode_image (CLIP)",
            "align_clip_text (CLIP 文本编码器)",
            "AutoTokenizer 直接编码"
        ],
        "correct": 2,
        "explanations": [
            "❌ encode_text 用于索引文本块，不是查询编码；查询需要与图像在同一语义空间。",
            "❌ encode_image 用于图像编码。",
            "✅ query() 方法调用 self.encoder.align_clip_text([query_text])，使用 CLIP 的文本编码器将查询映射到与图像相同的语义空间。",
            "❌ AutoTokenizer 只是文本预处理工具，不直接生成查询向量。"
        ]
    },
    {
        "question": "生产环境中，论文建议如何处理图像内容以获得更可控的检索效果？",
        "options": [
            "直接用 CLIP 编码图像向量存入索引",
            "使用 OCR 提取图像中的文字",
            "完全忽略图像，只索引文本",
            "使用 VLM 生成结构化描述后作为文本索引"
        ],
        "correct": 3,
        "explanations": [
            "❌ 直接编码虽然有效，但不如结构化描述可控。",
            "❌ OCR 在 Text + OCR RAG 中图文查询准确率仅 0.45，不够理想。",
            "❌ 完全忽略图像会丧失大量视觉信息。",
            "✅ 结论第4条明确指出：图像 → VLM 生成结构化描述（如 '图表显示...'）→ 作为文本索引，比纯向量更可控。"
        ]
    }
];
    // SINGLE_QUESTIONS_PLACEHOLDER_END

    // MULTI_QUESTIONS_PLACEHOLDER_START
    const multiQuestions = [
    {
        "question": "多模态 RAG 实验中，以下哪些组件被用于构建系统？",
        "options": [
            "BAAI/bge-large-zh（文本 Embedding）",
            "openai/clip-vit-base-patch16（图像 Embedding）",
            "Sentence-BERT（文本 Embedding）",
            "FAISS（向量存储）",
            "Elasticsearch（文本检索）",
            "BLIP-2（图像 Caption）"
        ],
        "correct": [
            0,
            1,
            3,
            5
        ],
        "explanations": [
            "✅ 代码中明确使用 BAAI/bge-large-zh 作为文本编码器。",
            "✅ 代码中使用 openai/clip-vit-base-patch16 作为图像编码器。",
            "⬜ 实验未使用 Sentence-BERT。",
            "✅ 代码中使用 FAISS 构建 IndexFlatIP 索引。",
            "⬜ 实验未使用 Elasticsearch。",
            "✅ BLIP-2/Qwen-VL 在实验设计中被列为图像 Caption 工具。"
        ]
    },
    {
        "question": "以下关于实验结论的描述，哪些是正确的？",
        "options": [
            "纯文本 RAG 的图文查询准确率为 0.78",
            "CLIP 的图文对齐空间是多模态检索的核心",
            "图像 Caption 是双刃剑，可能引入噪声",
            "Multimodal RAG + Caption 的图像召回率为 0.68",
            "中文场景下 Chinese-CLIP 或 Qwen-VL 效果更好",
            "生产环境建议完全依赖 CLIP 向量检索"
        ],
        "correct": [
            1,
            2,
            4
        ],
        "explanations": [
            "⬜ 0.78 是纯文本 RAG 的文本查询准确率，图文查询准确率仅为 0.32。",
            "✅ 结论第2条明确指出 CLIP 的图文对齐空间是核心。",
            "✅ 结论第3条指出图像 Caption 质量不稳定，可能引入错误信息。",
            "⬜ 0.68 是 Multimodal RAG (CLIP) 的图像召回率，Caption 版本为 0.55。",
            "✅ 结论第2条提到中文场景下 Chinese-CLIP 或 Qwen-VL 效果更好。",
            "⬜ 生产环境建议使用 VLM 生成结构化描述作为文本索引，而非完全依赖 CLIP。"
        ]
    }
];
    // MULTI_QUESTIONS_PLACEHOLDER_END

    // TRUEFALSE_QUESTIONS_PLACEHOLDER_START
    const trueFalseQuestions = [
    {
        "question": "MultimodalEncoder 的 encode_text 方法使用了 mean pooling 对 last_hidden_state 进行聚合。",
        "correct": true,
        "explanationTrue": "正确。代码中明确使用 `outputs.last_hidden_state.mean(dim=1)` 进行 mean pooling，将变长序列压缩为固定维度的句向量。",
        "explanationFalse": "错误。代码中确实使用了 mean pooling 对 last_hidden_state 进行聚合，而非 [CLS]  token 或其他 pooling 策略。"
    },
    {
        "question": "在实验中，Text + OCR RAG 的图文查询准确率（0.45）高于 Multimodal RAG (CLIP) 的图文查询准确率（0.62）。",
        "correct": false,
        "explanationTrue": "正确...",
        "explanationFalse": "错误。Text + OCR RAG 的图文查询准确率为 0.45，而 Multimodal RAG (CLIP) 为 0.62，后者明显更高。CLIP 的跨模态对齐空间显著优于 OCR 提取的文本表示。"
    },
    {
        "question": "代码中 FAISS 索引使用 L2 距离（欧氏距离）作为相似度度量。",
        "correct": false,
        "explanationTrue": "正确...",
        "explanationFalse": "错误。代码中使用的是 `faiss.IndexFlatIP(dim)`，即内积（Inner Product）索引，并通过 L2 归一化（faiss.normalize_L2）使内积等价于余弦相似度，而非 L2 距离。"
    },
    {
        "question": "多模态 RAG 实验中，图像和文本的嵌入向量被存入同一个 FAISS 索引中实现统一检索。",
        "correct": true,
        "explanationTrue": "正确。MultimodalVectorStore 使用单个 FAISS 索引，文本和图像的嵌入经过对齐后（均映射到 CLIP 512维空间）存入同一索引，通过 search 方法统一检索。",
        "explanationFalse": "错误。实验中确实将图像和文本的嵌入向量存入同一个 FAISS 索引中实现统一检索，这是多模态 RAG 的核心设计之一。"
    }
];
    // TRUEFALSE_QUESTIONS_PLACEHOLDER_END

    // ===== STATE =====
    let currentType = 'drag';
    let currentIndex = 0;
    let userAnswers = {};
    let checkedState = {};

    // ===== HELPERS =====
    function makeKey(type, index) {
      return type + ':' + index;
    }

    function getQuestions(type) {
      if (type === 'drag') return dragQuestions;
      if (type === 'single') return singleQuestions;
      if (type === 'multi') return multiQuestions;
      return trueFalseQuestions;
    }

    function getBadgeId(type) {
      if (type === 'drag') return 'badgeDrag';
      if (type === 'single') return 'badgeSingle';
      if (type === 'multi') return 'badgeMulti';
      return 'badgeTrueFalse';
    }

    function countQuestions(type) {
      return getQuestions(type).length;
    }

    function allTypes() {
      return ['drag', 'single', 'multi', 'truefalse'];
    }

    // ===== RENDER =====
    function initBadges() {
      allTypes().forEach(function(t) {
        document.getElementById(getBadgeId(t)).textContent = countQuestions(t);
      });
    }

    function updateScore() {
      let total = 0, scored = 0;
      allTypes().forEach(function(type) {
        const list = getQuestions(type);
        for (let i = 0; i < list.length; i++) {
          const q = list[i];
          const key = makeKey(type, i);
          if (checkedState[key]) {
            total += getQuestionPoints(q, type);
            scored += getUserPoints(q, type, i);
          }
        }
      });
      document.getElementById('scoreDisplay').textContent = '得分: ' + scored + ' / ' + total;
    }

    function getQuestionPoints(q, type) {
      if (type === 'drag') return q.answers.length;
      if (type === 'multi') return q.correct.length;
      return 1;
    }

    function getUserPoints(q, type, idx) {
      const key = makeKey(type, idx);
      const ans = userAnswers[key];
      if (!ans) return 0;
      if (type === 'drag') {
        let pts = 0;
        for (let i = 0; i < q.answers.length; i++) {
          if (ans[i] === q.answers[i]) pts++;
        }
        return pts;
      }
      if (type === 'single') {
        return ans === q.correct ? 1 : 0;
      }
      if (type === 'multi') {
        let pts = 0;
        const correctSet = {};
        for (let i = 0; i < q.correct.length; i++) correctSet[q.correct[i]] = true;
        const userSet = {};
        for (let i = 0; i < ans.length; i++) userSet[ans[i]] = true;
        for (let k in correctSet) {
          if (userSet[k]) pts++;
        }
        return pts;
      }
      return ans === q.correct ? 1 : 0;
    }

    function updateProgress() {
      const total = countQuestions(currentType);
      const text = total > 0 ? (currentIndex + 1) + ' / ' + total : '0 / 0';
      document.getElementById('progressText').textContent = text;
      const pct = total > 0 ? ((currentIndex + 1) / total * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderQuestion() {
      const area = document.getElementById('questionArea');
      const expl = document.getElementById('explanationArea');
      area.innerHTML = '';
      expl.innerHTML = '';
      expl.style.display = 'none';
      updateProgress();

      const questions = getQuestions(currentType);
      if (questions.length === 0) {
        area.innerHTML = '<p style="text-align:center;color:var(--text-muted)">该题型暂无题目</p>';
        return;
      }
      const q = questions[currentIndex];
      const key = makeKey(currentType, currentIndex);

      const qtext = document.createElement('div');
      qtext.className = 'question-text';

      if (currentType === 'drag') {
        let html = q.question;
        for (let i = 0; i < q.answers.length; i++) {
          const filled = userAnswers[key] && userAnswers[key][i] ? userAnswers[key][i] : '';
          let cls = 'blank';
          if (checkedState[key]) {
            if (filled === q.answers[i]) cls += ' correct';
            else cls += ' wrong';
          } else if (filled) {
            cls += ' filled';
          }
          html = html.replace('{\/' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
          html = html.replace('{\*' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
          html = html.replace('{' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
        }
        qtext.innerHTML = html;
        area.appendChild(qtext);

        const pool = document.createElement('div');
        pool.className = 'draggables';
        const used = userAnswers[key] || [];
        for (let i = 0; i < q.options.length; i++) {
          const opt = q.options[i];
          const isUsed = used.indexOf(opt) !== -1;
          const chip = document.createElement('div');
          chip.className = 'draggable' + (isUsed ? ' used' : '');
          chip.draggable = !isUsed;
          chip.textContent = opt;
          chip.dataset.value = opt;
          if (!isUsed) setupDrag(chip);
          pool.appendChild(chip);
        }
        area.appendChild(pool);

        if (checkedState[key]) {
          const box = document.createElement('div');
          box.className = 'explanation show correct-ex';
          let exHtml = '<strong>解析：</strong><ul style="margin:8px 0 0 18px">';
          for (let i = 0; i < q.explanations.length; i++) {
            const isOk = userAnswers[key] && userAnswers[key][i] === q.answers[i];
            exHtml += '<li><span style="color:' + (isOk ? 'var(--correct)' : 'var(--wrong)') + '">' + (isOk ? '✅' : '❌') + '</span> 空' + (i+1) + '：' + q.explanations[i] + '</li>';
          }
          exHtml += '</ul>';
          box.innerHTML = exHtml;
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'single') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        for (let i = 0; i < q.options.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const isSel = userAnswers[key] === i;
          if (checkedState[key]) {
            if (i === q.correct) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'singleOpt';
          radio.checked = isSel;
          radio.disabled = !!checkedState[key];
          radio.addEventListener('change', function() {
            userAnswers[key] = i;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = q.options[i];
          opt.appendChild(radio);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = i === q.correct ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          box.className = 'explanation show ' + (userAnswers[key] === q.correct ? 'correct-ex' : 'wrong-ex');
          box.innerHTML = '<strong>解析：</strong><br>' + q.explanations[q.correct];
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'multi') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        const selSet = {};
        const ans = userAnswers[key] || [];
        for (let i = 0; i < ans.length; i++) selSet[ans[i]] = true;
        const correctSet = {};
        for (let i = 0; i < q.correct.length; i++) correctSet[q.correct[i]] = true;
        for (let i = 0; i < q.options.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const isSel = !!selSet[i];
          if (checkedState[key]) {
            if (correctSet[i]) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = isSel;
          cb.disabled = !!checkedState[key];
          cb.addEventListener('change', function() {
            const a = userAnswers[key] || [];
            const pos = a.indexOf(i);
            if (pos >= 0) a.splice(pos, 1);
            else a.push(i);
            userAnswers[key] = a;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = q.options[i];
          opt.appendChild(cb);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = correctSet[i] ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          let ok = true;
          for (let k in correctSet) { if (!selSet[k]) ok = false; }
          for (let k in selSet) { if (!correctSet[k]) ok = false; }
          box.className = 'explanation show ' + (ok ? 'correct-ex' : 'wrong-ex');
          let exHtml = '<strong>解析：</strong><ul style="margin:8px 0 0 18px">';
          for (let i = 0; i < q.options.length; i++) {
            const isCorrect = !!correctSet[i];
            const icon = isCorrect ? '✅' : (selSet[i] ? '❌' : '⬜');
            exHtml += '<li>' + icon + ' ' + q.explanations[i] + '</li>';
          }
          exHtml += '</ul>';
          box.innerHTML = exHtml;
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'truefalse') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        const opts = [{val: true, label: '是 / True'}, {val: false, label: '否 / False'}];
        for (let i = 0; i < opts.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const v = opts[i].val;
          const isSel = userAnswers[key] === v;
          if (checkedState[key]) {
            if (v === q.correct) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'tfOpt';
          radio.checked = isSel;
          radio.disabled = !!checkedState[key];
          radio.addEventListener('change', function() {
            userAnswers[key] = v;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = opts[i].label;
          opt.appendChild(radio);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = v === q.correct ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          const ok = userAnswers[key] === q.correct;
          box.className = 'explanation show ' + (ok ? 'correct-ex' : 'wrong-ex');
          box.innerHTML = '<strong>解析：</strong><br>' + (q.correct ? q.explanationTrue : q.explanationFalse);
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      }
    }

    // ===== DRAG & DROP =====
    function setupDrag(el) {
      el.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', el.dataset.value);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', function() {
        el.classList.remove('dragging');
      });
    }

    document.addEventListener('dragover', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (blank) e.preventDefault();
    });

    document.addEventListener('drop', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (!blank) return;
      e.preventDefault();
      const value = e.dataTransfer.getData('text/plain');
      if (!value) return;
      const bidx = parseInt(blank.dataset.blank, 10);
      const key = makeKey(currentType, currentIndex);
      if (!userAnswers[key]) userAnswers[key] = [];
      userAnswers[key][bidx] = value;
      renderQuestion();
    });

    // Also support click-to-fill on mobile
    document.addEventListener('click', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (!blank) return;
      if (checkedState[makeKey(currentType, currentIndex)]) return;
      const key = makeKey(currentType, currentIndex);
      const ans = userAnswers[key] || [];
      const bidx = parseInt(blank.dataset.blank, 10);
      if (ans[bidx]) {
        delete ans[bidx];
        renderQuestion();
        return;
      }
      // Find first unused draggable
      const chips = document.querySelectorAll('.draggable:not(.used)');
      if (chips.length > 0) {
        const val = chips[0].dataset.value;
        if (!userAnswers[key]) userAnswers[key] = [];
        userAnswers[key][bidx] = val;
        renderQuestion();
      }
    });

    // ===== CONTROLS =====
    function switchTab(type) {
      currentType = type;
      currentIndex = 0;
      document.querySelectorAll('.tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.type === type);
      });
      renderQuestion();
    }

    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        switchTab(tab.dataset.type);
      });
    });

    document.getElementById('btnPrev').addEventListener('click', function() {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    });

    document.getElementById('btnNext').addEventListener('click', function() {
      if (currentIndex + 1 < countQuestions(currentType)) { currentIndex++; renderQuestion(); }
    });

    document.getElementById('btnCheck').addEventListener('click', function() {
      const key = makeKey(currentType, currentIndex);
      if (countQuestions(currentType) === 0) return;
      checkedState[key] = true;
      updateScore();
      renderQuestion();
    });

    document.getElementById('btnResetCurrent').addEventListener('click', function() {
      const key = makeKey(currentType, currentIndex);
      delete userAnswers[key];
      delete checkedState[key];
      updateScore();
      renderQuestion();
    });

    document.getElementById('btnResetAll').addEventListener('click', function() {
      if (!confirm('确定要重置所有答题记录吗？')) return;
      userAnswers = {};
      checkedState = {};
      updateScore();
      renderQuestion();
    });

    // ===== SHUFFLE =====
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
    }

    function buildIndexMap(oldLen, shuffledIndices) {
      const map = {};
      for (let newPos = 0; newPos < oldLen; newPos++) {
        map[shuffledIndices[newPos]] = newPos;
      }
      return map;
    }

    document.getElementById('btnShuffle').addEventListener('click', function() {
      if (!confirm('随机化会清空所有答题记录，确定继续？')) return;
      userAnswers = {};
      checkedState = {};

      // Single
      for (let qi = 0; qi < singleQuestions.length; qi++) {
        const q = singleQuestions[qi];
        const order = [];
        for (let i = 0; i < q.options.length; i++) order.push(i);
        shuffleArray(order);
        const newOpts = [];
        for (let i = 0; i < order.length; i++) newOpts.push(q.options[order[i]]);
        const newExps = [];
        for (let i = 0; i < order.length; i++) newExps.push(q.explanations[order[i]]);
        const idxMap = buildIndexMap(q.options.length, order);
        q.correct = idxMap[q.correct];
        q.options = newOpts;
        q.explanations = newExps;
      }

      // Multi
      for (let qi = 0; qi < multiQuestions.length; qi++) {
        const q = multiQuestions[qi];
        const order = [];
        for (let i = 0; i < q.options.length; i++) order.push(i);
        shuffleArray(order);
        const newOpts = [];
        for (let i = 0; i < order.length; i++) newOpts.push(q.options[order[i]]);
        const newExps = [];
        for (let i = 0; i < order.length; i++) newExps.push(q.explanations[order[i]]);
        const idxMap = buildIndexMap(q.options.length, order);
        const newCorrect = [];
        for (let i = 0; i < q.correct.length; i++) newCorrect.push(idxMap[q.correct[i]]);
        q.correct = newCorrect;
        q.options = newOpts;
        q.explanations = newExps;
      }

      updateScore();
      renderQuestion();
    });

    // ===== OVERVIEW =====
    function openOverview() {
      const grid = document.getElementById('overviewGrid');
      grid.innerHTML = '';
      const questions = getQuestions(currentType);
      for (let i = 0; i < questions.length; i++) {
        const cell = document.createElement('div');
        const key = makeKey(currentType, i);
        let cls = 'grid-item';
        if (checkedState[key]) {
          const pts = getUserPoints(questions[i], currentType, i);
          const maxPts = getQuestionPoints(questions[i], currentType);
          cls += pts === maxPts ? ' correct' : ' wrong';
        } else {
          cls += ' empty';
        }
        cell.className = cls;
        cell.textContent = i + 1;
        cell.addEventListener('click', function() {
          currentIndex = i;
          document.getElementById('overviewOverlay').classList.remove('show');
          renderQuestion();
        });
        grid.appendChild(cell);
      }
      document.getElementById('overviewOverlay').classList.add('show');
    }

    document.getElementById('btnOverview').addEventListener('click', openOverview);
    document.getElementById('btnCloseOverview').addEventListener('click', function() {
      document.getElementById('overviewOverlay').classList.remove('show');
    });
    document.getElementById('overviewOverlay').addEventListener('click', function(e) {
      if (e.target === document.getElementById('overviewOverlay')) {
        document.getElementById('overviewOverlay').classList.remove('show');
      }
    });

    // ===== KEYBOARD NAV =====
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') document.getElementById('btnPrev').click();
      if (e.key === 'ArrowRight') document.getElementById('btnNext').click();
    });

    // ===== INIT =====
    initBadges();
    updateScore();
    renderQuestion();
  </script>
</body>
</html>
