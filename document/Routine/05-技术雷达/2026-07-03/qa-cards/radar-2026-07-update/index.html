<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术雷达 2026-07 更新 · 综合面试卡牌</title>
<style>
:root{
  --bg:#faf6f0; --card:#fffdf9; --ink:#3d3833; --ink2:#7a7066;
  --accent:#b3814f; --accent-soft:#f0e4d4; --line:#e8dfd3;
  --ok:#5d8a66; --ok-bg:#e7f0e8; --bad:#b05c4f; --bad-bg:#f5e6e2;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;padding:20px 14px}
.wrap{max-width:860px;margin:0 auto}
header{text-align:center;margin-bottom:18px}
header h1{font-size:1.5rem;letter-spacing:.5px}
header p{color:var(--ink2);font-size:.85rem;margin-top:4px}
.topbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.85rem;cursor:pointer;color:var(--ink);transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#a06f3f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress-wrap{margin:12px 0 18px}
.progress-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink2);margin-bottom:5px}
.progress-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;box-shadow:0 2px 10px rgba(120,100,70,.06)}
.q-type{display:inline-block;font-size:.72rem;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:99px;margin-bottom:10px;font-weight:600}
.q-text{font-size:1.08rem;font-weight:600;margin-bottom:18px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:all .15s;background:#fff}
.opt:hover{border-color:var(--accent)}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.disabled{cursor:default}
.opt .mark{width:22px;height:22px;flex-shrink:0;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;margin-top:2px}
.opt.tf .mark{border-radius:50%}
.opt.selected .mark{border-color:var(--accent);color:var(--accent)}
.opt.correct .mark{border-color:var(--ok);color:var(--ok)}
.opt.wrong .mark{border-color:var(--bad);color:var(--bad)}
.explain{font-size:.85rem;color:var(--ink2);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);display:none}
.opt.revealed .explain{display:block}
.verdict{margin:14px 0;padding:12px 16px;border-radius:10px;font-weight:600;display:none}
.verdict.show{display:block}
.verdict.right{background:var(--ok-bg);color:var(--ok)}
.verdict.wrong{background:var(--bad-bg);color:var(--bad)}
.followups{margin-top:16px;border-top:2px solid var(--line);padding-top:14px;display:none}
.followups.show{display:block}
.followups h4{font-size:.9rem;color:var(--accent);margin-bottom:10px}
.fu{margin-bottom:10px;background:#fbf7f0;border-radius:10px;padding:10px 14px}
.fu summary{cursor:pointer;font-size:.88rem;font-weight:600;color:var(--ink)}
.fu .fu-a{font-size:.85rem;color:var(--ink2);margin-top:6px}
.tf-pair{margin-top:8px}
.tf-pair .ok-note{font-size:.85rem;background:var(--ok-bg);border-radius:8px;padding:8px 12px;margin-bottom:6px;display:none}
.tf-pair .bad-note{font-size:.85rem;background:var(--bad-bg);border-radius:8px;padding:8px 12px;display:none}
.tf-pair.show .ok-note,.tf-pair.show .bad-note{display:block}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
/* overview */
.overlay{position:fixed;inset:0;background:rgba(60,50,40,.35);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.overlay.show{display:flex}
.panel{background:var(--card);border-radius:var(--radius);max-width:760px;width:100%;padding:24px}
.panel h3{margin-bottom:12px}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-row .btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.thumb{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:.75rem;cursor:pointer;background:#fff}
.thumb:hover{border-color:var(--accent)}
.thumb .t-type{display:block;font-size:.62rem;color:var(--ink2)}
.thumb.s-ok{background:var(--ok-bg);border-color:var(--ok)}
.thumb.s-bad{background:var(--bad-bg);border-color:var(--bad)}
.thumb.s-cur{outline:2px solid var(--accent)}
/* result */
.result{display:none;text-align:center;padding:40px 20px}
.result.show{display:block}
.result .score{font-size:3rem;font-weight:700;color:var(--accent)}
.result .sub{color:var(--ink2);margin:10px 0 24px}
.result .btn{margin:0 6px}
footer{text-align:center;color:var(--ink2);font-size:.75rem;margin-top:22px}
@media(max-width:560px){
  .card{padding:18px 14px}
  header h1{font-size:1.2rem}
  .nav{flex-wrap:wrap}
  .nav .btn{flex:1;min-width:100px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>技术雷达 2026-07 · 四象限变更面试卡牌</h1>
  <p>考察范围：2026-07-18 更新日志（Adopt / Trial / Assess / Hold 四象限新增与边界判断）</p>
</header>

<div class="topbar">
  <button class="btn" id="btnOverview">📋 总览面板</button>
  <button class="btn" id="btnShuffle">🎲 重新洗牌选项</button>
  <button class="btn" id="btnResetAll">🔄 重置所有分数</button>
  <button class="btn" id="btnResult">🏁 查看结果</button>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-meta">
    <span id="progressText">第 1 / 16 题</span>
    <span id="scoreText">得分 0 / 16</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:6.25%"></div></div>
</div>

<div class="card" id="quizCard">
  <div id="qArea"></div>
  <div class="nav">
    <button class="btn" id="btnPrev">← 上一题</button>
    <button class="btn primary" id="btnCheck">检查答案</button>
    <button class="btn" id="btnResetQ">重置本题</button>
    <button class="btn" id="btnNext">下一题 →</button>
  </div>
</div>

<div class="card result" id="resultCard">
  <div class="score" id="finalScore">0</div>
  <div class="sub" id="finalSub"></div>
  <button class="btn" id="btnBackView">📋 返回查看</button>
  <button class="btn primary" id="btnContinue">✏️ 继续做题</button>
</div>

<footer>数据来源：2026-07 技术雷达（2026-07-03 版，含 2026-07-18 更新日志）· 类型B 综合卡牌</footer>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h3>题目总览</h3>
    <div class="filter-row">
      <button class="btn active" data-f="all">全部</button>
      <button class="btn" data-f="ok">✓ 正确</button>
      <button class="btn" data-f="bad">✗ 错误</button>
      <button class="btn" data-f="todo">○ 未答</button>
      <button class="btn" id="btnCloseOv" style="margin-left:auto">关闭</button>
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
  </div>
</div>

<script>
/* ================= 题库（唯一声明） ================= */

{

    '✅ 正确。源文件：SGLang 的 RadixAttention 前缀复用在 agentic / tool-calling 负载下 TTFT 最优，这是其进 Adopt 的关键卖点。',

{
  type:'single',
  q:'MCP 条目为什么带着「安全警示」进 Adopt？下列哪一组事实组合与源文件一致？',
  options:[
    '2025-11-25 规范引入 Tasks 异步原语（SEP-1686）与 CIMD 认证，已移交 Linux Foundation 托管；但存在 tool poisoning 攻击面（MCPTox, AAAI 2026）与 ~55k token 全量工具描述注入成本',

    '❌ CIMD 是「认证」机制而非强制 gateway；tool poisoning 是现存攻击面，并未被修复。',
    '❌ 9700 万月下载量属实，但因果倒置：普及度恰恰放大了 tool poisoning 攻击面，源文件要求按 curated allowlist 使用。',
    '❌ 主导方写反了：MCP 是 Anthropic 主导的开放标准，获 OpenAI、Google、Microsoft 支持。'
  ],
  followups:[
    {q:'追问：~55k token 成本是哪来的？',a:'全量工具描述注入上下文的成本，源文件据此要求按 curated allowlist 使用 MCP 工具。'},
    {q:'追问：tool poisoning 的防护动作是什么？',a:'建立 allowlist 并评估 tool poisoning 防护；阅读 MCP 规范 2025-11-25 版；实现自定义 MCP server（如连接笔记检索）。'},

  ]
},
{
  type:'single',
  q:'Speculative Decoding / MTP 为什么放在 Trial 而不是 Adopt？',
  options:[
    '草稿模型质量尚不成熟，任何场景下都没有延迟收益',

    '低并发、延迟敏感场景收益明确，但高并发下收益坍缩（arXiv:2510.22876 实测证据），限定适用场景、不作通用加速手段',
    '与 PagedAttention 冲突，无法在 vLLM 上部署'
  ],
  correct:2,
  explains:[
    '❌ 因果倒置：低并发延迟敏感场景收益是「明确」的，这正是它值得 Trial 的原因。',
    '❌ 恰好说反：高并发下收益坍缩，不是收益明确。',
    '✅ 正确。源文件原文：低并发、延迟敏感场景收益明确；高并发下收益坍缩（arXiv:2510.22876），限定适用场景，不作为通用加速手段——这是 Trial 而非 Adopt 的边界条件。',

  followups:[

  ]
},
{
  type:'single',
  q:'源文件给出的 RAG「及格线」配置及其相对裸 dense 的提升是？',
  options:[
    'hybrid（BM25 + dense + RRF k=60）+ cross-encoder reranker，较裸 dense +17pp 精度',

    '❌ Embedding 自托管解决的是 MTEB 分数与成本问题，不替代 hybrid + reranker 的检索结构。'

  followups:[
    {q:'追问：裸 dense 单路 RAG 为什么进 Hold？',a:'缺 BM25 词法信号与重排序，精度显著低于 hybrid + reranker（+17pp），是已知反模式。'},
    {q:'追问：RRF 里的 k=60 是什么角色？',a:'源文件给定 hybrid 融合的标准常数配置：BM25 + dense 两路结果用 RRF（k=60）融合，再接 cross-encoder reranker。'}
  ]
},
{
  type:'single',
  q:'ToolRL 进 Trial 的核心贡献与编号是？',
  options:[
    'arXiv:2505.20286；运行时自动生成并注册 MCP server',
    'arXiv:2510.22876；证明高并发下 speculative decoding 收益坍缩',
    'GRPO 的四项改进，将 GRPO 推向生产级稳定训练',
    'arXiv:2504.13958；提出细粒度 reward 分解（格式 / 参数名 / 参数值分项奖励），比 outcome-only 提供更稳定的 tool-use RL 训练信号'

  correct:3,
  explains:[
    '❌ arXiv:2505.20286 是 Alita（Assess 象限，自动生成 MCP server），编号张冠李戴。',

  followups:[

  ]
},
{
  type:'single',
  q:'Voyager 技能库被定位 Assess 的「单点打穿」目标具体是？（按 W28 复盘要求）',
  options:[

  followups:[

{

/* ================= 状态 ================= */
const TYPE_LABEL={single:'单选题',multi:'多选题',tf:'判断题'};
let cur=0;
let answers=allQuestions.map(()=>({picked:null,checked:false,right:false}));
/* picked: single->index, multi->Set/array, tf->true/false */

const qArea=document.getElementById('qArea');
const progressText=document.getElementById('progressText');
const scoreText=document.getElementById('scoreText');
const progressFill=document.getElementById('progressFill');

function score(){return answers.filter(a=>a.checked&&a.right).length;}

function renderQ(){
  const q=allQuestions[cur];
  const a=answers[cur];
  let h=`<span class="q-type">${TYPE_LABEL[q.type]} · 第 ${cur+1} 题</span>
  <div class="q-text">${q.q}</div>`;
  if(q.type==='tf'){
    h+=`<div class="opt tf ${a.picked===true?'selected':''} ${a.checked?(q.correct===true?'correct':'wrong'):''} ${a.checked?'disabled revealed':''}" data-v="true">
      <span class="mark">✓</span><div><strong>正确</strong></div></div>
    <div class="opt tf ${a.picked===false?'selected':''} ${a.checked?(q.correct===false?'correct':'wrong'):''} ${a.checked?'disabled revealed':''}" data-v="false">
      <span class="mark">✗</span><div><strong>错误</strong></div></div>
    <div class="tf-pair ${a.checked?'show':''}">
      <div class="ok-note">${q.ok}</div>
      <div class="bad-note">${q.bad}</div>
    </div>`;
  }else{
    const isMulti=q.type==='multi';
    q.options.forEach((opt,i)=>{
      let cls='opt';
      const pickedArr=isMulti?(a.picked||[]):null;
      const sel=isMulti?pickedArr.includes(i):a.picked===i;
      if(a.checked){
        const corArr=isMulti?q.correct:[q.correct];
        if(corArr.includes(i))cls+=' correct';
        else if(sel)cls+=' wrong';
        cls+=' disabled revealed';
      }else if(sel)cls+=' selected';
      h+=`<div class="${cls}" data-v="${i}">
        <span class="mark">${isMulti?(sel?'☑':'☐'):String.fromCharCode(65+i)}</span>
        <div>${opt}<div class="explain">${q.explains[i]}</div></div></div>`;
    });
  }
  h+=`<div class="verdict ${a.checked?'show '+(a.right?'right':'wrong'):''}">${a.checked?(a.right?'✅ 回答正确':'❌ 回答错误，请查看逐条解析'):''}</div>`;
  h+=`<div class="followups ${a.checked?'show':''}"><h4>🎯 面试官可能的追问</h4>${
    q.followups.map(f=>`<details class="fu"><summary>${f.q}</summary><div class="fu-a">${f.a}</div></details>`).join('')
  }</div>`;
  qArea.innerHTML=h;

  qArea.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      if(answers[cur].checked)return;
      const v=el.dataset.v;
      if(q.type==='tf'){answers[cur].picked=(v==='true');}
      else if(q.type==='single'){answers[cur].picked=parseInt(v);}
      else{
        if(!Array.isArray(answers[cur].picked))answers[cur].picked=[];
        const i=parseInt(v),arr=answers[cur].picked;
        const idx=arr.indexOf(i);
        if(idx>=0)arr.splice(idx,1);else arr.push(i);
      }
      renderQ();
    });
  });
  updateBar();
}

function updateBar(){
  progressText.textContent=`第 ${cur+1} / ${allQuestions.length} 题`;
  scoreText.textContent=`得分 ${score()} / ${allQuestions.length}`;
  progressFill.style.width=((cur+1)/allQuestions.length*100)+'%';
  document.getElementById('btnPrev').disabled=(cur===0);
  document.getElementById('btnNext').disabled=(cur===allQuestions.length-1);
}

function check(){
  const q=allQuestions[cur],a=answers[cur];
  if(a.picked===null||(Array.isArray(a.picked)&&a.picked.length===0)){alert('请先作答再检查答案');return;}
  let right=false;
  if(q.type==='tf')right=(a.picked===q.correct);
  else if(q.type==='single')right=(a.picked===q.correct);
  else{
    const s=[...a.picked].sort().join(','),c=[...q.correct].sort().join(',');
    right=(s===c);
  }
  a.checked=true;a.right=right;
  renderQ();
}

function resetQ(){answers[cur]={picked:null,checked:false,right:false};renderQ();}

function resetAll(){
  answers=allQuestions.map(()=>({picked:null,checked:false,right:false}));
  cur=0;
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('quizCard').style.display='';
  document.getElementById('progressWrap').style.display='';
  renderQ();
}

function showResult(){
  document.getElementById('quizCard').style.display='none';
  /* 不隐藏 progressWrap 父容器，仅更新其内容 */
  const r=document.getElementById('resultCard');
  r.classList.add('show');
  document.getElementById('finalScore').textContent=`${score()} / ${allQuestions.length}`;
  document.getElementById('finalSub').textContent=`已作答 ${answers.filter(a=>a.checked).length} 题 · 正确 ${score()} 题`;
}

/* shuffle */
function fisherYates(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function shuffleOptions(){
  allQuestions.forEach(q=>{
    if(q.type==='tf')return;
    const order=fisherYates(q.options.map((_,i)=>i));
    q.options=order.map(i=>q.options[i]);
    q.explains=order.map(i=>q.explains[i]);
    if(q.type==='single')q.correct=order.indexOf(q.correct);
    else q.correct=q.correct.map(c=>order.indexOf(c)).sort((x,y)=>x-y);
  });
  resetAll();
}

/* overview */
let filter='all';
function renderThumbs(){
  const g=document.getElementById('thumbGrid');g.innerHTML='';
  allQuestions.forEach((q,i)=>{
    const a=answers[i];
    const st=a.checked?(a.right?'ok':'bad'):'todo';
    if(filter!=='all'&&st!==filter)return;
    const t=document.createElement('div');
    t.className=`thumb s-${st}${i===cur?' s-cur':''}`;
    t.innerHTML=`${i+1}<span class="t-type">${q.type==='tf'?'判断':(q.type==='multi'?'多选':'单选')}</span>`;
    t.onclick=()=>{cur=i;closeOv();document.getElementById('resultCard').classList.remove('show');document.getElementById('quizCard').style.display='';renderQ();};
    g.appendChild(t);
  });
}
function openOv(){renderThumbs();document.getElementById('overlay').classList.add('show');}
function closeOv(){document.getElementById('overlay').classList.remove('show');}

/* events */
document.getElementById('btnCheck').onclick=check;
document.getElementById('btnResetQ').onclick=resetQ;
document.getElementById('btnPrev').onclick=()=>{if(cur>0){cur--;renderQ();}};
document.getElementById('btnNext').onclick=()=>{if(cur<allQuestions.length-1){cur++;renderQ();}};
document.getElementById('btnShuffle').onclick=()=>{if(confirm('洗牌将清空所有答题记录，确定继续？'))shuffleOptions();};
document.getElementById('btnResetAll').onclick=resetAll;
document.getElementById('btnResult').onclick=showResult;
document.getElementById('btnOverview').onclick=openOv;
document.getElementById('btnCloseOv').onclick=closeOv;
document.getElementById('btnBackView').onclick=()=>{openOv();};
document.getElementById('btnContinue').onclick=()=>{
  const last=answers.map((a,i)=>a.checked?i:-1).filter(i=>i>=0);
  cur=last.length?last[last.length-1]:0;
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('quizCard').style.display='';
  renderQ();
};
document.querySelectorAll('.filter-row .btn[data-f]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.filter-row .btn[data-f]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');filter=b.dataset.f;renderThumbs();
  };
});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeOv();});

renderQ();
</script>
