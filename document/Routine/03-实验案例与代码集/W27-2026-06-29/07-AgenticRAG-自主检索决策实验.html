<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07-AgenticRAG：自主检索决策实验 — 互动知识卡牌</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --accent: #059669;
    --accent-light: #d1fae5;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --warn: #d97706;
    --warn-light: #fef3c7;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: #fff;
    padding: 1.5rem 1rem;
    text-align: center;
    box-shadow: var(--shadow);
  }
  header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
  header p { font-size: 0.9rem; opacity: 0.9; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .score-bar { display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; font-weight: 600; }
  .score-bar .pill { background: var(--primary-light); color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 999px; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.45rem 0.9rem; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; color: var(--text); font-size: 0.85rem; font-weight: 500; cursor: pointer;
    transition: all 0.15s ease; user-select: none;
  }
  .btn:hover { background: #f9fafb; border-color: #d1d5db; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-accent:hover { background: #047857; }
  .btn-warn { background: var(--warn); color: #fff; border-color: var(--warn); }
  .btn-warn:hover { background: #b45309; }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { background: #b91c1c; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .container { max-width: 900px; margin: 0 auto; padding: 1rem; width: 100%; flex: 1; }
  .progress-bar { height: 6px; background: #e5e7eb; border-radius: 3px; margin-bottom: 1rem; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #60a5fa); width: 0%; transition: width 0.3s ease; }
  .progress-text { text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.75rem; }
  .card {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 1.5rem; margin-bottom: 1rem; border: 1px solid var(--border);
  }
  .card h3 { font-size: 1.15rem; margin-bottom: 1rem; color: #111827; }
  .card .type-badge {
    display: inline-block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    padding: 0.15rem 0.5rem; border-radius: 4px; margin-bottom: 0.75rem; letter-spacing: 0.03em;
  }
  .badge-drag { background: #ede9fe; color: #5b21b6; }
  .badge-single { background: #dbeafe; color: #1e40af; }
  .badge-multi { background: #d1fae5; color: #065f46; }
  .badge-tf { background: #fef3c7; color: #92400e; }
  .drop-zone {
    display: inline-block; min-width: 120px; min-height: 36px;
    border: 2px dashed #cbd5e1; border-radius: 6px; background: #f8fafc;
    vertical-align: middle; margin: 0 4px; padding: 0.25rem 0.5rem; text-align: center;
    transition: all 0.2s; line-height: 1.4;
  }
  .drop-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
  .drop-zone.filled { border-style: solid; border-color: var(--primary); background: #eff6ff; font-weight: 600; color: var(--primary); }
  .drop-zone.correct { border-color: var(--accent); background: var(--accent-light); color: #065f46; }
  .drop-zone.wrong { border-color: var(--danger); background: var(--danger-light); color: #991b1b; }
  .draggables { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
  .draggable {
    padding: 0.4rem 0.8rem; background: #fff; border: 1px solid var(--border); border-radius: 6px;
    cursor: grab; font-size: 0.9rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: transform 0.1s;
    user-select: none; touch-action: none;
  }
  .draggable:active { cursor: grabbing; transform: scale(1.02); }
  .draggable.used { opacity: 0.4; pointer-events: none; }
  .options { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }
  .option {
    padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    background: #fff; transition: all 0.15s; display: flex; align-items: center; gap: 0.6rem;
  }
  .option:hover { background: #f9fafb; border-color: #d1d5db; }
  .option.selected { border-color: var(--primary); background: var(--primary-light); }
  .option.correct { border-color: var(--accent); background: var(--accent-light); }
  .option.wrong { border-color: var(--danger); background: var(--danger-light); }
  .option .check { width: 20px; height: 20px; border: 2px solid #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; }
  .option.selected .check { border-color: var(--primary); background: var(--primary); color: #fff; }
  .option.correct .check { border-color: var(--accent); background: var(--accent); color: #fff; }
  .option.wrong .check { border-color: var(--danger); background: var(--danger); color: #fff; }
  .option .check.square { border-radius: 4px; }
  .feedback { margin-top: 1rem; padding: 1rem; border-radius: 8px; font-size: 0.9rem; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--accent-light); border: 1px solid #a7f3d0; }
  .feedback.wrong { background: var(--danger-light); border: 1px solid #fecaca; }
  .feedback-title { font-weight: 700; margin-bottom: 0.5rem; }
  .explanation { margin-top: 0.5rem; padding-left: 1rem; border-left: 3px solid var(--border); color: var(--text-secondary); font-size: 0.85rem; }
  .nav-btns { display: flex; justify-content: space-between; margin-top: 1.25rem; gap: 0.5rem; flex-wrap: wrap; }
  .nav-btns .right-group { display: flex; gap: 0.5rem; }
  .dashboard-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 1rem;
  }
  .dashboard-overlay.open { display: flex; }
  .dashboard-panel {
    background: var(--card-bg); border-radius: var(--radius); width: 100%; max-width: 800px;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); padding: 1.5rem;
  }
  .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.6rem; }
  .dashboard-item {
    padding: 0.6rem; border-radius: 8px; text-align: center; font-size: 0.8rem; cursor: pointer;
    border: 1px solid var(--border); background: #fff; transition: all 0.15s;
  }
  .dashboard-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .dashboard-item.correct { background: var(--accent-light); border-color: #a7f3d0; }
  .dashboard-item.wrong { background: var(--danger-light); border-color: #fecaca; }
  .dashboard-item.unanswered { background: #f3f4f6; border-color: #e5e7eb; color: var(--text-secondary); }
  .dashboard-item .num { font-weight: 700; font-size: 1rem; display: block; margin-bottom: 0.2rem; }
  .dashboard-item .type { font-size: 0.65rem; opacity: 0.8; }
  .filter-btns { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn { padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 0.8rem; cursor: pointer; }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .result-page { display: none; text-align: center; padding: 2rem 1rem; }
  .result-page.show { display: block; }
  .result-score { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 1rem 0; }
  .result-ring { width: 160px; height: 160px; border-radius: 50%; border: 8px solid var(--primary-light); border-top-color: var(--primary); margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
  .result-stat { background: #fff; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
  .result-stat .val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .result-stat .lbl { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem; }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .top-bar { flex-direction: column; align-items: stretch; }
    .score-bar { justify-content: center; }
    .nav-btns { flex-direction: column; }
    .nav-btns .right-group { justify-content: stretch; }
    .nav-btns .right-group .btn { flex: 1; justify-content: center; }
    .dashboard-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <h1>07-AgenticRAG：自主检索决策实验</h1>
  <p>互动知识卡牌 — 拖拽填空 / 单选 / 多选 / 判断</p>
</header>

<div class="top-bar">
  <div class="score-bar">
    <span class="pill">得分: <span id="score">0</span> / <span id="totalMax">0</span></span>
    <span class="pill">正确: <span id="correctCount">0</span></span>
    <span class="pill">错误: <span id="wrongCount">0</span></span>
  </div>
  <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
    <button class="btn" onclick="openDashboard()">📊 题目总览</button>
    <button class="btn" onclick="shuffleAll()">🎲 重新洗牌选项</button>
    <button class="btn btn-danger" onclick="resetAll()">🔄 重置全部</button>
  </div>
</div>

<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText">第 1 题 / 共 0 题</div>

<div class="container" id="quizContainer">
  <div id="questionArea"></div>
  <div class="nav-btns">
    <button class="btn" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
    <div class="right-group">
      <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">检查答案</button>
      <button class="btn" id="resetBtn" onclick="resetCurrent()">重置本题</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>
</div>

<div class="result-page" id="resultPage">
  <div class="result-ring" id="resultRing">0%</div>
  <div class="result-score" id="resultScore">0 / 0</div>
  <p style="color:var(--text-secondary);margin-bottom:1.5rem;">测试完成！</p>
  <div class="result-stats" id="resultStats"></div>
  <div style="display:flex;gap:0.75rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="openDashboard()">📊 返回查看</button>
    <button class="btn btn-accent" onclick="continueQuiz()">继续做题</button>
  </div>
</div>

<div class="dashboard-overlay" id="dashboardOverlay" onclick="if(event.target===this)closeDashboard()">
  <div class="dashboard-panel">
    <div class="dashboard-header">
      <h2>📊 题目总览</h2>
      <button class="btn" onclick="closeDashboard()">✕ 关闭</button>
    </div>
    <div class="filter-btns">
      <button class="filter-btn active" onclick="filterDashboard('all')">全部</button>
      <button class="filter-btn" onclick="filterDashboard('correct')">✅ 正确</button>
      <button class="filter-btn" onclick="filterDashboard('wrong')">❌ 错误</button>
      <button class="filter-btn" onclick="filterDashboard('unanswered')">⭕ 未答</button>
    </div>
    <div class="dashboard-grid" id="dashboardGrid"></div>
  </div>
</div>

<script>
// ===================== 题目数据 =====================

const dragQuestions = [
  {
    id: "d1",
    type: "drag",
    question: "AgenticRAG 的 ReAct 策略中，LLM 生成推理链的格式是：{0} → {1} → {2}。",
    answers: ["Thought", "Action", "Observation"],
    pool: ["Thought", "Action", "Observation", "Reasoning", "Execution", "Feedback"],
    explanations: [
      "Thought 是第一步：LLM 分析当前状态，决定下一步。干扰项 Reasoning 虽然语义相近，但不是 ReAct 框架中的标准术语。",
      "Action 是第二步：调用工具（retrieve / answer）。干扰项 Execution 过于笼统，不是 ReAct 的规范命名。",
      "Observation 是第三步：工具返回的结果，作为下一轮 Thought 的输入。干扰项 Feedback 是通用概念，不是 ReAct 循环中的标准术语。"
    ]
  },
  {
    id: "d2",
    type: "drag",
    question: "Adaptive RAG 的核心流程是：先用 LLM 判断问题是否需要检索，若需要则执行 {0}，否则直接 {1}。",
    answers: ["检索", "回答"],
    pool: ["检索", "回答", "推理", "验证", "总结", "拒绝"],
    explanations: [
      "Adaptive RAG 的关键是'先判断再行动'：需要检索时调用 retriever 获取上下文，再基于上下文生成答案。",
      "若判断为不需要检索（如简单事实性问题），则直接调用 LLM 生成回答，节省 token 和延迟。"
    ]
  },
  {
    id: "d3",
    type: "drag",
    question: "Corrective RAG 在检索后增加了一个 {0} 检查步骤，若相关性低于阈值则触发 {1} 机制。",
    answers: ["相关性", "fallback"],
    pool: ["相关性", "fallback", "准确性", "重试", "完整性", "跳过"],
    explanations: [
      "Corrective RAG 的核心是'检索质量反馈闭环'：检索后评估文档与问题的相关性，而非直接信任检索结果。",
      "当相关性低于阈值时，系统触发 fallback（如切换 Google Search 等外部搜索引擎），而非继续使用低质量检索结果。"
    ]
  },
  {
    id: "d4",
    type: "drag",
    question: "在实验结果中，{0} 策略在复杂查询上准确率最高（0.81），但代价是延迟达到 {1} 秒。",
    answers: ["ReAct", "5.2"],
    pool: ["ReAct", "5.2", "Self-RAG", "3.5", "Adaptive", "1.8"],
    explanations: [
      "ReAct 策略通过多轮 Thought → Action → Observation 循环处理复杂问题，准确率最高（0.81），但多轮 LLM 调用导致延迟最高。",
      "实验数据显示 ReAct 的 P99 延迟为 5.2 秒，是固定 Naive RAG（2.5 秒）的两倍以上。"
    ]
  },
  {
    id: "d5",
    type: "drag",
    question: "Adaptive RAG 的 RETRIEVAL_CHECK_PROMPT 要求 LLM 仅回答 {0} 或 {1}，并设置 max_tokens={2} 以加速判断。",
    answers: ["YES", "NO", "10"],
    pool: ["YES", "NO", "10", "TRUE", "FALSE", "50"],
    explanations: [
      "RETRIEVAL_CHECK_PROMPT 是一个二分类任务，LLM 只需输出 YES（需要检索）或 NO（不需要检索）。",
      "NO 是另一种可能的输出，表示该问题可以直接由 LLM 回答，无需检索外部知识。",
      "max_tokens=10 限制输出长度，加速判断过程。但模型可能输出 'YES, because...' 导致解析失败，这是该策略的一个已知缺陷。"
    ]
  }
];

const singleQuestions = [
  {
    id: "s1",
    type: "single",
    question: "在五种 RAG 策略中，哪种策略的实现最简单、行为最可预测，但简单问题也会浪费 token？",
    options: [
      "A. ReAct 策略",
      "B. 固定策略 (Naive RAG)",
      "C. Self-RAG 策略",
      "D. Corrective RAG"
    ],
    correct: 1,
    explanations: [
      "❌ ReAct 策略实现复杂，需要多轮 LLM 调用和 Action 解析，不是最简单的。",
      "✅ 固定策略 (Naive RAG) 所有问题都检索 top_k=3，实现简单且行为可预测，但简单问题也检索，浪费 token。",
      "❌ Self-RAG 需要修改生成过程或训练专用模型，实现复杂度最高。",
      "❌ Corrective RAG 需要额外的相关性评估步骤和搜索引擎切换逻辑，实现比固定策略复杂。"
    ]
  },
  {
    id: "s2",
    type: "single",
    question: "Adaptive RAG 在生产环境中的主要优势是什么？",
    options: [
      "A. 复杂问题准确率最高",
      "B. 简单问题可节省 30-40% token，延迟降低",
      "C. 每生成一个 token 都判断是否检索",
      "D. 检索后自动切换搜索引擎"
    ],
    correct: 1,
    explanations: [
      "❌ 复杂问题准确率最高的是 ReAct 策略（0.81），不是 Adaptive RAG（0.74）。",
      "✅ Adaptive RAG 的核心优势是'按需检索'：简单问题直接回答，可节省 30-40% token，延迟降低。",
      "❌ 每 token 判断是否检索是 Self-RAG 的特征，不是 Adaptive RAG。",
      "❌ 检索后切换搜索引擎是 Corrective RAG 的机制。"
    ]
  },
  {
    id: "s3",
    type: "single",
    question: "ReAct 策略中的 'ReAct' 是什么的缩写？",
    options: [
      "A. Reactive Action",
      "B. Reasoning + Acting",
      "C. Retrieval Activation",
      "D. Recursive Attention"
    ],
    correct: 1,
    explanations: [
      "❌ Reactive Action 不是 ReAct 的正确含义。",
      "✅ ReAct = Reasoning + Acting，核心是把 LLM 从'一次性生成答案'变成'多轮决策器'。",
      "❌ Retrieval Activation 是干扰项，与 ReAct 无关。",
      "❌ Recursive Attention 是干扰项，不是 ReAct 的含义。"
    ]
  },
  {
    id: "s4",
    type: "single",
    question: "在实验结果中，哪种策略在中等复杂度查询上的性价比最佳？",
    options: [
      "A. 固定 Naive RAG",
      "B. ReAct Agentic",
      "C. Self-RAG",
      "D. Corrective RAG"
    ],
    correct: 2,
    explanations: [
      "❌ 固定 Naive RAG 虽然成本低，但准确率只有 0.72，性价比不如 Self-RAG。",
      "❌ ReAct 准确率最高（0.81）但 token 消耗和延迟也最高（3,500 token / 5.2s），性价比不是最佳。",
      "✅ Self-RAG 准确率 0.79 接近 ReAct，但成本比 ReAct 低 20%（2,800 token / 3.5s），在中等复杂度上性价比最佳。",
      "❌ Corrective RAG 准确率 0.76，成本 2,600 token，性价比不如 Self-RAG。"
    ]
  },
  {
    id: "s5",
    type: "single",
    question: "AgenticRAG 系统中，max_steps=5 的作用是什么？",
    options: [
      "A. 限制检索返回的文档数量",
      "B. 限制每轮 LLM 调用的 token 数",
      "C. 防止 ReAct 循环陷入无限循环的安全上限",
      "D. 限制向量索引的维度"
    ],
    correct: 2,
    explanations: [

    explanation: "❌ 错误。代码中明确注释 'scores=[0.8] * len(docs) // 模拟分数，实际应由 FAISS 返回'。当前实现使用固定值 0.8 模拟，不是真实分数。在生产环境中需要替换为 FAISS 实际返回的相似度分数。"
  },
  {
    id: "t8",
    type: "tf",
    question: "实验数据集中的 100 条查询按复杂度分为三类：简单 30 条、中等 40 条、复杂 30 条。",
    correct: true,
    explanation: "✅ 正确。实验设计明确说明：简单查询 30 条（事实性问题，无需检索）、中等查询 40 条（需要 1-2 次检索）、复杂查询 30 条（需要多步检索、推理、验证）。"
  }
];

// ===================== 状态管理 =====================

const allQuestions = [...dragQuestions, ...singleQuestions, ...multiQuestions, ...trueFalseQuestions];

let currentIndex = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = new Set();
let userAnswers = {}; // questionId -> answer
let dragState = {}; // questionId -> { filled: [term, ...], used: Set }

function getQuestionById(id) {
  return allQuestions.find(q => q.id === id);
}

function getQuestionIndexById(id) {
  return allQuestions.findIndex(q => q.id === id);
}

function getTypeLabel(type) {
  if (type === 'drag') return '拖拽';
  if (type === 'single') return '单选';
  if (type === 'multi') return '多选';
  if (type === 'tf') return '判断';
  return type;
}

function getTypeBadgeClass(type) {
  if (type === 'drag') return 'badge-drag';
  if (type === 'single') return 'badge-single';
  if (type === 'multi') return 'badge-multi';
  if (type === 'tf') return 'badge-tf';
  return 'badge-single';
}

// ===================== 渲染 =====================

function renderQuestion() {
  const q = allQuestions[currentIndex];
  const area = document.getElementById('questionArea');
  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'q-' + q.id;

  const badge = document.createElement('span');
  badge.className = 'type-badge ' + getTypeBadgeClass(q.type);
  badge.textContent = getTypeLabel(q.type);
  card.appendChild(badge);

  const title = document.createElement('h3');
  title.textContent = q.question;
  card.appendChild(title);

  if (q.type === 'drag') {
    renderDrag(card, q);
  } else if (q.type === 'single') {
    renderSingle(card, q);
  } else if (q.type === 'multi') {
    renderMulti(card, q);
  } else if (q.type === 'tf') {
    renderTF(card, q);
  }

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + q.id;
  card.appendChild(feedback);

  area.appendChild(card);

  updateProgress();
  updateNavButtons();
}

function renderDrag(card, q) {
  const state = dragState[q.id] || { filled: new Array(q.answers.length).fill(null), used: new Set() };
  dragState[q.id] = state;

  // Build question text with drop zones
  let parts = q.question.split(/\{(\d+)\}/g);
  const questionEl = document.createElement('div');
  questionEl.style.lineHeight = '2.2';
  parts.forEach((part, i) => {
    if (i % 2 === 0) {
      questionEl.appendChild(document.createTextNode(part));
    } else {
      const idx = parseInt(part);
      const zone = document.createElement('span');
      zone.className = 'drop-zone';
      zone.dataset.index = idx;
      zone.dataset.qid = q.id;
      if (state.filled[idx]) {
        zone.textContent = state.filled[idx];
        zone.classList.add('filled');
      } else {
        zone.textContent = '?';
      }
      if (answered.has(q.id)) {
        const isCorrect = state.filled[idx] === q.answers[idx];
        zone.classList.add(isCorrect ? 'correct' : 'wrong');
      }
      setupDropZone(zone);
      questionEl.appendChild(zone);
    }
  });
  card.appendChild(questionEl);

  // Draggables pool
  const poolEl = document.createElement('div');
  poolEl.className = 'draggables';
  q.pool.forEach(term => {
    const btn = document.createElement('div');
    btn.className = 'draggable';
    btn.textContent = term;
    btn.draggable = !answered.has(q.id);
    if (state.used.has(term) || answered.has(q.id)) {
      btn.classList.add('used');
      btn.draggable = false;
    }
    btn.dataset.term = term;
    setupDraggable(btn);
    poolEl.appendChild(btn);
  });
  card.appendChild(poolEl);

  if (answered.has(q.id)) {
    showDragFeedback(q);
  }
}

function renderSingle(card, q) {
  const opts = document.createElement('div');
  opts.className = 'options';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.dataset.index = i;
    div.innerHTML = '<span class="check"></span><span>' + escapeHtml(opt) + '</span>';
    div.onclick = () => selectSingle(q.id, i);
    if (answered.has(q.id)) {
      const userAns = userAnswers[q.id];
      if (i === userAns) div.classList.add(userAns === q.correct ? 'correct' : 'wrong');
      if (i === q.correct && userAns !== q.correct) div.classList.add('correct');
      div.onclick = null;
      div.style.cursor = 'default';
    } else if (userAnswers[q.id] === i) {
      div.classList.add('selected');
    }
    opts.appendChild(div);
  });
  card.appendChild(opts);
  if (answered.has(q.id)) showOptionFeedback(q);
}

function renderMulti(card, q) {
  const opts = document.createElement('div');
  opts.className = 'options';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.dataset.index = i;
    div.innerHTML = '<span class="check square"></span><span>' + escapeHtml(opt) + '</span>';
    div.onclick = () => toggleMulti(q.id, i);
    if (answered.has(q.id)) {
      const userAns = userAnswers[q.id] || [];
      const isCorrect = q.correct.includes(i);
      const isSelected = userAns.includes(i);
      if (isSelected && isCorrect) div.classList.add('correct');
      else if (isSelected && !isCorrect) div.classList.add('wrong');
      else if (!isSelected && isCorrect) div.classList.add('correct');
      div.onclick = null;
      div.style.cursor = 'default';
    } else {
      const userAns = userAnswers[q.id] || [];
      if (userAns.includes(i)) div.classList.add('selected');
    }
    opts.appendChild(div);
  });
  card.appendChild(opts);
  if (answered.has(q.id)) showOptionFeedback(q);
}

function renderTF(card, q) {
  const opts = document.createElement('div');
  opts.className = 'options';
  const choices = [
    { label: '✅ 正确 (True)', val: true },
    { label: '❌ 错误 (False)', val: false }
  ];
  choices.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.dataset.val = c.val;
    div.innerHTML = '<span class="check"></span><span>' + c.label + '</span>';
    div.onclick = () => selectTF(q.id, c.val);
    if (answered.has(q.id)) {
      const userAns = userAnswers[q.id];
      if (c.val === userAns) div.classList.add(userAns === q.correct ? 'correct' : 'wrong');
      if (c.val === q.correct && userAns !== q.correct) div.classList.add('correct');
      div.onclick = null;
      div.style.cursor = 'default';
    } else if (userAnswers[q.id] === c.val) {
      div.classList.add('selected');
    }
    opts.appendChild(div);
  });
  card.appendChild(opts);
  if (answered.has(q.id)) showTFFeedback(q);
}

// ===================== 交互 =====================

function setupDraggable(el) {
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', el.dataset.term);
    el.style.opacity = '0.5';
  });
  el.addEventListener('dragend', e => {
    el.style.opacity = '1';
  });
  // Touch support
  el.addEventListener('touchstart', handleTouchStart, { passive: false });
  el.addEventListener('touchmove', handleTouchMove, { passive: false });
  el.addEventListener('touchend', handleTouchEnd, { passive: false });
}

function setupDropZone(el) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    const term = e.dataTransfer.getData('text/plain');
    if (!term) return;
    fillDropZone(el, term);
  });
}

let touchDragTerm = null;
let touchClone = null;

function handleTouchStart(e) {
  if (answered.has(e.target.closest('.draggable')?.closest('.card')?.id?.replace('q-', ''))) return;
  const el = e.target.closest('.draggable');
  if (!el || el.classList.contains('used')) return;
  touchDragTerm = el.dataset.term;
  touchClone = el.cloneNode(true);
  touchClone.style.position = 'fixed';
  touchClone.style.zIndex = '1000';
  touchClone.style.opacity = '0.8';
  touchClone.style.pointerEvents = 'none';
  document.body.appendChild(touchClone);
  moveTouchClone(e);
}

function handleTouchMove(e) {
  if (!touchClone) return;
  e.preventDefault();
  moveTouchClone(e);
}

function moveTouchClone(e) {
  const touch = e.touches[0];
  touchClone.style.left = touch.clientX - touchClone.offsetWidth / 2 + 'px';
  touchClone.style.top = touch.clientY - touchClone.offsetHeight / 2 + 'px';
}

function handleTouchEnd(e) {
  if (!touchClone) return;
  const touch = e.changedTouches[0];
  const zones = document.querySelectorAll('.drop-zone');
  for (const z of zones) {
    const rect = z.getBoundingClientRect();
    if (touch.clientX >= rect.left && touch.clientX <= rect.right && touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
      fillDropZone(z, touchDragTerm);
      break;
    }
  }
  touchClone.remove();
  touchClone = null;
  touchDragTerm = null;
}

function fillDropZone(zone, term) {
  const qid = zone.dataset.qid;
  if (answered.has(qid)) return;
  const idx = parseInt(zone.dataset.index);
  const q = getQuestionById(qid);
  const state = dragState[qid];
  // Remove from previous slot if any
  const prevIdx = state.filled.indexOf(term);
  if (prevIdx !== -1) {
    state.filled[prevIdx] = null;
    state.used.delete(term);
  }
  // Remove current slot's old term from used
  if (state.filled[idx]) {
    state.used.delete(state.filled[idx]);
  }
  state.filled[idx] = term;
  state.used.add(term);
  renderQuestion();
}

function selectSingle(qid, idx) {
  if (answered.has(qid)) return;
  userAnswers[qid] = idx;
  renderQuestion();
}

function toggleMulti(qid, idx) {
  if (answered.has(qid)) return;
  if (!userAnswers[qid]) userAnswers[qid] = [];
  const arr = userAnswers[qid];
  const pos = arr.indexOf(idx);
  if (pos === -1) arr.push(idx);
  else arr.splice(pos, 1);
  renderQuestion();
}

function selectTF(qid, val) {
  if (answered.has(qid)) return;
  userAnswers[qid] = val;
  renderQuestion();
}

// ===================== 检查答案 =====================

function checkAnswer() {
  const q = allQuestions[currentIndex];
  if (answered.has(q.id)) return;

  if (q.type === 'drag') {
    const state = dragState[q.id];
    if (!state || state.filled.some(v => v === null)) {
      alert('请先完成所有填空！');
      return;
    }
  } else if (q.type === 'single' || q.type === 'tf') {
    if (userAnswers[q.id] === undefined) {
      alert('请先选择一个答案！');
      return;
    }
  } else if (q.type === 'multi') {
    if (!userAnswers[q.id] || userAnswers[q.id].length === 0) {
      alert('请至少选择一个答案！');
      return;
    }
  }

  answered.add(q.id);
  let isCorrect = false;

  if (q.type === 'drag') {
    const state = dragState[q.id];
    isCorrect = state.filled.every((term, i) => term === q.answers[i]);
    showDragFeedback(q);
  } else if (q.type === 'single') {
    isCorrect = userAnswers[q.id] === q.correct;
    showOptionFeedback(q);
  } else if (q.type === 'multi') {
    const userAns = userAnswers[q.id] || [];
    isCorrect = userAns.length === q.correct.length && userAns.every(v => q.correct.includes(v));
    showOptionFeedback(q);
  } else if (q.type === 'tf') {
    isCorrect = userAnswers[q.id] === q.correct;
    showTFFeedback(q);
  }

  if (isCorrect) {
    score++;
    correctCount++;
  } else {
    wrongCount++;
  }
  updateScore();
  updateNavButtons();
  renderQuestion();

  // Check if all answered
  if (answered.size === allQuestions.length) {
    showResult();
  }
}

function showDragFeedback(q) {
  const fb = document.getElementById('feedback-' + q.id);
  const state = dragState[q.id];
  const allCorrect = state.filled.every((term, i) => term === q.answers[i]);
  fb.className = 'feedback show ' + (allCorrect ? 'correct' : 'wrong');
  let html = '<div class="feedback-title">' + (allCorrect ? '✅ 全部正确！' : '❌ 有错误！') + '</div>';
  html += '<div class="explanation">';
  q.answers.forEach((ans, i) => {
    const user = state.filled[i];
    html += '<p><strong>空格 ' + (i + 1) + ':</strong> ';
    if (user === ans) html += '✅ 正确 (' + ans + ')';
    else html += '❌ 你的答案: ' + (user || '空') + ' | 正确答案: ' + ans;
    html += '<br><span style="color:#6b7280;">' + q.explanations[i] + '</span></p>';
  });
  html += '</div>';
  fb.innerHTML = html;
}

function showOptionFeedback(q) {
  const fb = document.getElementById('feedback-' + q.id);
  let isCorrect = false;
  if (q.type === 'single') {
    isCorrect = userAnswers[q.id] === q.correct;
  } else if (q.type === 'multi') {
    const userAns = userAnswers[q.id] || [];
    isCorrect = userAns.length === q.correct.length && userAns.every(v => q.correct.includes(v));
  }
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  let html = '<div class="feedback-title">' + (isCorrect ? '✅ 回答正确！' : '❌ 回答错误！') + '</div>';
  html += '<div class="explanation">';
  q.options.forEach((opt, i) => {
    html += '<p>' + q.explanations[i] + '</p>';
  });
  html += '</div>';
  fb.innerHTML = html;
}

function showTFFeedback(q) {
  const fb = document.getElementById('feedback-' + q.id);
  const isCorrect = userAnswers[q.id] === q.correct;
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = '<div class="feedback-title">' + (isCorrect ? '✅ 回答正确！' : '❌ 回答错误！') + '</div>' +
    '<div class="explanation"><p>' + q.explanation + '</p></div>';
}

// ===================== 导航 =====================

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (currentIndex < allQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  }
}

function updateNavButtons() {
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === allQuestions.length - 1;
  const q = allQuestions[currentIndex];
  document.getElementById('checkBtn').disabled = answered.has(q.id);
}

function updateProgress() {
  const pct = ((currentIndex + 1) / allQuestions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = '第 ' + (currentIndex + 1) + ' 题 / 共 ' + allQuestions.length + ' 题';
}

function updateScore() {
  document.getElementById('score').textContent = score;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
}

// ===================== 重置 =====================

function resetCurrent() {
  const q = allQuestions[currentIndex];
  if (!answered.has(q.id)) {
    // Just clear user selection
    if (q.type === 'drag') {
      dragState[q.id] = { filled: new Array(q.answers.length).fill(null), used: new Set() };
    } else {
      delete userAnswers[q.id];
    }
    renderQuestion();
    return;
  }
  // Remove from answered and adjust score
  answered.delete(q.id);
  // Recalculate score
  recalcScore();
  if (q.type === 'drag') {
    dragState[q.id] = { filled: new Array(q.answers.length).fill(null), used: new Set() };
  } else {
    delete userAnswers[q.id];
  }
  renderQuestion();
}

function recalcScore() {
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  for (const qid of answered) {
    const q = getQuestionById(qid);
    let isCorrect = false;
    if (q.type === 'drag') {
      const state = dragState[qid];
      isCorrect = state && state.filled.every((term, i) => term === q.answers[i]);
    } else if (q.type === 'single') {
      isCorrect = userAnswers[qid] === q.correct;
    } else if (q.type === 'multi') {
      const userAns = userAnswers[qid] || [];
      isCorrect = userAns.length === q.correct.length && userAns.every(v => q.correct.includes(v));
    } else if (q.type === 'tf') {
      isCorrect = userAnswers[qid] === q.correct;
    }
    if (isCorrect) { score++; correctCount++; }
    else wrongCount++;
  }
  updateScore();
}

function resetAll() {
  if (!confirm('确定要重置所有答题记录吗？')) return;
  currentIndex = 0;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  answered = new Set();
  userAnswers = {};
  dragState = {};
  updateScore();
  document.getElementById('resultPage').classList.remove('show');
  document.getElementById('quizContainer').classList.remove('hidden');
  document.getElementById('progressBar').classList.remove('hidden');
  document.getElementById('progressText').classList.remove('hidden');
  renderQuestion();
}

// ===================== 总览面板 =====================

function openDashboard() {
  document.getElementById('dashboardOverlay').classList.add('open');
  renderDashboardGrid('all');
}

function closeDashboard() {
  document.getElementById('dashboardOverlay').classList.remove('open');
}

function filterDashboard(filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderDashboardGrid(filter);
}

function renderDashboardGrid(filter) {
  const grid = document.getElementById('dashboardGrid');
  grid.innerHTML = '';
  allQuestions.forEach((q, i) => {
    const isAnswered = answered.has(q.id);
    let status = 'unanswered';
    if (isAnswered) {
      let isCorrect = false;
      if (q.type === 'drag') {
        const state = dragState[q.id];
        isCorrect = state && state.filled.every((term, j) => term === q.answers[j]);
      } else if (q.type === 'single') {
        isCorrect = userAnswers[q.id] === q.correct;
      } else if (q.type === 'multi') {
        const userAns = userAnswers[q.id] || [];
        isCorrect = userAns.length === q.correct.length && userAns.every(v => q.correct.includes(v));
      } else if (q.type === 'tf') {
        isCorrect = userAnswers[q.id] === q.correct;
      }
      status = isCorrect ? 'correct' : 'wrong';
    }
    if (filter !== 'all' && status !== filter) return;

    const item = document.createElement('div');
    item.className = 'dashboard-item ' + status;
    item.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="type">' + getTypeLabel(q.type) + '</span>';
    item.onclick = () => {
      currentIndex = i;
      closeDashboard();
      renderQuestion();
    };
    grid.appendChild(item);
  });
}

// ===================== 结果页 =====================

function showResult() {
  document.getElementById('quizContainer').classList.add('hidden');
  document.getElementById('progressBar').classList.add('hidden');
  document.getElementById('progressText').classList.add('hidden');
  const resultPage = document.getElementById('resultPage');
  resultPage.classList.add('show');

  const total = allQuestions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('resultScore').textContent = score + ' / ' + total;
  document.getElementById('resultRing').textContent = pct + '%';

  const stats = document.getElementById('resultStats');
  stats.innerHTML = '';
  const statData = [
    { val: correctCount, lbl: '正确' },
    { val: wrongCount, lbl: '错误' },
    { val: total - answered.size, lbl: '未答' },
    { val: pct + '%', lbl: '得分率' }
  ];
  statData.forEach(s => {
    const div = document.createElement('div');
    div.className = 'result-stat';
    div.innerHTML = '<div class="val">' + s.val + '</div><div class="lbl">' + s.lbl + '</div>';
    stats.appendChild(div);
  });
}

function continueQuiz() {
  document.getElementById('resultPage').classList.remove('show');
  document.getElementById('quizContainer').classList.remove('hidden');
  document.getElementById('progressBar').classList.remove('hidden');
  document.getElementById('progressText').classList.remove('hidden');
  // Go to first unanswered or last question
  const firstUnanswered = allQuestions.findIndex(q => !answered.has(q.id));
  currentIndex = firstUnanswered !== -1 ? firstUnanswered : allQuestions.length - 1;
  renderQuestion();
}

// ===================== 洗牌 =====================

function shuffleAll() {
  if (!confirm('重新洗牌将清空所有答题记录并随机打乱选项顺序，确定继续？')) return;

  // Shuffle single
  singleQuestions.forEach(q => {
    const pairs = q.options.map((opt, i) => ({ opt, expl: q.explanations[i] }));
    for (let i = pairs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
    }
    q.options = pairs.map(p => p.opt);
    q.explanations = pairs.map(p => p.expl);
    q.correct = pairs.findIndex(p => p.expl.startsWith('✅'));
  });

  // Shuffle multi
  multiQuestions.forEach(q => {
    const pairs = q.options.map((opt, i) => ({ opt, expl: q.explanations[i], isCorrect: q.correct.includes(i) }));
    for (let i = pairs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
    }
    q.options = pairs.map(p => p.opt);
    q.explanations = pairs.map(p => p.expl);
    q.correct = pairs.map((p, i) => p.isCorrect ? i : -1).filter(v => v !== -1);
  });

  // Shuffle TF
  trueFalseQuestions.forEach(q => {
    // TF only has 2 options, shuffle doesn't change much but let's be consistent
    // Actually TF options are generated dynamically, no need to shuffle
  });

  // Reset all progress
  currentIndex = 0;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  answered = new Set();
  userAnswers = {};
  dragState = {};
  updateScore();
  document.getElementById('resultPage').classList.remove('show');
  document.getElementById('quizContainer').classList.remove('hidden');
  document.getElementById('progressBar').classList.remove('hidden');
  document.getElementById('progressText').classList.remove('hidden');
  renderQuestion();
}

// ===================== 工具 =====================

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===================== 初始化 =====================

function init() {
  document.getElementById('totalMax').textContent = allQuestions.length;
  updateScore();
  renderQuestion();
}

init();
</script>
