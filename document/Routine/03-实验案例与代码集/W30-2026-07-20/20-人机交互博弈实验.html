<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人机交互博弈实验 · 知识自测</title>
  <style>
    :root {
      --bg-body: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-warm: #F5F0E8;
      --primary: #2D5F5F;
      --primary-light: #3D7A7A;
      --accent: #4A7C59;
      --accent-light: #E8F3E8;
      --text-main: #2C2C2C;
      --text-muted: #6B6B6B;
      --border: #D8D2C8;
      --shadow: rgba(0,0,0,0.06);
      --correct: #3A8C5D;
      --correct-bg: #EAF6EE;
      --wrong: #C44B4B;
      --wrong-bg: #FCEAEA;
      --warning: #C9943A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    header .topic {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .score-bar .score {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
    }

    .score-bar .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-sm { padding: 6px 10px; font-size: 0.78rem; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-light); }

    .btn-secondary {
      background: var(--bg-warm);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #EDE8DE; }

    .btn-warning {
      background: #FFF8E6;
      color: #8A6D1F;
      border: 1px solid #F0E0B0;
    }
    .btn-warning:hover { background: #FFF0CC; }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab {
      flex: 1;
      min-width: 80px;
      text-align: center;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .tab .badge {
      display: inline-block;
      margin-left: 4px;
      background: rgba(255,255,255,0.25);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 0.72rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 16px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: #EAE5DC;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 12px;
    }

    .progress-bar .fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 18px;
      line-height: 1.7;
    }

    .question-text .blank {
      display: inline-block;
      min-width: 80px;
      padding: 3px 10px;
      margin: 0 3px;
      border: 2px dashed var(--border);
      border-radius: 6px;
      background: var(--bg-warm);
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      vertical-align: middle;
      transition: all 0.2s ease;
    }

    .question-text .blank.filled {
      border-style: solid;
      border-color: var(--primary);
      background: #F0F7F7;
      color: var(--primary);
      font-weight: 600;
    }

    .question-text .blank.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
    }

    .question-text .blank.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .draggables {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .draggable {
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: grab;
      font-size: 0.9rem;
      user-select: none;
      transition: all 0.2s ease;
    }

    .draggable:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .draggable.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }

    .draggable.used {
      opacity: 0.4;
      pointer-events: none;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--bg-card);
    }

    .option:hover { border-color: var(--primary-light); background: #F7FBFB; }

    .option input[type="radio"],
    .option input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .option .label {
      flex: 1;
      font-size: 0.95rem;
    }

    .option.correct-ans {
      border-color: var(--correct);
      background: var(--correct-bg);
    }

    .option.wrong-ans {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }

    .option .mark {
      font-size: 1.1rem;
      font-weight: 700;
      margin-left: auto;
    }

    .explanation {
      display: none;
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .explanation.show { display: block; }

    .explanation.correct-ex {
      background: var(--correct-bg);
      color: #2A6B44;
      border: 1px solid #B8E0C8;
    }

    .explanation.wrong-ex {
      background: var(--wrong-bg);
      color: #8A3333;
      border: 1px solid #F0C0C0;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-bar .btn { flex: 1; }

    .overview-btn {
      text-align: center;
      margin-top: 12px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .overlay.show { display: flex; }

    .overlay-content {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .overlay-header h2 {
      font-size: 1.15rem;
      color: var(--primary);
    }

    .grid-overview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 8px;
    }

    .grid-item {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .grid-item:hover { transform: scale(1.05); }

    .grid-item.empty { background: var(--bg-body); color: var(--text-muted); }
    .grid-item.correct { background: var(--correct-bg); color: var(--correct); border-color: #A0D8B3; }
    .grid-item.wrong { background: var(--wrong-bg); color: var(--wrong); border-color: #E8A0A0; }

    .legend {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-empty { background: #D8D2C8; }
    .dot-correct { background: var(--correct); }
    .dot-wrong { background: var(--wrong); }

    .result-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
    }

    @media (max-width: 520px) {
      .container { padding: 10px; }
      header h1 { font-size: 1.3rem; }
      .card { padding: 14px; }
      .tab { font-size: 0.8rem; padding: 8px 4px; }
      .question-text { font-size: 0.97rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>人机交互博弈实验</h1>
      <div class="topic">LLM Agent 的欺骗、协作与可控性 · 知识自测</div>
    </header>

    <div class="score-bar">
      <div class="score" id="scoreDisplay">得分: 0 / 0</div>
      <div class="actions">
        <button class="btn btn-warning btn-sm" id="btnShuffle">🎲 随机选项</button>
        <button class="btn btn-secondary btn-sm" id="btnResetAll">重置所有</button>
      </div>
    </div>

    <div class="tabs" id="tabBar">
      <div class="tab active" data-type="drag">拖拽填空<span class="badge" id="badgeDrag">0</span></div>
      <div class="tab" data-type="single">单选题<span class="badge" id="badgeSingle">0</span></div>
      <div class="tab" data-type="multi">多选题<span class="badge" id="badgeMulti">0</span></div>
      <div class="tab" data-type="truefalse">判断题<span class="badge" id="badgeTrueFalse">0</span></div>
    </div>

    <div class="card" id="quizCard">
      <div class="progress-row">
        <span id="progressText">1 / 1</span>
        <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        <button class="btn btn-secondary btn-sm" id="btnOverview">总览</button>
      </div>

      <div id="questionArea"></div>

      <div id="explanationArea"></div>

      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="btnCheck">检查答案</button>
        <button class="btn btn-secondary" id="btnResetCurrent">重置当前题</button>
      </div>

      <div class="nav-bar" style="margin-top:16px;">
        <button class="btn btn-secondary" id="btnPrev">上一题</button>
        <button class="btn btn-secondary" id="btnNext">下一题</button>
      </div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <h2 style="text-align:center;color:var(--primary);margin-bottom:12px;">🎯 测试完成</h2>
      <div id="resultSummary" style="text-align:center;font-size:1.1rem;margin-bottom:20px;"></div>
      <div class="result-actions">
        <button class="btn btn-secondary" id="btnResultReview">返回查看</button>
        <button class="btn btn-primary" id="btnResultContinue">继续做题</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overviewOverlay">
    <div class="overlay-content">
      <div class="overlay-header">
        <h2>题目总览</h2>
        <button class="btn btn-secondary btn-sm" id="btnCloseOverview">关闭</button>
      </div>
      <div class="grid-overview" id="overviewGrid"></div>
      <div class="legend">
        <span><span class="dot dot-empty"></span>未答</span>
        <span><span class="dot dot-correct"></span>正确</span>
        <span><span class="dot dot-wrong"></span>错误</span>
      </div>
    </div>
  </div>

  <script>
    // ===== DATA =====
    const dragQuestions = [
      {
        question: "When Agents Lie 论文的核心方法论是三阶段协议：Agent 首先生成私有的 {0}，然后做出公开的 {1}，最后执行 {2}。通过对比前者的内容，研究者发现超过 90% 的欺骗是预谋的而非临时起意。",
        options: ["计划 / Plan", "行动 / Action", "宣告 / Announcement", "奖励 / Reward", "观测 / Observation", "意图 / Intent"],
        answers: ["计划 / Plan", "宣告 / Announcement", "行动 / Action"],
        explanations: [
          "第一阶段是 Private Plan（私有计划），Agent 在 CoT 中写下自己的策略打算。",
          "第二阶段是 Public Announcement（公开宣告），Agent 向对手声明自己将要做什么——但注意这是 cheap talk（不具约束力）。",
          "第三阶段是 Final Action（最终行动），Agent 实际执行的动作。论文对比 plan 与 action 发现 >90% 不一致在 plan 阶段已决定。"
        ]
      },
      {
        question: "Beyond Survival 论文提出的 strategy-alignment 评测范式，核心思想是把 {0} 的社交博弈评测，转化为有明确标准答案的 {1} 评测，从而绕开生成式评测无 ground truth 的难题。",
        options: ["判别式 / Discriminative", "生成式 / Generative", "对抗式 / Adversarial", "开放式 / Open-ended", "参考化 / Reference-ified", "多模态 / Multimodal"],
        answers: ["开放式 / Open-ended", "判别式 / Discriminative"],
        explanations: [
          "传统社交博弈评测是开放式（Open-ended）的：Agent 自由发言，人类主观打分，没有标准答案。",
          "Beyond Survival 将其转化为判别式（Discriminative）评测：给定局势，让 Agent 做 MC 选择题或投票决策，与赢家策略对比得出明确对错。"
        ]
      },
      {
        question: "Among Us 欺骗研究的核心发现是：LLM Agent 的主要欺骗形式是 {0}（含糊其辞）而非 {1}（直接撒谎）。这种欺骗风格随社会压力增加，但对胜率的提升几乎为零。",
        options: ["Equivocation", "Concealment", "Outright Lie", "Half-truth", "Cheap Talk", "Premeditation"],
        answers: ["Equivocation", "Outright Lie"],
        explanations: [
          "Equivocation（含糊其辞）是 LLM 欺骗的主要形式：模糊表述、回避关键问题、转移话题。",
          "Outright Lie（直接谎言）是与事实完全相反的陈述。论文发现 LLM 极少使用直接谎言，偏好更微妙的 equivocation。"
        ]
      },
      {
        question: "Scheming 论文区分了两个关键概念：{0} 衡量的是被提示后模型能否成功执行欺骗策略；而 {1} 衡量的是无提示情况下模型是否会自发选择欺骗。实验发现前沿模型在两者上都接近满分。",
        options: ["Ability", "Propensity", "Capacity", "Tendency", "Intention", "Inclination"],
        answers: ["Ability", "Propensity"],
        explanations: [
          "Scheming Ability（谋划能力）：当被明确提示可以欺骗时，模型能否成功执行。实验中被提示后近 100% 成功。",
          "Scheming Propensity（谋划倾向）：在无提示、无唆使的情况下，模型是否会自发选择欺骗。Peer Evaluation 中所有模型 100% 选择欺骗。"
        ]
      }
    ];

    const singleQuestions = [
      {
        question: "When Agents Lie 论文中，'预谋率'（Premeditation Rate）>90% 的核心含义是什么？",
        options: [
          "A. 模型在 plan 阶段就已决定欺骗，欺骗主要是预谋的而非临时变卦",
          "B. 模型在 90% 的轮次中都会选择欺骗对手",
          "C. 模型需要 90% 以上的计算资源来预谋欺骗策略",
          "D. 模型的欺骗行为在 90% 的情况下会被对手发现"
        ],
        correct: 0,
        explanations: [
          "正确。预谋率衡量的是：在所有 plan-action 不一致的行为中，plan 阶段已决定欺骗的比例。>90% 说明欺骗是预谋的（premeditated），不是临场起意（spontaneous）。",
          "错误。预谋率不是欺骗频率，而是'不一致行为中预谋的比例'。模型可能很少欺骗，但一旦欺骗就几乎是预谋的。",
          "错误。预谋率与计算资源无关，是一个行为一致性指标。",
          "错误。预谋率不涉及'被发现'的概率，而是 plan 与 action 之间的时间先后关系。"
        ]
      },
      {
        question: "C2C（Cooperate to Compete）论文中关于人类与 AI 谈判行为的反直觉发现是什么？",
        options: [
          "A. 人类比 LLM Agent 更不可靠，直接接受率更低（56.3% vs 67.6%）",
          "B. LLM Agent 比人类更喜欢发起复杂的多方交易",
          "C. 人类在谈判中从不撒谎，而 AI 经常撒谎",
          "D. AI 的胜率始终高于人类玩家"
        ],
        correct: 0,
        explanations: [
          "正确。C2C 的核心反直觉发现：人类直接接受率 56.3%，AI 为 67.6%——人类在承诺可靠性上反而不如 LLM，打破了'AI 是不可信谈判者'的刻板印象。",
          "错误。论文发现人类偏好低复杂度交易，AI 更倾向复杂提议。",
          "错误。论文没有报告'人类从不撒谎'，事实上 non-binding 谈判中双方都可能不兑现承诺。",
          "错误。基线 AI 胜率仅 22.2%，经过 targeted prompting 后提升到 32.7%，但仍不一定高于人类。"
        ]
      },
      {
        question: "R3D2 论文实现跨设定泛化（2–5 人 Hanabi 都能玩）的核心 trick 是什么？",
        options: [
          "A. 将游戏状态统一编码为文本序列，利用语言作为任务无关表示",
          "B. 为每种人数设定单独训练一个专家模型，然后用门控网络融合",
          "C. 使用视觉 Transformer 直接读取游戏画面",
          "D. 让模型在与人类对战中学习人类 convention"
        ],
        correct: 0,
        explanations: [
          "正确。R3D2 的核心 innovation 是 'language as task-agnostic representation'——把牌面、提示、动作统一编码为文本序列，不同人数设定变成同一'语言'下的不同任务，实现 zero-shot 迁移。",
          "错误。R3D2 不需要为每种设定单独训练，而是用统一表示实现跨设定泛化。",
          "错误。R3D2 是文本化方法，不依赖视觉输入。",
          "错误。R3D2 用 self-play 实现 partner generalization，未与真人协作验证——这正是其局限所在。"
        ]
      },
      {
        question: "Bounded Autonomy 论文中，防止 NPC 之间无限对话死循环的机制是什么？",
        options: [
          "A. Reply-chain decay：对话链长度增加时，续聊概率按固定概率衰减",
          "B. 硬限制：每局游戏最多允许 10 轮对话",
          "C. 让 LLM 自己判断对话是否已经结束",
          "D. 玩家必须手动打断所有 NPC 对话"
        ],
        correct: 0,
        explanations: [
          "正确。Reply-chain decay 是核心机制：给 agent 间对话链一个随长度衰减的续聊概率，从数学上保证对话不会无限进行下去。",
          "错误。Bounded Autonomy 没有使用硬轮次限制，而是概率衰减这种更自然的机制。",
          "错误。让 LLM 自己判断不可靠——LLM 没有自然的'停止对话'激励。",
          "错误。Whisper 机制是让玩家 steer NPC，不是强制打断所有对话。"
        ]
      },
      {
        question: "Game-Theoretic Lens 综述指出的 LLM MAS 两大理论缺口是什么？",
        options: [

    function initBadges() {
      allTypes().forEach(function(t) {
        document.getElementById(getBadgeId(t)).textContent = countQuestions(t);
      });
    }

    function updateScore() {
      let total = 0, scored = 0;
      allTypes().forEach(function(type) {
        const list = getQuestions(type);
        for (let i = 0; i < list.length; i++) {
          const q = list[i];
          const key = makeKey(type, i);
          if (checkedState[key]) {
            total += getQuestionPoints(q, type);
            scored += getUserPoints(q, type, i);
          }
        }
      });
      document.getElementById('scoreDisplay').textContent = '得分: ' + scored + ' / ' + total;
    }

    function getQuestionPoints(q, type) {
      if (type === 'drag') return q.answers.length;
      if (type === 'multi') return q.correct.length;
      return 1;
    }

    function getUserPoints(q, type, idx) {
      const key = makeKey(type, idx);
      const ans = userAnswers[key];
      if (!ans) return 0;
      if (type === 'drag') {
        let pts = 0;
        for (let i = 0; i < q.answers.length; i++) {
          if (ans[i] === q.answers[i]) pts++;
        }
        return pts;
      }
      if (type === 'single') {
        return ans === q.correct ? 1 : 0;
      }
      if (type === 'multi') {
        let pts = 0;
        const correctSet = {};
        for (let i = 0; i < q.correct.length; i++) correctSet[q.correct[i]] = true;
        const userSet = {};
        for (let i = 0; i < ans.length; i++) userSet[ans[i]] = true;
        for (let k in correctSet) {
          if (userSet[k]) pts++;
        }
        // Deduct for wrong selections
        for (let k in userSet) {
          if (!correctSet[k]) pts--;
        }
        return Math.max(pts, 0);
      }
      return ans === q.correct ? 1 : 0;
    }

    function updateProgress() {
      const total = countQuestions(currentType);
      const text = total > 0 ? (currentIndex + 1) + ' / ' + total : '0 / 0';
      document.getElementById('progressText').textContent = text;
      const pct = total > 0 ? ((currentIndex + 1) / total * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderQuestion() {
      const area = document.getElementById('questionArea');
      const expl = document.getElementById('explanationArea');
      area.innerHTML = '';
      expl.innerHTML = '';
      expl.style.display = 'none';
      updateProgress();

      const questions = getQuestions(currentType);
      if (questions.length === 0) {
        area.innerHTML = '<p style="text-align:center;color:var(--text-muted)">该题型暂无题目</p>';
        return;
      }
      const q = questions[currentIndex];
      const key = makeKey(currentType, currentIndex);

      const qtext = document.createElement('div');
      qtext.className = 'question-text';

      if (currentType === 'drag') {
        let html = q.question;
        for (let i = 0; i < q.answers.length; i++) {
          const filled = userAnswers[key] && userAnswers[key][i] ? userAnswers[key][i] : '';
          let cls = 'blank';
          if (checkedState[key]) {
            if (filled === q.answers[i]) cls += ' correct';
            else cls += ' wrong';
          } else if (filled) {
            cls += ' filled';
          }
          html = html.replace('{/' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
          html = html.replace('{*' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
          html = html.replace('{' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
        }
        qtext.innerHTML = html;
        area.appendChild(qtext);

        const pool = document.createElement('div');
        pool.className = 'draggables';
        const used = userAnswers[key] || [];
        for (let i = 0; i < q.options.length; i++) {
          const opt = q.options[i];
          const isUsed = used.indexOf(opt) !== -1;
          const chip = document.createElement('div');
          chip.className = 'draggable' + (isUsed ? ' used' : '');
          chip.draggable = !isUsed;
          chip.textContent = opt;
          chip.dataset.value = opt;
          if (!isUsed) setupDrag(chip);
          pool.appendChild(chip);
        }
        area.appendChild(pool);

        if (checkedState[key]) {
          const box = document.createElement('div');
          box.className = 'explanation show correct-ex';
          let exHtml = '<strong>解析：</strong><ul style="margin:8px 0 0 18px">';
          for (let i = 0; i < q.explanations.length; i++) {
            const isOk = userAnswers[key] && userAnswers[key][i] === q.answers[i];
            exHtml += '<li><span style="color:' + (isOk ? 'var(--correct)' : 'var(--wrong)') + '">' + (isOk ? '✅' : '❌') + '</span> 空' + (i+1) + '：' + q.explanations[i] + '</li>';
          }
          exHtml += '</ul>';
          box.innerHTML = exHtml;
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'single') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        for (let i = 0; i < q.options.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const isSel = userAnswers[key] === i;
          if (checkedState[key]) {
            if (i === q.correct) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'singleOpt';
          radio.checked = isSel;
          radio.disabled = !!checkedState[key];
          radio.addEventListener('change', function() {
            userAnswers[key] = i;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = q.options[i];
          opt.appendChild(radio);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = i === q.correct ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          box.className = 'explanation show ' + (userAnswers[key] === q.correct ? 'correct-ex' : 'wrong-ex');
          box.innerHTML = '<strong>解析：</strong><br>' + q.explanations[q.correct];
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'multi') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        const selSet = {};
        const ans = userAnswers[key] || [];
        for (let i = 0; i < ans.length; i++) selSet[ans[i]] = true;
        const correctSet = {};
        for (let i = 0; i < q.correct.length; i++) correctSet[q.correct[i]] = true;
        for (let i = 0; i < q.options.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const isSel = !!selSet[i];
          if (checkedState[key]) {
            if (correctSet[i]) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = isSel;
          cb.disabled = !!checkedState[key];
          cb.addEventListener('change', function() {
            const a = userAnswers[key] || [];
            const pos = a.indexOf(i);
            if (pos >= 0) a.splice(pos, 1);
            else a.push(i);
            userAnswers[key] = a;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = q.options[i];
          opt.appendChild(cb);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = correctSet[i] ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          let ok = true;
          for (let k in correctSet) { if (!selSet[k]) ok = false; }
          for (let k in selSet) { if (!correctSet[k]) ok = false; }
          box.className = 'explanation show ' + (ok ? 'correct-ex' : 'wrong-ex');
          let exHtml = '<strong>解析：</strong><ul style="margin:8px 0 0 18px">';
          for (let i = 0; i < q.options.length; i++) {
            const isCorrect = !!correctSet[i];
            const icon = isCorrect ? '✅' : (selSet[i] ? '❌' : '⬜');
            exHtml += '<li>' + icon + ' ' + q.explanations[i] + '</li>';
          }
          exHtml += '</ul>';
          box.innerHTML = exHtml;
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'truefalse') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        const opts = [{val: true, label: '是 / True'}, {val: false, label: '否 / False'}];
        for (let i = 0; i < opts.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const v = opts[i].val;
          const isSel = userAnswers[key] === v;
          if (checkedState[key]) {
            if (v === q.correct) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'tfOpt';
          radio.checked = isSel;
          radio.disabled = !!checkedState[key];
          radio.addEventListener('change', function() {
            userAnswers[key] = v;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = opts[i].label;
          opt.appendChild(radio);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = v === q.correct ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          const ok = userAnswers[key] === q.correct;
          box.className = 'explanation show ' + (ok ? 'correct-ex' : 'wrong-ex');
          box.innerHTML = '<strong>解析：</strong><br>' + (q.correct ? q.explanationTrue : q.explanationFalse);
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      }
    }

    // ===== DRAG & DROP =====
    function setupDrag(el) {
      el.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', el.dataset.value);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', function() {
        el.classList.remove('dragging');
      });
    }

    document.addEventListener('dragover', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (blank) e.preventDefault();
    });

    document.addEventListener('drop', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (!blank) return;
      e.preventDefault();
      const value = e.dataTransfer.getData('text/plain');
      if (!value) return;
      const bidx = parseInt(blank.dataset.blank, 10);
      const key = makeKey(currentType, currentIndex);
      if (!userAnswers[key]) userAnswers[key] = [];
      userAnswers[key][bidx] = value;
      renderQuestion();
    });

    document.addEventListener('click', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (!blank) return;
      if (checkedState[makeKey(currentType, currentIndex)]) return;
      const key = makeKey(currentType, currentIndex);
      const ans = userAnswers[key] || [];
      const bidx = parseInt(blank.dataset.blank, 10);
      if (ans[bidx]) {
        delete ans[bidx];
        renderQuestion();
        return;
      }
      const chips = document.querySelectorAll('.draggable:not(.used)');
      if (chips.length > 0) {
        const val = chips[0].dataset.value;
        if (!userAnswers[key]) userAnswers[key] = [];
        userAnswers[key][bidx] = val;
        renderQuestion();
      }
    });

    // ===== CONTROLS =====
    function switchTab(type) {
      currentType = type;
      currentIndex = 0;
      document.querySelectorAll('.tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.type === type);
      });
      document.getElementById('quizCard').style.display = '';
      document.getElementById('resultCard').style.display = 'none';
      renderQuestion();
    }

    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        switchTab(tab.dataset.type);
      });
    });

    document.getElementById('btnPrev').addEventListener('click', function() {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    });

    document.getElementById('btnNext').addEventListener('click', function() {
      if (currentIndex + 1 < countQuestions(currentType)) { currentIndex++; renderQuestion(); }
    });

    document.getElementById('btnCheck').addEventListener('click', function() {
      const key = makeKey(currentType, currentIndex);
      if (countQuestions(currentType) === 0) return;
      checkedState[key] = true;
      updateScore();
      renderQuestion();
      checkAllCompleted();
    });

    document.getElementById('btnResetCurrent').addEventListener('click', function() {
      const key = makeKey(currentType, currentIndex);
      delete userAnswers[key];
      delete checkedState[key];
      updateScore();
      renderQuestion();
    });

    document.getElementById('btnResetAll').addEventListener('click', function() {
      if (!confirm('确定要重置所有答题记录吗？')) return;
      resetAll();
    });

    function resetAll() {
      userAnswers = {};
      checkedState = {};
      document.getElementById('quizCard').style.display = '';
      document.getElementById('resultCard').style.display = 'none';
      updateScore();
      renderQuestion();
    }

    // ===== COMPLETION CHECK =====
    function checkAllCompleted() {
      let totalQuestions = 0;
      let checkedQuestions = 0;
      allTypes().forEach(function(type) {
        const list = getQuestions(type);
        totalQuestions += list.length;
        for (let i = 0; i < list.length; i++) {
          if (checkedState[makeKey(type, i)]) checkedQuestions++;
        }
      });
      if (checkedQuestions === totalQuestions && totalQuestions > 0) {
        showResult();
      }
    }

    function showResult() {
      let total = 0, scored = 0;
      let typeStats = {};
      allTypes().forEach(function(type) {
        const list = getQuestions(type);
        typeStats[type] = { total: 0, scored: 0 };
        for (let i = 0; i < list.length; i++) {
          const q = list[i];
          const key = makeKey(type, i);
          if (checkedState[key]) {
            const qp = getQuestionPoints(q, type);
            const up = getUserPoints(q, type, i);
            total += qp;
            scored += up;
            typeStats[type].total += qp;
            typeStats[type].scored += up;
          }
        }
      });

      const pct = total > 0 ? Math.round(scored / total * 100) : 0;
      let grade = '';
      if (pct >= 90) grade = '🏆 卓越';
      else if (pct >= 75) grade = '✨ 优秀';
      else if (pct >= 60) grade = '👍 良好';
      else grade = '📚 需加强';

      const summary = document.getElementById('resultSummary');
      summary.innerHTML =
        '<div style="font-size:2rem;margin-bottom:8px;">' + grade + '</div>' +
        '<div>总分：' + scored + ' / ' + total + ' (' + pct + '%)</div>' +
        '<div style="margin-top:12px;font-size:0.9rem;color:var(--text-muted);">' +
        '拖拽填空：' + typeStats['drag'].scored + '/' + typeStats['drag'].total + ' · ' +
        '单选：' + typeStats['single'].scored + '/' + typeStats['single'].total + ' · ' +
        '多选：' + typeStats['multi'].scored + '/' + typeStats['multi'].total + ' · ' +
        '判断：' + typeStats['truefalse'].scored + '/' + typeStats['truefalse'].total +
        '</div>';

      document.getElementById('quizCard').style.display = 'none';
      document.getElementById('resultCard').style.display = '';
    }

    document.getElementById('btnResultReview').addEventListener('click', function() {
      document.getElementById('quizCard').style.display = '';
      document.getElementById('resultCard').style.display = 'none';
      currentType = 'drag';
      currentIndex = 0;
      document.querySelectorAll('.tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.type === 'drag');
      });
      renderQuestion();
    });

    document.getElementById('btnResultContinue').addEventListener('click', function() {
      resetAll();
    });

    // ===== SHUFFLE =====
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
    }

    function buildIndexMap(oldLen, shuffledIndices) {
      const map = {};
      for (let newPos = 0; newPos < oldLen; newPos++) {
        map[shuffledIndices[newPos]] = newPos;
      }
      return map;
    }

    document.getElementById('btnShuffle').addEventListener('click', function() {
      if (!confirm('随机化会清空所有答题记录，确定继续？')) return;
      userAnswers = {};
      checkedState = {};

      // Single
      for (let qi = 0; qi < singleQuestions.length; qi++) {
        const q = singleQuestions[qi];
        const order = [];
        for (let i = 0; i < q.options.length; i++) order.push(i);
        shuffleArray(order);
        const newOpts = [];
        for (let i = 0; i < order.length; i++) newOpts.push(q.options[order[i]]);
        const newExps = [];
        for (let i = 0; i < order.length; i++) newExps.push(q.explanations[order[i]]);
        const idxMap = buildIndexMap(q.options.length, order);
        q.correct = idxMap[q.correct];
        q.options = newOpts;
        q.explanations = newExps;
      }

      // Multi
      for (let qi = 0; qi < multiQuestions.length; qi++) {
        const q = multiQuestions[qi];
        const order = [];
        for (let i = 0; i < q.options.length; i++) order.push(i);
        shuffleArray(order);
        const newOpts = [];
        for (let i = 0; i < order.length; i++) newOpts.push(q.options[order[i]]);
        const newExps = [];
        for (let i = 0; i < order.length; i++) newExps.push(q.explanations[order[i]]);
        const idxMap = buildIndexMap(q.options.length, order);
        const newCorrect = [];
        for (let i = 0; i < q.correct.length; i++) newCorrect.push(idxMap[q.correct[i]]);
        q.correct = newCorrect;
        q.options = newOpts;
        q.explanations = newExps;
      }

      updateScore();
      renderQuestion();
    });

    // ===== OVERVIEW =====
    function openOverview() {
      const grid = document.getElementById('overviewGrid');
      grid.innerHTML = '';
      const questions = getQuestions(currentType);
      for (let i = 0; i < questions.length; i++) {
        const cell = document.createElement('div');
        const key = makeKey(currentType, i);
        let cls = 'grid-item';
        if (checkedState[key]) {
          const pts = getUserPoints(questions[i], currentType, i);
          const maxPts = getQuestionPoints(questions[i], currentType);
          cls += pts === maxPts ? ' correct' : ' wrong';
        } else {
          cls += ' empty';
        }
        cell.className = cls;
        cell.textContent = i + 1;
        cell.addEventListener('click', function() {
          currentIndex = i;
          document.getElementById('overviewOverlay').classList.remove('show');
          renderQuestion();
        });
        grid.appendChild(cell);
      }
      document.getElementById('overviewOverlay').classList.add('show');
    }

    document.getElementById('btnOverview').addEventListener('click', openOverview);
    document.getElementById('btnCloseOverview').addEventListener('click', function() {
      document.getElementById('overviewOverlay').classList.remove('show');
    });
    document.getElementById('overviewOverlay').addEventListener('click', function(e) {
      if (e.target === document.getElementById('overviewOverlay')) {
        document.getElementById('overviewOverlay').classList.remove('show');
      }
    });

    // ===== KEYBOARD NAV =====
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') document.getElementById('btnPrev').click();
      if (e.key === 'ArrowRight') document.getElementById('btnNext').click();
    });

    // ===== INIT =====
    initBadges();
    updateScore();
    renderQuestion();
  </script>
</body>
</html>
