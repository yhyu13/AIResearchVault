<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65;padding:20px 14px 60px}

.sub{color:var(--ink2);font-size:.85rem;margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:.85rem;transition:background .15s}
button:hover{background:var(--chip)}

.progress{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0%;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:0 1px 4px rgba(90,70,50,.06)}
.qtype{display:inline-block;font-size:.72rem;letter-spacing:.05em;background:var(--chip);color:var(--ink2);border-radius:99px;padding:3px 10px;margin-bottom:12px}
.qtext{font-size:1.05rem;font-weight:600;margin-bottom:18px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .mark{font-weight:700;min-width:20px;color:var(--ink2)}
.opt .body{flex:1}
.opt .why{display:block;margin-top:6px;font-size:.82rem;color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px}
.tfrow{display:flex;gap:10px}
.tfrow button{flex:1;padding:14px;font-size:1rem}
.tfrow button.sel{background:var(--accent-soft);border-color:var(--accent)}
.tfrow button.correct{background:var(--ok-soft);border-color:var(--ok)}
.tfrow button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.verdict{margin:14px 0;padding:12px 14px;border-radius:12px;font-size:.9rem}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.explain{font-size:.88rem;color:var(--ink2);background:#fbf8f3;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;white-space:pre-wrap}

.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:.85rem;cursor:grab;user-select:none}
.chip.used{opacity:.3;cursor:default}
.blank{display:inline-block;min-width:120px;border:2px dashed var(--accent);border-radius:8px;padding:4px 12px;margin:2px 4px;background:#fff;vertical-align:middle;font-size:.9rem;cursor:pointer}
.blank.filled{border-style:solid;background:var(--accent-soft)}
.blank.correct{border-color:var(--ok);background:var(--ok-soft)}
.blank.wrong{border-color:var(--bad);background:var(--bad-soft)}
.blank .hint{font-size:.72rem;color:var(--ink2);display:block}
.dragline{margin-bottom:12px;font-size:.95rem}
.blankwhy{font-size:.8rem;color:var(--ink2);margin:-6px 0 12px 6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

.overlay{position:fixed;inset:0;background:rgba(60,50,40,.35);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow:auto}
.overlay.open{display:flex}
.panel{background:var(--card);border-radius:16px;max-width:760px;width:100%;padding:22px}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:.78rem;cursor:pointer;background:#fff}
.cell .t{display:block;font-size:.68rem;color:var(--ink2)}
.cell.st-ok{background:var(--ok-soft);border-color:var(--ok)}
.cell.st-bad{background:var(--bad-soft);border-color:var(--bad)}
.cell.st-none{opacity:.75}
/* result */
.result{text-align:center;padding:30px 10px}
.result .big{font-size:2.6rem;font-weight:800;color:var(--accent)}
.result p{color:var(--ink2);margin:10px 0 20px}
@media(max-width:560px){
  .card{padding:18px 14px}
  h1{font-size:1.15rem}
  .tfrow{flex-direction:column}
}
</style>

}
];

/* ============ 引擎 ============ */
const TYPE_LABEL={drag:"拖拽填空",single:"单选题",multi:"多选题",tf:"判断题"};
let order=allQuestions.map((_,i)=>i);
let cur=0;
let state=allQuestions.map(()=>({answered:false,correct:false,sel:null,fills:null}));

const $=id=>document.getElementById(id);

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function reshuffle(){
  allQuestions.forEach(q=>{
    if(q.type==="single"){
      const idx=q.options.map((_,i)=>i);shuffleArr(idx);
      q.options=idx.map(i=>q.options[i]);
      q.correct=idx.indexOf(q.correct);
    }else if(q.type==="multi"){
      const idx=q.options.map((_,i)=>i);shuffleArr(idx);
      q.options=idx.map(i=>q.options[i]);
    }else if(q.type==="drag"){
      shuffleArr(q.pool);
    }
  });
  state=allQuestions.map(()=>({answered:false,correct:false,sel:null,fills:null}));
  cur=0;
  $("resultView").style.display="none";
  setQuizVisible(true);
  render();
}

function resetAll(){
  state=allQuestions.map(()=>({answered:false,correct:false,sel:null,fills:null}));
  cur=0;
  $("resultView").style.display="none";
  setQuizVisible(true);
  render();
}

/* 只切换题卡与导航行，绝不隐藏进度条/分数栏父容器 */
function setQuizVisible(v){
  $("qcard").style.display=v?"":"none";
  $("navRow").style.display=v?"":"none";
  $("mainView").style.display="";
  $("scoreBar").style.display="";
}

function qNow(){return allQuestions[order[cur]];}

function render(){
  const q=qNow();const st=state[order[cur]];
  const c=$("qcard");c.innerHTML="";
  const tag=document.createElement("span");tag.className="qtype";tag.textContent=TYPE_LABEL[q.type];c.appendChild(tag);
  const qt=document.createElement("div");qt.className="qtext";qt.textContent=q.q;c.appendChild(qt);
  if(q.type==="single")renderSingle(c,q,st);
  else if(q.type==="multi")renderMulti(c,q,st);
  else if(q.type==="tf")renderTF(c,q,st);
  else renderDrag(c,q,st);
  updateBar();
}

function updateBar(){
  const total=allQuestions.length;
  let score=0,done=0;
  state.forEach(s=>{if(s.answered){done++;if(s.correct)score++;}});
  $("scoreText").textContent=`得分 ${score} / ${done}（共 ${total} 题）`;
  $("progText").textContent=`第 ${cur+1} / ${total} 题`;
  $("progFill").style.width=((cur+1)/total*100)+"%";
  $("btnPrev").disabled=cur===0;
}

function verdictEl(ok){
  const v=document.createElement("div");
  v.className="verdict "+(ok?"ok":"no");
  v.textContent=ok?"✅ 回答正确":"❌ 回答错误";
  return v;
}
function explainEl(text){
  const e=document.createElement("div");e.className="explain";e.textContent=text;return e;
}

/* ---- single ---- */
function renderSingle(c,q,st){
  if(st.sel===null)st.sel=-1;
  q.options.forEach((o,i)=>{
    const d=document.createElement("div");d.className="opt";
    if(!st.answered&&st.sel===i)d.classList.add("sel");
    if(st.answered){if(i===q.correct)d.classList.add("correct");else if(st.sel===i)d.classList.add("wrong");}
    const m=document.createElement("span");m.className="mark";m.textContent=String.fromCharCode(65+i);
    const b=document.createElement("div");b.className="body";b.textContent=o.t;
    if(st.answered){const w=document.createElement("span");w.className="why";w.textContent=o.why;b.appendChild(w);}
    d.appendChild(m);d.appendChild(b);
    if(!st.answered)d.onclick=()=>{st.sel=i;render();};
    c.appendChild(d);
  });
  if(st.answered){c.appendChild(verdictEl(st.correct));c.appendChild(explainEl(q.explain));}
}
/* ---- multi ---- */
function renderMulti(c,q,st){
  if(st.sel===null)st.sel=new Set();
  q.options.forEach((o,i)=>{
    const d=document.createElement("div");d.className="opt";
    if(!st.answered&&st.sel.has(i))d.classList.add("sel");
    if(st.answered){
      if(o.c)d.classList.add("correct");
      else if(st.sel.has(i))d.classList.add("wrong");
    }
    const m=document.createElement("span");m.className="mark";m.textContent=st.answered?(o.c?"✓":"✗"):(st.sel.has(i)?"☑":"☐");
    const b=document.createElement("div");b.className="body";b.textContent=o.t;
    if(st.answered){const w=document.createElement("span");w.className="why";w.textContent=o.why;b.appendChild(w);}
    d.appendChild(m);d.appendChild(b);
    if(!st.answered)d.onclick=()=>{st.sel.has(i)?st.sel.delete(i):st.sel.add(i);render();};
    c.appendChild(d);
  });
  if(st.answered){c.appendChild(verdictEl(st.correct));c.appendChild(explainEl(q.explain));}
}
/* ---- tf ---- */
function renderTF(c,q,st){
  const row=document.createElement("div");row.className="tfrow";
  [["正确 ✅",true],["错误 ❌",false]].forEach(([label,val])=>{
    const b=document.createElement("button");b.textContent=label;
    if(!st.answered&&st.sel===val)b.classList.add("sel");
    if(st.answered){
      if(q.answer===val)b.classList.add("correct");
      else if(st.sel===val)b.classList.add("wrong");
    }
    if(!st.answered)b.onclick=()=>{st.sel=val;render();};
    row.appendChild(b);
  });
  c.appendChild(row);
  if(st.answered){c.appendChild(verdictEl(st.correct));c.appendChild(explainEl(q.explain));}
}
/* ---- drag ---- */
function renderDrag(c,q,st){
  if(st.fills===null)st.fills=q.lines.map(l=>l.blanks.map(()=>null));
  // pool
  const pool=document.createElement("div");pool.className="pool";
  const used=new Set();
  st.fills.forEach(r=>r.forEach(v=>{if(v!==null)used.add(v);}));
  q.pool.forEach(term=>{
    const ch=document.createElement("span");ch.className="chip"+(used.has(term)?" used":"");
    ch.textContent=term;ch.draggable=!st.answered&&!used.has(term);
    ch.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",term);});
    pool.appendChild(ch);
  });
  c.appendChild(pool);
  const tip=document.createElement("div");tip.style.cssText="font-size:.78rem;color:var(--ink2);margin-bottom:12px";
  tip.textContent=st.answered?"":"拖动术语到空格，或点击空格后点击术语填入；点击已填空格可移除。";
  c.appendChild(tip);
  let pending=null;
  q.lines.forEach((line,li)=>{
    const d=document.createElement("div");d.className="dragline";
    d.appendChild(document.createTextNode(line.pre));
    line.blanks.forEach((b,bi)=>{
      const sp=document.createElement("span");sp.className="blank";
      const val=st.fills[li][bi];
      if(val!==null)sp.classList.add("filled");
      if(st.answered)sp.classList.add(val===b.ans?"correct":"wrong");
      sp.textContent=val!==null?val:"＿＿＿＿";
      if(st.answered&&val!==b.ans){const h=document.createElement("span");h.className="hint";h.textContent="正确："+b.ans;sp.appendChild(h);}
      sp.addEventListener("dragover",e=>e.preventDefault());
      sp.addEventListener("drop",e=>{
        e.preventDefault();if(st.answered)return;
        const t=e.dataTransfer.getData("text/plain");
        if(t&&!used.has(t)){st.fills[li][bi]=t;render();}
      });
      if(!st.answered)sp.onclick=()=>{
        if(val!==null){st.fills[li][bi]=null;pending=null;render();}
        else pending={li,bi};
      };
      d.appendChild(sp);
    });
    d.appendChild(document.createTextNode(line.post));
    c.appendChild(d);
    if(st.answered)line.blanks.forEach(b=>{
      const w=document.createElement("div");w.className="blankwhy";w.textContent="💡 "+b.why;c.appendChild(w);
    });
  });
  // click-to-fill: pool chips clickable when a blank pending
  if(!st.answered){
    pool.querySelectorAll(".chip:not(.used)").forEach(ch=>{
      ch.onclick=()=>{
        // find first empty blank
        for(let li=0;li<st.fills.length;li++)for(let bi=0;bi<st.fills[li].length;bi++){
          if(st.fills[li][bi]===null){st.fills[li][bi]=ch.textContent;render();return;}
        }
      };
    });
  }
  if(st.answered){c.appendChild(verdictEl(st.correct));c.appendChild(explainEl(q.explain));}
}

/* ---- check / nav ---- */
function check(){
  const q=qNow();const st=state[order[cur]];
  if(q.type==="single"){
    if(st.sel===null||st.sel<0){alert("请先选择一个选项");return;}
    st.correct=st.sel===q.correct;
  }else if(q.type==="multi"){
    if(!st.sel||st.sel.size===0){alert("请至少选择一个选项");return;}
    const want=new Set();q.options.forEach((o,i)=>{if(o.c)want.add(i);});
    st.correct=want.size===st.sel.size&&[...want].every(i=>st.sel.has(i));
  }else if(q.type==="tf"){
    if(st.sel===null){alert("请先选择 正确/错误");return;}
    st.correct=st.sel===q.answer;
  }else{
    const flat=st.fills.flat();
    if(flat.some(v=>v===null)){alert("请填满所有空格");return;}
    st.correct=q.lines.every((l,li)=>l.blanks.every((b,bi)=>st.fills[li][bi]===b.ans));
  }
  st.answered=true;render();
}

function goNext(){
  if(cur<allQuestions.length-1){cur++;render();}
  else showResult();
}
function showResult(){
  let score=0,done=0;
  state.forEach(s=>{if(s.answered){done++;if(s.correct)score++;}});
  setQuizVisible(false);  // 只隐藏题卡与导航行，进度条/分数栏保持可见
  $("resultView").style.display="";
  $("resultScore").textContent=`${score} / ${allQuestions.length}`;
  $("resultDetail").textContent=`已作答 ${done} 题，答对 ${score} 题。点击「返回查看」打开总览面板逐题回顾，或「继续做题」回到最后一题。`;
}

/* ---- overview ---- */
let ovFilter="all";
function renderOv(){
  const g=$("ovGrid");g.innerHTML="";
  allQuestions.forEach((q,i)=>{
    const st=state[i];
    const stCls=!st.answered?"st-none":(st.correct?"st-ok":"st-bad");
    if(ovFilter==="ok"&&stCls!=="st-ok")return;
    if(ovFilter==="bad"&&stCls!=="st-bad")return;
    if(ovFilter==="none"&&stCls!=="st-none")return;
    const d=document.createElement("div");d.className="cell "+stCls;
    d.innerHTML=`<span class="t">${TYPE_LABEL[q.type]}</span>第 ${i+1} 题`;
    d.onclick=()=>{cur=i;$("overlay").classList.remove("open");$("resultView").style.display="none";setQuizVisible(true);render();};
    g.appendChild(d);
  });
}

/* ---- events ---- */
$("btnCheck").onclick=check;
$("btnNext").onclick=goNext;
$("btnPrev").onclick=()=>{if(cur>0){cur--;render();}};
$("btnReset").onclick=()=>{state[order[cur]]={answered:false,correct:false,sel:null,fills:null};render();};
$("btnResetAll").onclick=resetAll;
$("btnShuffle").onclick=()=>{if(confirm("洗牌将清空所有答题记录并回到第一题，继续？"))reshuffle();};
$("btnOverview").onclick=()=>{renderOv();$("overlay").classList.add("open");};
$("btnCloseOv").onclick=()=>$("overlay").classList.remove("open");
$("overlay").onclick=e=>{if(e.target===$("overlay"))$("overlay").classList.remove("open");};
document.querySelectorAll(".filters button").forEach(b=>{
  b.onclick=()=>{document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("on"));b.classList.add("on");ovFilter=b.dataset.f;renderOv();};
});
$("btnResultOverview").onclick=()=>{renderOv();$("overlay").classList.add("open");};
$("btnResultContinue").onclick=()=>{$("resultView").style.display="none";setQuizVisible(true);cur=allQuestions.length-1;render();};

render();
</script>
</body>
</html>
