<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验 11：Generative Agents 社交模拟实验（简化版）— 互动知识卡牌</title>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --primary: #2d6a4f;
    --primary-soft: #e9f5ec;
    --accent: #b08968;
    --accent-soft: #f4ebe0;
    --danger: #c0392b;
    --danger-soft: #fdecea;
    --success: #27ae60;
    --success-soft: #e8f8f0;
    --text: #2c3e50;
    --text-secondary: #7f8c8d;
    --border: #e0e0e0;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    padding: 16px;
  }
  .app-header {
    text-align: center;
    padding: 20px 0 12px;
  }
  .app-header h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 6px; }
  .app-header p { color: var(--text-secondary); font-size: 0.9rem; }
  .score-bar {
    position: sticky; top: 0; z-index: 50;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px; margin: 12px 0;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .score-left { display: flex; align-items: center; gap: 12px; }
  .score-pill {
    background: var(--primary-soft); color: var(--primary);
    padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 0.95rem;
  }
  .progress-wrap { flex: 1; max-width: 260px; margin-left: 12px; }
  .progress-track { height: 8px; background: #e0e0e0; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width .3s ease; }
  .score-right { display: flex; gap: 8px; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer;
    font-size: 0.9rem; font-weight: 600; transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .container { max-width: 900px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 1.15rem; color: var(--primary); margin-bottom: 10px; }
  .card .meta { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 12px; }

  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    background: #fff; transition: background .2s, border-color .2s;
  }
  .option:hover { background: #fafafa; }
  .option input { accent-color: var(--primary); }
  .option.correct { border-color: var(--success); background: var(--success-soft); }
  .option.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .option.disabled { pointer-events: none; opacity: .9; }

  .drag-pool { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .drag-item {
    padding: 8px 12px; background: var(--accent-soft); color: var(--accent);
    border: 1px dashed var(--accent); border-radius: 8px; cursor: grab; font-weight: 600;
    user-select: none; touch-action: none;
  }
  .drag-item.dragging { opacity: .6; }
  .drop-zone {
    display: inline-block; min-width: 120px; padding: 6px 10px; border: 2px dashed var(--border);
    border-radius: 6px; text-align: center; color: var(--text-secondary); margin: 0 4px;
    vertical-align: middle; transition: border-color .2s, background .2s;
  }
  .drop-zone.drag-over { border-color: var(--primary); background: var(--primary-soft); }
  .drop-zone.filled { border-style: solid; border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .drop-zone.correct-zone { border-color: var(--success); background: var(--success-soft); color: var(--success); }
  .drop-zone.wrong-zone { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }

  .tf-wrap { display: flex; gap: 12px; margin-top: 10px; }
  .tf-btn {
    flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; cursor: pointer; text-align: center; font-weight: 600;
    transition: background .2s, border-color .2s;
  }
  .tf-btn:hover { background: #fafafa; }
  .tf-btn.selected { border-color: var(--primary); background: var(--primary-soft); }
  .tf-btn.correct { border-color: var(--success); background: var(--success-soft); color: var(--success); }
  .tf-btn.wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }

  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .explain {
    margin-top: 12px; padding: 12px; border-radius: 8px; background: #f4f6f8;
    border-left: 4px solid var(--primary); font-size: 0.92rem; display: none;
  }
  .explain.show { display: block; }

  .nav-bar { display: flex; align-items: center; justify-content: space-between; margin: 16px 0; }
  .nav-bar .btn { min-width: 100px; }

  .overview { display: none; }
  .overview.show { display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin-top: 12px; }
  .thumb {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    background: #fff; transition: transform .1s;
  }
  .thumb:hover { transform: translateY(-2px); }
  .thumb.correct { background: var(--success-soft); border-color: var(--success); color: var(--success); }
  .thumb.wrong { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .thumb.unchecked { background: #f0f0f0; color: var(--text-secondary); }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 0.85rem; }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .result-screen { display: none; text-align: center; padding: 30px 10px; }
  .result-screen.show { display: block; }
  .big-score { font-size: 3rem; font-weight: 800; color: var(--primary); }
  .result-msg { margin: 10px 0 20px; color: var(--text-secondary); }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .score-bar { flex-wrap: wrap; gap: 8px; }
    .progress-wrap { max-width: none; width: 100%; margin-left: 0; }
    .app-header h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="app-header">
    <h1>实验 11：Generative Agents 社交模拟实验（简化版）</h1>
    <p>互动知识卡牌 — 基于 Park et al., UIST 2023 论文核心机制</p>
  </div>

  <div class="score-bar">
    <div class="score-left">
      <div class="score-pill">得分: <span id="scoreVal">0</span></div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
        <div style="font-size:.75rem;color:var(--text-secondary);margin-top:4px;text-align:center;">
          <span id="currentQ">1</span> / <span id="totalQ">0</span>
        </div>
      </div>
    </div>
    <div class="score-right">
      <button class="btn btn-outline" id="btnOverview" onclick="toggleOverview()">📋 总览</button>
      <button class="btn btn-outline" onclick="shuffleAll()">🎲 重新洗牌选项</button>
    </div>
  </div>

  <div id="quizArea"></div>

  <div class="nav-bar">
    <button class="btn btn-outline" id="btnPrev" onclick="prevQuestion()">⬅ 上一题</button>
    <button class="btn btn-primary" id="btnCheck" onclick="checkCurrent()">✅ 检查答案</button>
    <button class="btn btn-outline" id="btnReset" onclick="resetCurrent()">🔄 重置题目</button>
    <button class="btn btn-outline" id="btnNext" onclick="nextQuestion()">下一题 ➡</button>
  </div>

  <div class="overview card" id="overviewPanel">
    <h2>总览面板</h2>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterThumbs('all')">全部</button>
      <button class="filter-btn" onclick="filterThumbs('correct')">✅ 正确</button>
      <button class="filter-btn" onclick="filterThumbs('wrong')">❌ 错误</button>
      <button class="filter-btn" onclick="filterThumbs('unchecked')">⬜ 未答</button>
    </div>
    <div class="grid" id="thumbGrid"></div>
    <div class="actions" style="margin-top:12px;">
      <button class="btn btn-danger" onclick="resetAll()">🗑 重置全部</button>
    </div>
  </div>

  <div class="result-screen card" id="resultScreen">
    <div class="big-score" id="finalScore">0</div>
    <div class="result-msg" id="finalMsg">完成所有题目后查看结果</div>
    <div class="actions" style="justify-content:center;">
      <button class="btn btn-outline" onclick="showQuestion(0)">🔍 返回查看</button>
      <button class="btn btn-primary" onclick="resetAll()">🔄 继续做题</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ===================== 数据 =====================
  var allQuestions = [
    // ---------- 拖拽填空 (5道) ----------
    {
      type: "dragfill",
      question: "Generative Agent 的三层架构从上到下依次为：观察层 → __1__ → __2__ → 行为层。",
      blanks: ["记忆流(Memory Stream)", "反思层(Reflection)"],
      pool: ["记忆流(Memory Stream)", "反思层(Reflection)", "规划层(Planning)", "情感层(Emotion)", "感知层(Perception)"],
      explanation: "正确顺序是：观察层 → 记忆流 → 反思层 → 规划层 → 行为层。题目中只填前两个空，记忆流负责记录观察，反思层对高频主题进行抽象总结。"
    },
    {
      type: "dragfill",
      question: "记忆检索的复合评分公式为：score = 0.5 × __1__ + 0.3 × __2__ + 0.2 × 时效性。",
      blanks: ["相关性", "重要性"],
      pool: ["相关性", "重要性", "情感值", "随机性", "社交度"],
      explanation: "论文中检索公式包含相关性(relevance)、重要性(importance)和时效性(recency)三个维度，权重分别为 0.5、0.3、0.2。"
    },
    {
      type: "dragfill",
      question: "在 ImportanceScorer 中，包含关键词'争吵'的记忆会被归类为 __1__ 影响事件，基础分额外加 __2__ 分。",
      blanks: ["高", "3.0"],
      pool: ["高", "低", "3.0", "2.0", "1.0"],
      explanation: "HIGH_IMPACT_KEYWORDS 包含'争吵'等情绪事件，匹配后 base_score += 3.0，属于高影响事件。"
    },
    {
      type: "dragfill",
      question: "Agent 的社交关系分数范围被限制在 __1__ 到 __2__ 之间。",
      blanks: ["-10", "10"],
      pool: ["-10", "0", "5", "10", "100"],
      explanation: "代码中通过 max(-10, min(10, score)) 将关系分数限制在 [-10, 10] 区间。"
    },
    {
      type: "dragfill",
      question: "当同主题记忆数量达到 __1__ 条时触发反思，反思层级上限为 __2__。",
      blanks: ["8", "2"],
      pool: ["5", "8", "10", "2", "3"],
      explanation: "REFLECTION_THRESHOLD = 8 表示同主题记忆达到 8 条触发反思；MAX_REFLECTION_DEPTH = 2 表示最多 2 层反思。"
    },

    // ---------- 单选题 (10道) ----------
    {
      type: "single",
      question: "Generative Agents 论文中，原始系统部署了多少个 Agent？",
      options: ["10 个", "25 个", "3 个", "50 个"],
      answer: 1,
      explanation: "论文中部署了 25 个 Agent；本实验简化为 3 个（Alice, Bob, Carol）。"
    },
    {
      type: "single",
      question: "记忆流中，当记忆数量超过 MEMORY_CAPACITY 时，如何移除旧记忆？",
      options: ["随机移除", "移除时间最久的", "按重要性+时间排序后移除最低分", "只移除观察类记忆"],
      answer: 2,
      explanation: "代码中 self.memory_stream.sort(key=lambda m: (m.importance, m.timestamp)) 后移除最低分且最旧的记忆。"
    },
    {
      type: "single",
      question: "以下哪个地点在代码中被定义为 Location 枚举值？",
      options: ["学校", "咖啡馆", "医院", "图书馆"],
      answer: 1,
      explanation: "Location 枚举包含 HOME(家)、CAFE(咖啡馆)、PARK(公园) 三个值。"
    },
    {
      type: "single",
      question: "Agent 的每日计划生成依据是什么？",
      options: ["随机选择", "当前能量值", "性格特征（traits）", "其他 Agent 的计划"],
      answer: 2,
      explanation: "_get_plan_templates() 根据 traits 中的'外向/内向'等关键词选择不同的计划模板。"
    },
    {
      type: "single",
      question: "两个 Agent 交互时，如果一方计划 is_interruptible = False，会发生什么？",
      options: ["强制交互", "跳过交互", "降低交互概率", "延长计划时间"],
      answer: 1,
      explanation: "代码中明确检查 if plan1 and not plan1.is_interruptible: continue，即跳过不可中断计划的 Agent 的交互。"
    },
    {
      type: "single",
      question: "社交重新规划（_check_social_replan）触发的条件是什么？",
      options: ["任意两个 Agent 相遇", "关系分数 > 5 且随机概率 < 0.3", "能量值低于 50", "反思数量超过阈值"],
      answer: 1,
      explanation: "代码中 if a1.relationships[a2.name] > 5 and random.random() < 0.3 才会触发社交重新规划。"
    },
    {
      type: "single",
      question: "以下哪个 MemoryType 的枚举值代表反思产生的抽象记忆？",
      options: ["OBSERVATION", "REFLECTION", "PLAN", "SOCIAL"],
      answer: 1,
      explanation: "MemoryType.REFLECTION 对应反思产生的抽象记忆；OBSERVATION 是直接观察，PLAN 是计划相关记忆。"
    },
    {
      type: "single",
      question: "时效性评分（recency）的计算公式中，时间常数 RECENCY_DECAY_HOURS 是多少？",
      options: ["4.0 小时", "8.0 小时", "12.0 小时", "24.0 小时"],
      answer: 1,
      explanation: "代码中 RECENCY_DECAY_HOURS = 8.0，recency = max(0, 1 - hours_ago / 8.0)。"
    },
    {
      type: "single",
      question: "在 _update_relationship 中，'friendly' 交互类型的关系变化 delta 是多少？",
      options: ["0.5", "1.0", "1.5", "2.0"],
      answer: 2,
      explanation: "friendly: +1.5, neutral_positive: +0.5, neutral: 0.0, hostile: -2.0。"
    },
    {
      type: "single",
      question: "本实验与论文原系统相比，最大的简化差异是什么？",
      options: ["Agent 数量减少", "使用基于规则的模板代替 LLM", "地点数量减少", "时间步长变大"],
      answer: 1,
      explanation: "虽然 Agent 数量和地点都减少了，但核心差异是语言生成从真实 LLM 改为基于规则的模板系统。"
    },

    // ---------- 多选题 (6道) ----------
    {
      type: "multi",
      question: "以下哪些属于 ImportanceScorer 中的 HIGH_IMPACT_KEYWORDS？",
      options: ["争吵", "聊天", "生病", "工作", "道歉", "阅读"],
      answer: [0, 2, 4],
      explanation: "HIGH_IMPACT_KEYWORDS 包含争吵、冲突、生气、道歉、表白、失望、惊喜、礼物、帮助、拯救、生病、获奖、丢失、找到。聊天和工作属于 SOCIAL/ROUTINE。"
    },
    {
      type: "multi",
      question: "记忆节点 MemoryNode 包含哪些字段？",
      options: ["agent_name", "content", "timestamp", "memory_type", "importance", "relationship_score"],
      answer: [0, 1, 2, 3, 4],
      explanation: "MemoryNode 包含 agent_name, content, timestamp, memory_type, importance, keywords, depth, retrieval_score；不包含 relationship_score（关系分数在 Agent 中维护）。"
    },
    {
      type: "multi",
      question: "以下哪些条件会阻止 Agent 之间的交互？",
      options: ["不在同一位置", "一方计划不可中断", "关系分数为负数", "能量值低于 0", "随机概率未命中", "反思数量不足"],
      answer: [0, 1, 4],
      explanation: "不在同一位置无法交互；is_interruptible=False 会跳过；random.random() < interact_prob 未命中也会跳过。关系分数负数和反思数量不影响交互触发。"
    },
    {
      type: "multi",
      question: "PlanNode 包含哪些属性？",
      options: ["description", "start_time", "end_time", "location", "priority", "energy_cost"],
      answer: [0, 1, 2, 3, 4],
      explanation: "PlanNode 有 description, start_time, end_time, location, priority, is_interruptible, source；没有 energy_cost（能量在 act() 中直接减 2.0）。"
    },
    {
      type: "multi",
      question: "以下哪些属于涌现行为（emergence）的观察指标？",
      options: ["社交关系演变", "计划变更次数", "代码行数", "反思生成数量", "位置访问分布", "编译时间"],
      answer: [0, 1, 3, 4],
      explanation: "评估指标包括社交关系演变、计划变更次数、反思生成数量、位置访问分布、涌现行为计数；代码行数和编译时间不是评估指标。"
    },
    {
      type: "multi",
      question: "以下哪些场景配置属于标准模拟的推荐参数？",
      options: ["Agent 数量: 3", "时间步长: 30min", "记忆容量: 200", "反思阈值: 8", "Agent 数量: 5", "反思阈值: 3"],
      answer: [0, 1, 2, 3],
      explanation: "标准模拟参数：3 个 Agent、30min 步长、记忆容量 200、反思阈值 8。5 个 Agent/阈值 3 是密集社交/极简模式的参数。"
    },

    // ---------- 判断题 (6道) ----------
    {
      type: "tf",
      question: "反思（Reflection）必须由 LLM 生成，基于规则的模板无法产生有效的反思。",
      answer: false,
      explanation: "错误。本实验使用基于规则的模板生成反思，且论文的核心洞察是：只要具备记忆存储、关系建模、规划重算三个机制，就能产生涌现行为，LLM 只是提升语言质量。"
    },
    {
      type: "tf",
      question: "如果所有计划的 is_interruptible 都设为 False，Agent 将变成'机器人'，不会产生社交适应。",
      answer: true,
      explanation: "正确。代码中不可中断计划会跳过交互，社交重新规划也无法触发。论文中的计划层级本质上是为可中断性提供粒度。"
    },
    {
      type: "tf",
      question: "记忆检索时，时效性（recency）的权重比重要性（importance）更高。",
      answer: false,
      explanation: "错误。检索公式中相关性权重 0.5，重要性 0.3，时效性 0.2。时效性权重最低，不是最高。"
    },
    {
      type: "tf",
      question: "Agent 之间的关系分数可以无限增长，没有上限。",
      answer: false,
      explanation: "错误。代码中通过 max(-10, min(10, score)) 将关系分数严格限制在 [-10, 10] 区间。"
    },
    {
      type: "tf",
      question: "当反思数量等于 0 时，应该检查 REFLECTION_THRESHOLD 是否太高，或模拟时间是否太短。",
      answer: true,
      explanation: "正确。这是初学者调试清单中的明确建议：反思不生成时，检查阈值是否过高或时间是否不足。"
    },
    {
      type: "tf",
      question: "在 _generate_reflection 中，深度反思（depth > 1）会在同一主题只有 1 条反思时触发。",
      answer: false,
      explanation: "错误。深度反思需要 len(self.reflections[keyword]) >= 2 且 related[0].depth < MAX_REFLECTION_DEPTH，即至少已有 2 条反思才会触发更高层级。"
    }
  ];

  // ===================== 状态 =====================
  var state = {
    current: 0,
    answers: [], // 每道题的用户答案
    checked: [], // 每道题是否已检查
    score: 0,
    shuffled: false
  };

  function initState() {
    state.answers = allQuestions.map(function() { return null; });
    state.checked = allQuestions.map(function() { return false; });
    state.score = 0;
    state.current = 0;
  }

  // ===================== 渲染 =====================
  function renderQuestion(index) {
    var q = allQuestions[index];
    var html = '<div class="card" id="qcard">';
    html += '<div class="meta">' + typeLabel(q.type) + ' · 第 ' + (index + 1) + ' 题</div>';
    html += '<h2>' + escapeHtml(q.question) + '</h2>';

    if (q.type === "dragfill") {
      html += renderDragFill(q, index);
    } else if (q.type === "single") {
      html += renderSingle(q, index);
    } else if (q.type === "multi") {
      html += renderMulti(q, index);
    } else if (q.type === "tf") {
      html += renderTF(q, index);
    }

    html += '<div class="explain" id="explain_' + index + '">' + escapeHtml(q.explanation) + '</div>';
    html += '</div>';
    document.getElementById("quizArea").innerHTML = html;
    updateProgress();
    updateNav();
    if (state.checked[index]) { showExplain(index); }
  }

  function typeLabel(t) {
    var map = { dragfill: "拖拽填空", single: "单选题", multi: "多选题", tf: "判断题" };
    return map[t] || t;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---------- 拖拽填空 ----------
  function renderDragFill(q, idx) {
    var user = state.answers[idx] || [];
    var parts = q.question.split(/__(\d+)__/g);
    var filled = 0;
    var html = '<div style="line-height:2.2;font-size:1.05rem;">';
    for (var i = 0; i < parts.length; i++) {
      if (/^\d+$/.test(parts[i])) {
        var bidx = parseInt(parts[i], 10) - 1;
        var val = user[bidx] || "";
        var cls = "drop-zone";
        if (state.checked[idx]) {
          cls += val === q.blanks[bidx] ? " correct-zone" : " wrong-zone";
        } else if (val) {
          cls += " filled";
        }
        html += '<span class="' + cls + '" data-blank="' + bidx + '" ondrop="drop(event)" ondragover="allowDrop(event)" onclick="clearBlank(' + idx + ',' + bidx + ')">' + (val || "【填空" + (bidx + 1) + "】") + '</span>';
        if (val) filled++;
      } else {
        html += escapeHtml(parts[i]);
      }
    }
    html += '</div>';
    html += '<div class="drag-pool" id="pool_' + idx + '">';
    var used = user || [];
    q.pool.forEach(function(item) {
      if (used.indexOf(item) === -1) {
        html += '<span class="drag-item" draggable="true" ondragstart="drag(event)" data-val="' + escapeHtml(item) + '">' + escapeHtml(item) + '</span>';
      }
    });
    html += '</div>';
    return html;
  }

  window.drag = function(ev) {
    ev.dataTransfer.setData("text/plain", ev.target.getAttribute("data-val"));
    ev.target.classList.add("dragging");
  };
  window.allowDrop = function(ev) { ev.preventDefault(); };
  window.drop = function(ev) {
    ev.preventDefault();
    var val = ev.dataTransfer.getData("text/plain");
    if (!val) return;
    var blankIdx = parseInt(ev.target.getAttribute("data-blank"), 10);
    setBlank(state.current, blankIdx, val);
  };
  function setBlank(qidx, bidx, val) {
    var arr = state.answers[qidx] ? state.answers[qidx].slice() : [];
    arr[bidx] = val;
    state.answers[qidx] = arr;
    renderQuestion(qidx);
  }
  window.clearBlank = function(qidx, bidx) {
    if (state.checked[qidx]) return;
    var arr = state.answers[qidx] ? state.answers[qidx].slice() : [];
    arr[bidx] = "";
    state.answers[qidx] = arr;
    renderQuestion(qidx);
  };

  // ---------- 单选题 ----------
  function renderSingle(q, idx) {
    var user = state.answers[idx];
    var html = '<div class="options">';
    q.options.forEach(function(opt, i) {
      var cls = "option";
      if (state.checked[idx]) {
        cls += " disabled";
        if (i === q.answer) cls += " correct";
        else if (i === user) cls += " wrong";
      } else if (i === user) {
        cls += " selected";
      }
      html += '<label class="' + cls + '" onclick="selectSingle(' + idx + ',' + i + ')">';
      html += '<input type="radio" name="single_' + idx + '" ' + (i === user ? 'checked' : '') + '>';
      html += '<span>' + String.fromCharCode(65 + i) + '. ' + escapeHtml(opt) + '</span>';
      html += '</label>';
    });
    html += '</div>';
    return html;
  }
  window.selectSingle = function(idx, val) {
    if (state.checked[idx]) return;
    state.answers[idx] = val;
    renderQuestion(idx);
  };

  // ---------- 多选题 ----------
  function renderMulti(q, idx) {
    var user = state.answers[idx] || [];
    var html = '<div class="options">';
    q.options.forEach(function(opt, i) {
      var cls = "option";
      var checked = user.indexOf(i) !== -1;
      if (state.checked[idx]) {
        cls += " disabled";
        var isCorrect = q.answer.indexOf(i) !== -1;
        if (isCorrect) cls += " correct";
        else if (checked) cls += " wrong";
      } else if (checked) {
        cls += " selected";
      }
      html += '<label class="' + cls + '" onclick="toggleMulti(' + idx + ',' + i + ')">';
      html += '<input type="checkbox" ' + (checked ? 'checked' : '') + '>';
      html += '<span>' + String.fromCharCode(65 + i) + '. ' + escapeHtml(opt) + '</span>';
      html += '</label>';
    });
    html += '</div>';
    return html;
  }
  window.toggleMulti = function(idx, val) {
    if (state.checked[idx]) return;
    var arr = state.answers[idx] ? state.answers[idx].slice() : [];
    var pos = arr.indexOf(val);
    if (pos === -1) arr.push(val);
    else arr.splice(pos, 1);
    state.answers[idx] = arr;
    renderQuestion(idx);
  };

  // ---------- 判断题 ----------
  function renderTF(q, idx) {
    var user = state.answers[idx];
    var html = '<div class="tf-wrap">';
    var opts = [{v: true, l: "是 / True"}, {v: false, l: "否 / False"}];
    opts.forEach(function(o) {
      var cls = "tf-btn";
      if (state.checked[idx]) {
        cls += " disabled";
        if (o.v === q.answer) cls += " correct";
        else if (o.v === user) cls += " wrong";
      } else if (o.v === user) {
        cls += " selected";
      }
      html += '<div class="' + cls + '" onclick="selectTF(' + idx + ',' + o.v + ')">' + escapeHtml(o.l) + '</div>';
    });
    html += '</div>';
    return html;
  }
  window.selectTF = function(idx, val) {
    if (state.checked[idx]) return;
    state.answers[idx] = val;
    renderQuestion(idx);
  };

  // ===================== 检查/重置 =====================
  window.checkCurrent = function() {
    var idx = state.current;
    var q = allQuestions[idx];
    var ans = state.answers[idx];
    var correct = false;

    if (q.type === "dragfill") {
      if (!ans || ans.length < q.blanks.length) { alert("请先完成所有填空"); return; }
      correct = true;
      for (var i = 0; i < q.blanks.length; i++) {
        if (ans[i] !== q.blanks[i]) { correct = false; break; }
      }
    } else if (q.type === "single") {
      if (ans === null || ans === undefined) { alert("请先选择一个答案"); return; }
      correct = (ans === q.answer);
    } else if (q.type === "multi") {
      if (!ans || ans.length === 0) { alert("请至少选择一个选项"); return; }
      var sortedUser = ans.slice().sort(function(a,b){return a-b;});
      var sortedAns = q.answer.slice().sort(function(a,b){return a-b;});
      correct = JSON.stringify(sortedUser) === JSON.stringify(sortedAns);
    } else if (q.type === "tf") {
      if (ans === null || ans === undefined) { alert("请先选择是或否"); return; }
      correct = (ans === q.answer);
    }

    state.checked[idx] = true;
    recalcScore();
    renderQuestion(idx);
    showExplain(idx);
    updateThumbs();
  };

  function showExplain(idx) {
    var el = document.getElementById("explain_" + idx);
    if (el) el.classList.add("show");
  }

  function recalcScore() {
    var total = 0;
    for (var i = 0; i < allQuestions.length; i++) {
      if (!state.checked[i]) continue;
      var q = allQuestions[i];
      var ans = state.answers[i];
      var pts = 0;
      if (q.type === "dragfill") {
        var ok = true;
        for (var j = 0; j < q.blanks.length; j++) { if (ans[j] !== q.blanks[j]) { ok = false; break; } }
        pts = ok ? 1 : 0;
      } else if (q.type === "single" || q.type === "tf") {
        pts = (ans === q.answer) ? 1 : 0;
      } else if (q.type === "multi") {
        var su = (ans || []).slice().sort(function(a,b){return a-b;});
        var sa = q.answer.slice().sort(function(a,b){return a-b;});
        pts = (JSON.stringify(su) === JSON.stringify(sa)) ? 1 : 0;
      }
      total += pts;
    }
    state.score = total;
    document.getElementById("scoreVal").textContent = total + " / " + allQuestions.length;
  }

  window.resetCurrent = function() {
    var idx = state.current;
    state.answers[idx] = null;
    state.checked[idx] = false;
    renderQuestion(idx);
    recalcScore();
    updateThumbs();
  };

  window.resetAll = function() {
    if (!confirm("确定要清空所有答题记录吗？")) return;
    initState();
    document.getElementById("overviewPanel").classList.remove("show");
    document.getElementById("resultScreen").classList.remove("show");
    renderQuestion(0);
    recalcScore();
    updateThumbs();
  };

  // ===================== 导航 =====================
  function updateProgress() {
    document.getElementById("currentQ").textContent = state.current + 1;
    document.getElementById("totalQ").textContent = allQuestions.length;
    var pct = ((state.current + 1) / allQuestions.length) * 100;
    document.getElementById("progressBar").style.width = pct + "%";
  }
  function updateNav() {
    document.getElementById("btnPrev").disabled = state.current === 0;
    document.getElementById("btnNext").disabled = state.current === allQuestions.length - 1;
  }
  window.prevQuestion = function() {
    if (state.current > 0) { state.current--; renderQuestion(state.current); }
  };
  window.nextQuestion = function() {
    if (state.current < allQuestions.length - 1) { state.current++; renderQuestion(state.current); }
  };
  window.showQuestion = function(idx) {
    document.getElementById("overviewPanel").classList.remove("show");
    document.getElementById("resultScreen").classList.remove("show");
    state.current = idx;
    renderQuestion(idx);
  };

  // ===================== 总览面板 =====================
  window.toggleOverview = function() {
    var panel = document.getElementById("overviewPanel");
    panel.classList.toggle("show");
    if (panel.classList.contains("show")) updateThumbs();
  };
  function updateThumbs() {
    var grid = document.getElementById("thumbGrid");
    var html = "";
    for (var i = 0; i < allQuestions.length; i++) {
      var cls = "thumb";
      if (state.checked[i]) {
        var q = allQuestions[i];
        var ans = state.answers[i];
        var ok = false;
        if (q.type === "dragfill") {
          ok = true;
          for (var j = 0; j < q.blanks.length; j++) { if (ans[j] !== q.blanks[j]) { ok = false; break; } }
        } else if (q.type === "single" || q.type === "tf") {
          ok = (ans === q.answer);
        } else if (q.type === "multi") {
          var su = (ans || []).slice().sort(function(a,b){return a-b;});
          var sa = q.answer.slice().sort(function(a,b){return a-b;});
          ok = JSON.stringify(su) === JSON.stringify(sa);
        }
        cls += ok ? " correct" : " wrong";
      } else {
        cls += " unchecked";
      }
      html += '<div class="' + cls + '" onclick="showQuestion(' + i + ')">' + (i + 1) + '</div>';
    }
    grid.innerHTML = html;
  }
  window.filterThumbs = function(filter) {
    var btns = document.querySelectorAll(".filter-btn");
    btns.forEach(function(b) { b.classList.remove("active"); });
    event.target.classList.add("active");
    var thumbs = document.querySelectorAll(".thumb");
    thumbs.forEach(function(t) {
      t.style.display = "flex";
      if (filter === "correct" && !t.classList.contains("correct")) t.style.display = "none";
      if (filter === "wrong" && !t.classList.contains("wrong")) t.style.display = "none";
      if (filter === "unchecked" && !t.classList.contains("unchecked")) t.style.display = "none";
    });
  };

  // ===================== 洗牌 =====================
  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  window.shuffleAll = function() {
    allQuestions.forEach(function(q) {
      if (q.type === "single" || q.type === "multi") {
        var oldAns = q.answer;
        var isMulti = Array.isArray(oldAns);
        var mapping = {};
        var newOptions = [];
        var indices = q.options.map(function(_, i){ return i; });
        var shuffledIndices = shuffleArray(indices);
        shuffledIndices.forEach(function(oldIdx, newIdx) {
          mapping[oldIdx] = newIdx;
          newOptions[newIdx] = q.options[oldIdx];
        });
        q.options = newOptions;
        if (isMulti) {
          q.answer = oldAns.map(function(oldIdx){ return mapping[oldIdx]; });
        } else {
          q.answer = mapping[oldAns];
        }
      }
    });
    state.shuffled = true;
    renderQuestion(state.current);
    alert("选项已重新洗牌！");
  };

  // ===================== 结果 =====================
  function showResult() {
    document.getElementById("quizArea").innerHTML = "";
    document.getElementById("overviewPanel").classList.remove("show");
    document.getElementById("resultScreen").classList.add("show");
    document.getElementById("finalScore").textContent = state.score + " / " + allQuestions.length;
    var pct = Math.round((state.score / allQuestions.length) * 100);
    var msg = "";
    if (pct >= 90) msg = "🎉 太棒了！你对 Generative Agents 的机制理解非常透彻！";
    else if (pct >= 70) msg = "👍 不错！大部分核心概念已经掌握，再巩固一下细节。";
    else if (pct >= 50) msg = "💪 基本了解框架，建议重点复习记忆检索公式和反思触发条件。";
    else msg = "📚 建议重新阅读实验文档，特别关注三层架构和评估指标之间的关系。";
    document.getElementById("finalMsg").textContent = msg + "（正确率 " + pct + "%）";
  }

  // 检查是否全部完成
  function checkAllDone() {
    var allDone = state.checked.every(function(v){ return v; });
    if (allDone) showResult();
  }
  // 覆盖 checkCurrent 后追加检查
  var originalCheck = window.checkCurrent;
  window.checkCurrent = function() {
    originalCheck();
    checkAllDone();
  };

  // ===================== 初始化 =====================
  initState();
  document.getElementById("totalQ").textContent = allQuestions.length;
  renderQuestion(0);
  recalcScore();
  updateThumbs();
})();
</script>
</body>
</html>
