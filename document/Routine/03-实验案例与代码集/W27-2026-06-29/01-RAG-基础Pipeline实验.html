<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01-RAG 基础 Pipeline 实验 — 互动知识卡牌</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 6px; }
  header p { color: var(--text-secondary); font-size: 0.9rem; }
  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    padding: 12px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .score-bar .score { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
  .score-bar .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #d1d5db; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-warning:hover { background: #b45309; }
  .progress-bar {
    background: var(--card-bg);
    padding: 12px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .progress-track {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 4px;
    transition: width 0.3s;
  }
  .progress-text { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
  .question-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
    display: none;
  }
  .question-card.active { display: block; }
  .question-card h3 { font-size: 1.1rem; margin-bottom: 16px; line-height: 1.5; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-right: 8px;
    vertical-align: middle;
  }
  .badge-drag { background: #ede9fe; color: #7c3aed; }
  .badge-single { background: var(--primary-light); color: var(--primary); }
  .badge-multi { background: #fce7f3; color: #be185d; }
  .badge-tf { background: #ccfbf1; color: #0f766e; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .option {
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .option:hover { border-color: var(--primary); background: var(--primary-light); }
  .option.selected { border-color: var(--primary); background: var(--primary-light); }
  .option.correct { border-color: var(--success); background: var(--success-bg); }
  .option.wrong { border-color: var(--danger); background: var(--danger-bg); }
  .option input { display: none; }
  .option-label { font-weight: 600; min-width: 24px; }
  .drop-zone {
    display: inline-block;
    min-width: 120px;
    min-height: 36px;
    padding: 4px 12px;
    border: 2px dashed var(--primary);
    border-radius: 6px;
    background: var(--primary-light);
    vertical-align: middle;
    text-align: center;
    line-height: 28px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .drop-zone.dragover { background: #bfdbfe; border-color: #1d4ed8; }
  .drop-zone.filled { border-style: solid; background: #dcfce7; border-color: var(--success); }
  .drop-zone.wrong { background: var(--danger-bg); border-color: var(--danger); }
  .drag-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0;
    padding: 12px;
    background: #f9fafb;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .drag-item {
    padding: 8px 16px;
    background: var(--card-bg);
    border: 2px solid var(--primary);
    border-radius: 6px;
    cursor: grab;
    font-weight: 500;
    color: var(--primary);
    user-select: none;
  }
  .drag-item.dragging { opacity: 0.5; }
  .drag-item.used { opacity: 0.4; pointer-events: none; }
  .feedback { display: none; margin-top: 16px; padding: 16px; border-radius: 8px; }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--success-bg); border: 1px solid var(--success); }
  .feedback.wrong { background: var(--danger-bg); border: 1px solid var(--danger); }
  .feedback h4 { margin-bottom: 8px; }
  .feedback p { margin-bottom: 6px; line-height: 1.5; }
  .nav-btns {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 10px;
  }
  .nav-btns .center { display: flex; gap: 10px; }
  .result-page {
    display: none;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    text-align: center;
  }
  .result-page.active { display: block; }
  .result-page h2 { font-size: 1.5rem; margin-bottom: 12px; }
  .result-score { font-size: 3rem; font-weight: 700; color: var(--primary); margin: 16px 0; }
  .result-detail { color: var(--text-secondary); margin-bottom: 24px; }
  .dashboard-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .dashboard-overlay.open { display: flex; }
  .dashboard-panel {
    background: var(--card-bg);
    border-radius: var(--radius);
    max-width: 700px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .dashboard-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 8px;
  }
  .dashboard-item {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .dashboard-item:hover { transform: scale(1.05); }
  .dashboard-item.unanswered { background: #f3f4f6; color: var(--text-secondary); border-color: var(--border); }
  .dashboard-item.correct { background: var(--success-bg); color: var(--success); border-color: var(--success); }
  .dashboard-item.wrong { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
  .dashboard-item .num { font-size: 1.1rem; }
  .dashboard-item .type { font-size: 0.65rem; opacity: 0.8; }
  @media (max-width: 600px) {
    body { padding: 12px; }
    .question-card { padding: 16px; }
    .score-bar { flex-direction: column; align-items: flex-start; }
    .nav-btns { flex-direction: column; }
    .nav-btns .center { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>01-RAG 基础 Pipeline 实验</h1>
    <p>互动知识卡牌 · 拖拽填空 · 单选 · 多选 · 判断</p>
  </header>

  <div class="score-bar">
    <div class="score">得分: <span id="totalScore">0</span> / <span id="totalMax">0</span></div>
    <div class="btns">
      <button class="btn btn-secondary" onclick="openDashboard()">📊 题目总览</button>
      <button class="btn btn-warning" onclick="shuffleAll()">🎲 重新洗牌选项</button>
      <button class="btn btn-danger" onclick="resetAll()">🔄 重置所有分数</button>
    </div>
  </div>

  <div class="progress-bar">
    <div>进度: <span id="progressText">0 / 0</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressDetail">尚未开始</div>
  </div>

  <!-- Drag Questions -->
  <div id="dragQuestions"></div>

  <!-- Single Choice Questions -->
  <div id="singleQuestions"></div>

  <!-- Multiple Choice Questions -->
  <div id="multiQuestions"></div>

  <!-- True/False Questions -->
  <div id="tfQuestions"></div>

  <!-- Navigation -->
  <div class="nav-btns" id="navButtons">
    <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">⬅ 上一题</button>
    <div class="center">
      <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">✅ 检查答案</button>
      <button class="btn btn-secondary" id="resetBtn" onclick="resetCurrent()">🔄 重置本题</button>
    </div>
    <button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()">下一题 ➡</button>
  </div>

  <!-- Result Page -->
  <div class="result-page" id="resultPage">
    <h2>🎉 测试完成！</h2>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-detail" id="resultDetail"></div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="openDashboard()">📊 返回查看</button>
      <button class="btn btn-secondary" onclick="continueQuiz()">▶ 继续做题</button>
    </div>
  </div>
</div>

<!-- Dashboard Overlay -->
<div class="dashboard-overlay" id="dashboardOverlay" onclick="closeDashboard(event)">
  <div class="dashboard-panel" onclick="event.stopPropagation()">
    <div class="dashboard-header">
      <h3>📊 题目总览</h3>
      <button class="btn btn-secondary" onclick="closeDashboard()">✕ 关闭</button>
    </div>
    <div class="dashboard-filters">
      <button class="btn btn-secondary" onclick="filterDashboard('all')">全部</button>
      <button class="btn btn-secondary" onclick="filterDashboard('correct')">✅ 正确</button>
      <button class="btn btn-secondary" onclick="filterDashboard('wrong')">❌ 错误</button>
      <button class="btn btn-secondary" onclick="filterDashboard('unanswered')">⭕ 未答</button>
    </div>
    <div class="dashboard-grid" id="dashboardGrid"></div>
  </div>
</div>

<script>
// ===================== DATA =====================
const dragQuestions = [
  {
    question: "RAG Pipeline 的标准流程为：首先使用 {0} 将长文档分割为 chunk，然后通过 {1} 将文本编码为向量，接着使用 {2} 构建向量索引，最后通过 {3} 生成回答。",
    answers: ["RecursiveCharacterTextSplitter", "HuggingFaceEmbeddings", "FAISS", "LLM"],
    pool: ["RecursiveCharacterTextSplitter", "HuggingFaceEmbeddings", "FAISS", "LLM", "BM25", "TF-IDF", "Redis", "Elasticsearch"],
    explanations: [
      "RecursiveCharacterTextSplitter 按优先级尝试段落、行、句号等分隔符，保持语义完整性。BM25 是稀疏检索算法，不用于文本分割。",
      "HuggingFaceEmbeddings 使用 sentence-transformers 将文本编码为 384-dim 向量。TF-IDF 是词频统计方法，不生成语义向量。",
      "FAISS 是本地向量数据库，支持相似度搜索。Redis 和 Elasticsearch 虽可存向量，但此处标准选型是 FAISS。",
      "LLM（如 Qwen2.5-7B-Instruct）负责根据检索到的上下文生成回答。BM25 和 TF-IDF 是检索算法，不负责生成。"
    ],
    detailLink: "#实验设计"
  },
  {
    question: "评估 RAG 检索效果的指标 {0} 衡量「找得全不全」，而 {1} 同时衡量「找没找全」和「排得靠前不靠前」。生成质量评估中，{2} 对同义词敏感，{3} 基于语义相似度能识别表述不同但语义等价的文本。",
    answers: ["Recall@k", "MRR", "BERTScore", "BLEU"],
    pool: ["Recall@k", "MRR", "BERTScore", "BLEU", "ROUGE-L", "Exact Match", "Answer F1", "幻觉率"],
    explanations: [
      "Recall@k 计算相关文档在前 k 个结果中的召回比例，衡量「找得全不全」。",
      "MRR（Mean Reciprocal Rank）是首个相关文档排名的倒数均值，同时衡量召回和排序质量。",
      "BERTScore 基于预训练模型的语义相似度，能识别同义词和语义等价表述。BLEU 基于 n-gram 精确率，对同义词不敏感。",
      "BLEU 基于 n-gram 精确率的几何平均，对同义词不敏感（如"技术"vs"方法"算不匹配）。"
    ],
    detailLink: "#评估指标"
  },
  {
    question: "在 RAG Pipeline 代码中，`split_documents` 使用 `chunk_size={0}` 和 `chunk_overlap={1}` 进行文本分割；检索时默认返回 `top_k={2}` 个最相关文档；生成模型 `max_new_tokens` 设置为 {3}。",
    answers: ["512", "50", "3", "512"],
    pool: ["512", "50", "3", "256", "1024", "30", "5", "7", "128", "100"],
    explanations: [
      "代码中 CHUNK_SIZE = 512，表示每个 chunk 的目标长度为 512 字符。",
      "代码中 CHUNK_OVERLAP = 50，保证相邻 chunk 有 50 字符重叠，防止关键信息被截断。",
      "代码中 TOP_K = 3，默认检索返回 3 个最相关文档。",
      "代码中 max_new_tokens=512，最多生成 512 个新 token，约 300-400 汉字。"
    ],
    detailLink: "#代码"
  },
  {
    question: "RAG 降低幻觉的关键 trick 是在 prompt 中加入："如果上下文中没有相关信息，请回答{0}"。这种设计称为 {1}，强制模型在信息不足时 {2} 而非编造答案。",
    answers: [""我不知道"", "安全护栏", "拒绝回答"],
    pool: [""我不知道"", "安全护栏", "拒绝回答", ""请继续生成"", "温度控制", "贪心解码", "随机采样"],
    explanations: [
      "代码注释明确说明：加入"如果上下文中没有相关信息，请回答\'我不知道\'"作为安全护栏。",
      "这种设计称为安全护栏（Safety Guardrail），是降低幻觉的关键 trick。",
      "强制模型在信息不足时拒绝回答，而非编造答案。温度控制和贪心解码是生成策略，不直接防止幻觉。"
    ],
    detailLink: "#代码"
  },
  {
    question: "实验中，Naive RAG (chunk=512, top_k=3) 的检索 Recall@3 为 {0}，生成 BERTScore 为 {1}，幻觉率为 {2}；而无 RAG 直接生成的幻觉率高达 {3}。",
    answers: ["0.62", "0.71", "0.15", "0.42"],
    pool: ["0.62", "0.71", "0.15", "0.42", "0.68", "0.74", "0.12", "0.45"],
    explanations: [
      "基线配置 (chunk=512, top_k=3) 的 Recall@3 = 0.62。",
      "基线配置的 BERTScore = 0.71。",
      "基线配置的幻觉率 = 0.15，显著低于无 RAG 的 0.42。",
      "无 RAG 直接生成的幻觉率为 0.42，说明 RAG 显著降低了幻觉。"
    ],
    detailLink: "#结果"
  }
];

const singleQuestions = [
  {
    question: "RAG Pipeline 中，为什么使用 RecursiveCharacterTextSplitter 而非固定长度切分？",
    options: [
      "A. 固定长度切分速度更快，但 RecursiveCharacterTextSplitter 更节省内存",
      "B. RecursiveCharacterTextSplitter 按优先级尝试段落、行、句号等分隔符，尽量保持语义完整性，避免在句子中间切断",
      "C. RecursiveCharacterTextSplitter 能自动识别文档的语言类型",
      "D. 固定长度切分会产生更少的 chunk，降低向量存储成本"
    ],
    correct: 1,
    explanations: [
      "❌ 错误：速度不是主要考虑因素，且 RecursiveCharacterTextSplitter 的内存占用与固定长度切分相当。",
      "✅ 正确：RecursiveCharacterTextSplitter 按优先级尝试分隔符 [

, 
, 。, ，, 空格]，尽量在语义边界处切分。",
      "❌ 错误：RecursiveCharacterTextSplitter 不识别语言类型，它只按通用分隔符切分。",
      "❌ 错误：chunk 数量取决于文档长度和 chunk_size，与切分策略关系不大。"
    ],
    detailLink: "#代码"
  },
  {
    question: "实验中 Embedding 模型选用 sentence-transformers/all-MiniLM-L6-v2 的主要理由是什么？",
    options: [
      "A. 它是目前效果最好的 Embedding 模型，在所有基准测试上排名第一",
      "B. 轻量、开源、384-dim，适合快速原型验证",
      "C. 它专为中文优化，在中文文档上效果远超其他模型",
      "D. 它支持多模态输入，可以同时处理文本和图像"
    ],
    correct: 1,
    explanations: [
      "❌ 错误：all-MiniLM-L6-v2 不是效果最好的模型，MTEB 排行榜上有更强大的模型如 BGE-Large。",
      "✅ 正确：实验明确说明选型理由是"轻量、开源、384-dim"，适合快速原型。",
      "❌ 错误：all-MiniLM-L6-v2 是通用英文模型，中文效果一般；中文场景应选用 BGE 等中文优化模型。",
      "❌ 错误：all-MiniLM-L6-v2 是纯文本 Embedding 模型，不支持多模态。"
    ],
    detailLink: "#实验设计"
  },
  {
    question: "为什么 Recall@k 被称为 RAG Pipeline 的"瓶颈指标"？",
    options: [
      "A. 因为 Recall@k 的计算速度最慢，拖慢了整个评估流程",
      "B. 因为检索不到正确文档，生成模型必然无法回答正确，检索是 RAG 效果的上限",
      "C. 因为 Recall@k 需要人工标注相关文档，成本最高",
      "D. 因为 Recall@k 只关注前 k 个结果，忽略了排序质量"
    ],
    correct: 2,
    explanations: [
      "❌ 错误：Recall@k 的计算是自动的，不需要额外时间开销。",
      "❌ 错误：Recall@k 基于 ground_truth_doc_id 自动计算，不需要人工标注。",
      "✅ 正确：文档明确说明"检索不到正确文档，生成必然错误"，检索质量决定了 RAG 效果的上限。",
      "❌ 错误：虽然 Recall@k 确实不关注排序，但这不是它被称为瓶颈指标的原因。",
    ],
    detailLink: "#评估指标"
  },
  {
    question: "MRR 的局限性是什么？",
    options: [
      "A. MRR 计算复杂度高，不适用于大规模数据集",
      "B. MRR 只关注第一个相关文档，忽略后续相关文档；对 top-1 要求苛刻",
      "C. MRR 需要知道所有相关文档的位置，标注成本太高",
      "D. MRR 不能衡量检索系统的召回能力"
    ],
    correct: 3,
    explanations: [
      "❌ 错误：MRR 计算非常简单，只是倒数求和平均。",

// ===================== RENDER =====================
function renderDragQuestions() {
  const container = document.getElementById('dragQuestions');
  container.innerHTML = '';
  dragQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `drag-${idx}`;
    card.dataset.type = 'drag';
    card.dataset.index = idx;

    let html = `<h3><span class="badge badge-drag">拖拽</span>${escapeHtml(q.question)}</h3>`;
    html += `<div class="drag-pool" id="drag-pool-${idx}"></div>`;
    html += `<div class="feedback" id="feedback-drag-${idx}"></div>`;
    card.innerHTML = html;
    container.appendChild(card);

    // Render pool
    const pool = document.getElementById(`drag-pool-${idx}`);
    q.pool.forEach((term, i) => {
      const item = document.createElement('div');
      item.className = 'drag-item';
      item.draggable = true;
      item.textContent = term;
      item.dataset.term = term;
      item.addEventListener('dragstart', e => {
        item.classList.add('dragging');
        e.dataTransfer.setData('text/plain', term);
      });
      item.addEventListener('dragend', () => item.classList.remove('dragging'));
      pool.appendChild(item);
    });

    // Make drop zones
    const questionText = card.querySelector('h3');
    const matches = q.question.match(/\{\d+\}/g);
    if (matches) {
      let innerHTML = escapeHtml(q.question);
      matches.forEach((m, i) => {
        innerHTML = innerHTML.replace(escapeHtml(m), `<span class="drop-zone" id="drop-zone-${idx}-${i}" data-index="${i}"></span>`);
      });
      questionText.innerHTML = `<span class="badge badge-drag">拖拽</span>` + innerHTML;
    }

    // Bind drop zones
    matches.forEach((m, i) => {
      const zone = document.getElementById(`drop-zone-${idx}-${i}`);
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('dragover');
        const term = e.dataTransfer.getData('text/plain');
        zone.textContent = term;
        zone.classList.add('filled');
        zone.dataset.value = term;
        // Mark used
        pool.querySelectorAll('.drag-item').forEach(item => {
          if (item.dataset.term === term) item.classList.add('used');
        });
      });
      zone.addEventListener('click', () => {
        if (zone.dataset.value) {
          // Return to pool
          pool.querySelectorAll('.drag-item').forEach(item => {
            if (item.dataset.term === zone.dataset.value) item.classList.remove('used');
          });
          zone.textContent = '';
          zone.classList.remove('filled');
          delete zone.dataset.value;
        }
      });
    });
  });
}

function renderSingleQuestions() {
  const container = document.getElementById('singleQuestions');
  container.innerHTML = '';
  singleQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `single-${idx}`;
    card.dataset.type = 'single';
    card.dataset.index = idx;

    let html = `<h3><span class="badge badge-single">单选</span>${escapeHtml(q.question)}</h3>`;
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      html += `<div class="option" onclick="selectSingle(${idx}, ${i})" id="single-opt-${idx}-${i}">
        <span class="option-label">${String.fromCharCode(65 + i)}.</span>
        <span>${escapeHtml(opt)}</span>
      </div>`;
    });
    html += `</div>`;
    html += `<div class="feedback" id="feedback-single-${idx}"></div>`;
    card.innerHTML = html;
    container.appendChild(card);
  });
}

function renderMultiQuestions() {
  const container = document.getElementById('multiQuestions');
  container.innerHTML = '';
  multiQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `multi-${idx}`;
    card.dataset.type = 'multi';
    card.dataset.index = idx;

    let html = `<h3><span class="badge badge-multi">多选</span>${escapeHtml(q.question)}</h3>`;
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      html += `<div class="option" onclick="toggleMulti(${idx}, ${i})" id="multi-opt-${idx}-${i}">
        <span class="option-label">${String.fromCharCode(65 + i)}.</span>
        <span>${escapeHtml(opt)}</span>
      </div>`;
    });
    html += `</div>`;
    html += `<div class="feedback" id="feedback-multi-${idx}"></div>`;
    card.innerHTML = html;
    container.appendChild(card);

}

function renderTFQuestions() {
  const container = document.getElementById('tfQuestions');
  container.innerHTML = '';
  trueFalseQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `tf-${idx}`;
    card.dataset.type = 'tf';
    card.dataset.index = idx;

    let html = `<h3><span class="badge badge-tf">判断</span>${escapeHtml(q.question)}</h3>`;
    html += `<div class="options">`;
    html += `<div class="option" onclick="selectTF(${idx}, true)" id="tf-opt-${idx}-true">
      <span class="option-label">✓</span><span>是 / True</span>
    </div>`;
    html += `<div class="option" onclick="selectTF(${idx}, false)" id="tf-opt-${idx}-false">
      <span class="option-label">✗</span><span>否 / False</span>
    </div>`;
    html += `</div>`;
    html += `<div class="feedback" id="feedback-tf-${idx}"></div>`;
    card.innerHTML = html;
    container.appendChild(card);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===================== INTERACTION =====================
function selectSingle(qIdx, optIdx) {
  if (userScores[`single-${qIdx}`] !== undefined) return;
  userAnswers[`single-${qIdx}`] = optIdx;
  document.querySelectorAll(`#single-${qIdx} .option`).forEach((el, i) => {
    el.classList.toggle('selected', i === optIdx);
  });
}

function toggleMulti(qIdx, optIdx) {
  if (userScores[`multi-${qIdx}`] !== undefined) return;
  const key = `multi-${qIdx}`;
  if (!userAnswers[key]) userAnswers[key] = [];
  const arr = userAnswers[key];
  const pos = arr.indexOf(optIdx);
  if (pos >= 0) arr.splice(pos, 1);
  else arr.push(optIdx);
  document.querySelectorAll(`#multi-${qIdx} .option`).forEach((el, i) => {
    el.classList.toggle('selected', arr.includes(i));
  });
}

function selectTF(qIdx, val) {
  if (userScores[`tf-${qIdx}`] !== undefined) return;
  userAnswers[`tf-${qIdx}`] = val;
  document.querySelectorAll(`#tf-${qIdx} .option`).forEach(el => el.classList.remove('selected'));
  document.getElementById(`tf-opt-${qIdx}-${val}`).classList.add('selected');
}

// ===================== CHECK =====================
function checkAnswer() {
  const q = allQuestions[currentIndex];
  if (!q) return;

  if (q.type === 'drag') {
    const data = q.data;
    const answers = [];
    let allFilled = true;
    for (let i = 0; i < data.answers.length; i++) {
      const zone = document.getElementById(`drop-zone-${q.index}-${i}`);
      if (!zone || !zone.dataset.value) { allFilled = false; break; }
      answers.push(zone.dataset.value);
    }
    if (!allFilled) { alert('请先将所有术语拖拽到正确位置'); return; }

    let correct = true;
    const fb = document.getElementById(`feedback-drag-${q.index}`);
    let html = '<h4>解析</h4>';
    for (let i = 0; i < data.answers.length; i++) {
      const zone = document.getElementById(`drop-zone-${q.index}-${i}`);
      const isCorrect = answers[i] === data.answers[i];
      if (!isCorrect) correct = false;
      zone.classList.toggle('wrong', !isCorrect);
      html += `<p><strong>空位 ${i + 1}：</strong>${isCorrect ? '✅ 正确' : '❌ 错误'}</p>`;
      html += `<p>${escapeHtml(data.explanations[i])}</p>`;
    }
    fb.innerHTML = html;
    fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
    userScores[`drag-${q.index}`] = correct ? 1 : 0;
  }

  if (q.type === 'single') {
    const ans = userAnswers[`single-${q.index}`];
    if (ans === undefined) { alert('请选择一个选项'); return; }
    const data = q.data;
    const correct = ans === data.correct;
    userScores[`single-${q.index}`] = correct ? 1 : 0;

    document.querySelectorAll(`#single-${q.index} .option`).forEach((el, i) => {
      el.classList.remove('selected');
      if (i === data.correct) el.classList.add('correct');
      else if (i === ans && !correct) el.classList.add('wrong');
    });

    const fb = document.getElementById(`feedback-single-${q.index}`);
    let html = '<h4>解析</h4>';
    data.explanations.forEach((exp, i) => {
      html += `<p>${escapeHtml(exp)}</p>`;
    });
    fb.innerHTML = html;
    fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
  }

  if (q.type === 'multi') {
    const ans = userAnswers[`multi-${q.index}`];
    if (!ans || ans.length === 0) { alert('请至少选择一个选项'); return; }
    const data = q.data;
    const correctSet = new Set(data.correct);
    const userSet = new Set(ans);
    let correct = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
    userScores[`multi-${q.index}`] = correct ? 1 : 0;

    document.querySelectorAll(`#multi-${q.index} .option`).forEach((el, i) => {
      el.classList.remove('selected');
      if (data.correct.includes(i)) el.classList.add('correct');
      else if (userSet.has(i)) el.classList.add('wrong');
    });

    const fb = document.getElementById(`feedback-multi-${q.index}`);
    let html = '<h4>解析</h4>';
    data.explanations.forEach((exp, i) => {
      html += `<p>${escapeHtml(exp)}</p>`;
    });
    fb.innerHTML = html;
    fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
  }

  if (q.type === 'tf') {
    const ans = userAnswers[`tf-${q.index}`];
    if (ans === undefined) { alert('请选择是或否'); return; }
    const data = q.data;
    const correct = ans === data.correct;
    userScores[`tf-${q.index}`] = correct ? 1 : 0;

    document.querySelectorAll(`#tf-${q.index} .option`).forEach(el => el.classList.remove('selected'));
    document.getElementById(`tf-opt-${q.index}-${data.correct}`).classList.add('correct');
    if (!correct) document.getElementById(`tf-opt-${q.index}-${ans}`).classList.add('wrong');

    const fb = document.getElementById(`feedback-tf-${q.index}`);
    let html = '<h4>解析</h4>';
    data.explanations.forEach(exp => {
      html += `<p>${escapeHtml(exp)}</p>`;
    });
    fb.innerHTML = html;
    fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
  }

  updateScore();
  updateProgress();
}

// ===================== NAVIGATION =====================
function showQuestion(index) {
  if (index < 0 || index >= allQuestions.length) return;
  currentIndex = index;
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const q = allQuestions[index];
  const card = document.getElementById(`${q.type}-${q.index}`);
  if (card) card.classList.add('active');

  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index === allQuestions.length - 1;
  updateProgress();
}

function prevQuestion() { showQuestion(currentIndex - 1); }
function nextQuestion() { showQuestion(currentIndex + 1); }

function updateProgress() {
  const total = allQuestions.length;
  const answered = Object.keys(userScores).length;
  document.getElementById('progressText').textContent = `${currentIndex + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${((currentIndex + 1) / total) * 100}%`;
  document.getElementById('progressDetail').textContent = `已答 ${answered} 题，未答 ${total - answered} 题`;
}

function updateScore() {
  let score = 0;
  let max = 0;
  dragQuestions.forEach((_, i) => { max++; score += (userScores[`drag-${i}`] || 0); });
  singleQuestions.forEach((_, i) => { max++; score += (userScores[`single-${i}`] || 0); });
  multiQuestions.forEach((_, i) => { max++; score += (userScores[`multi-${i}`] || 0); });
  trueFalseQuestions.forEach((_, i) => { max++; score += (userScores[`tf-${i}`] || 0); });
  document.getElementById('totalScore').textContent = score;
  document.getElementById('totalMax').textContent = max;

  if (max === allQuestions.length && max > 0) {
    showResult(score, max);
  }
}

function showResult(score, max) {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  document.getElementById('navButtons').classList.add('hidden');
  document.querySelector('.progress-bar').classList.add('hidden');
  document.querySelector('.score-bar').classList.add('hidden');
  const rp = document.getElementById('resultPage');
  rp.classList.add('active');
  document.getElementById('resultScore').textContent = `${score} / ${max}`;
  const pct = Math.round((score / max) * 100);
  let msg = '';
  if (pct >= 90) msg = '太棒了！你对 RAG Pipeline 掌握得非常扎实！🎉';
  else if (pct >= 70) msg = '不错！大部分概念已经掌握，再巩固一下细节。💪';
  else if (pct >= 50) msg = '及格了，但还有不少概念盲区，建议重新阅读实验文档。📚';
  else msg = '需要加油！建议重新学习 RAG Pipeline 实验内容。📝';
  document.getElementById('resultDetail').textContent = `正确率 ${pct}% · ${msg}`;
}

function continueQuiz() {
  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('navButtons').classList.remove('hidden');
  document.querySelector('.progress-bar').classList.remove('hidden');
  document.querySelector('.score-bar').classList.remove('hidden');
  showQuestion(currentIndex);
}

// ===================== RESET =====================
function resetCurrent() {
  const q = allQuestions[currentIndex];
  if (!q) return;
  const key = `${q.type}-${q.index}`;
  delete userAnswers[key];
  delete userScores[key];

  if (q.type === 'drag') {
    const fb = document.getElementById(`feedback-drag-${q.index}`);
    fb.className = 'feedback'; fb.innerHTML = '';
    for (let i = 0; i < q.data.answers.length; i++) {
      const zone = document.getElementById(`drop-zone-${q.index}-${i}`);
      if (zone && zone.dataset.value) {
        const pool = document.getElementById(`drag-pool-${q.index}`);
        pool.querySelectorAll('.drag-item').forEach(item => {
          if (item.dataset.term === zone.dataset.value) item.classList.remove('used');
        });
        zone.textContent = '';
        zone.classList.remove('filled', 'wrong');
        delete zone.dataset.value;
      }
    }
  }
  if (q.type === 'single') {
    const fb = document.getElementById(`feedback-single-${q.index}`);
    fb.className = 'feedback'; fb.innerHTML = '';
    document.querySelectorAll(`#single-${q.index} .option`).forEach(el => {
      el.classList.remove('selected', 'correct', 'wrong');
    });
  }
  if (q.type === 'multi') {
    const fb = document.getElementById(`feedback-multi-${q.index}`);
    fb.className = 'feedback'; fb.innerHTML = '';
    document.querySelectorAll(`#multi-${q.index} .option`).forEach(el => {
      el.classList.remove('selected', 'correct', 'wrong');
    });
  }
  if (q.type === 'tf') {
    const fb = document.getElementById(`feedback-tf-${q.index}`);
    fb.className = 'feedback'; fb.innerHTML = '';
    document.querySelectorAll(`#tf-${q.index} .option`).forEach(el => {
      el.classList.remove('selected', 'correct', 'wrong');
    });
  }
  updateScore();
  updateProgress();
}

function resetAll() {
  userAnswers = {};
  userScores = {};
  currentIndex = 0;
  currentFilter = 'all';

  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('navButtons').classList.remove('hidden');
  document.querySelector('.progress-bar').classList.remove('hidden');
  document.querySelector('.score-bar').classList.remove('hidden');

  // Re-render everything
  renderDragQuestions();
  renderSingleQuestions();
  renderMultiQuestions();
  renderTFQuestions();
  buildAllQuestions();
  showQuestion(0);
  updateScore();
}

// ===================== DASHBOARD =====================
function openDashboard() {
  document.getElementById('dashboardOverlay').classList.add('open');
  renderDashboardGrid();
}
function closeDashboard(e) {
  if (!e || e.target === document.getElementById('dashboardOverlay')) {
    document.getElementById('dashboardOverlay').classList.remove('open');
  }
}
function filterDashboard(type) {
  currentFilter = type;
  renderDashboardGrid();
}

function renderDashboardGrid() {
  const grid = document.getElementById('dashboardGrid');
  grid.innerHTML = '';
  let qNum = 1;
  allQuestions.forEach((q, idx) => {
    const key = `${q.type}-${q.index}`;
    const score = userScores[key];
    let status = 'unanswered';
    if (score === 1) status = 'correct';
    else if (score === 0) status = 'wrong';

    if (currentFilter !== 'all' && currentFilter !== status) return;

    const item = document.createElement('div');
    item.className = `dashboard-item ${status}`;
    item.innerHTML = `<div class="num">${qNum}</div><div class="type">${q.type === 'drag' ? '拖拽' : q.type === 'single' ? '单选' : q.type === 'multi' ? '多选' : '判断'}</div>`;
    item.onclick = () => {
      closeDashboard();
      showQuestion(idx);
    };
    grid.appendChild(item);
    qNum++;
  });
}

// ===================== SHUFFLE =====================
function shuffleAll() {
  if (!confirm('重新洗牌将打乱所有选项顺序并清空答题记录，确定继续？')) return;

  // Shuffle single
  singleQuestions.forEach(q => {
    const pairs = q.options.map((opt, i) => ({ opt, expl: q.explanations[i] }));
    for (let i = pairs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
    }
    q.options = pairs.map(p => p.opt);
    q.explanations = pairs.map(p => p.expl);
    q.correct = pairs.findIndex(p => p.expl.startsWith('✅'));
  });

  // Shuffle multi
  multiQuestions.forEach(q => {
    const pairs = q.options.map((opt, i) => ({ opt, expl: q.explanations[i], isCorrect: q.correct.includes(i) }));
    for (let i = pairs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
    }
    q.options = pairs.map(p => p.opt);
    q.explanations = pairs.map(p => p.expl);
    q.correct = pairs.map((p, i) => p.isCorrect ? i : -1).filter(i => i >= 0);
  });

  // Shuffle TF options order (swap true/false visually)
  trueFalseQuestions.forEach(q => {
    // Just shuffle explanations to match if we had more, but for 2 options we just keep as is
    // The true/false labels are fixed, but we can shuffle which side shows first
    if (Math.random() > 0.5) {
      // Swap explanation order for variety
      q.explanations = [q.explanations[1], q.explanations[0]];
    }
  });

  resetAll();
}

// ===================== INIT =====================
buildAllQuestions();
renderDragQuestions();
renderSingleQuestions();
renderMultiQuestions();
renderTFQuestions();
showQuestion(0);
updateScore();
</script>
