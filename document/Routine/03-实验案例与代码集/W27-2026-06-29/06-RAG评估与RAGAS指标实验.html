<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06-RAG 评估与 RAGAS 指标实验 — 互动知识卡牌</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --good: #16a34a;
    --bad: #dc2626;
    --warn: #d97706;
    --border: #e5e7eb;
    --shadow: 0 10px 30px rgba(0,0,0,0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; max-width: 900px; padding: 20px 16px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 1.25rem; margin: 0; }
  .score-board {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 16px; box-shadow: var(--shadow); display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  .score-board .pill { font-size: 0.9rem; }
  .pill .num { font-weight: 700; color: var(--accent); }
  .progress-wrap { width: 100%; max-width: 900px; padding: 0 16px; }
  .progress-bar { height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.3s ease; }
  .progress-text { font-size: 0.85rem; color: var(--muted); margin-top: 6px; text-align: right; }

  .container { width: 100%; max-width: 900px; padding: 16px; flex: 1; display: flex; flex-direction: column; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px; flex: 1; display: flex; flex-direction: column; gap: 14px;
  }
  .q-type { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; }
  .q-title { font-size: 1.1rem; line-height: 1.6; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    cursor: pointer; display: flex; align-items: center; gap: 10px; transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .option:hover { border-color: #cbd5e1; background: #f1f5f9; }
  .option input { accent-color: var(--accent); }
  .option.correct { border-color: var(--good); background: #f0fdf4; }
  .option.wrong { border-color: var(--bad); background: #fef2f2; }
  .option.disabled { pointer-events: none; opacity: 0.9; }

  .tf-options { display: flex; gap: 12px; flex-wrap: wrap; }
  .tf-btn {
    flex: 1; min-width: 120px; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
    background: #f8fafc; cursor: pointer; font-weight: 600; transition: all 0.15s;
  }
  .tf-btn:hover { border-color: #cbd5e1; background: #f1f5f9; }
  .tf-btn.correct { border-color: var(--good); background: #f0fdf4; color: var(--good); }
  .tf-btn.wrong { border-color: var(--bad); background: #fef2f2; color: var(--bad); }
  .tf-btn.disabled { pointer-events: none; opacity: 0.9; }

  .drop-zone {
    display: inline-block; min-width: 120px; min-height: 34px; border: 2px dashed #cbd5e1;
    border-radius: 8px; background: #f8fafc; vertical-align: middle; text-align: center; line-height: 30px;
    padding: 0 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s;
  }
  .drop-zone.hovered { border-color: var(--accent); background: #eff6ff; }
  .drop-zone.occupied { border-style: solid; border-color: var(--accent); background: #eff6ff; font-weight: 600; }
  .drop-zone.correct-zone { border-color: var(--good); background: #f0fdf4; }
  .drop-zone.wrong-zone { border-color: var(--bad); background: #fef2f2; }
  .draggable-pool { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .draggable {
    background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px;
    cursor: grab; box-shadow: 0 2px 0 rgba(0,0,0,0.04); user-select: none; touch-action: none;
  }
  .draggable.dragging { opacity: 0.5; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  button.action {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none;
    border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 18px rgba(37,99,235,0.25);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  button.action:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(37,99,235,0.3); }
  button.action.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  button.action.secondary:hover { background: #f8fafc; }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .explain {
    background: #f8fafc; border-left: 4px solid var(--accent); padding: 12px 14px; border-radius: 0 10px 10px 0;
    color: #374151; line-height: 1.6; display: none;
  }
  .explain.visible { display: block; }

  .nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }

  .overview {
    display: none; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; padding: 10px 0;
  }
  .overview.visible { display: grid; }
  .thumb {
    background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 6px; text-align: center;
    cursor: pointer; transition: transform 0.1s, box-shadow 0.15s; font-size: 0.85rem;
  }
  .thumb:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .thumb .t-num { font-weight: 700; font-size: 1rem; }
  .thumb .t-type { font-size: 0.7rem; color: var(--muted); }
  .thumb.correct { border-color: var(--good); background: #f0fdf4; }
  .thumb.wrong { border-color: var(--bad); background: #fef2f2; }
  .thumb.answered { border-color: var(--warn); background: #fffbeb; }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .result { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 30px 16px; text-align: center; }
  .result.visible { display: flex; }
  .big-score { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; color: transparent; }
  .result-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>06-RAG 评估与 RAGAS 指标实验</h1>
  <div class="score-board">
    <div class="pill">得分：<span class="num" id="scoreVal">0</span></div>
    <div class="pill">已答：<span class="num" id="answeredVal">0</span> / <span id="totalVal">0</span></div>
    <div class="pill">正确率：<span class="num" id="rateVal">0%</span></div>
  </div>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0</div>
</div>

<div class="container">
  <div class="filter-bar" id="filterBar">
    <button class="chip active" data-filter="all" onclick="filterOverview('all')">全部</button>
    <button class="chip" data-filter="correct" onclick="filterOverview('correct')">正确</button>
    <button class="chip" data-filter="wrong" onclick="filterOverview('wrong')">错误</button>
    <button class="chip" data-filter="unanswered" onclick="filterOverview('unanswered')">未答</button>
  </div>
  <div class="overview" id="overview"></div>

  <div id="quizArea">
    <div class="card" id="questionCard">
      <div class="q-type" id="qType"></div>
      <div class="q-title" id="qTitle"></div>
      <div id="qBody"></div>
      <div class="explain" id="explain"></div>
      <div class="actions">
        <button class="action" id="checkBtn" onclick="checkAnswer()">检查答案</button>
        <button class="action secondary" id="resetBtn" onclick="resetQuestion()">重置题目</button>
        <button class="action secondary" onclick="toggleOverview()">总览面板</button>
        <button class="action secondary" id="shuffleBtn" onclick="shuffleOptions()">🎲 重新洗牌选项</button>
      </div>
    </div>
    <div class="nav">
      <button class="action secondary" onclick="prevQuestion()">上一题</button>
      <button class="action secondary" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <div class="result" id="resultArea">
    <div class="big-score" id="finalScore">0</div>
    <div id="finalMsg">完成所有题目！</div>
    <div class="result-btns">
      <button class="action" onclick="showResultDetails()">返回查看</button>
      <button class="action secondary" onclick="resetAll()">重置全部</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const allQuestions = [
    // ===== 单选题 (10) =====
    {
      type: 'single',
      question: 'RAGAS 框架的核心思想是什么？',
      options: [
        '利用人工标注者对每个回答进行 1-5 分评分',
        '利用 LLM 作为评判者，通过构造特定 prompt 判断回答质量',
        '使用 BLEU 和 ROUGE 等字符串重叠指标评估生成质量',
        '仅依赖 NLI 模型判断回答与上下文的一致性'
      ],
      correct: 1,
      explain: 'RAGAS 的核心创新在于利用 LLM 作为「评判者」，通过语义感知的方式评估 RAG 系统质量，而非传统字符串匹配指标。'
    },
    {
      type: 'single',
      question: 'Faithfulness 指标的定义是什么？',
      options: [
        '回答与标准答案的语义相似度',
        '回答是否直接回应了用户的问题',
        '被上下文支持的声明数 / 回答中的总声明数',
        '检索到的前 k 个文档中相关文档的比例'
      ],
      correct: 2,
      explain: 'Faithfulness = 被上下文支持的声明数 / 总声明数，用于检测幻觉——即回答中是否包含无法从检索上下文中验证的信息。'
    },
    {
      type: 'single',
      question: 'Answer Correctness 与人工评分的 Pearson 相关系数 r 是多少？',
      options: [
        '0.55',
        '0.68',
        '0.72',
        '0.78'
      ],
      correct: 3,
      explain: '实验结果显示 Answer Correctness 与人工评分的相关性最高（r=0.78），是端到端质量最可靠的自动化代理指标。'
    },
    {
      type: 'single',
      question: 'Context Precision@k 衡量的是什么？',
      options: [
        '所有相关文档中被成功召回的比例',
        '检索到的前 k 个文档中真正相关文档所占比例',
        '回答与标准答案的事实重叠度',
        '回答是否直接回应了用户的问题'
      ],
      correct: 1,
      explain: 'Context Precision@k = top-k 中相关文档数 / k，衡量检索系统的精确率，避免给 LLM 灌入无关噪声上下文。'
    },
    {
      type: 'single',
      question: '自定义 FaithfulnessChecker 中，为什么对多个 context 取「最大 entailment 分数」而非平均？',
      options: [
        '因为平均计算会放大噪声，最大更稳健',
        '因为只要有一个 context 能支持该回答，回答就是忠实的（OR 逻辑）',
        '因为 CrossEncoder 模型对长文本平均效果差',
        '因为 RAGAS 官方推荐取最大值'
      ],
      correct: 1,
      explain: '只要有一个上下文能支持回答中的声明，该声明即被视为忠实——这是 OR 逻辑，而非要求所有上下文都支持。'
    },
    {
      type: 'single',
      question: '以下哪项是 Faithfulness 指标的局限性？',
      options: [
        '必须有 ground truth 才能计算',
        '无法检测上下文中的错误信息（如果检索文档本身有错，Faithfulness 仍可能很高）',
        '对开放式问题的判断主观性较强',
        '只关心检索准不准，不关心全不全'
      ],
      correct: 1,
      explain: 'Faithfulness 判断「回答是否被上下文支持」，但如果上下文本身包含错误信息，Faithfulness 仍可能很高——它无法检测原始知识源的错误。'
    },
    {
      type: 'single',
      question: '在相关性分析中，当评分分布偏斜或存在极端值时，应优先参考哪个系数？',
      options: [
        'Pearson r',
        'Spearman ρ',
        'Kendall τ',
        'F1 Score'
      ],
      correct: 1,
      explain: 'Spearman 秩相关系数对异常值更稳健，能捕捉单调（不必线性）关系，适合评分分布偏斜或存在极端值的场景。'
    },
    {
      type: 'single',
      question: '为什么 RAGAS 在计算 Faithfulness 时要将回答拆分为「原子声明」？',
      options: [
        '为了减少 LLM 调用次数，降低计算成本',
        '为了精确定位哪个具体事实出了问题，避免整体判断掩盖局部错误',
        '因为原子声明更容易与 BLEU 分数对齐',
        '因为 RAGAS 只支持单句输入'
      ],
      correct: 1,
      explain: '回答通常包含多个事实，整体判断 entailment 会掩盖局部错误。拆分为原子声明后可以精确定位哪个具体事实出了问题。'
    },
    {
      type: 'single',
      question: '日常开发迭代场景下，推荐的指标组合是什么？',
      options: [
        '全套 RAGAS 5 指标',
        'Answer Correctness + Human Eval',
        'Faithfulness + Semantic Sim',
        'Context Precision@k + Context Recall'
      ],
      correct: 2,
      explain: '日常迭代推荐 Faithfulness + Semantic Sim，无需 ground truth 且计算成本低，适合快速发现幻觉和语义漂移。'
    },
    {
      type: 'single',
      question: 'SemanticCorrectness 类使用什么模型计算语义相似度？',
      options: [
        'OpenAI GPT-4 API',
        'cross-encoder/nli-deberta-v3-base',
        'BAAI/bge-large-zh',
        'all-MiniLM-L6-v2'
      ],
      correct: 2,
      explain: '代码中 SemanticCorrectness 默认使用 BAAI/bge-large-zh 模型，针对中文语义相似度优化。英文场景可换为 all-MiniLM-L6-v2 或 intfloat/e5-large-v2。'
    },

    // ===== 多选题 (6) =====
    {
      type: 'multi',
      question: 'RAGAS 框架包含哪些评估指标？（多选）',
      options: [
        'Faithfulness',
        'Answer Relevancy',
        'Context Precision',
        'Context Recall',
        'Answer Correctness',
        'BERTScore'
      ],
      correct: [0,1,2,3,4],
      explain: 'RAGAS 全套 5 指标包括：Faithfulness、Answer Relevancy、Context Precision、Context Recall、Answer Correctness。BERTScore 是自定义补充指标，非 RAGAS 原生。'
    },
    {
      type: 'multi',
      question: '以下哪些是 Context Recall 的局限性？（多选）',
      options: [
        '需要预先知道「所有相关文档」的完整集合',
        '在无标注数据集上无法计算',
        '不关心返回顺序',
        '只关心检索准不准，不关心全不全',
        '提高 k 值通常提升 Recall 但降低 Precision',
        '无法用于多模态 RAG 系统'
      ],
      correct: [0,1,2,4],
      explain: 'Context Recall 的局限：(1) 需要预先知道所有相关文档；(2) 无标注数据集无法计算；(3) 不关心返回顺序；(4) 与 Precision 存在权衡（非其自身局限的表述）。D 描述的是 Precision 的特点，F 无依据。'
    },
    {
      type: 'multi',
      question: 'NLI 模型在 Faithfulness 检测中判断哪些逻辑关系？（多选）',
      options: [
        '蕴含（Entailment）',
        '矛盾（Contradiction）',
        '中性（Neutral）',
        '相似（Similarity）',
        '等价（Equivalence）',
        '推理（Inference）'
      ],
      correct: [0,1,2],
      explain: 'NLI 模型判断三分类关系：Entailment（上下文支持声明）、Contradiction（声明与上下文矛盾，即幻觉）、Neutral（无法验证，可能为参数记忆）。'
    },
    {
      type: 'multi',
      question: '以下哪些指标需要 ground truth（标准答案）才能计算？（多选）',
      options: [
        'Faithfulness',
        'Answer Relevancy',
        'Context Precision',
        'Context Recall',
        'Answer Correctness',
        'Semantic Sim'
      ],
      correct: [3,4,5],
      explain: '需要 ground truth 的指标：Context Recall（需预先知道所有相关文档）、Answer Correctness（需与标准答案对比）、Semantic Sim（需与参考答案计算相似度）。Faithfulness、Answer Relevancy、Context Precision 无需 ground truth。'
    },
    {
      type: 'multi',
      question: '实验中对比了哪些 RAG 系统变体？（多选）',
      options: [
        'Naive RAG',
        'Advanced RAG',
        'GraphRAG',
        'Multimodal RAG',
        'Agentic RAG',
        'Hybrid RAG'
      ],
      correct: [0,1,2,3,4],
      explain: '实验对比了 5 个 RAG 系统变体：Naive、Advanced、GraphRAG、Multimodal、Agentic。Hybrid RAG 未在实验设计列表中明确列出。'
    },
    {
      type: 'multi',
      question: '以下哪些是 Answer Relevancy 的局限性？（多选）',
      options: [
        '容易与 Correctness 混淆——回答可能非常相关但完全错误',
        '对开放式问题的判断主观性较强',
        '某些场景下「不直接回答」是合理策略（如安全拒绝）',
        '必须有 ground truth 才能计算',
        '无法检测上下文中的错误信息',
        '计算成本极低，无需 LLM 调用'
      ],
      correct: [0,1,2],
      explain: 'Answer Relevancy 的局限：(1) 容易与 Correctness 混淆；(2) 对开放式问题判断主观；(3) 安全拒绝等场景下不直接回答也是合理的。D 是 Answer Correctness 的特点，E 是 Faithfulness 的局限，F 与事实相反（RAGAS 指标均需 LLM 调用，成本高）。'
    },

    // ===== 判断题 (6) =====
    {
      type: 'tf',
      question: 'Faithfulness 指标可以检测检索文档本身是否存在错误信息。',
      answer: false,
      explain: '错误。Faithfulness 只判断「回答是否被上下文支持」，如果检索到的文档本身有错，Faithfulness 仍可能很高。它无法检测原始知识源的错误。'
    },
    {
      type: 'tf',
      question: 'Context Precision@k 只关心检索结果「准不准」，不关心「全不全」。',
      answer: true,
      explain: '正确。Context Precision 衡量 top-k 中相关文档的比例，只关心精确率。如果系统只返回 1 篇相关文档，Precision=1.0，但可能漏掉大量其他相关文档。'
    },
    {
      type: 'tf',
      question: 'Answer Relevancy 高意味着回答一定是正确的。',
      answer: false,
      explain: '错误。Answer Relevancy 只检测回答是否回应了问题，不检测事实正确性。回答可能非常相关但完全错误——这是它与 Correctness 的核心区别。'
    },
    {
      type: 'tf',
      question: 'RAGAS 的 evaluate() 函数默认使用 OpenAI GPT 模型进行判断。',
      answer: true,
      explain: '正确。RAGAS 的 evaluate() 默认调用 LLM（通常是 OpenAI GPT）对每个样本进行判断，需要提前设置 OPENAI_API_KEY 环境变量。'
    },
    {
      type: 'tf',
      question: 'Pearson 相关系数对单调非线性关系比 Spearman 更敏感。',
      answer: false,
      explain: '错误。Pearson 只对线性关系敏感，对单调非线性关系可能低估。Spearman 基于秩次，能捕捉单调（不必线性）关系，对异常值也更稳健。'
    },
    {
      type: 'tf',
      question: '自定义 FaithfulnessChecker 使用 CrossEncoder 的 NLI 模型，无需 OpenAI API 即可本地运行。',
      answer: true,
      explain: '正确。FaithfulnessChecker 基于 cross-encoder/nli-deberta-v3-base 本地运行，无需 LLM API，适合低成本快速检测幻觉。'
    },

    // ===== 拖拽填空 (4) =====
    {
      type: 'drag',
      question: '将正确的术语填入 RAGAS 评估框架的架构图中：',
      template: 'RAGAS 利用 {0} 作为评判者，通过 {1} 判断回答质量。其中 {2} 检测幻觉，{3} 检测离题回答。',
      blanks: [
        'LLM（大语言模型）',
        '特定 prompt 构造',
        'Faithfulness（忠实度）',
        'Answer Relevancy（回答相关性）'
      ],
      pool: [
        'LLM（大语言模型）',
        '特定 prompt 构造',
        'Faithfulness（忠实度）',
        'Answer Relevancy（回答相关性）',
        'BLEU 分数',
        '人工标注者'
      ],
      explain: 'RAGAS 的核心是利用 LLM 作为评判者，通过构造特定 prompt 让 LLM 判断回答质量。Faithfulness 检测幻觉（回答是否忠实于上下文），Answer Relevancy 检测离题（回答是否回应问题）。'
    },
    {
      type: 'drag',
      question: '将指标与其核心关注点匹配：',
      template: '{0} 关注检索精确率，{1} 关注检索召回率，{2} 关注回答与标准答案的一致性，{3} 关注回答是否被上下文支持。',
      blanks: [
        'Context Precision@k',
        'Context Recall',
        'Answer Correctness',
        'Faithfulness'
      ],
      pool: [
        'Context Precision@k',
        'Context Recall',
        'Answer Correctness',
        'Faithfulness',
        'Answer Relevancy',
        'Semantic Sim'
      ],
      explain: 'Context Precision@k 衡量检索精确率；Context Recall 衡量检索召回率；Answer Correctness 衡量回答与 ground truth 的一致性；Faithfulness 衡量回答是否被上下文支持（检测幻觉）。'
    },
    {
      type: 'drag',
      question: '将 NLI 逻辑关系与 Faithfulness 判断结果匹配：',
      template: '当上下文与声明的关系为 {0} 时，声明被支持；为 {1} 时，声明与上下文矛盾（幻觉）；为 {2} 时，声明无法验证（可能为参数记忆）。RAGAS 使用 {3} 将回答拆分为原子声明逐一验证。',
      blanks: [
        'Entailment（蕴含）',
        'Contradiction（矛盾）',
        'Neutral（中性）',
        'LLM'
      ],
      pool: [
        'Entailment（蕴含）',
        'Contradiction（矛盾）',
        'Neutral（中性）',
        'LLM',
        'BLEU',
        'ROUGE'
      ],
      explain: 'NLI 三分类：Entailment 表示声明被支持；Contradiction 表示声明与上下文矛盾（幻觉）；Neutral 表示无法验证。RAGAS 使用 LLM 将回答拆分为原子声明，逐一判断支持关系。'
    },
    {
      type: 'drag',
      question: '将代码中的类/函数与其功能匹配：',
      template: '{0} 将原始数据转换为 RAGAS 要求的 Dataset 格式；{1} 基于 NLI 模型检测 Faithfulness；{2} 基于 Embedding 计算语义相似度；{3} 计算自动化指标与人工评分的 Pearson 和 Spearman 相关性。',
      blanks: [
        'prepare_ragas_dataset()',
        'FaithfulnessChecker',
        'SemanticCorrectness',
        'compute_human_correlation()'
      ],
      pool: [
        'prepare_ragas_dataset()',
        'FaithfulnessChecker',
        'SemanticCorrectness',
        'compute_human_correlation()',
        'run_ragas_evaluation()',
        'CrossEncoder'
      ],
      explain: 'prepare_ragas_dataset() 构造 Dataset；FaithfulnessChecker 基于 NLI 检测忠实度；SemanticCorrectness 基于 Embedding 计算语义相似度；compute_human_correlation() 计算 Pearson 和 Spearman 相关性。'
    }
  ];

  let current = 0;
  const state = allQuestions.map(() => ({ answered: false, correct: false, userAnswer: null }));
  let filter = 'all';

  function init() {
    document.getElementById('totalVal').textContent = allQuestions.length;
    renderOverview();
    renderQuestion();
    updateProgress();
  }

  function updateProgress() {
    const answered = state.filter(s => s.answered).length;
    const correct = state.filter(s => s.correct).length;
    const total = allQuestions.length;
    const rate = answered ? Math.round(correct / answered * 100) : 0;
    document.getElementById('scoreVal').textContent = correct;
    document.getElementById('answeredVal').textContent = answered;
    document.getElementById('rateVal').textContent = rate + '%';
    document.getElementById('progressFill').style.width = (answered / total * 100) + '%';
    document.getElementById('progressText').textContent = (current + 1) + ' / ' + total;
  }

  function renderQuestion() {
    const q = allQuestions[current];
    const s = state[current];
    document.getElementById('qType').textContent = typeLabel(q.type);
    document.getElementById('qTitle').textContent = (current + 1) + '. ' + q.question;
    const body = document.getElementById('qBody');
    body.innerHTML = '';
    document.getElementById('explain').classList.remove('visible');
    document.getElementById('explain').textContent = '';

    if (q.type === 'single') {
      const opts = document.createElement('div');
      opts.className = 'options';
      q.options.forEach((opt, i) => {
        const row = document.createElement('label');
        row.className = 'option';
        row.dataset.index = i;
        row.innerHTML = `<input type="radio" name="q${current}" value="${i}"> <span>${String.fromCharCode(65+i)}. ${escapeHtml(opt)}</span>`;
        row.querySelector('input').addEventListener('change', () => { s.userAnswer = i; });
        opts.appendChild(row);
      });
      body.appendChild(opts);
    } else if (q.type === 'multi') {
      const opts = document.createElement('div');
      opts.className = 'options';
      q.options.forEach((opt, i) => {
        const row = document.createElement('label');
        row.className = 'option';
        row.dataset.index = i;
        row.innerHTML = `<input type="checkbox" name="q${current}" value="${i}"> <span>${String.fromCharCode(65+i)}. ${escapeHtml(opt)}</span>`;
        row.querySelector('input').addEventListener('change', () => {
          if (!Array.isArray(s.userAnswer)) s.userAnswer = [];
          const idx = s.userAnswer.indexOf(i);
          if (idx > -1) s.userAnswer.splice(idx, 1); else s.userAnswer.push(i);
          s.userAnswer.sort((a,b)=>a-b);
        });
        opts.appendChild(row);
      });
      body.appendChild(opts);
    } else if (q.type === 'tf') {
      const wrap = document.createElement('div');
      wrap.className = 'tf-options';
      const yesBtn = document.createElement('button');
      yesBtn.className = 'tf-btn';
      yesBtn.textContent = '是（正确）';
      yesBtn.onclick = () => { s.userAnswer = true; };
      const noBtn = document.createElement('button');
      noBtn.className = 'tf-btn';
      noBtn.textContent = '否（错误）';
      noBtn.onclick = () => { s.userAnswer = false; };
      wrap.appendChild(yesBtn);
      wrap.appendChild(noBtn);
      body.appendChild(wrap);
    } else if (q.type === 'drag') {
      const wrap = document.createElement('div');
      wrap.style.lineHeight = '2.2';
      let html = escapeHtml(q.template);
      q.blanks.forEach((_, i) => {
        html = html.replace('{'+i+'}', `<span class="drop-zone" data-index="${i}"></span>`);
      });
      wrap.innerHTML = html;
      const pool = document.createElement('div');
      pool.className = 'draggable-pool';
      q.pool.forEach((item, idx) => {
        const chip = document.createElement('span');
        chip.className = 'draggable';
        chip.draggable = true;
        chip.dataset.value = item;
        chip.textContent = item;
        chip.addEventListener('dragstart', dragStart);
        chip.addEventListener('dragend', dragEnd);
        pool.appendChild(chip);
      });
      body.appendChild(wrap);
      body.appendChild(pool);
      setupDropZones(wrap);
      if (!s.userAnswer) s.userAnswer = new Array(q.blanks.length).fill(null);
    }

    if (s.answered) {
      showFeedback();
      document.getElementById('checkBtn').disabled = true;
    } else {
      document.getElementById('checkBtn').disabled = false;
      if (q.type === 'single' && typeof s.userAnswer === 'number') {
        const inp = body.querySelector(`input[value="${s.userAnswer}"]`);
        if (inp) inp.checked = true;
      }
      if (q.type === 'multi' && Array.isArray(s.userAnswer)) {
        s.userAnswer.forEach(i => {
          const inp = body.querySelector(`input[value="${i}"]`);
          if (inp) inp.checked = true;
        });
      }
      if (q.type === 'tf' && typeof s.userAnswer === 'boolean') {
        const btns = body.querySelectorAll('.tf-btn');
        btns[s.userAnswer ? 0 : 1].classList.add('active');
      }
    }
  }

  function typeLabel(t) {
    return t==='single'?'单选题':t==='multi'?'多选题':t==='tf'?'判断题':'拖拽填空';
  }

  function checkAnswer() {
    const q = allQuestions[current];
    const s = state[current];
    let isCorrect = false;

    if (q.type === 'single') {
      if (typeof s.userAnswer !== 'number') { alert('请先选择一个答案'); return; }
      isCorrect = s.userAnswer === q.correct;
    } else if (q.type === 'multi') {
      if (!Array.isArray(s.userAnswer) || s.userAnswer.length === 0) { alert('请至少选择一个答案'); return; }
      isCorrect = arraysEqual(s.userAnswer, q.correct);
    } else if (q.type === 'tf') {
      if (typeof s.userAnswer !== 'boolean') { alert('请选择「是」或「否」'); return; }
      isCorrect = s.userAnswer === q.answer;
    } else if (q.type === 'drag') {
      if (!Array.isArray(s.userAnswer) || s.userAnswer.some(v => v === null)) { alert('请将所有术语填入对应位置'); return; }
      isCorrect = arraysEqual(s.userAnswer, q.blanks);
    }

    s.answered = true;
    s.correct = isCorrect;
    showFeedback();
    updateProgress();
    renderOverview();
    document.getElementById('checkBtn').disabled = true;

    if (state.every(st => st.answered)) {
      setTimeout(() => showResult(), 600);
    }
  }

  function showFeedback() {
    const q = allQuestions[current];
    const s = state[current];
    const body = document.getElementById('qBody');
    const explain = document.getElementById('explain');
    explain.textContent = q.explain;
    explain.classList.add('visible');

    if (q.type === 'single') {
      body.querySelectorAll('.option').forEach((row, i) => {
        row.classList.add('disabled');
        if (i === q.correct) row.classList.add('correct');
        else if (i === s.userAnswer && !s.correct) row.classList.add('wrong');
      });
    } else if (q.type === 'multi') {
      body.querySelectorAll('.option').forEach((row, i) => {
        row.classList.add('disabled');
        const isCorrect = q.correct.includes(i);
        const isSelected = s.userAnswer.includes(i);
        if (isCorrect) row.classList.add('correct');
        else if (isSelected && !isCorrect) row.classList.add('wrong');
      });
    } else if (q.type === 'tf') {
      const btns = body.querySelectorAll('.tf-btn');
      btns.forEach(b => b.classList.add('disabled'));
      const correctIdx = q.answer ? 0 : 1;
      const chosenIdx = s.userAnswer ? 0 : 1;
      btns[correctIdx].classList.add('correct');
      if (chosenIdx !== correctIdx) btns[chosenIdx].classList.add('wrong');
    } else if (q.type === 'drag') {
      body.querySelectorAll('.drop-zone').forEach((zone, i) => {
        const val = zone.textContent.trim();
        const correct = q.blanks[i];
        if (val === correct) zone.classList.add('correct-zone');
        else zone.classList.add('wrong-zone');
      });
      body.querySelectorAll('.draggable').forEach(d => d.draggable = false);
    }
  }

  function resetQuestion() {
    const s = state[current];
    s.answered = false; s.correct = false; s.userAnswer = null;
    renderQuestion();
    updateProgress();
    renderOverview();
  }

  function prevQuestion() {
    if (current > 0) { current--; renderQuestion(); updateProgress(); }
  }
  function nextQuestion() {
    if (current < allQuestions.length - 1) { current++; renderQuestion(); updateProgress(); }
  }

  function shuffleOptions() {
    const q = allQuestions[current];
    if (q.type !== 'single' && q.type !== 'multi') { alert('只有单选题和多选题支持洗牌'); return; }
    const body = document.getElementById('qBody');
    const opts = body.querySelector('.options');
    const rows = Array.from(opts.children);
    for (let i = rows.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      opts.insertBefore(rows[j], rows[i].nextSibling);
      [rows[i], rows[j]] = [rows[j], rows[i]];
    }
    // Clear selection after shuffle
    state[current].userAnswer = q.type === 'multi' ? [] : null;
    body.querySelectorAll('input').forEach(inp => inp.checked = false);
  }

  function renderOverview() {
    const ov = document.getElementById('overview');
    ov.innerHTML = '';
    allQuestions.forEach((q, i) => {
      const s = state[i];
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (s.answered) {
        thumb.classList.add(s.correct ? 'correct' : 'wrong');
      }
      thumb.innerHTML = `<div class="t-num">${i+1}</div><div class="t-type">${typeLabel(q.type)}</div>`;
      thumb.onclick = () => { current = i; toggleOverview(false); renderQuestion(); updateProgress(); };
      if (filter === 'correct' && (!s.answered || !s.correct)) return;
      if (filter === 'wrong' && (!s.answered || s.correct)) return;
      if (filter === 'unanswered' && s.answered) return;
      ov.appendChild(thumb);
    });
  }

  function toggleOverview(show) {
    const ov = document.getElementById('overview');
    const quiz = document.getElementById('quizArea');
    const fb = document.getElementById('filterBar');
    if (typeof show === 'boolean') {
      if (show) { ov.classList.add('visible'); quiz.classList.add('hidden'); fb.style.display = 'flex'; }
      else { ov.classList.remove('visible'); quiz.classList.remove('hidden'); fb.style.display = 'none'; }
    } else {
      if (ov.classList.contains('visible')) { ov.classList.remove('visible'); quiz.classList.remove('hidden'); fb.style.display = 'none'; }
      else { ov.classList.add('visible'); quiz.classList.add('hidden'); fb.style.display = 'flex'; }
    }
  }

  function filterOverview(f) {
    filter = f;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
    renderOverview();
  }

  function showResult() {
    const correct = state.filter(s => s.correct).length;
    document.getElementById('finalScore').textContent = correct;
    document.getElementById('resultArea').classList.add('visible');
    document.getElementById('quizArea').classList.add('hidden');
    document.getElementById('filterBar').style.display = 'none';
    document.getElementById('overview').classList.remove('visible');
  }

  function showResultDetails() {
    document.getElementById('resultArea').classList.remove('visible');
    document.getElementById('quizArea').classList.remove('hidden');
    current = 0; renderQuestion(); updateProgress();
  }

  function resetAll() {
    if (!confirm('确定要清空所有答题记录吗？')) return;
    state.forEach(s => { s.answered = false; s.correct = false; s.userAnswer = null; });
    current = 0;
    document.getElementById('resultArea').classList.remove('visible');
    document.getElementById('quizArea').classList.remove('hidden');
    toggleOverview(false);
    renderQuestion();
    updateProgress();
    renderOverview();
  }

  // Drag and Drop
  let draggedEl = null;
  function dragStart(e) { draggedEl = this; this.classList.add('dragging'); e.dataTransfer.setData('text/plain', this.dataset.value); }
  function dragEnd(e) { this.classList.remove('dragging'); draggedEl = null; }
  function setupDropZones(container) {
    container.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('hovered'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('hovered'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('hovered');
        const val = e.dataTransfer.getData('text/plain');
        zone.textContent = val;
        zone.classList.add('occupied');
        const idx = parseInt(zone.dataset.index);
        if (!Array.isArray(state[current].userAnswer)) state[current].userAnswer = new Array(allQuestions[current].blanks.length).fill(null);
        state[current].userAnswer[idx] = val;
      });
      zone.addEventListener('click', () => {
        if (zone.textContent.trim()) {
          zone.textContent = '';
          zone.classList.remove('occupied');
          const idx = parseInt(zone.dataset.index);
          if (Array.isArray(state[current].userAnswer)) state[current].userAnswer[idx] = null;
        }
      });
    });
  }

  function arraysEqual(a, b) {
    if (a.length !== b.length) return false;
    const sa = a.slice().sort(), sb = b.slice().sort();
    return sa.every((v, i) => v === sb[i]);
  }
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  init();
})();
</script>
</body>
</html>
