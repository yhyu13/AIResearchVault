<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05-多模态 RAG：图文检索实验 — 互动知识卡牌</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --accent: #059669;
    --accent-light: #d1fae5;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --warn: #d97706;
    --warn-light: #fef3c7;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --radius: 12px;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #fff; padding: 24px 16px; text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 1.35rem; }
  header .subtitle { opacity: 0.9; font-size: 0.9rem; }
  .container { max-width: 960px; margin: 0 auto; padding: 16px; }
  .toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .toolbar .left, .toolbar .right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    background: var(--primary); color: #fff; transition: transform 0.05s, opacity 0.2s;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: translateY(1px); }
  button.secondary { background: #fff; color: var(--primary); border: 1px solid var(--border); }
  button.accent { background: var(--accent); }
  button.danger { background: var(--danger); }
  .score-pill {
    background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px;
    font-weight: 600; font-size: 0.9rem;
  }
  .progress-bar { width: 100%; height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .progress-bar .fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
  .card {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 1.1rem; color: var(--primary); }
  .card .meta { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 12px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .option:hover { background: #f9fafb; }
  .option input { margin-top: 3px; }
  .option.correct { border-color: var(--accent); background: var(--accent-light); }
  .option.wrong { border-color: var(--danger); background: var(--danger-light); }
  .option.missed { border-color: var(--warn); background: var(--warn-light); }
  .drag-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .drag-chip {
    padding: 8px 12px; background: var(--primary-light); color: var(--primary); border-radius: 8px;
    cursor: grab; font-weight: 600; border: 1px dashed var(--primary); user-select: none;
  }
  .drop-zone {
    display: inline-block; min-width: 120px; min-height: 36px; border: 2px dashed var(--border);
    border-radius: 8px; padding: 6px 10px; vertical-align: middle; text-align: center; color: var(--text-secondary);
  }
  .drop-zone.filled { border-style: solid; border-color: var(--primary); color: var(--text); font-weight: 600; background: var(--primary-light); }
  .drop-zone.correct { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
  .drop-zone.wrong { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
  .tf-wrap { display: flex; gap: 12px; margin-top: 8px; }
  .tf-btn {
    flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; text-align: center; font-weight: 600;
  }
  .tf-btn.selected { border-color: var(--primary); background: var(--primary-light); }
  .tf-btn.correct { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
  .tf-btn.wrong { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
  .explanation {
    display: none; margin-top: 12px; padding: 12px; border-radius: 8px; background: #f0f9ff; border-left: 4px solid var(--primary);
  }
  .explanation.show { display: block; }
  .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .overview {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 50; justify-content: center; align-items: center; padding: 16px;
  }
  .overview.show { display: flex; }
  .overview .modal {
    background: #fff; border-radius: var(--radius); max-width: 720px; width: 100%; max-height: 80vh; overflow: auto; padding: 20px; box-shadow: var(--shadow);
  }
  .overview .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
  .thumb {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 0.85rem;
  }
  .thumb.correct { border-color: var(--accent); background: var(--accent-light); }
  .thumb.wrong { border-color: var(--danger); background: var(--danger-light); }
  .thumb.unanswered { border-color: var(--border); background: #f9fafb; }
  .thumb .type { font-size: 0.75rem; color: var(--text-secondary); }
  .result-screen {
    display: none; text-align: center; padding: 40px 20px;
  }
  .result-screen.show { display: block; }
  .big-score { font-size: 3rem; font-weight: 800; color: var(--primary); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters button { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .filters button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .left, .toolbar .right { justify-content: space-between; }
  }
</style>
</head>
<body>
<header>
  <h1>05-多模态 RAG：图文检索实验</h1>
  <div class="subtitle">互动知识卡牌 · 拖拽填空 · 单选 · 多选 · 判断</div>
</header>

<div class="container">
  <div class="toolbar">
    <div class="left">
      <button class="secondary" onclick="toggleOverview()">📋 总览面板</button>
      <button class="secondary" onclick="shuffleOptions()">🎲 重新洗牌选项</button>
    </div>
    <div class="right">
      <div class="score-pill">得分: <span id="scoreDisplay">0</span> / <span id="totalDisplay">0</span></div>
      <button class="danger" onclick="resetAll()">🔄 重置全部</button>
    </div>
  </div>

  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
  <div id="questionCounter" style="text-align:center;color:var(--text-secondary);margin-bottom:12px;font-size:0.9rem;">第 1 / 28 题</div>

  <div id="quizArea"></div>

  <div class="nav">
    <button class="secondary" onclick="prevQuestion()">⬅ 上一题</button>
    <button onclick="checkCurrent()">✅ 检查答案</button>
    <button class="secondary" onclick="nextQuestion()">下一题 ➡</button>
  </div>
</div>

<div class="overview" id="overviewPanel" onclick="if(event.target===this) toggleOverview()">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <h3 style="margin:0;">题目总览</h3>
      <button class="secondary" onclick="toggleOverview()">关闭</button>
    </div>
    <div class="filters">
      <button class="active" onclick="filterThumbs('all',this)">全部</button>
      <button onclick="filterThumbs('correct',this)">正确</button>
      <button onclick="filterThumbs('wrong',this)">错误</button>
      <button onclick="filterThumbs('unanswered',this)">未答</button>
    </div>
    <div class="grid" id="thumbGrid"></div>
  </div>
</div>

<div class="result-screen" id="resultScreen">
  <div class="big-score" id="finalScore">0</div>
  <div style="color:var(--text-secondary);margin-bottom:16px;">总分</div>
  <div class="legend">
    <span><span class="dot" style="background:var(--accent)"></span> 正确</span>
    <span><span class="dot" style="background:var(--danger)"></span> 错误</span>
    <span><span class="dot" style="background:var(--text-secondary)"></span> 未答</span>
  </div>
  <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;">
    <button onclick="showResult(false);jumpTo(0)">🔙 返回查看</button>
    <button class="accent" onclick="resetAll()">🔄 继续做题</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ============================
  // 数据：题目定义
  // ============================
  var allQuestions = [
    // ---- 拖拽填空 (5道) ----
    {
      type: 'drag',
      question: '请将正确的术语拖入架构描述中的空白处：\n\n在多模态 RAG 中，文本使用 [___] 编码（1024 维），图像使用 [___] 编码（512 维）。为了跨模态检索，查询文本需通过 [___] 与图像向量比较。向量存储使用 [___] 建立混合索引，距离度量经 [___] 后等价于 Cosine 相似度。',
      blanks: ['BGE-large-zh', 'CLIP ViT-B/16', 'CLIP 文本编码器', 'FAISS IndexFlatIP', 'L2 归一化'],
      pool: ['BGE-large-zh','CLIP ViT-B/16','CLIP 文本编码器','FAISS IndexFlatIP','L2 归一化','BLIP-2','GPT-4V','Chinese-CLIP'],
      explanation: '文本侧用 BGE-large-zh（1024维），图像侧用 CLIP ViT-B/16（512维）。跨模态检索时，查询文本必须用 CLIP 文本编码器，才能与 CLIP 图像向量在同一空间比较。向量库使用 FAISS IndexFlatIP，配合 L2 归一化后内积等价于 Cosine 相似度。'
    },
    {
      type: 'drag',
      question: '实验结果对比：\n\nText-only RAG 的图文查询准确率为 [___]，Multimodal RAG (CLIP) 的图文查询准确率为 [___]，Text + OCR RAG 的图像召回率为 [___]，Multimodal RAG + Caption 的图文查询准确率为 [___]。',
      blanks: ['0.32', '0.62', '0.40', '0.58'],
      pool: ['0.32','0.62','0.40','0.58','0.74','0.68','0.77','0.45'],
      explanation: '根据实验结果表：Text-only RAG 图文准确率 0.32；Multimodal RAG (CLIP) 图文准确率 0.62；Text + OCR RAG 图像召回率 0.40；Multimodal RAG + Caption 图文准确率 0.58。'
    },
    {
      type: 'drag',
      question: '配置矩阵匹配：\n\n「英文快速原型」场景推荐文本 Embedding 使用 [___]，图像 Embedding 使用 [___]，Caption 策略为 [___]，生成模型使用 [___]。',
      blanks: ['all-MiniLM-L6-v2', 'clip-vit-base-patch16', '关闭', 'GPT-4V'],
      pool: ['all-MiniLM-L6-v2','clip-vit-base-patch16','关闭','GPT-4V','BAAI/bge-large-zh','Chinese-CLIP','结构化描述','Qwen-VL-Chat'],
      explanation: '英文快速原型场景的配置为：文本 Embedding 用 all-MiniLM-L6-v2，图像 Embedding 用 clip-vit-base-patch16，Caption 关闭，生成模型用 GPT-4V。'
    },
    {
      type: 'drag',
      question: '评估指标定义匹配：\n\n[___] 衡量「查询的 top-k 结果中至少包含 1 个相关项」的比例；[___] 衡量「需要图像信息才能回答的问题中，模型回答正确的比例」；[___] 衡量「图文查询中相关图像被成功检索到的比例」；[___] 量化「多模态投入带来的实际收益」。',
      blanks: ['Top-k Accuracy', 'QA Accuracy', 'Image Recall', 'Baseline Delta'],
      pool: ['Top-k Accuracy','QA Accuracy','Image Recall','Baseline Delta','Cosine Similarity','Precision','BLEU','F1 Score'],
      explanation: 'Top-k Accuracy 关注前 k 个结果是否包含相关项；QA Accuracy 是端到端问答准确率；Image Recall 衡量视觉信息利用程度；Baseline Delta = Multimodal Accuracy - Text-only Accuracy，衡量多模态增益。'
    },
    {
      type: 'drag',
      question: '代码关键类/函数职责：\n\n[___] 负责分别编码文本和图像；[___] 基于 FAISS 管理混合索引；[___] 整合编码器和向量存储提供统一接口；[___] 方法使用 CLIP 文本编码器将查询文本映射到图像向量空间。',
      blanks: ['MultimodalEncoder', 'MultimodalVectorStore', 'MultimodalRAG', 'align_clip_text'],
      pool: ['MultimodalEncoder','MultimodalVectorStore','MultimodalRAG','align_clip_text','encode_text','encode_image','index_documents','query'],
      explanation: 'MultimodalEncoder 封装文本和图像编码；MultimodalVectorStore 封装 FAISS 索引；MultimodalRAG 是主流程类；align_clip_text 是专门用于跨模态检索的 CLIP 文本编码方法。'
    },

    // ---- 单选题 (10道) ----
    {
      type: 'single',
      question: '为什么文本查询检索图像时，必须使用 CLIP 的文本编码器（align_clip_text），而不能直接用 BGE 编码的查询向量？',
      options: [
        'A. BGE 编码的向量维度是 1024，CLIP 图像向量是 512，维度不同无法直接比较',
        'B. BGE 和 CLIP 的向量空间不同，只有同一空间的向量才能用 Cosine 相似度比较',
        'C. FAISS 只支持 CLIP 格式的向量输入',
        'D. BGE 的查询向量需要先经过 PCA 降维才能与图像向量比较'
      ],
      answer: 1,
      explanation: '正确答案是 B。核心原因是向量空间不一致：BGE 将文本映射到语义空间，CLIP 将图像映射到图文共享空间。只有同一空间的向量才能直接比较相似度。维度不同（A）是表象，但根本原因是空间不同；即使投影到同一维度，不同空间的语义对齐也无法保证。'
    },
    {
      type: 'single',
      question: '在 MultimodalVectorStore 中，为什么使用 IndexFlatIP 并配合 L2 归一化？',
      options: [
        'A. IndexFlatIP 是 FAISS 中唯一支持多模态向量的索引类型',
        'B. L2 归一化后，内积（Inner Product）等价于 Cosine 相似度，便于跨模态比较',
        'C. IndexFlatIP 的搜索速度比 IVF 和 HNSW 都快',
        'D. 只有 IndexFlatIP 支持动态添加和删除向量'
      ],
      answer: 1,
      explanation: '正确答案是 B。L2 归一化后，向量的模长为 1，此时内积等于 Cosine 相似度。IndexFlatIP 是精确搜索的暴力索引，配合归一化后可直接得到 Cosine 相似度分数，适合跨模态对齐后的向量比较。'
    },
    {
      type: 'single',
      question: '实验结果显示，Multimodal RAG + Caption 的图文查询准确率（0.58）反而低于纯 Multimodal RAG (CLIP)（0.62），主要原因是什么？',
      options: [
        'A. Caption 模型生成的描述太长，导致文本索引检索速度下降',
        'B. Caption 质量不稳定，错误描述会污染索引，引入噪声',
        'C. FAISS 不支持同时索引向量数据和文本 Caption 数据',
        'D. Caption 会覆盖原始图像向量，导致图像信息完全丢失'
      ],
      answer: 1,
      explanation: '正确答案是 B。Caption 是双刃剑：优点是可利用成熟文本 Embedding，缺点是 Caption 错误会直接污染索引。实验结果中 Caption 策略的准确率下降，正是因为 Caption 质量不稳定引入了噪声。'
    },
    {
      type: 'single',
      question: '在中文场景下，为什么推荐使用 Chinese-CLIP 而不是 OpenAI 的 CLIP？',
      options: [
        'A. Chinese-CLIP 的模型参数量比 OpenAI CLIP 更小，推理更快',
        'B. Chinese-CLIP 在中文图文对上训练，对中文查询的召回率显著更高',
        'C. OpenAI CLIP 的许可证不允许在中国使用',
        'D. Chinese-CLIP 支持更高的图像分辨率输入'
      ],
      answer: 1,
      explanation: '正确答案是 B。OpenAI CLIP 在 4 亿英文图文对上训练，对中文概念（如「图表」「截图」）的召回率会显著下降。Chinese-CLIP 在中文图文对上训练，中文适配更强。'
    },
    {
      type: 'single',
      question: '代码中 `index_documents` 方法为什么要将图像先 `Image.open(p).convert("RGB")`？',
      options: [
        'A. 将图像转换为 RGB 格式可以减小图像文件大小，节省内存',
        'B. CLIP 的图像编码器要求输入为 RGB 格式，透明通道（PNG）或灰度图需要转换',
        'C. convert("RGB") 是 PIL 的默认行为，不写也可以',
        'D. 只有 RGB 格式的图像才能被 FAISS 索引存储'
      ],
      answer: 1,
      explanation: '正确答案是 B。CLIPProcessor 期望 RGB 输入，PNG 的透明通道或灰度图如果不转换会导致预处理错误。convert("RGB") 确保所有图像格式统一。'
    },
    {
      type: 'single',
      question: '以下哪个指标专门衡量「视觉信息是否被有效利用」，是多模态 RAG 区别于纯文本 RAG 的核心指标？',
      options: [
        'A. Top-k Accuracy',
        'B. QA Accuracy',
        'C. Image Recall',
        'D. Baseline Delta'
      ],
      answer: 2,
      explanation: '正确答案是 C。Image Recall 衡量图文查询中相关图像被成功检索到的比例，直接反映视觉信息的利用程度。Top-k 和 QA Accuracy 在纯文本 RAG 中也能使用，Baseline Delta 是相对增益。'
    },
    {
      type: 'single',
      question: '生产环境中，为什么建议用 VLM 生成「结构化描述」（如 "图表显示 2024 年 Q1 营收增长 23%"）而不是纯 Caption？',
      options: [
        'A. 结构化描述更短，可以节省向量存储空间',
        'B. 结构化描述包含关键数值和事实，比开放式 Caption 更可控、更精确',
        'C. FAISS 对结构化文本的检索速度比自然语言描述快',
        'D. 结构化描述不需要 Embedding 模型编码，可直接存入索引'
      ],
      answer: 1,
      explanation: '正确答案是 B。纯 Caption 质量不稳定，可能生成模糊描述。结构化描述提取关键事实（数值、趋势、关系），作为文本索引更可控，减少噪声。'
    },
    {
      type: 'single',
      question: '在 `MultimodalEncoder.encode_text` 中，为什么使用 `mean pooling` 而不是直接取 `[CLS]` token？',
      options: [
        'A. BGE 系列模型的标准做法是 mean pooling，对所有 token 隐藏状态取平均得到句子向量',
        'B. `[CLS]` token 在 BGE 中没有被训练，表示无意义',
        'C. mean pooling 的计算速度比取 `[CLS]` 快 10 倍以上',
        'D. `[CLS]` token 的维度与图像向量不一致，无法存入同一索引'
      ],
      answer: 0,
      explanation: '正确答案是 A。BGE 系列模型使用 mean pooling 作为标准句子表示方法，对所有 token 的 last_hidden_state 取平均，获得更稳定的句子级向量。'
    },
    {
      type: 'single',
      question: 'CLIP 的对比学习训练目标中，温度系数 τ 的作用是什么？',
      options: [
        'A. τ 控制模型训练的批量大小，τ 越大批次越大',
        'B. τ 缩放相似度分数，影响分布的平滑程度，低 τ 使模型更关注 hardest negatives',
        'C. τ 是正则化系数，防止模型在训练集上过拟合',
        'D. τ 决定 CLIP 的图像编码器使用多少层 Transformer'
      ],
      answer: 1,
      explanation: '正确答案是 B。τ 是温度系数，缩放相似度分数。低 τ 使相似度分布更尖锐，模型更关注最难的负样本；高 τ 使分布更平滑。这是对比学习的标准技巧。'
    },
    {
      type: 'single',

  // ============================
  // 状态管理
  // ============================
  var state = {
    current: 0,
    answers: new Array(allQuestions.length).fill(null), // 用户答案
    checked: new Array(allQuestions.length).fill(false),  // 是否已检查
    shuffled: allQuestions.map(function(q){ return q.type==='single' || q.type==='multi' ? shuffleArray(q.options.slice()) : null; })
  };

  function shuffleArray(arr){
    var a = arr.slice(), i = a.length, j, t;
    while(i){
      j = Math.floor(Math.random()*i--);
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ============================
  // 渲染
  // ============================
  function render(){
    var area = document.getElementById('quizArea');
    var q = allQuestions[state.current];
    var html = '<div class="card">';
    html += '<div class="meta">' + typeLabel(q.type) + ' · 第 ' + (state.current+1) + ' / ' + allQuestions.length + ' 题</div>';
    html += '<h2>' + escapeHtml(q.question).replace(/\n/g,'<br>') + '</h2>';

    if(q.type === 'drag'){
      html += renderDrag(q, state.current);
    } else if(q.type === 'single'){
      html += renderSingle(q, state.current);
    } else if(q.type === 'multi'){
      html += renderMulti(q, state.current);
    } else if(q.type === 'tf'){
      html += renderTF(q, state.current);
    }

    html += '<div class="explanation ' + (state.checked[state.current] ? 'show' : '') + '" id="exp_' + state.current + '">' + escapeHtml(q.explanation) + '</div>';
    html += '</div>';
    area.innerHTML = html;

    updateProgress();
    updateScore();
    if(q.type === 'drag') initDrag(state.current);
  }

  function typeLabel(t){
    return t==='drag' ? '🎯 拖拽填空' : t==='single' ? '🔘 单选题' : t==='multi' ? '☑️ 多选题' : '⚖️ 判断题';
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---- 拖拽填空渲染 ----
  function renderDrag(q, idx){
    var ans = state.answers[idx] || new Array(q.blanks.length).fill(null);
    state.answers[idx] = ans;
    var text = q.question;
    for(var i=0;i<q.blanks.length;i++){
      var val = ans[i] ? ans[i] : '';
      var cls = state.checked[idx] ? (ans[i]===q.blanks[i] ? 'correct' : 'wrong') : (val ? 'filled' : '');
      text = text.replace('[___]', '<span class="drop-zone ' + cls + '" data-idx="'+i+'" ondrop="drop(event)" ondragover="allowDrop(event)" onclick="clearDrop(this)">' + (val || '拖入此处') + '</span>');
    }
    var poolHtml = '<div class="drag-pool">';
    var used = ans.filter(function(v){ return v; });
    q.pool.forEach(function(item){
      if(used.indexOf(item) === -1){
        poolHtml += '<span class="drag-chip" draggable="true" ondragstart="drag(event)" data-val="'+escapeHtml(item)+'">' + escapeHtml(item) + '</span>';
      }
    });
    poolHtml += '</div>';
    return poolHtml + '<div style="line-height:2.2;">' + text + '</div>';
  }

  function initDrag(idx){
    // drag handlers use global functions below
  }
  window.allowDrop = function(ev){ ev.preventDefault(); };
  window.drag = function(ev){ ev.dataTransfer.setData('text/plain', ev.target.getAttribute('data-val')); };
  window.drop = function(ev){
    ev.preventDefault();
    var val = ev.dataTransfer.getData('text/plain');
    var zone = ev.target.closest('.drop-zone');
    if(!zone) return;
    var bidx = parseInt(zone.getAttribute('data-idx'));
    var qidx = state.current;
    if(!state.answers[qidx]) state.answers[qidx] = new Array(allQuestions[qidx].blanks.length).fill(null);
    state.answers[qidx][bidx] = val;
    render();
  };
  window.clearDrop = function(zone){
    var bidx = parseInt(zone.getAttribute('data-idx'));
    var qidx = state.current;
    if(state.checked[qidx]) return; // 已检查不能修改
    state.answers[qidx][bidx] = null;
    render();
  };

  // ---- 单选渲染 ----
  function renderSingle(q, idx){
    var opts = state.shuffled[idx] || q.options;
    var ans = state.answers[idx];
    var html = '<div class="options">';
    opts.forEach(function(opt, i){
      var originalIndex = q.options.indexOf(opt);
      var cls = '';
      if(state.checked[idx]){
        if(originalIndex === q.answer) cls = 'correct';
        else if(ans === originalIndex) cls = 'wrong';
      } else if(ans === originalIndex) {
        cls = 'selected';
      }
      html += '<label class="option ' + cls + '" onclick="selectSingle('+idx+','+originalIndex+')">';
      html += '<input type="radio" name="q_'+idx+'" ' + (ans===originalIndex?'checked':'') + '>';
      html += '<span>' + escapeHtml(opt) + '</span></label>';
    });
    html += '</div>';
    return html;
  }
  window.selectSingle = function(idx, optIdx){
    if(state.checked[idx]) return;
    state.answers[idx] = optIdx;
    render();
  };

  // ---- 多选渲染 ----
  function renderMulti(q, idx){
    var opts = state.shuffled[idx] || q.options;
    var ans = state.answers[idx] || [];
    var html = '<div class="options">';
    opts.forEach(function(opt, i){
      var originalIndex = q.options.indexOf(opt);
      var cls = '';
      if(state.checked[idx]){
        if(q.answer.indexOf(originalIndex) !== -1) cls = 'correct';
        else if(ans.indexOf(originalIndex) !== -1) cls = 'wrong';
      } else if(ans.indexOf(originalIndex) !== -1) {
        cls = 'selected';
      }
      html += '<label class="option ' + cls + '" onclick="toggleMulti('+idx+','+originalIndex+')">';
      html += '<input type="checkbox" ' + (ans.indexOf(originalIndex)!==-1?'checked':'') + '>';
      html += '<span>' + escapeHtml(opt) + '</span></label>';
    });
    html += '</div>';
    return html;
  }
  window.toggleMulti = function(idx, optIdx){
    if(state.checked[idx]) return;
    var ans = state.answers[idx] || [];
    var pos = ans.indexOf(optIdx);
    if(pos === -1) ans.push(optIdx); else ans.splice(pos,1);
    state.answers[idx] = ans;
    render();
  };

  // ---- 判断题渲染 ----
  function renderTF(q, idx){
    var ans = state.answers[idx];
    var html = '<div class="tf-wrap">';
    var labels = ['是 / True', '否 / False'];
    [true, false].forEach(function(val, i){
      var cls = '';
      if(state.checked[idx]){
        if(val === q.answer) cls = 'correct';
        else if(ans === val) cls = 'wrong';
      } else if(ans === val) {
        cls = 'selected';
      }
      html += '<div class="tf-btn ' + cls + '" onclick="selectTF('+idx+','+(val?'true':'false')+')">' + labels[i] + '</div>';
    });
    html += '</div>';
    return html;
  }
  window.selectTF = function(idx, val){
    if(state.checked[idx]) return;
    state.answers[idx] = val;
    render();
  };

  // ============================
  // 检查答案
  // ============================
  window.checkCurrent = function(){
    var idx = state.current;
    var q = allQuestions[idx];
    var ans = state.answers[idx];
    var correct = false;
    if(q.type === 'drag'){
      if(!ans) { alert('请先完成填空'); return; }
      correct = ans.every(function(v,i){ return v === q.blanks[i]; });
      if(!correct && ans.some(function(v){ return !v; })) { alert('请先完成所有填空'); return; }
    } else if(q.type === 'single'){
      if(ans === null) { alert('请先选择一个选项'); return; }
      correct = ans === q.answer;
    } else if(q.type === 'multi'){
      if(!ans || ans.length === 0) { alert('请至少选择一个选项'); return; }
      correct = ans.length === q.answer.length && ans.every(function(v){ return q.answer.indexOf(v) !== -1; });
    } else if(q.type === 'tf'){
      if(ans === null) { alert('请先做出判断'); return; }
      correct = ans === q.answer;
    }
    state.checked[idx] = true;
    render();
    document.getElementById('exp_'+idx).classList.add('show');
    updateScore();
    buildThumbs();
  };

  // ============================
  // 导航
  // ============================
  window.nextQuestion = function(){
    if(state.current < allQuestions.length - 1){ state.current++; render(); }
    else { showResult(true); }
  };
  window.prevQuestion = function(){
    if(state.current > 0){ state.current--; render(); }
  };
  window.jumpTo = function(idx){
    state.current = idx;
    showResult(false);
    render();
  };

  function updateProgress(){
    var pct = ((state.current + 1) / allQuestions.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('questionCounter').textContent = '第 ' + (state.current+1) + ' / ' + allQuestions.length + ' 题';
  }

  function updateScore(){
    var total = allQuestions.length;
    var score = 0;
    for(var i=0;i<total;i++){
      if(!state.checked[i]) continue;
      var q = allQuestions[i];
      var ans = state.answers[i];
      if(q.type === 'drag'){
        if(ans && ans.every(function(v,idx){ return v===q.blanks[idx]; })) score++;
      } else if(q.type === 'single' || q.type === 'tf'){
        if(ans === q.answer) score++;
      } else if(q.type === 'multi'){
        if(ans && ans.length===q.answer.length && ans.every(function(v){ return q.answer.indexOf(v)!==-1; })) score++;
      }
    }
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('totalDisplay').textContent = total;
    document.getElementById('finalScore').textContent = score + ' / ' + total;
  }

  // ============================
  // 总览面板
  // ============================
  window.toggleOverview = function(){
    var panel = document.getElementById('overviewPanel');
    panel.classList.toggle('show');
    if(panel.classList.contains('show')) buildThumbs();
  };

  var currentFilter = 'all';
  window.filterThumbs = function(filter, btn){
    currentFilter = filter;
    var btns = btn.parentElement.querySelectorAll('button');
    btns.forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    buildThumbs();
  };

  function buildThumbs(){
    var grid = document.getElementById('thumbGrid');
    var html = '';
    for(var i=0;i<allQuestions.length;i++){
      var q = allQuestions[i];
      var status = 'unanswered';
      if(state.checked[i]){
        var correct = false;
        var ans = state.answers[i];
        if(q.type==='drag') correct = ans && ans.every(function(v,idx){ return v===q.blanks[idx]; });
        else if(q.type==='single' || q.type==='tf') correct = ans === q.answer;
        else if(q.type==='multi') correct = ans && ans.length===q.answer.length && ans.every(function(v){ return q.answer.indexOf(v)!==-1; });
        status = correct ? 'correct' : 'wrong';
      }
      if(currentFilter !== 'all' && currentFilter !== status) continue;
      var label = typeLabel(q.type).replace(/[^\u4e00-\u9fa5]/g,'');
      html += '<div class="thumb ' + status + '" onclick="jumpTo('+i+');toggleOverview();">';
      html += '<div class="type">' + label + '</div>';
      html += '<div>第 ' + (i+1) + ' 题</div></div>';
    }
    grid.innerHTML = html;
  }

  // ============================
  // 洗牌 & 重置
  // ============================
  window.shuffleOptions = function(){
    state.shuffled = allQuestions.map(function(q){ return q.type==='single' || q.type==='multi' ? shuffleArray(q.options.slice()) : null; });
    render();
  };

  window.resetAll = function(){
    state.current = 0;
    state.answers = new Array(allQuestions.length).fill(null);
    state.checked = new Array(allQuestions.length).fill(false);
    state.shuffled = allQuestions.map(function(q){ return q.type==='single' || q.type==='multi' ? shuffleArray(q.options.slice()) : null; });
    showResult(false);
    render();
    buildThumbs();
  };

  function showResult(show){
    var rs = document.getElementById('resultScreen');
    var qa = document.getElementById('quizArea');
    var nav = document.querySelector('.nav');
    var prog = document.querySelector('.progress-bar');
    var counter = document.getElementById('questionCounter');
    if(show){
      rs.classList.add('show');
      qa.classList.add('hidden');
      nav.classList.add('hidden');
      prog.classList.add('hidden');
      counter.classList.add('hidden');
    } else {
      rs.classList.remove('show');
      qa.classList.remove('hidden');
      nav.classList.remove('hidden');
      prog.classList.remove('hidden');
      counter.classList.remove('hidden');
    }
  }

  // ============================
  // 初始化
  // ============================
  render();
  buildThumbs();
})();
</script>
</body>
</html>
