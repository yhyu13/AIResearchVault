<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验 09 — Agent Harness 六组件架构验证实验</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --success: #4ade80;
    --danger: #f87171;
    --warn: #fbbf24;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  header { text-align: center; margin-bottom: 12px; }
  header h1 { margin: 0; font-size: 1.4rem; color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px;
  }
  button {
    background: var(--card-bg); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: .2s;
  }
  button:hover { border-color: var(--accent); }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; }
  .danger { border-color: var(--danger); color: var(--danger); }
  .score-bar {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px;
  }
  .score-pill {
    background: var(--card-bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
    font-size: 0.85rem; color: var(--muted);
  }
  .score-pill b { color: var(--accent); }
  .progress-text { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
  .progress-bar {
    width: 100%; max-width: 720px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 16px;
  }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width .3s; }
  .container { width: 100%; max-width: 720px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 10px; font-size: 1.05rem; color: var(--accent); }
  .question { font-size: 1rem; margin-bottom: 10px; line-height: 1.5; }
  .options label {
    display: block; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: .2s;
  }
  .options label:hover { border-color: var(--accent); }
  .options input { display: none; }
  .options label.selected { border-color: var(--accent); background: #1e293b; }
  .options label.correct { border-color: var(--success); background: rgba(74,222,128,.08); }
  .options label.wrong { border-color: var(--danger); background: rgba(248,113,113,.08); }
  .options label.disabled { pointer-events: none; opacity: .7; }
  .drop-zone {
    display: inline-block; min-width: 80px; height: 32px; line-height: 30px; border: 2px dashed var(--border); border-radius: 6px; text-align: center; vertical-align: middle; margin: 0 4px; padding: 0 8px; background: #0f172a; color: var(--muted); font-size: 0.9rem;
  }
  .drop-zone.filled { border-style: solid; border-color: var(--accent); color: var(--text); }
  .drop-zone.correct { border-color: var(--success); color: var(--success); }
  .drop-zone.wrong { border-color: var(--danger); color: var(--danger); }
  .draggable {
    display: inline-block; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; margin: 4px; cursor: grab; font-size: 0.9rem; user-select: none;
  }
  .draggable.dragging { opacity: .5; }
  .tf-options { display: flex; gap: 12px; }
  .tf-options label { flex: 1; text-align: center; }
  .nav { display: flex; justify-content: space-between; margin-top: 12px; }
  .explanation {
    margin-top: 10px; padding: 10px; background: #0f172a; border-radius: 8px; border-left: 3px solid var(--accent); font-size: 0.9rem; line-height: 1.5; color: var(--muted);
  }
  .explanation b { color: var(--text); }
  .hidden { display: none !important; }
  .dashboard-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.95); z-index: 50; display: none; flex-direction: column; padding: 16px; overflow-y: auto;
  }
  .dashboard-overlay.open { display: flex; }
  .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .dashboard-item {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 0.85rem;
  }
  .dashboard-item:hover { border-color: var(--accent); }
  .dashboard-item.correct { border-color: var(--success); }
  .dashboard-item.wrong { border-color: var(--danger); }
  .dashboard-item.unanswered { border-color: var(--warn); opacity: .8; }
  .result-page { text-align: center; padding: 24px; }
  .result-page h2 { color: var(--accent); }
  .big-score { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 12px 0; }
  .filters { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .filters button { font-size: 0.8rem; padding: 6px 10px; }
  .type-tag { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); margin-bottom: 6px; }
  @media (max-width: 480px) { header h1 { font-size: 1.1rem; } .big-score { font-size: 2.2rem; } }
</style>
</head>
<body>
<header>
  <h1>实验 09 — Agent Harness 六组件架构验证实验</h1>
  <p>自测卡牌 · 拖拽填空 / 单选 / 多选 / 判断</p>
</header>

<div class="toolbar">
  <button class="primary" onclick="openDashboard()">📊 题目总览</button>
  <button onclick="shuffleAll()">🎲 重新洗牌选项</button>
  <button class="danger" onclick="resetAll()">🔄 重置所有分数</button>
</div>

<div class="score-bar">
  <div class="score-pill">得分: <b id="score">0</b> / <b id="maxScore">0</b></div>
  <div class="score-pill">正确: <b id="correctCount">0</b></div>
  <div class="score-pill">错误: <b id="wrongCount">0</b></div>
  <div class="score-pill">未答: <b id="unansweredCount">0</b></div>
</div>

<div class="progress-text"><span id="currentNum">1</span> / <span id="totalNum">0</span></div>
<div class="progress-bar"><div id="progressFill"></div></div>

<div class="container" id="quizContainer"></div>

<div class="nav">
  <button onclick="prevQuestion()">⬅ 上一题</button>
  <button class="primary" onclick="checkCurrent()">检查答案</button>
  <button onclick="resetCurrent()">重置题目</button>
  <button onclick="nextQuestion()">下一题 ➡</button>
</div>

<div class="dashboard-overlay" id="dashboard">
  <div class="dashboard-header">
    <h2>📊 题目总览</h2>
    <button onclick="closeDashboard()">✕ 关闭</button>
  </div>
  <div class="filters">
    <button onclick="filterDashboard('all')">全部</button>
    <button onclick="filterDashboard('correct')">✅ 正确</button>
    <button onclick="filterDashboard('wrong')">❌ 错误</button>
    <button onclick="filterDashboard('unanswered')">⏳ 未答</button>
  </div>
  <div class="dashboard-grid" id="dashboardGrid"></div>
</div>

<div class="container hidden" id="resultPage">
  <div class="card result-page">
    <h2>🎉 测试完成</h2>
    <div class="big-score" id="finalScore">0</div>
    <p id="finalText"></p>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="primary" onclick="openDashboard()">📊 返回查看</button>
      <button onclick="continueQuiz()">📝 继续做题</button>
    </div>
  </div>
</div>

<script>
/* ===================== 题目数据 ===================== */

const dragQuestions = [
  {
    id: "d1", type: "drag", category: "架构",
    question: "Agent Harness 六组件架构 $H=(E, T, C, S, L, V)$ 中，请将正确术语拖入对应空白：\n\nE 代表 {0}，负责管理状态转移；\nT 代表 {1}，负责生成动作；\nS 代表 {2}，负责拦截违规动作。",
    blanks: 3,
    answer: ["Environment", "Tool/Agent", "Safety"],
    pool: ["Environment", "Tool/Agent", "Safety", "Context", "Logger", "Verifier", "Sandbox", "ReActAgent"],
    explanations: [
      "E (Environment) 是 2D 沙盒环境，管理状态转移和边界处理。",
      "T (Tool/Agent) 是代理策略，负责生成动作（如 heuristic 或 random）。",
      "S (Safety) 是安全沙箱，负责拦截违规动作并记录违规日志。"
    ]
  },
  {
    id: "d2", type: "drag", category: "评估",
    question: "综合得分 $V(s_T)$ 的四个核心评估维度中，请将术语拖入正确位置：\n\n衡量目标位置正确方块占比的是 {0}；\n衡量总方块数是否在允许范围内的是 {1}；\n衡量回合利用率的是 {2}；\n衡量是否满足任务库存要求的是 {3}。",
    blanks: 4,
    answer: ["structure_correctness", "block_count", "efficiency", "inventory_match"],
    pool: ["structure_correctness", "block_count", "efficiency", "inventory_match", "safety_violations", "overall_score", "pass_rate", "step_count"],
    explanations: [
      "structure_correctness 计算目标位置正确方块占比，是任务完成的核心指标。",
      "block_count 检查总方块数是否在 [min_blocks, max_blocks] 范围内，防止过度放置。",
      "efficiency = 1 - t/t_max，鼓励用更少步数完成任务。",
      "inventory_match 检查库存是否包含任务要求的全部材料，防止透支作弊。"
    ]
  },
  {
    id: "d3", type: "drag", category: "安全策略",
    question: "三种安全策略的对比中，请将策略名称拖入正确位置：\n\n{0} 策略禁止边界越界和库存透支，是默认生产环境配置；\n{1} 策略允许边界越界和库存透支，用于测试环境边界容错；\n{2} 策略增加禁止放置类型（STONE、WALL）并要求工具。",
    blanks: 3,
    answer: ["default_game_policy", "relaxed_policy", "strict_policy"],
    pool: ["default_game_policy", "relaxed_policy", "strict_policy", "heuristic_policy", "random_policy", "sandbox_policy", "harness_policy", "env_policy"],
    explanations: [
      "default_game_policy 是标准安全边界，禁止边界越界、库存透支、挖掘草地等。",
      "relaxed_policy 放宽限制，允许边界越界（环境会静默截断）和库存透支。",
      "strict_policy 增加禁止放置类型（STONE、WALL）并要求工具（如 pickaxe）。"
    ]
  }
];

const singleQuestions = [
  {
    id: "s1", type: "single", category: "架构",
    question: "Agent Harness 六组件架构 $H=(E, T, C, S, L, V)$ 中，哪个组件负责评估任务完成质量？",
    options: ["E (Environment)", "T (Tool/Agent)", "S (Safety)", "V (Verifier)"],
    correct: 3,
    explanations: [
      "❌ E 负责环境状态转移，不直接评估任务完成质量。",
      "❌ T 负责生成动作，是策略执行层。",
      "❌ S 负责安全拦截，评估的是动作合法性而非任务完成度。",
      "✅ V (Verifier) 负责计算 structure_correctness、efficiency 等多维度评估指标。"
    ]
  },
  {
    id: "s2", type: "single", category: "评估",
    question: "在 build_wall_2x2 任务中，结构正确性 $v_{struct}$ 的计算方式是什么？",
    options: ["正确方块数 / 环境中总方块数", "正确方块数 / 目标位置数", "使用步数 / 最大步数", "库存匹配数 / 总库存数"],
    correct: 1,
    explanations: [
      "❌ 结构正确性只关心目标位置是否正确，与环境中总方块数无关。",
      "✅ $v_{struct} = \\frac{1}{|P_{target}|} \\sum_{p \\in P_{target}} \\mathbb{1}\\{s(p)=target_type\\}$，即正确方块数除以目标位置数。",
      "❌ 这是 efficiency 的计算方式，不是结构正确性。",
      "❌ 这是 inventory_match 的概念，与结构正确性无关。"
    ]
  },
  {
    id: "s3", type: "single", category: "策略",
    question: "heuristic 策略与 random 策略的核心区别是什么？",
    options: ["heuristic 使用随机种子，random 不使用", "heuristic 基于目标坐标规则移动，random 均匀随机采样动作", "heuristic 只能用于建墙任务，random 可用于所有任务", "heuristic 不需要安全沙箱，random 需要"],
    correct: 1,
    explanations: [
      "❌ 两者都可以使用随机种子，heuristic 是确定性策略。",
      "✅ heuristic 计算到目标的最短路径（曼哈顿距离），random 从动作空间均匀采样。",
      "❌ heuristic 也可用于其他结构化任务（如 craft_planks）。",
      "❌ 两者都需要安全沙箱进行动作合法性校验。"
    ]
  },
  {
    id: "s4", type: "single", category: "安全策略",
    question: "在 strict_policy 中，放置 WALL 方块需要什么条件？",
    options: ["不需要任何额外条件", "需要 pickaxe 工具", "需要至少 5 个 PLANK 库存", "需要完成前置任务"],
    correct: 1,
    explanations: [
      "❌ strict_policy 增加了工具要求，不是无条件放置。",
      "✅ strict_policy 的 required_tools 中规定 BlockType.WALL 需要 pickaxe 工具。",
      "❌ 库存要求是 inventory_match 的评估维度，不是 strict_policy 的放置条件。",
      "❌ 实验中没有前置任务机制。"
    ]
  },
  {
    id: "s5", type: "single", category: "实验结果",
    question: "实验 3 中，heuristic 策略与 random 策略的得分差距大约是多少倍？",
    options: ["约 1-2 倍", "约 4-6 倍", "约 10-15 倍", "两者得分相近"],
    correct: 1,
    explanations: [
      "❌ 实际差距更大，heuristic 约 0.85，random 约 0.05-0.20。",
      "✅ 实验结论明确指出差距约 4-6 倍，说明 Agent 策略是任务成败的核心。",
      "❌ 差距没有达到 10-15 倍。",
      "❌ random 策略几乎无法完成建墙任务，得分差距显著。"
    ]
  },
  {
    id: "s6", type: "single", category: "架构",
    question: "SafetySandbox 的三层防御中，哪一层是环境自身的保护？",
    options: ["agent.act() 中的预检查", "harness.run() 中的二次检查", "env.step() 中的最终截断", "ContextManager 的历史过滤"],
    correct: 2,
    explanations: [
      "❌ 这是第一层防御，由 SafetySandbox 在 Agent 动作生成阶段执行。",
      "❌ 这是第二层防御，由 Harness 在运行阶段执行。",
      "✅ env.step() 是环境的最终截断，即使沙箱放宽，环境仍有自身保护（如 max(0, x-1)）。",
      "❌ ContextManager 负责上下文历史管理，与安全防御无关。"
    ]
  },
  {
    id: "s7", type: "single", category: "评估",
    question: "综合得分 $V(s_T)$ 的通过条件是什么？",
    options: ["$V \\geq 0.5$ 即可", "$V \\geq 0.75$ 且强制维度 $\\geq 0.8$", "$V \\geq 0.9$ 且所有维度满分", "只要结构正确性为 1.0 即可"],
    correct: 1,
    explanations: [
      "❌ 阈值是 0.75 不是 0.5。",
      "✅ 综合得分 $V \\geq 0.75$ 且强制维度（structure_correctness、inventory_match）$\\geq 0.8$ 才能通过。",
      "❌ 不需要所有维度满分，强制维度达到阈值即可。",
      "❌ 即使结构正确性为 1.0，若 inventory_match 不达标仍判定失败。"
    ]
  },
  {
    id: "s8", type: "single", category: "实验设计",
    question: "实验 3 中固定随机种子的目的是什么？",
    options: ["让 random 策略也能完成建墙任务", "确保动作序列可复现，便于对比", "减少安全违规次数", "增加 heuristic 策略的随机性"],
    correct: 1,
    explanations: [
      "❌ random 策略即使固定种子也无法完成建墙任务。",
      "✅ 固定种子确保每轮使用确定性的随机序列，使实验结果可复现。",
      "❌ 随机种子与安全违规次数无直接关系。",
      "❌ heuristic 是确定性策略，不受随机种子影响。"
    ]
  },
  {
    id: "s9", type: "single", category: "评估",
    question: "efficiency 指标 $v_{eff} = 1 - t/t_{max}$ 的主要局限性是什么？",
    options: ["无法衡量结构正确性", "与任务难度耦合，不宜跨任务比较", "只能用于 heuristic 策略", "计算结果总是 0 或 1"],
    correct: 1,
    explanations: [
      "❌ efficiency 确实不衡量结构正确性，但这不是其主要局限性。",
      "✅ 简单任务效率天然高，复杂任务效率天然低，因此不宜跨任务比较。",
      "❌ efficiency 适用于所有策略。",
      "❌ efficiency 是连续值，不是二值化指标。"
    ]
  },
  {
    id: "s10", type: "single", category: "安全策略",
    question: "relaxed_policy 允许边界越界，但环境如何处理越界动作？",
    options: ["直接崩溃抛出异常", "静默截断（如 max(0, x-1)）", "自动将 Agent 传送到边界内", "忽略动作不做任何处理"],
    correct: 1,
    explanations: [
      "❌ 环境不会崩溃，有自身的边界保护机制。",
      "✅ 环境 env.step() 会静默截断越界坐标，如使用 max(0, x-1) 等函数。",
      "❌ 环境不会传送 Agent，只是截断坐标值。",
      "❌ 环境会处理动作，只是将越界坐标修正到边界内。"
    ]
  }
];

const multiQuestions = [
  {
    id: "m1", type: "multi", category: "架构",
    question: "Agent Harness 六组件架构 $H=(E, T, C, S, L, V)$ 中，以下哪些组件属于该架构？（多选）",
    options: ["E (Environment)", "T (Tool/Agent)", "C (Context)", "S (Safety)", "L (Logger)", "V (Verifier)"],
    correct: [0, 1, 2, 3, 4, 5],
    explanations: [
      "✅ E 是 2D 沙盒环境，管理状态转移。",
      "✅ T 是代理策略，生成动作。",
      "✅ C 是上下文管理器，维护对话历史。",
      "✅ S 是安全沙箱，拦截违规动作。",
      "✅ L 是日志记录器，记录运行轨迹。",
      "✅ V 是验证器，评估任务完成质量。"
    ]
  },
  {
    id: "m2", type: "multi", category: "评估",
    question: "以下哪些是 structure_correctness 的局限性？（多选）",
    options: [
      "只关心位置对不对，不关心方块从哪来",
      "无法检测库存透支作弊",
      "是二值化指标，无法区分差一点和差很多",
      "与任务难度耦合",
      "需要大量计算资源",
      "不适用于随机策略"
    ],
    correct: [0, 1],
    explanations: [
      "✅ 结构正确性只检查位置是否正确，不检查方块来源是否合法。",
      "✅ 若 Agent 透支库存放置方块，结构正确性仍可能很高，但 inventory_match 会暴露问题。",
      "❌ 这是 block_count 的局限性，不是 structure_correctness 的。",

/* ===================== 状态管理 ===================== */

const allQuestions = [];
let currentIndex = 0;
let userAnswers = {};
let checked = {};
let shuffled = false;

function initAllQuestions() {
  allQuestions.length = 0;
  dragQuestions.forEach(q => allQuestions.push(q));
  singleQuestions.forEach(q => allQuestions.push(q));
  multiQuestions.forEach(q => allQuestions.push(q));
  trueFalseQuestions.forEach(q => allQuestions.push(q));
}

function getState(qid) {
  if (userAnswers[qid] === undefined) return "unanswered";
  if (checked[qid]) return checked[qid] === "correct" ? "correct" : "wrong";
  return "unanswered";
}

function computeScore() {
  let score = 0, maxScore = 0, correct = 0, wrong = 0, unanswered = 0;
  allQuestions.forEach(q => {
    const max = q.type === "drag" ? q.blanks : (q.type === "multi" ? q.correct.length : 1);
    maxScore += max;
    const state = getState(q.id);
    if (state === "correct") { score += max; correct++; }
    else if (state === "wrong") { wrong++; }
    else unanswered++;
  });
  document.getElementById("score").textContent = score;
  document.getElementById("maxScore").textContent = maxScore;
  document.getElementById("correctCount").textContent = correct;
  document.getElementById("wrongCount").textContent = wrong;
  document.getElementById("unansweredCount").textContent = unanswered;
  const pct = maxScore > 0 ? (score / maxScore * 100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
}

/* ===================== 渲染 ===================== */

function renderDrag(q) {
  let html = `<div class="card" id="card-${q.id}"><span class="type-tag">拖拽填空 · ${q.category}</span><div class="question">${q.question}</div>`;
  html += `<div class="pool" id="pool-${q.id}">`;
  q.pool.forEach((term, i) => {
    html += `<span class="draggable" draggable="true" data-term="${term}" id="drag-${q.id}-${i}">${term}</span>`;
  });
  html += `</div>`;
  html += `<div style="margin-top:10px;"><button class="primary" onclick="checkDrag('${q.id}')">检查答案</button> <button onclick="resetDrag('${q.id}')">重置</button></div>`;
  html += `<div class="explanation hidden" id="exp-${q.id}"></div></div>`;
  return html;
}

function renderSingle(q) {
  let html = `<div class="card" id="card-${q.id}"><span class="type-tag">单选题 · ${q.category}</span><div class="question">${q.question}</div><div class="options">`;
  q.options.forEach((opt, i) => {
    html += `<label id="opt-${q.id}-${i}" onclick="selectSingle('${q.id}', ${i})"><input type="radio" name="${q.id}" value="${i}"> ${opt}</label>`;
  });
  html += `</div>`;
  html += `<div style="margin-top:10px;"><button class="primary" onclick="checkSingle('${q.id}')">检查答案</button> <button onclick="resetSingle('${q.id}')">重置</button></div>`;
  html += `<div class="explanation hidden" id="exp-${q.id}"></div></div>`;
  return html;
}

function renderMulti(q) {
  let html = `<div class="card" id="card-${q.id}"><span class="type-tag">多选题 · ${q.category}</span><div class="question">${q.question}</div><div class="options">`;
  q.options.forEach((opt, i) => {
    html += `<label id="opt-${q.id}-${i}" onclick="toggleMulti('${q.id}', ${i})"><input type="checkbox" name="${q.id}" value="${i}"> ${opt}</label>`;
  });
  html += `</div>`;
  html += `<div style="margin-top:10px;"><button class="primary" onclick="checkMulti('${q.id}')">检查答案</button> <button onclick="resetMulti('${q.id}')">重置</button></div>`;
  html += `<div class="explanation hidden" id="exp-${q.id}"></div></div>`;
  return html;
}

function renderTF(q) {
  let html = `<div class="card" id="card-${q.id}"><span class="type-tag">判断题 · ${q.category}</span><div class="question">${q.question}</div><div class="options tf-options">`;
  ["是", "否"].forEach((opt, i) => {
    html += `<label id="opt-${q.id}-${i}" onclick="selectTF('${q.id}', ${i})"><input type="radio" name="${q.id}" value="${i}"> ${opt}</label>`;
  });
  html += `</div>`;
  html += `<div style="margin-top:10px;"><button class="primary" onclick="checkTF('${q.id}')">检查答案</button> <button onclick="resetTF('${q.id}')">重置</button></div>`;
  html += `<div class="explanation hidden" id="exp-${q.id}"></div></div>`;
  return html;
}

function renderCurrent() {
  const container = document.getElementById("quizContainer");
  const q = allQuestions[currentIndex];
  let html = "";
  if (q.type === "drag") html = renderDrag(q);
  else if (q.type === "single") html = renderSingle(q);
  else if (q.type === "multi") html = renderMulti(q);
  else if (q.type === "tf") html = renderTF(q);
  container.innerHTML = html;
  document.getElementById("currentNum").textContent = currentIndex + 1;
  document.getElementById("totalNum").textContent = allQuestions.length;
  setupDragListeners(q);
  restoreState(q);
}

function restoreState(q) {
  if (userAnswers[q.id] === undefined) return;
  if (q.type === "single") {
    const ans = userAnswers[q.id];
    document.querySelectorAll(`input[name="${q.id}"]`).forEach((el, i) => { if (i === ans) el.checked = true; });
    document.querySelectorAll(`#card-${q.id} .options label`).forEach((el, i) => { if (i === ans) el.classList.add("selected"); });
  } else if (q.type === "multi") {
    const ans = userAnswers[q.id] || [];
    document.querySelectorAll(`input[name="${q.id}"]`).forEach((el, i) => { if (ans.includes(i)) el.checked = true; });
    document.querySelectorAll(`#card-${q.id} .options label`).forEach((el, i) => { if (ans.includes(i)) el.classList.add("selected"); });
  } else if (q.type === "tf") {
    const ans = userAnswers[q.id];
    document.querySelectorAll(`input[name="${q.id}"]`).forEach((el, i) => { if (i === ans) el.checked = true; });
    document.querySelectorAll(`#card-${q.id} .options label`).forEach((el, i) => { if (i === ans) el.classList.add("selected"); });
  } else if (q.type === "drag") {
    const ans = userAnswers[q.id] || [];
    ans.forEach((term, idx) => {
      const zones = document.querySelectorAll(`#card-${q.id} .drop-zone`);
      if (zones[idx] && term) { zones[idx].textContent = term; zones[idx].classList.add("filled"); }
    });
  }
  if (checked[q.id]) showExplanation(q.id);
}

/* ===================== 交互逻辑 ===================== */

function selectSingle(qid, idx) {
  if (checked[qid]) return;
  userAnswers[qid] = idx;
  document.querySelectorAll(`#card-${qid} .options label`).forEach((el, i) => {
    el.classList.toggle("selected", i === idx);
  });
}

function toggleMulti(qid, idx) {
  if (checked[qid]) return;
  let arr = userAnswers[qid] || [];
  if (arr.includes(idx)) arr = arr.filter(i => i !== idx);
  else arr.push(idx);
  userAnswers[qid] = arr.sort((a, b) => a - b);
  document.querySelectorAll(`#card-${qid} .options label`).forEach((el, i) => {
    el.classList.toggle("selected", arr.includes(i));
  });
}

function selectTF(qid, idx) {
  if (checked[qid]) return;
  userAnswers[qid] = idx;
  document.querySelectorAll(`#card-${qid} .options label`).forEach((el, i) => {
    el.classList.toggle("selected", i === idx);
  });
}

/* ===================== 检查答案 ===================== */

function checkDrag(qid) {
  const q = allQuestions.find(x => x.id === qid);
  const zones = document.querySelectorAll(`#card-${qid} .drop-zone`);
  const ans = [];
  zones.forEach(z => ans.push(z.textContent.trim()));
  userAnswers[qid] = ans;
  let allCorrect = true;
  zones.forEach((z, i) => {
    const correct = q.answer[i];
    if (z.textContent.trim() === correct) { z.classList.add("correct"); }
    else { z.classList.add("wrong"); allCorrect = false; }
  });
  checked[qid] = allCorrect ? "correct" : "wrong";
  showExplanation(qid);
  computeScore();
}

function checkSingle(qid) {
  if (userAnswers[qid] === undefined) { alert("请先选择一个选项"); return; }
  const q = allQuestions.find(x => x.id === qid);
  const ans = userAnswers[qid];
  const correct = ans === q.correct;
  checked[qid] = correct ? "correct" : "wrong";
  document.querySelectorAll(`#card-${qid} .options label`).forEach((el, i) => {
    el.classList.add("disabled");
    if (i === q.correct) el.classList.add("correct");
    else if (i === ans && !correct) el.classList.add("wrong");
  });
  showExplanation(qid);
  computeScore();
}

function checkMulti(qid) {
  const arr = userAnswers[qid] || [];
  if (arr.length === 0) { alert("请至少选择一个选项"); return; }
  const q = allQuestions.find(x => x.id === qid);
  const correct = JSON.stringify(arr) === JSON.stringify(q.correct);
  checked[qid] = correct ? "correct" : "wrong";
  document.querySelectorAll(`#card-${qid} .options label`).forEach((el, i) => {
    el.classList.add("disabled");
    if (q.correct.includes(i)) el.classList.add("correct");
    else if (arr.includes(i)) el.classList.add("wrong");
  });
  showExplanation(qid);
  computeScore();
}

function checkTF(qid) {
  if (userAnswers[qid] === undefined) { alert("请先选择是或否"); return; }
  const q = allQuestions.find(x => x.id === qid);
  const ans = userAnswers[qid];
  const correct = (ans === 0) === q.correct; // 0=是, 1=否
  checked[qid] = correct ? "correct" : "wrong";
  document.querySelectorAll(`#card-${qid} .options label`).forEach((el, i) => {
    el.classList.add("disabled");
    const isCorrect = (i === 0) === q.correct;
    if (isCorrect) el.classList.add("correct");
    else if (i === ans) el.classList.add("wrong");
  });
  showExplanation(qid);
  computeScore();
}

function showExplanation(qid) {
  const q = allQuestions.find(x => x.id === qid);
  const expEl = document.getElementById(`exp-${qid}`);
  if (!expEl) return;
  let html = "";
  if (q.type === "drag") {
    html = `<b>解析：</b><br>` + q.explanations.map((e, i) => `空格 ${i+1}：${e}`).join("<br>");
  } else if (q.type === "single" || q.type === "multi") {
    html = `<b>解析：</b><br>` + q.explanations.map((e, i) => `${String.fromCharCode(65+i)}. ${e}`).join("<br>");
  } else if (q.type === "tf") {
    html = `<b>解析：</b><br>` + q.explanations.filter(e => e).map(e => e).join("<br>");
  }
  expEl.innerHTML = html;
  expEl.classList.remove("hidden");
}

function checkCurrent() {
  const q = allQuestions[currentIndex];
  if (q.type === "drag") checkDrag(q.id);
  else if (q.type === "single") checkSingle(q.id);
  else if (q.type === "multi") checkMulti(q.id);
  else if (q.type === "tf") checkTF(q.id);
}

/* ===================== 重置 ===================== */

function resetDrag(qid) {
  delete userAnswers[qid]; delete checked[qid];
  const zones = document.querySelectorAll(`#card-${qid} .drop-zone`);
  zones.forEach(z => { z.textContent = ""; z.classList.remove("filled", "correct", "wrong"); });
  document.getElementById(`exp-${qid}`).classList.add("hidden");
  computeScore();
}

function resetSingle(qid) {
  delete userAnswers[qid]; delete checked[qid];
  document.querySelectorAll(`#card-${qid} .options label`).forEach(el => {
    el.classList.remove("selected", "correct", "wrong", "disabled");
  });
  document.querySelectorAll(`input[name="${qid}"]`).forEach(el => el.checked = false);
  document.getElementById(`exp-${qid}`).classList.add("hidden");
  computeScore();
}

function resetMulti(qid) {
  delete userAnswers[qid]; delete checked[qid];
  document.querySelectorAll(`#card-${qid} .options label`).forEach(el => {
    el.classList.remove("selected", "correct", "wrong", "disabled");
  });
  document.querySelectorAll(`input[name="${qid}"]`).forEach(el => el.checked = false);
  document.getElementById(`exp-${qid}`).classList.add("hidden");
  computeScore();
}

function resetTF(qid) {
  delete userAnswers[qid]; delete checked[qid];
  document.querySelectorAll(`#card-${qid} .options label`).forEach(el => {
    el.classList.remove("selected", "correct", "wrong", "disabled");
  });
  document.querySelectorAll(`input[name="${qid}"]`).forEach(el => el.checked = false);
  document.getElementById(`exp-${qid}`).classList.add("hidden");
  computeScore();
}

function resetCurrent() {
  const q = allQuestions[currentIndex];
  if (q.type === "drag") resetDrag(q.id);
  else if (q.type === "single") resetSingle(q.id);
  else if (q.type === "multi") resetMulti(q.id);
  else if (q.type === "tf") resetTF(q.id);
}

function resetAll() {
  userAnswers = {}; checked = {};
  document.getElementById("resultPage").classList.add("hidden");
  document.querySelectorAll(".score-bar, .progress-text, .progress-bar, .nav").forEach(el => el.classList.remove("hidden"));
  renderCurrent();
  computeScore();
}

/* ===================== 导航 ===================== */

function prevQuestion() {
  if (currentIndex > 0) { currentIndex--; renderCurrent(); }
}

function nextQuestion() {
  if (currentIndex < allQuestions.length - 1) { currentIndex++; renderCurrent(); }
  else { showResult(); }
}

function showResult() {
  document.getElementById("quizContainer").innerHTML = "";
  document.querySelectorAll(".score-bar, .progress-text, .progress-bar, .nav").forEach(el => el.classList.add("hidden"));
  const resultPage = document.getElementById("resultPage");
  resultPage.classList.remove("hidden");
  const score = parseInt(document.getElementById("score").textContent);
  const max = parseInt(document.getElementById("maxScore").textContent);
  document.getElementById("finalScore").textContent = score + " / " + max;
  const pct = max > 0 ? (score / max * 100) : 0;
  let text = "";
  if (pct >= 90) text = "🌟 优秀！你对 Agent Harness 六组件架构理解非常深入！";
  else if (pct >= 75) text = "👍 良好！大部分核心概念已掌握，继续巩固细节。";
  else if (pct >= 50) text = "📚 及格！建议重新阅读实验文档，重点理解评估指标和安全策略。";
  else text = "💪 加油！建议先通读实验文档，再进行自测。";
  document.getElementById("finalText").textContent = text;
}

function continueQuiz() {
  document.getElementById("resultPage").classList.add("hidden");
  document.querySelectorAll(".score-bar, .progress-text, .progress-bar, .nav").forEach(el => el.classList.remove("hidden"));
  renderCurrent();
}

/* ===================== 拖拽 ===================== */

function setupDragListeners(q) {
  if (q.type !== "drag") return;
  const draggables = document.querySelectorAll(`#card-${q.id} .draggable`);
  const zones = document.querySelectorAll(`#card-${q.id} .drop-zone`);
  draggables.forEach(d => {
    d.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", d.dataset.term); d.classList.add("dragging"); });
    d.addEventListener("dragend", () => d.classList.remove("dragging"));
    d.addEventListener("click", () => {
      if (checked[q.id]) return;
      const emptyZone = Array.from(zones).find(z => !z.textContent.trim());
      if (emptyZone) { emptyZone.textContent = d.dataset.term; emptyZone.classList.add("filled"); }
    });
  });
  zones.forEach(z => {
    z.addEventListener("dragover", e => e.preventDefault());
    z.addEventListener("drop", e => {
      e.preventDefault();
      if (checked[q.id]) return;
      const term = e.dataTransfer.getData("text/plain");
      z.textContent = term; z.classList.add("filled");
    });
    z.addEventListener("click", () => {
      if (checked[q.id]) return;
      if (z.textContent.trim()) { z.textContent = ""; z.classList.remove("filled", "correct", "wrong"); }
    });
  });
}

/* ===================== 总览面板 ===================== */

function openDashboard() {
  renderDashboardGrid("all");
  document.getElementById("dashboard").classList.add("open");
}

function closeDashboard() {
  document.getElementById("dashboard").classList.remove("open");
}

function filterDashboard(filter) {
  renderDashboardGrid(filter);
}

function renderDashboardGrid(filter) {
  const grid = document.getElementById("dashboardGrid");
  grid.innerHTML = "";
  allQuestions.forEach((q, i) => {
    const state = getState(q.id);
    if (filter !== "all" && state !== filter) return;
    const div = document.createElement("div");
    div.className = "dashboard-item " + state;
    const typeLabel = q.type === "drag" ? "拖拽" : q.type === "single" ? "单选" : q.type === "multi" ? "多选" : "判断";
    div.innerHTML = `<div style="font-weight:700;margin-bottom:4px;">${i+1}</div><div style="color:var(--muted);font-size:.75rem;">${typeLabel} · ${q.category}</div>`;
    div.onclick = () => { currentIndex = i; closeDashboard(); renderCurrent(); };
    grid.appendChild(div);
  });
}

/* ===================== 洗牌 ===================== */

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function shuffleAll() {
  if (!confirm("重新洗牌将清空所有答题记录，是否继续？")) return;
  singleQuestions.forEach(q => {
    const pairs = q.options.map((opt, i) => ({ opt, expl: q.explanations[i] }));
    shuffleArray(pairs);
    q.options = pairs.map(p => p.opt);
    q.explanations = pairs.map(p => p.expl);
    q.correct = pairs.findIndex(p => p.expl.startsWith("✅"));
  });
  multiQuestions.forEach(q => {
    const pairs = q.options.map((opt, i) => ({ opt, expl: q.explanations[i], isCorrect: q.correct.includes(i) }));
    shuffleArray(pairs);
    q.options = pairs.map(p => p.opt);
    q.explanations = pairs.map(p => p.expl);
    q.correct = pairs.map((p, i) => p.isCorrect ? i : -1).filter(i => i !== -1);
  });
  trueFalseQuestions.forEach(q => {
    // 判断题只有是/否，不需要洗牌选项，但可以重置
  });
  userAnswers = {}; checked = {}; shuffled = true;
  currentIndex = 0;
  renderCurrent();
  computeScore();
}

/* ===================== 初始化 ===================== */

initAllQuestions();
renderCurrent();
computeScore();
