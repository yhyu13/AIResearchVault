<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08-长上下文 RAG：Chunking 策略实验面试知识自测</title>
  <style>
    :root {
      --bg-body: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-warm: #F5F0E8;
      --primary: #2D5F5F;
      --primary-light: #3D7A7A;
      --accent: #4A7C59;
      --accent-light: #E8F3E8;
      --text-main: #2C2C2C;
      --text-muted: #6B6B6B;
      --border: #D8D2C8;
      --shadow: rgba(0,0,0,0.06);
      --correct: #3A8C5D;
      --correct-bg: #EAF6EE;
      --wrong: #C44B4B;
      --wrong-bg: #FCEAEA;
      --warning: #C9943A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    header .topic {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .score-bar .score {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
    }

    .score-bar .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-sm { padding: 6px 10px; font-size: 0.78rem; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-light); }

    .btn-secondary {
      background: var(--bg-warm);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #EDE8DE; }

    .btn-warning {
      background: #FFF8E6;
      color: #8A6D1F;
      border: 1px solid #F0E0B0;
    }
    .btn-warning:hover { background: #FFF0CC; }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab {
      flex: 1;
      min-width: 80px;
      text-align: center;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .tab .badge {
      display: inline-block;
      margin-left: 4px;
      background: rgba(255,255,255,0.25);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 0.72rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 16px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: #EAE5DC;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 12px;
    }

    .progress-bar .fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 18px;
      line-height: 1.7;
    }

    .question-text .blank {
      display: inline-block;
      min-width: 80px;
      padding: 3px 10px;
      margin: 0 3px;
      border: 2px dashed var(--border);
      border-radius: 6px;
      background: var(--bg-warm);
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      vertical-align: middle;
      transition: all 0.2s ease;
    }

    .question-text .blank.filled {
      border-style: solid;
      border-color: var(--primary);
      background: #F0F7F7;
      color: var(--primary);
      font-weight: 600;
    }

    .question-text .blank.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
    }

    .question-text .blank.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .draggables {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .draggable {
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: grab;
      font-size: 0.9rem;
      user-select: none;
      transition: all 0.2s ease;
    }

    .draggable:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .draggable.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }

    .draggable.used {
      opacity: 0.4;
      pointer-events: none;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--bg-card);
    }

    .option:hover { border-color: var(--primary-light); background: #F7FBFB; }

    .option input[type="radio"],
    .option input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .option .label {
      flex: 1;
      font-size: 0.95rem;
    }

    .option.correct-ans {
      border-color: var(--correct);
      background: var(--correct-bg);
    }

    .option.wrong-ans {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }

    .option .mark {
      font-size: 1.1rem;
      font-weight: 700;
      margin-left: auto;
    }

    .explanation {
      display: none;
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .explanation.show { display: block; }

    .explanation.correct-ex {
      background: var(--correct-bg);
      color: #2A6B44;
      border: 1px solid #B8E0C8;
    }

    .explanation.wrong-ex {
      background: var(--wrong-bg);
      color: #8A3333;
      border: 1px solid #F0C0C0;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-bar .btn { flex: 1; }

    .overview-btn {
      text-align: center;
      margin-top: 12px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .overlay.show { display: flex; }

    .overlay-content {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .overlay-header h2 {
      font-size: 1.15rem;
      color: var(--primary);
    }

    .grid-overview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 8px;
    }

    .grid-item {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .grid-item:hover { transform: scale(1.05); }

    .grid-item.empty { background: var(--bg-body); color: var(--text-muted); }
    .grid-item.correct { background: var(--correct-bg); color: var(--correct); border-color: #A0D8B3; }
    .grid-item.wrong { background: var(--wrong-bg); color: var(--wrong); border-color: #E8A0A0; }

    .legend {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-empty { background: #D8D2C8; }
    .dot-correct { background: var(--correct); }
    .dot-wrong { background: var(--wrong); }

    @media (max-width: 520px) {
      .container { padding: 10px; }
      header h1 { font-size: 1.3rem; }
      .card { padding: 14px; }
      .tab { font-size: 0.8rem; padding: 8px 4px; }
      .question-text { font-size: 0.97rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>08-长上下文 RAG：Chunking 策略实验面试知识自测</h1>
      <div class="topic">experiment / RAG / long-context / chunking 请完成以下题目检验掌握程度</div>
    </header>

    <div class="score-bar">

    <div class="tabs" id="tabBar">

      <div id="questionArea"></div>

      <div id="explanationArea"></div>

      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">

      <div class="nav-bar" style="margin-top:16px;">
        <button class="btn btn-secondary" id="btnPrev">上一题</button>
        <button class="btn btn-secondary" id="btnNext">下一题</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overviewOverlay">
    <div class="overlay-content">
      <div class="overlay-header">
        <h2>题目总览</h2>
        <button class="btn btn-secondary btn-sm" id="btnCloseOverview">关闭</button>
      </div>
      <div class="grid-overview" id="overviewGrid"></div>
      <div class="legend">
        <span><span class="dot dot-empty"></span>未答</span>
        <span><span class="dot dot-correct"></span>正确</span>
        <span><span class="dot dot-wrong"></span>错误</span>
      </div>
    </div>
  </div>

  <script>
    // ===== DATA PLACEHOLDERS =====
    // DRAG_QUESTIONS_PLACEHOLDER_START
    const dragQuestions = [
  {
    "question": "语义分块的核心流程是：先按 {0} 切分文本，计算当前句子与当前 chunk 的 {1}，当该值低于阈值 θ 或 chunk 超过 max_chunk_size 时创建新 chunk。",
    "answers": [
      "句子",
      "平均嵌入余弦相似度"
    ],
    "options": [
      "句子",
      "段落",
      "平均嵌入余弦相似度",
      "Jaccard 相似度",
      "编辑距离",
      "TF-IDF 权重",
      "主题概率"
    ],
    "explanations": [
      "语义分块第一步使用正则 `(?<=[。！？.!?])\\s+` 将文本切分为句子。",
      "代码中通过 `np.mean(current_embs, axis=0)` 计算当前 chunk 的平均嵌入，再与当前句子计算 `cosine_similarity`。"
    ]
  },
  {
    "question": "在 `boundary_completeness` 评估函数中，理想情况是 chunk {0} 较高（内部一致性强），而 chunk {1} 较低（边界清晰）。归一化公式为 `(intra_mean - inter_mean + 1) / 2`。",
    "answers": [
      "内句子相似度",
      "间相邻句子相似度"
    ],
    "options": [
      "内句子相似度",
      "间相邻句子相似度",
      "大小方差",
      "数量均值",
      "主题覆盖率",
      "端到端准确率",
      "chunk 利用率"
    ],
    "explanations": [
      "`intra_sims` 表示 chunk 内部句子间的平均相似度，越高说明 chunk 内部语义越一致。",
      "`inter_sims` 表示相邻 chunk 边界处句子的相似度，越低说明边界切分越合理。"
    ]
  },
  {
    "question": "实验结论表明，{0} 分块在边界完整性上最优（0.88），是结构化文档的首选；而 {1} 分块是通用无结构文档的最佳选择（Recall@5 = 0.81）。",
    "answers": [
      "Markdown 结构感知",
      "Semantic (θ=0.85)"
    ],
    "options": [
      "Markdown 结构感知",
      "Semantic (θ=0.85)",
      "Recursive 512",
      "Fixed 1024",
      "Agentic",
      "BERTopic 主题",
      "Top2Vec 聚类"
    ],
    "explanations": [
      "Markdown 结构感知分块利用文档已有的标题层级切分，天然在语义边界处断开，边界完整性高达 0.88。",
      "Semantic (θ=0.85) 无需文档结构化标记，通过句子嵌入相似度聚类实现，Recall@5 达到 0.81，是无结构文档的最佳通用选择。"
    ]
  }
];
    // DRAG_QUESTIONS_PLACEHOLDER_END

    // SINGLE_QUESTIONS_PLACEHOLDER_START
    const singleQuestions = [
  {
    "question": "在 RecursiveCharacterTextSplitter 的实现中，`separators` 参数的默认优先级顺序是什么？",
    "options": [
      "[\"\\n\\n\", \"\\n\", \"。\", \"，\", \" \", \"\"]",
      "[\"\\n\", \" \"。\", \"，\", \"\\n\\n\", \"\"]",
      "[\" \"。\", \"，\", \"\\n\\n\", \"\\n\", \"\"]",
      "[\"\", \" \"。\", \"，\", \"\\n\", \"\\n\\n\"]"
    ],
    "correct": 0,
    "explanations": [
      "✅ 正确。代码中 `separators=[\"\\n\\n\", \"\\n\", \"。\", \"，\", \" \", \"\"]` 表示优先按段落切分，不可分时依次降级到句子、单词、字符。",
      "❌ 错误。该顺序将单词和空格置于段落之前，不符合递归字符切分\"从粗粒度到细粒度\"的设计原则。",
      "❌ 错误。此顺序完全打乱了语义层级，会导致大块内容被不合理地切分。",
      "❌ 错误。空字符串 `\"\"` 作为最后兜底，不应放在首位，否则一开始就按字符切分，失去递归意义。"
    ]
  },
  {
    "question": "实验结论中，哪种分块策略被认为是\"性价比最高的选择\"？",
    "options": [
      "Fixed Length",
      "Recursive",
      "Semantic (θ=0.85)",
      "Agentic"
    ],
    "correct": 1,
    "explanations": [
      "❌ 错误。Fixed Length 除非有极端性能约束，否则在任何场景下都不如 Recursive。",
      "✅ 正确。Recursive 实现简单、无需额外模型、边界完整性 0.71 接近 Semantic 的 0.82，是性价比最高的选择。",
      "❌ 错误。Semantic 分块效果虽好，但需要 SentenceTransformer 编码，计算成本高于 Recursive。",
      "❌ 错误。Agentic 分块虽然质量好（边界完整性 0.85），但需要调用 LLM 接口，成本最高。"
    ]
  },
  {
    "question": "在语义分块的实现代码中，当 `sim < threshold` 或 `len(\"\".join(current_chunk)) > max_chunk_size` 时会发生什么？",
    "options": [
      "将当前句子追加到 current_chunk 并继续",
      "仅打印警告日志，不做切分",
      "将 current_chunk 保存为新 chunk，并用当前句子开启新 chunk",
      "直接返回所有已收集的 chunks，终止处理"
    ],
    "correct": 2,
    "explanations": [
      "❌ 错误。`sim < threshold` 时相似度不足，不应继续合并；这是 `else` 分支的行为（`sim >= threshold` 且未超大小限制）。",
      "❌ 错误。代码中没有打印警告的逻辑，条件触发即执行切分。",
      "✅ 正确。代码逻辑为：`chunks.append(\"\".join(current_chunk))`，然后 `current_chunk = [sentences[i]]` 开启新 chunk。",
      "❌ 错误。`return` 只在 `sentences <= 1` 时触发，此处仅完成当前 chunk 的切分，循环继续处理后续句子。"
    ]
  },
  {
    "question": "关于 Fixed Length 分块的实验结论，以下哪项描述最准确？",
    "options": [
      "Fixed Length 在端到端 Recall@5 上优于所有其他策略",
      "Fixed 1024 由于块最大，因此边界完整性最高",
      "Fixed Length 适用于需要跨段落信息的查询",
      "除非有极端性能约束，否则 Recursive 在任何场景下都优于 Fixed Length"
    ],
    "correct": 3,
    "explanations": [
      "❌ 错误。Fixed Length 的 Recall@5 最高仅 0.72（Fixed 512），远低于 Markdown Headers 的 0.83。",
      "❌ 错误。Fixed 1024 的边界完整性仅 0.58，块越大反而越容易在语义中间切断，边界完整性越低。",
      "❌ 错误。Fixed Length 常切断语义边界，对于跨段落查询反而可能丢失上下文连贯性。",
      "✅ 正确。实验结论第 4 条明确指出：\"Fixed Length 不推荐，除非有极端性能约束，否则 Recursive 在任何场景下都优于它。\""
    ]
  }
];
    // SINGLE_QUESTIONS_PLACEHOLDER_END

    // MULTI_QUESTIONS_PLACEHOLDER_START
    const multiQuestions = [
  {
    "question": "以下哪些是实验中对比评估的分块策略？（多选）",
    "options": [
      "Fixed Length",
      "Recursive",
      "Semantic",
      "Markdown Headers",
      "Agentic",
      "BM25 检索"
    ],
    "correct": [

      1,

      3,
      4
    ],
    "explanations": [
      "✅ 正确。Fixed Length 使用 CharacterTextSplitter，是实验基线之一。",
      "✅ 正确。Recursive 使用 RecursiveCharacterTextSplitter，是性价比最高的选择。",
      "✅ 正确。Semantic 基于句子嵌入相似度聚类，是无结构文档的最佳通用选择。",
      "✅ 正确。Markdown Headers 按标题层级切分，边界完整性最优。",
      "✅ 正确。Agentic 使用 LLM 判断边界，成本高但质量好。",
      "❌ 错误。BM25 是一种稀疏检索算法，不是分块策略。"

  },
  {
    "question": "以下哪些指标被用于评估分块策略的质量？（多选）",
    "options": [
      "Context Precision@k",
      "Context Recall",
      "边界完整性",
      "端到端问答准确率",
      "Chunk 利用率",
      "BLEU Score"
    ],
    "correct": [
      0,

    ],
    "explanations": [
      "✅ 正确。Context Precision@k 衡量检索到的 chunk 中相关 chunk 的比例。",
      "✅ 正确。Context Recall 衡量所有相关 chunk 被召回的比例。",
      "✅ 正确。边界完整性评估分块是否在语义边界处切断。",
      "✅ 正确。端到端问答准确率衡量分块策略对最终生成效果的影响。",
      "✅ 正确。Chunk 利用率衡量检索到的 chunk 中被实际用于生成的比例。",
      "❌ 错误。BLEU Score 是机器翻译/文本生成评估指标，本实验未使用。"
    ]
  },
  {
    "question": "以下关于语义分块（Semantic Chunking）实现细节的描述，哪些是正确的？（多选）",
    "options": [
      "使用正则 `(?<=[。！？.!?])\\s+` 将文本切分为句子",
      "计算当前句子与当前 chunk 的平均嵌入余弦相似度",
      "阈值 θ 越大，产生的 chunk 数量越少",
      "当 chunk 大小超过 max_chunk_size 时强制切分",
      "使用 BERTopic 检测主题边界作为切分依据",
      "使用 SentenceTransformer 对句子进行编码"
    ],
    "correct": [
      0,
      1,
      3,
      5
    ],
    "explanations": [
      "✅ 正确。代码中使用 `re.split(r'(?<=[。！？.!?])\\s+', text)` 切分句子。",
      "✅ 正确。通过 `np.mean(current_embs, axis=0)` 求平均嵌入后计算 `cosine_similarity`。",
      "❌ 错误。θ 越大表示要求相似度越高才能合并，因此 chunk 数量反而越多（更细粒度）。",
      "✅ 正确。代码中 `len(\"\".join(current_chunk)) > max_chunk_size` 触发强制切分。",
      "❌ 错误。BERTopic 是主题分块（Topic Chunking）的方法，不是语义分块的实现。",
      "✅ 正确。代码中使用 `SentenceTransformer(\"BAAI/bge-small-zh\")` 编码句子。"
    ]
  }
];
    // MULTI_QUESTIONS_PLACEHOLDER_END

    // TRUEFALSE_QUESTIONS_PLACEHOLDER_START
    const trueFalseQuestions = [
  {
    "question": "Semantic (θ=0.85) 的边界完整性得分 0.82 是实验中所有分块策略中最高的。",
    "correct": false,
    "explanationTrue": "该陈述为 True 时不成立，因为 Markdown Headers 的边界完整性为 0.88，高于 Semantic 的 0.82。",
    "explanationFalse": "❌ 错误。虽然 Semantic (θ=0.85) 的边界完整性 0.82 表现优秀，但 Markdown 结构感知分块以 0.88 的成绩更高，因此它并非最高。"
  },
  {
    "question": "Chunk overlap 建议设置为 10-15%，过小会导致上下文丢失，过大会增加冗余信息。",
    "correct": true,
    "explanationTrue": "✅ 正确。实验结论第 5 条明确指出：\"Chunk overlap 建议 10-15%：过小丢失上下文，过大增加冗余。\"",
    "explanationFalse": "该陈述为 False 时不成立。overlap 设置确实需要在保留上下文和避免冗余之间取得平衡。"
  },
  {
    "question": "Agentic 分块使用 LLM 判断段落边界，是实验中实现成本最低的分块策略。",
    "correct": false,
    "explanationTrue": "该陈述为 True 时不成立。Agentic 分块需要调用 LLM 接口（如 gpt-4o-mini），每次切分都产生 API 调用成本，是成本最高的策略。",
    "explanationFalse": "❌ 错误。Agentic 分块虽然质量好（边界完整性 0.85），但需要调用 LLM 接口进行推理，是实验中成本最高的策略。Recursive 才是性价比最高的选择。"
  },
  {
    "question": "在 `boundary_completeness` 函数中，若 `intra_sims` 较高且 `inter_sims` 较低，则归一化后的边界完整性得分会接近 1.0。",
    "correct": true,
    "explanationTrue": "✅ 正确。归一化公式为 `(intra_mean - inter_mean + 1) / 2`。当 intra_mean → 1 且 inter_mean → 0 时，得分 → (1 - 0 + 1) / 2 = 1.0，表示分块边界非常清晰。",
    "explanationFalse": "该陈述为 False 时不成立。根据归一化公式，intra 高、inter 低确实会使得分趋近于 1.0。"
  }
];
    // TRUEFALSE_QUESTIONS_PLACEHOLDER_END

    // ===== STATE =====
    let currentType = 'drag';
    let currentIndex = 0;
    let userAnswers = {};
    let checkedState = {};

    // ===== HELPERS =====
    function makeKey(type, index) {
      return type + ':' + index;
    }

    function getQuestions(type) {
      if (type === 'drag') return dragQuestions;
      if (type === 'single') return singleQuestions;
      if (type === 'multi') return multiQuestions;
      return trueFalseQuestions;
    }

    function getBadgeId(type) {
      if (type === 'drag') return 'badgeDrag';
      if (type === 'single') return 'badgeSingle';
      if (type === 'multi') return 'badgeMulti';
      return 'badgeTrueFalse';
    }

    function countQuestions(type) {
      return getQuestions(type).length;
    }

    function allTypes() {
      return ['drag', 'single', 'multi', 'truefalse'];
    }

    // ===== RENDER =====
    function initBadges() {
      allTypes().forEach(function(t) {
        document.getElementById(getBadgeId(t)).textContent = countQuestions(t);
      });
    }

    function updateScore() {
      let total = 0, scored = 0;
      allTypes().forEach(function(type) {
        const list = getQuestions(type);
        for (let i = 0; i < list.length; i++) {
          const q = list[i];
          const key = makeKey(type, i);
          if (checkedState[key]) {
            total += getQuestionPoints(q, type);
            scored += getUserPoints(q, type, i);
          }
        }
      });
      document.getElementById('scoreDisplay').textContent = '得分: ' + scored + ' / ' + total;
    }

    function getQuestionPoints(q, type) {
      if (type === 'drag') return q.answers.length;
      if (type === 'multi') return q.correct.length;
      return 1;
    }

    function getUserPoints(q, type, idx) {
      const key = makeKey(type, idx);
      const ans = userAnswers[key];
      if (!ans) return 0;
      if (type === 'drag') {
        let pts = 0;
        for (let i = 0; i < q.answers.length; i++) {
          if (ans[i] === q.answers[i]) pts++;
        }
        return pts;
      }
      if (type === 'single') {
        return ans === q.correct ? 1 : 0;
      }
      if (type === 'multi') {
        let pts = 0;
        const correctSet = {};
        for (let i = 0; i < q.correct.length; i++) correctSet[q.correct[i]] = true;
        const userSet = {};
        for (let i = 0; i < ans.length; i++) userSet[ans[i]] = true;
        for (let k in correctSet) {
          if (userSet[k]) pts++;
        }
        return pts;
      }
      return ans === q.correct ? 1 : 0;
    }

    function updateProgress() {
      const total = countQuestions(currentType);
      const text = total > 0 ? (currentIndex + 1) + ' / ' + total : '0 / 0';
      document.getElementById('progressText').textContent = text;
      const pct = total > 0 ? ((currentIndex + 1) / total * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderQuestion() {
      const area = document.getElementById('questionArea');
      const expl = document.getElementById('explanationArea');
      area.innerHTML = '';
      expl.innerHTML = '';
      expl.style.display = 'none';
      updateProgress();

      const questions = getQuestions(currentType);
      if (questions.length === 0) {
        area.innerHTML = '<p style="text-align:center;color:var(--text-muted)">该题型暂无题目</p>';
        return;
      }
      const q = questions[currentIndex];
      const key = makeKey(currentType, currentIndex);

      const qtext = document.createElement('div');
      qtext.className = 'question-text';

      if (currentType === 'drag') {
        let html = q.question;
        for (let i = 0; i < q.answers.length; i++) {
          const filled = userAnswers[key] && userAnswers[key][i] ? userAnswers[key][i] : '';
          let cls = 'blank';
          if (checkedState[key]) {
            if (filled === q.answers[i]) cls += ' correct';
            else cls += ' wrong';
          } else if (filled) {
            cls += ' filled';
          }
          html = html.replace('{\/' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
          html = html.replace('{\*' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
          html = html.replace('{' + i + '}', '<span class="' + cls + '" data-blank="' + i + '">' + (filled || '____') + '</span>');
        }
        qtext.innerHTML = html;
        area.appendChild(qtext);

        const pool = document.createElement('div');
        pool.className = 'draggables';
        const used = userAnswers[key] || [];
        for (let i = 0; i < q.options.length; i++) {
          const opt = q.options[i];
          const isUsed = used.indexOf(opt) !== -1;
          const chip = document.createElement('div');
          chip.className = 'draggable' + (isUsed ? ' used' : '');
          chip.draggable = !isUsed;
          chip.textContent = opt;
          chip.dataset.value = opt;
          if (!isUsed) setupDrag(chip);
          pool.appendChild(chip);
        }
        area.appendChild(pool);

        if (checkedState[key]) {
          const box = document.createElement('div');
          box.className = 'explanation show correct-ex';
          let exHtml = '<strong>解析：</strong><ul style="margin:8px 0 0 18px">';
          for (let i = 0; i < q.explanations.length; i++) {
            const isOk = userAnswers[key] && userAnswers[key][i] === q.answers[i];
            exHtml += '<li><span style="color:' + (isOk ? 'var(--correct)' : 'var(--wrong)') + '">' + (isOk ? '✅' : '❌') + '</span> 空' + (i+1) + '：' + q.explanations[i] + '</li>';
          }
          exHtml += '</ul>';
          box.innerHTML = exHtml;
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'single') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        for (let i = 0; i < q.options.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const isSel = userAnswers[key] === i;
          if (checkedState[key]) {
            if (i === q.correct) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'singleOpt';
          radio.checked = isSel;
          radio.disabled = !!checkedState[key];
          radio.addEventListener('change', function() {
            userAnswers[key] = i;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = q.options[i];
          opt.appendChild(radio);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = i === q.correct ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          box.className = 'explanation show ' + (userAnswers[key] === q.correct ? 'correct-ex' : 'wrong-ex');
          box.innerHTML = '<strong>解析：</strong><br>' + q.explanations[q.correct];
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'multi') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        const selSet = {};
        const ans = userAnswers[key] || [];
        for (let i = 0; i < ans.length; i++) selSet[ans[i]] = true;
        const correctSet = {};
        for (let i = 0; i < q.correct.length; i++) correctSet[q.correct[i]] = true;
        for (let i = 0; i < q.options.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const isSel = !!selSet[i];
          if (checkedState[key]) {
            if (correctSet[i]) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = isSel;
          cb.disabled = !!checkedState[key];
          cb.addEventListener('change', function() {
            const a = userAnswers[key] || [];
            const pos = a.indexOf(i);
            if (pos >= 0) a.splice(pos, 1);
            else a.push(i);
            userAnswers[key] = a;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = q.options[i];
          opt.appendChild(cb);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = correctSet[i] ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          let ok = true;
          for (let k in correctSet) { if (!selSet[k]) ok = false; }
          for (let k in selSet) { if (!correctSet[k]) ok = false; }
          box.className = 'explanation show ' + (ok ? 'correct-ex' : 'wrong-ex');
          let exHtml = '<strong>解析：</strong><ul style="margin:8px 0 0 18px">';
          for (let i = 0; i < q.options.length; i++) {
            const isCorrect = !!correctSet[i];
            const icon = isCorrect ? '✅' : (selSet[i] ? '❌' : '⬜');
            exHtml += '<li>' + icon + ' ' + q.explanations[i] + '</li>';
          }
          exHtml += '</ul>';
          box.innerHTML = exHtml;
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      } else if (currentType === 'truefalse') {
        qtext.textContent = q.question;
        area.appendChild(qtext);
        const list = document.createElement('div');
        list.className = 'options-list';
        const opts = [{val: true, label: '是 / True'}, {val: false, label: '否 / False'}];
        for (let i = 0; i < opts.length; i++) {
          const opt = document.createElement('label');
          opt.className = 'option';
          const v = opts[i].val;
          const isSel = userAnswers[key] === v;
          if (checkedState[key]) {
            if (v === q.correct) opt.classList.add('correct-ans');
            else if (isSel) opt.classList.add('wrong-ans');
          }
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'tfOpt';
          radio.checked = isSel;
          radio.disabled = !!checkedState[key];
          radio.addEventListener('change', function() {
            userAnswers[key] = v;
          });
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = opts[i].label;
          opt.appendChild(radio);
          opt.appendChild(span);
          if (checkedState[key]) {
            const mark = document.createElement('span');
            mark.className = 'mark';
            mark.textContent = v === q.correct ? '✅' : (isSel ? '❌' : '');
            opt.appendChild(mark);
          }
          list.appendChild(opt);
        }
        area.appendChild(list);
        if (checkedState[key]) {
          const box = document.createElement('div');
          const ok = userAnswers[key] === q.correct;
          box.className = 'explanation show ' + (ok ? 'correct-ex' : 'wrong-ex');
          box.innerHTML = '<strong>解析：</strong><br>' + (q.correct ? q.explanationTrue : q.explanationFalse);
          expl.appendChild(box);
          expl.style.display = 'block';
        }
      }
    }

    // ===== DRAG & DROP =====
    function setupDrag(el) {
      el.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', el.dataset.value);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', function() {
        el.classList.remove('dragging');
      });
    }

    document.addEventListener('dragover', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (blank) e.preventDefault();
    });

    document.addEventListener('drop', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (!blank) return;
      e.preventDefault();
      const value = e.dataTransfer.getData('text/plain');
      if (!value) return;
      const bidx = parseInt(blank.dataset.blank, 10);
      const key = makeKey(currentType, currentIndex);
      if (!userAnswers[key]) userAnswers[key] = [];
      userAnswers[key][bidx] = value;
      renderQuestion();
    });

    // Also support click-to-fill on mobile
    document.addEventListener('click', function(e) {
      const blank = e.target.closest && e.target.closest('[data-blank]');
      if (!blank) return;
      if (checkedState[makeKey(currentType, currentIndex)]) return;
      const key = makeKey(currentType, currentIndex);
      const ans = userAnswers[key] || [];
      const bidx = parseInt(blank.dataset.blank, 10);
      if (ans[bidx]) {
        delete ans[bidx];
        renderQuestion();
        return;
      }
      // Find first unused draggable
      const chips = document.querySelectorAll('.draggable:not(.used)');
      if (chips.length > 0) {
        const val = chips[0].dataset.value;
        if (!userAnswers[key]) userAnswers[key] = [];
        userAnswers[key][bidx] = val;
        renderQuestion();
      }
    });

    // ===== CONTROLS =====
    function switchTab(type) {
      currentType = type;
      currentIndex = 0;
      document.querySelectorAll('.tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.type === type);
      });
      renderQuestion();
    }

    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        switchTab(tab.dataset.type);
      });
    });

    document.getElementById('btnPrev').addEventListener('click', function() {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    });

    document.getElementById('btnNext').addEventListener('click', function() {
      if (currentIndex + 1 < countQuestions(currentType)) { currentIndex++; renderQuestion(); }
    });

    document.getElementById('btnCheck').addEventListener('click', function() {
      const key = makeKey(currentType, currentIndex);
      if (countQuestions(currentType) === 0) return;
      checkedState[key] = true;
      updateScore();
      renderQuestion();
    });

    document.getElementById('btnResetCurrent').addEventListener('click', function() {
      const key = makeKey(currentType, currentIndex);
      delete userAnswers[key];
      delete checkedState[key];
      updateScore();
      renderQuestion();
    });

    document.getElementById('btnResetAll').addEventListener('click', function() {
      if (!confirm('确定要重置所有答题记录吗？')) return;
      userAnswers = {};
      checkedState = {};
      updateScore();
      renderQuestion();
    });

    // ===== SHUFFLE =====
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
    }

    function buildIndexMap(oldLen, shuffledIndices) {
      const map = {};
      for (let newPos = 0; newPos < oldLen; newPos++) {
        map[shuffledIndices[newPos]] = newPos;
      }
      return map;
    }

    document.getElementById('btnShuffle').addEventListener('click', function() {
      if (!confirm('随机化会清空所有答题记录，确定继续？')) return;
      userAnswers = {};
      checkedState = {};

      // Single
      for (let qi = 0; qi < singleQuestions.length; qi++) {
        const q = singleQuestions[qi];
        const order = [];
        for (let i = 0; i < q.options.length; i++) order.push(i);
        shuffleArray(order);
        const newOpts = [];
        for (let i = 0; i < order.length; i++) newOpts.push(q.options[order[i]]);
        const newExps = [];
        for (let i = 0; i < order.length; i++) newExps.push(q.explanations[order[i]]);
        const idxMap = buildIndexMap(q.options.length, order);
        q.correct = idxMap[q.correct];
        q.options = newOpts;
        q.explanations = newExps;
      }

      // Multi
      for (let qi = 0; qi < multiQuestions.length; qi++) {
        const q = multiQuestions[qi];
        const order = [];
        for (let i = 0; i < q.options.length; i++) order.push(i);
        shuffleArray(order);
        const newOpts = [];
        for (let i = 0; i < order.length; i++) newOpts.push(q.options[order[i]]);
        const newExps = [];
        for (let i = 0; i < order.length; i++) newExps.push(q.explanations[order[i]]);
        const idxMap = buildIndexMap(q.options.length, order);
        const newCorrect = [];
        for (let i = 0; i < q.correct.length; i++) newCorrect.push(idxMap[q.correct[i]]);
        q.correct = newCorrect;
        q.options = newOpts;
        q.explanations = newExps;
      }

      updateScore();
      renderQuestion();
    });

    // ===== OVERVIEW =====
    function openOverview() {
      const grid = document.getElementById('overviewGrid');
      grid.innerHTML = '';
      const questions = getQuestions(currentType);
      for (let i = 0; i < questions.length; i++) {
        const cell = document.createElement('div');
        const key = makeKey(currentType, i);
        let cls = 'grid-item';
        if (checkedState[key]) {
          const pts = getUserPoints(questions[i], currentType, i);
          const maxPts = getQuestionPoints(questions[i], currentType);
          cls += pts === maxPts ? ' correct' : ' wrong';
        } else {
          cls += ' empty';
        }
        cell.className = cls;
        cell.textContent = i + 1;
        cell.addEventListener('click', function() {
          currentIndex = i;
          document.getElementById('overviewOverlay').classList.remove('show');
          renderQuestion();
        });
        grid.appendChild(cell);
      }
      document.getElementById('overviewOverlay').classList.add('show');
    }

    document.getElementById('btnOverview').addEventListener('click', openOverview);
    document.getElementById('btnCloseOverview').addEventListener('click', function() {
      document.getElementById('overviewOverlay').classList.remove('show');
    });
    document.getElementById('overviewOverlay').addEventListener('click', function(e) {
      if (e.target === document.getElementById('overviewOverlay')) {
        document.getElementById('overviewOverlay').classList.remove('show');
      }
    });

    // ===== KEYBOARD NAV =====
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') document.getElementById('btnPrev').click();
      if (e.key === 'ArrowRight') document.getElementById('btnNext').click();
    });

    // ===== INIT =====
    initBadges();
    updateScore();
    renderQuestion();
  </script>
</body>
</html>
