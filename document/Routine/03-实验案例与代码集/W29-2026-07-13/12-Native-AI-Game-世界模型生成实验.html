<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验 12：Native AI Game — 世界模型生成实验</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --success: #27ae60;
            --warning: #f39c12;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #e1e8ed;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #34495e 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-hover);
        }

        header h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        header .subtitle {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        /* Score Panel */
        .score-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--secondary);
        }

        .progress-bar {
            flex: 1;
            min-width: 200px;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin: 0 16px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--success));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--text-light);
            min-width: 80px;
            text-align: right;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-danger {
            background: var(--accent);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .question-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .type-single { background: #e3f2fd; color: #1565c0; }
        .type-multi { background: #fff3e0; color: #e65100; }
        .type-judge { background: #e8f5e9; color: #2e7d32; }
        .type-drag { background: #f3e5f5; color: #7b1fa2; }

        .question-number {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .option-item:hover {
            border-color: var(--secondary);
            background: #f8f9fa;
        }

        .option-item.selected {
            border-color: var(--secondary);
            background: #e3f2fd;
        }

        .option-item.correct {
            border-color: var(--success);
            background: #e8f5e9;
        }

        .option-item.incorrect {
            border-color: var(--accent);
            background: #ffebee;
        }

        .option-item input {
            margin-right: 12px;
            cursor: pointer;
        }

        .option-label {
            font-weight: 500;
            margin-right: 8px;
            min-width: 24px;
        }

        /* Drag and Drop */
        .drag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .drag-words {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed var(--border);
            min-height: 60px;
        }

        .drag-word {
            padding: 8px 16px;
            background: var(--secondary);
            color: white;
            border-radius: 6px;
            cursor: grab;
            font-weight: 500;
            user-select: none;
            transition: transform 0.2s;
        }

        .drag-word:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .drag-word.dragging {
            opacity: 0.5;
        }

        .drag-blank {
            display: inline-block;
            min-width: 120px;
            height: 36px;
            border: 2px dashed var(--secondary);
            border-radius: 6px;
            margin: 0 4px;
            vertical-align: middle;
            background: #e3f2fd;
            text-align: center;
            line-height: 32px;
            font-weight: 500;
            color: var(--secondary);
        }

        .drag-blank.filled {
            background: var(--secondary);
            color: white;
            border-style: solid;
        }

        .drag-blank.correct {
            background: var(--success);
            border-color: var(--success);
        }

        .drag-blank.incorrect {
            background: var(--accent);
            border-color: var(--accent);
        }

        .drag-sentence {
            font-size: 1.05rem;
            line-height: 2.2;
            padding: 16px;
            background: #fafafa;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        /* Explanation */
        .explanation {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid var(--secondary);
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--secondary);
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .nav-group {
            display: flex;
            gap: 10px;
        }

        /* Overview Panel */
        .overview-panel {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .overview-panel.active {
            display: block;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            margin-top: 16px;
        }

        .overview-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .overview-item:hover {
            transform: scale(1.1);
        }

        .overview-item.unanswered {
            background: var(--border);
            color: var(--text-light);
        }

        .overview-item.correct {
            background: #e8f5e9;
            color: var(--success);
            border-color: var(--success);
        }

        .overview-item.incorrect {
            background: #ffebee;
            color: var(--accent);
            border-color: var(--accent);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        /* Result Panel */
        .result-panel {
            display: none;
            text-align: center;
            padding: 40px 24px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .result-panel.active {
            display: block;
        }

        .result-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--secondary);
            margin: 20px 0;
        }

        .result-message {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 24px 0;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .stat-item {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            header h1 {
                font-size: 1.2rem;
            }

            .score-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .progress-bar {
                margin: 8px 0;
            }

            .question-card {
                padding: 16px;
            }

            .nav-buttons {
                flex-direction: column;
                gap: 12px;
            }

            .nav-group {
                width: 100%;
                justify-content: center;
            }

            .result-stats {
                grid-template-columns: 1fr;
            }
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        .show {
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>实验 12：Native AI Game — 世界模型生成实验</h1>
            <p class="subtitle">程序化生成 + 世界模型 + 交互模拟 · 知识卡牌</p>
        </header>

        <!-- Score Panel -->
        <div class="score-panel" id="scorePanel">
            <div class="score-display">得分: <span id="scoreValue">0</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text"><span id="currentQ">0</span> / <span id="totalQ">0</span></div>
            <div class="nav-group">
                <button class="btn btn-outline" onclick="showOverview()">📋 总览</button>
                <button class="btn btn-warning" onclick="shuffleOptions()">🎲 重新洗牌</button>
                <button class="btn btn-danger" onclick="resetAll()">🔄 重置全部</button>
            </div>
        </div>

        <!-- Questions Container -->
        <div id="questionsContainer"></div>

        <!-- Overview Panel -->
        <div class="overview-panel" id="overviewPanel">
            <h2>题目总览</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterOverview('all')">全部</button>
                <button class="filter-btn" onclick="filterOverview('unanswered')">未答</button>
                <button class="filter-btn" onclick="filterOverview('correct')">正确</button>
                <button class="filter-btn" onclick="filterOverview('incorrect')">错误</button>
            </div>
            <div class="overview-grid" id="overviewGrid"></div>
            <div class="nav-buttons" style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="hideOverview()">返回做题</button>
            </div>
        </div>

        <!-- Result Panel -->
        <div class="result-panel" id="resultPanel">
            <h2>🎉 答题完成！</h2>
            <div class="result-score" id="finalScore">0</div>
            <div class="result-message" id="resultMessage"></div>
            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-value" id="statCorrect">0</div>
                    <div class="stat-label">正确</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statIncorrect">0</div>
                    <div class="stat-label">错误</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statUnanswered">0</div>
                    <div class="stat-label">未答</div>
                </div>
            </div>
            <div class="nav-group" style="justify-content: center; margin-top: 24px;">
                <button class="btn btn-outline" onclick="hideResult()">返回查看</button>
                <button class="btn btn-primary" onclick="resetAll()">继续做题</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 题目数据 ====================
        var allQuestions = [
            // ===== 拖拽填空题 (4道) =====
            {
                id: 1,
                type: "drag",
                question: "世界模型 M 将当前状态 s_t 和动作 a_t 映射到下一状态：s_{t+1} = ______",
                blanks: ["M(s_t, a_t)"],
                options: ["M(s_t, a_t)", "s_t + a_t", "fBm(s_t)", "hash(s_t, a_t)", "noise(s_t)", "terrain(s_t)"],
                explanation: "世界模型的核心定义是 M(s_t, a_t)，即根据当前状态和动作预测下一状态。这是 Genie 世界模型的基本形式。"
            },
            {
                id: 2,
                type: "drag",
                question: "程序化生成地形使用 ______ 叠加多个频率的噪声，公式为 h(x,y) = Σ (1/2^i) · noise(2^i x, 2^i y)",
                blanks: ["fBm（分形布朗运动）"],
                options: ["fBm（分形布朗运动）", "Perlin 噪声", "CNN", "RNN", "GAN", "VAE"],
                explanation: "fBm（Fractional Brownian Motion）通过叠加多八度噪声产生自相似的分形地形，是程序化生成的核心数学工具。"
            },
            {
                id: 3,
                type: "drag",
                question: "在 ProceduralWorldGenerator 中，______ 函数用于替代标准 Perlin 噪声，实现零外部依赖的平滑噪声",
                blanks: ["_smooth_noise"],
                options: ["_smooth_noise", "_fbm", "generate_terrain", "_hash", "predict_move", "is_valid_position"],
                explanation: "_smooth_noise 使用双线性插值对哈希值进行平滑，替代了标准 Perlin 噪声，确保代码零外部依赖。"
            },
            {
                id: 4,
                type: "drag",
                question: "建筑生成遵循聚落规则：新建筑必须 ______ 已有建筑，形成自然的聚落分布",
                blanks: ["邻接"],
                options: ["邻接", "远离", "重叠", "覆盖", "平行于", "垂直于"],
                explanation: "predict_build() 检查 3×3 邻域是否有已有建筑，只有邻接时才允许建造，模拟真实聚落形成。"
            },

            // ===== 单选题 (10道) =====
            {
                id: 5,
                type: "single",
                question: "Native AI Game 中，程序化生成路径（Infinigen 思路）的核心特征是什么？",
                options: [
                    "使用神经网络从数据中学习生成",
                    "使用算法和规则系统生成内容，具有确定性生成逻辑",
                    "依赖大规模训练数据集",
                    "使用 LLM 生成叙事内容"
                ],
                correct: 1,
                explanation: "程序化生成（Infinigen）使用算法和规则系统生成内容，每个元素都有确定性生成逻辑和可编辑属性，不依赖训练数据。"
            },
            {
                id: 6,
                type: "single",
                question: "世界模型路径（Genie 思路）的核心思想是什么？",
                options: [
                    "用程序化规则生成静态世界",
                    "世界模型即游戏引擎，用神经网络学习环境动力学",
                    "用 LLM 生成游戏剧情",
                    "用行为树控制 NPC 行为"
                ],
                correct: 1,
                explanation: "Genie 的核心思想是'世界模型即游戏引擎'，用神经网络从数据中学习环境动力学，生成可交互的物理一致世界。"
            },
            {
                id: 7,
                type: "single",
                question: "在 TerrainType 枚举中，哪种地形是不可行走的？",
                options: [
                    "平原 (PLAIN)",
                    "森林 (FOREST)",
                    "水域 (WATER) 和 山地 (MOUNTAIN)",
                    "沙滩 (SAND)"
                ],
                correct: 2,
                explanation: "walkable 属性返回 self != TerrainType.WATER and self != TerrainType.MOUNTAIN，即水域和山地不可行走。"
            },
            {
                id: 8,
                type: "single",
                question: "生成地形时，大尺度趋势（large_scale）的作用是什么？",
                options: [
                    "增加地形细节",
                    "让水域和山脉分布更自然",
                    "提高生成速度",
                    "减少内存占用"
                ],
                correct: 1,
                explanation: "代码注释明确说明：'添加大尺度趋势（让水域和山脉分布更自然）'，通过低八度 fBm 实现。"
            },
            {
                id: 9,
                type: "single",
                question: "NPC 的 _choose_target 方法中，EXPLORER（探索者）的目标选择策略是什么？",
                options: [
                    "在附近 5 格范围内徘徊",
                    "在建筑附近 3 格范围内巡逻",
                    "在聚落间 10 格范围内移动",
                    "在世界范围内随机选择目标"
                ],
                correct: 3,
                explanation: "EXPLORER 的目标选择是 random.randint(0, world.width - 1) 和 random.randint(0, world.height - 1)，即在世界范围内随机选择。"
            },
            {
                id: 10,
                type: "single",
                question: "建造塔楼 (TOWER) 需要消耗哪些资源？",
                options: [
                    "5 木材 + 2 石材",
                    "8 木材 + 4 石材",
                    "3 木材 + 2 食物",
                    "10 石材 + 5 木材 + 2 黄金"
                ],
                correct: 3,
                explanation: "BuildingType.TOWER 的 cost 是 {ResourceType.STONE: 10, ResourceType.WOOD: 5, ResourceType.GOLD: 2}。"
            },
            {
                id: 11,
                type: "single",
                question: "WorldModel 的 history 属性使用什么数据结构？",
                options: [
                    "列表 (list)",
                    "字典 (dict)",
                    "双端队列 (deque)",
                    "集合 (set)"
                ],
                correct: 2,
                explanation: "代码中 self.history: deque = deque(maxlen=100)，使用双端队列记录最近 100 个世界快照。"
            },
            {
                id: 12,
                type: "single",
                question: "Player 的 vision_range 默认值是多少？",
                options: [
                    "5",
                    "7",
                    "8",
                    "10"
                ],
                correct: 2,
                explanation: "Player 类中 vision_range: int = 8，表示玩家可以看到周围 8 格范围内的区域。"
            },
            {
                id: 13,
                type: "single",
                question: "本实验为什么使用伪随机哈希函数而非标准 Perlin 噪声？",
                options: [
                    "标准 Perlin 噪声计算太慢",
                    "零外部依赖，便于理解底层数学",
                    "伪随机哈希生成的地形更真实",
                    "Perlin 噪声有专利限制"
                ],
                correct: 1,
                explanation: "实验分析中明确说明：'原因：零外部依赖，便于理解底层数学。实现：用线性同余哈希 + 双线性插值模拟平滑噪声。'"
            },
            {
                id: 14,
                type: "single",
                question: "在评估指标中，'可达区域比例'的理想值应满足什么条件？",
                options: [
                    "< 20%",
                    "> 40%",
                    "= 50%",
                    "> 80%"
                ],
                correct: 1,
                explanation: "评估指标表中明确说明可达区域比例的理想值是 > 40%，确保玩家有足够的探索空间。"
            },

            // ===== 多选题 (6道) =====
            {
                id: 15,
                type: "multi",
                question: "WorldModel 提供的三个核心预测函数包括哪些？",
                options: [

            },

            },

                explanation: "代码中 if key[0] in \'wasdWASDgGbB123\' 时调用 world.tick()。h（帮助）和 q（退出）不会触发 tick。"

            // ===== 判断题 (7道) =====

            },

            },
            {

                type: "judge",
                question: "NPC 的 AI 使用神经网络进行决策，每个 NPC 都有独立的深度学习模型。",
                correct: false,
                explanation: "错误。NPC 使用简单的规则 AI（目标驱动行为），根据角色类型选择目标并移动。实验明确说明这是'最简可行 AI'，真实游戏才会用行为树或强化学习。"
            },
            {
                id: 24,
                type: "judge",
                question: "在 _fbm 函数中，persistence 参数越高，生成的地形越粗糙。",
                correct: true,
                explanation: "正确。persistence 控制高八度噪声的衰减速度，越高则高频噪声贡献越大，地形细节越多、越粗糙。"
            },
            {
                id: 25,
                type: "judge",
                question: "玩家可以在水域上建造建筑，只要资源足够。",
                correct: false,
                explanation: "错误。is_valid_position 检查 t.walkable，而水域的 walkable 为 False。predict_build 首先调用 is_valid_position，因此水域不可建造。"
            },
            {
                id: 26,
                type: "judge",
                question: "本实验中，程序化生成和世界模型是互斥的技术路径，不能同时使用。",
                correct: false,
                explanation: "错误。本实验的核心目标就是融合两条路径：用程序化生成构建基础世界，用世界模型管理交互。实验明确说明'程序化生成和世界模型不是互斥的'。"
            },
            {
                id: 27,
                type: "judge",
                question: "Inventory.can_afford 方法使用 all() 函数检查是否满足所有资源需求。",
                correct: true,
                explanation: "正确。代码中 return all(self.has(r, a) for r, a in cost.items())，使用 all() 确保每种资源都满足数量要求。"
            }
        ];

        // ==================== 状态管理 ====================
        var state = {
            currentIndex: 0,
            answers: {},
            score: 0,
            shuffled: false
        };

        var originalQuestions = JSON.parse(JSON.stringify(allQuestions));

        // ==================== 初始化 ====================
        function init() {
            document.getElementById("totalQ").textContent = allQuestions.length;
            renderQuestions();
            showQuestion(0);
            updateProgress();
        }

        // ==================== 渲染题目 ====================
        function renderQuestions() {
            var container = document.getElementById("questionsContainer");
            container.innerHTML = "";

            allQuestions.forEach(function(q, index) {
                var card = document.createElement("div");
                card.className = "question-card";
                card.id = "question-" + index;
                card.dataset.index = index;

                var typeClass = "type-" + q.type;
                var typeName = {
                    "single": "单选题",
                    "multi": "多选题",
                    "judge": "判断题",
                    "drag": "拖拽填空"
                }[q.type];

                var html = `
                    <div class="question-header">
                        <span class="question-type ${typeClass}">${typeName}</span>
                        <span class="question-number">第 ${index + 1} 题 / 共 ${allQuestions.length} 题</span>
                    </div>
                    <div class="question-title">${q.question}</div>
                `;

                if (q.type === "drag") {
                    html += renderDragQuestion(q, index);
                } else if (q.type === "single" || q.type === "multi") {
                    html += renderChoiceQuestion(q, index);
                } else if (q.type === "judge") {
                    html += renderJudgeQuestion(q, index);
                }

                html += `
                    <div class="explanation" id="explanation-${index}">
                        <div class="explanation-title">解析</div>
                        <div>${q.explanation}</div>
                    </div>
                    <div class="nav-buttons">
                        <div class="nav-group">
                            <button class="btn btn-outline" onclick="prevQuestion()" ${index === 0 ? "disabled" : ""}>上一题</button>
                            <button class="btn btn-primary" onclick="checkAnswer(${index})">检查答案</button>
                            <button class="btn btn-outline" onclick="resetQuestion(${index})">重置题目</button>
                        </div>
                        <div class="nav-group">
                            <button class="btn btn-outline" onclick="nextQuestion()" ${index === allQuestions.length - 1 ? "disabled" : ""}>下一题</button>
                        </div>
                    </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function renderDragQuestion(q, index) {
            var html = `<div class="drag-sentence">${q.question}</div>`;
            html += `<div class="drag-words" id="drag-words-${index}">`;
            q.options.forEach(function(opt, i) {
                html += `<div class="drag-word" draggable="true" data-value="${opt}" ondragstart="dragStart(event)" ondragend="dragEnd(event)">${opt}</div>`;
            });
            html += `</div>`;
            html += `<div style="margin-top: 16px; text-align: center;">`;
            html += `<button class="btn btn-outline" onclick="resetDrag(${index})">重置填空</button>`;
            html += `</div>`;
            return html;
        }

        function renderChoiceQuestion(q, index) {
            var html = `<div class="options-list" id="options-${index}">`;
            q.options.forEach(function(opt, i) {
                var label = String.fromCharCode(65 + i);
                var inputType = q.type === "single" ? "radio" : "checkbox";
                html += `
                    <label class="option-item" onclick="selectOption(${index}, ${i}, '${inputType}')">
                        <input type="${inputType}" name="q${index}" value="${i}" onchange="selectOption(${index}, ${i}, '${inputType}')">
                        <span class="option-label">${label}.</span>
                        <span>${opt}</span>
                    </label>
                `;
            });
            html += `</div>`;
            return html;
        }

        function renderJudgeQuestion(q, index) {
            var html = `<div class="options-list" id="options-${index}">`;
            var options = [
                { value: "true", label: "是 / True", text: "正确" },
                { value: "false", label: "否 / False", text: "错误" }
            ];
            options.forEach(function(opt, i) {
                html += `
                    <label class="option-item" onclick="selectJudge(${index}, ${opt.value === "true"})">
                        <input type="radio" name="q${index}" value="${opt.value}" onchange="selectJudge(${index}, ${opt.value === "true"})">
                        <span class="option-label">${opt.label}</span>
                        <span>(${opt.text})</span>
                    </label>
                `;
            });
            html += `</div>`;
            return html;
        }

        // ==================== 拖拽功能 ====================
        function dragStart(e) {
            e.target.classList.add("dragging");
            e.dataTransfer.setData("text/plain", e.target.dataset.value);
            e.dataTransfer.effectAllowed = "move";
        }

        function dragEnd(e) {
            e.target.classList.remove("dragging");
        }

        function dragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        }

        function drop(e, index) {
            e.preventDefault();
            var value = e.dataTransfer.getData("text/plain");
            var blank = e.target.closest(".drag-blank");
            if (blank && !blank.classList.contains("filled")) {
                blank.textContent = value;
                blank.classList.add("filled");
                blank.dataset.value = value;
            }
        }

        // ==================== 选择功能 ====================
        function selectOption(qIndex, optIndex, inputType) {
            var card = document.getElementById("question-" + qIndex);
            var items = card.querySelectorAll(".option-item");

            if (inputType === "radio") {
                items.forEach(function(item) { item.classList.remove("selected"); });
                items[optIndex].classList.add("selected");
                state.answers[qIndex] = optIndex;
            } else {
                items[optIndex].classList.toggle("selected");
                var selected = [];
                items.forEach(function(item, i) {
                    if (item.classList.contains("selected")) selected.push(i);
                });
                state.answers[qIndex] = selected;
            }
        }

        function selectJudge(qIndex, value) {
            var card = document.getElementById("question-" + qIndex);
            var items = card.querySelectorAll(".option-item");
            items.forEach(function(item) { item.classList.remove("selected"); });
            items[value ? 0 : 1].classList.add("selected");
            state.answers[qIndex] = value;
        }

        // ==================== 检查答案 ====================
        function checkAnswer(index) {
            var q = allQuestions[index];
            var answer = state.answers[index];
            var isCorrect = false;

            if (answer === undefined || answer === null) {
                alert("请先作答！");
                return;
            }

            if (q.type === "single") {
                isCorrect = answer === q.correct;
                showChoiceResult(index, isCorrect, [q.correct]);
            } else if (q.type === "multi") {
                var ansArr = Array.isArray(answer) ? answer : [answer];
                isCorrect = ansArr.length === q.correct.length &&
                    ansArr.every(function(v) { return q.correct.includes(v); });
                showChoiceResult(index, isCorrect, q.correct);
            } else if (q.type === "judge") {
                isCorrect = answer === q.correct;
                showJudgeResult(index, isCorrect);
            } else if (q.type === "drag") {
                isCorrect = checkDragAnswer(index, q);
                showDragResult(index, isCorrect, q);
            }

            if (isCorrect) {
                state.score += getQuestionScore(q.type);
            }

            updateScore();
            document.getElementById("explanation-" + index).classList.add("show");
        }

        function getQuestionScore(type) {
            return { "single": 10, "multi": 15, "judge": 5, "drag": 10 }[type];
        }

        function showChoiceResult(index, isCorrect, correctIndices) {
            var card = document.getElementById("question-" + index);
            var items = card.querySelectorAll(".option-item");

            items.forEach(function(item, i) {
                item.classList.remove("selected");
                if (correctIndices.includes(i)) {
                    item.classList.add("correct");
                } else if (item.querySelector("input").checked && !isCorrect) {
                    item.classList.add("incorrect");
                }
                item.querySelector("input").disabled = true;
            });
        }

        function showJudgeResult(index, isCorrect) {
            var card = document.getElementById("question-" + index);
            var items = card.querySelectorAll(".option-item");
            items.forEach(function(item) {
                item.classList.remove("selected");
                item.querySelector("input").disabled = true;
            });
            if (isCorrect) {
                items[allQuestions[index].correct ? 0 : 1].classList.add("correct");
            } else {
                items[allQuestions[index].correct ? 0 : 1].classList.add("correct");
                items[allQuestions[index].correct ? 1 : 0].classList.add("incorrect");
            }
        }

        function checkDragAnswer(index, q) {
            var card = document.getElementById("question-" + index);
            var blanks = card.querySelectorAll(".drag-blank");
            if (blanks.length === 0) return false;
            return blanks[0].dataset.value === q.blanks[0];
        }

        function showDragResult(index, isCorrect, q) {
            var card = document.getElementById("question-" + index);
            var blanks = card.querySelectorAll(".drag-blank");
            blanks.forEach(function(blank, i) {
                if (blank.dataset.value === q.blanks[i]) {
                    blank.classList.add("correct");
                } else {
                    blank.classList.add("incorrect");
                }
            });
        }

        // ==================== 导航 ====================
        function showQuestion(index) {
            document.querySelectorAll(".question-card").forEach(function(c) { c.classList.remove("active"); });
            var card = document.getElementById("question-" + index);
            if (card) card.classList.add("active");
            state.currentIndex = index;
            updateProgress();
        }

        function nextQuestion() {
            if (state.currentIndex < allQuestions.length - 1) {
                showQuestion(state.currentIndex + 1);
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (state.currentIndex > 0) {
                showQuestion(state.currentIndex - 1);
            }
        }

        function updateProgress() {
            document.getElementById("currentQ").textContent = state.currentIndex + 1;
            var pct = ((state.currentIndex + 1) / allQuestions.length) * 100;
            document.getElementById("progressFill").style.width = pct + "%";
        }

        function updateScore() {
            document.getElementById("scoreValue").textContent = state.score;
        }

        // ==================== 重置 ====================
        function resetQuestion(index) {
            delete state.answers[index];
            var q = allQuestions[index];
            var card = document.getElementById("question-" + index);

            if (q.type === "drag") {
                resetDrag(index);
            } else {
                var items = card.querySelectorAll(".option-item");
                items.forEach(function(item) {
                    item.classList.remove("selected", "correct", "incorrect");
                    var input = item.querySelector("input");
                    input.disabled = false;
                    input.checked = false;
                });
            }

            document.getElementById("explanation-" + index).classList.remove("show");
        }

        function resetDrag(index) {
            var q = allQuestions[index];
            var card = document.getElementById("question-" + index);
            var sentence = card.querySelector(".drag-sentence");
            sentence.innerHTML = q.question;
            var wordsContainer = document.getElementById("drag-words-" + index);
            wordsContainer.innerHTML = "";
            q.options.forEach(function(opt) {
                var div = document.createElement("div");
                div.className = "drag-word";
                div.draggable = true;
                div.dataset.value = opt;
                div.textContent = opt;
                div.ondragstart = function(e) { dragStart(e); };
                div.ondragend = function(e) { dragEnd(e); };
                wordsContainer.appendChild(div);
            });
            document.getElementById("explanation-" + index).classList.remove("show");
        }

        function resetAll() {
            state.answers = {};
            state.score = 0;
            state.currentIndex = 0;
            updateScore();
            document.getElementById("resultPanel").classList.remove("active");
            document.getElementById("overviewPanel").classList.remove("active");
            document.getElementById("scorePanel").style.display = "";
            renderQuestions();
            showQuestion(0);
        }

        // ==================== 洗牌 ====================
        function shuffleOptions() {
            allQuestions.forEach(function(q, index) {
                if (q.type === "single" || q.type === "multi") {
                    var originalOptions = q.options.slice();
                    var indices = originalOptions.map(function(_, i) { return i; });
                    for (var i = indices.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var temp = indices[i];
                        indices[i] = indices[j];
                        indices[j] = temp;
                    }
                    var newOptions = indices.map(function(i) { return originalOptions[i]; });
                    var newCorrect;
                    if (q.type === "single") {
                        newCorrect = indices.indexOf(q.correct);
                    } else {
                        newCorrect = q.correct.map(function(c) { return indices.indexOf(c); }).sort(function(a, b) { return a - b; });
                    }
                    q.options = newOptions;
                    q.correct = newCorrect;
                }
            });
            state.shuffled = true;
            renderQuestions();
            showQuestion(state.currentIndex);
        }

        // ==================== 总览面板 ====================
        function showOverview() {
            document.getElementById("overviewPanel").classList.add("active");
            renderOverview();
        }

        function hideOverview() {
            document.getElementById("overviewPanel").classList.remove("active");
        }

        function renderOverview() {
            var grid = document.getElementById("overviewGrid");
            grid.innerHTML = "";

            allQuestions.forEach(function(q, index) {
                var item = document.createElement("div");
                item.className = "overview-item";
                item.textContent = index + 1;
                item.onclick = function() {
                    hideOverview();
                    showQuestion(index);
                };

                var answer = state.answers[index];
                if (answer === undefined || answer === null) {
                    item.classList.add("unanswered");
                } else {
                    var isCorrect = false;
                    if (q.type === "single") isCorrect = answer === q.correct;
                    else if (q.type === "multi") {
                        var ansArr = Array.isArray(answer) ? answer : [answer];
                        isCorrect = ansArr.length === q.correct.length && ansArr.every(function(v) { return q.correct.includes(v); });
                    } else if (q.type === "judge") isCorrect = answer === q.correct;
                    else if (q.type === "drag") {
                        var card = document.getElementById("question-" + index);
                        if (card) {
                            var blanks = card.querySelectorAll(".drag-blank");
                            isCorrect = blanks.length > 0 && blanks[0].dataset.value === q.blanks[0];
                        }
                    }
                    item.classList.add(isCorrect ? "correct" : "incorrect");
                }

                grid.appendChild(item);
            });
        }

        function filterOverview(filter) {
            document.querySelectorAll(".filter-btn").forEach(function(btn) { btn.classList.remove("active"); });
            event.target.classList.add("active");

            var items = document.querySelectorAll(".overview-item");
            items.forEach(function(item) {
                item.style.display = "";
                if (filter === "unanswered" && !item.classList.contains("unanswered")) item.style.display = "none";
                if (filter === "correct" && !item.classList.contains("correct")) item.style.display = "none";
                if (filter === "incorrect" && !item.classList.contains("incorrect")) item.style.display = "none";
            });
        }

        // ==================== 结果面板 ====================
        function showResult() {
            var correct = 0, incorrect = 0, unanswered = 0;
            allQuestions.forEach(function(q, index) {
                var ans = state.answers[index];
                if (ans === undefined || ans === null) {
                    unanswered++;
                } else {
                    var isCorrect = false;
                    if (q.type === "single") isCorrect = ans === q.correct;
                    else if (q.type === "multi") {
                        var ansArr = Array.isArray(ans) ? ans : [ans];
                        isCorrect = ansArr.length === q.correct.length && ansArr.every(function(v) { return q.correct.includes(v); });
                    } else if (q.type === "judge") isCorrect = ans === q.correct;
                    else if (q.type === "drag") {
                        var card = document.getElementById("question-" + index);
                        if (card) {
                            var blanks = card.querySelectorAll(".drag-blank");
                            isCorrect = blanks.length > 0 && blanks[0].dataset.value === q.blanks[0];
                        }
                    }
                    if (isCorrect) correct++; else incorrect++;
                }
            });

            document.getElementById("finalScore").textContent = state.score;
            document.getElementById("statCorrect").textContent = correct;
            document.getElementById("statIncorrect").textContent = incorrect;
            document.getElementById("statUnanswered").textContent = unanswered;

            var total = allQuestions.length;
            var msg = "";
            if (correct === total) msg = "🌟 完美！全部正确！";
            else if (correct / total >= 0.8) msg = "👏 优秀！掌握得很扎实！";
            else if (correct / total >= 0.6) msg = "👍 良好！还有提升空间。";
            else msg = "💪 继续加油！建议重新复习相关知识点。";
            document.getElementById("resultMessage").textContent = msg;

            document.getElementById("resultPanel").classList.add("active");
        }

        function hideResult() {
            document.getElementById("resultPanel").classList.remove("active");
        }

        // ==================== 启动 ====================
        document.addEventListener("DOMContentLoaded", init);
    </script>
