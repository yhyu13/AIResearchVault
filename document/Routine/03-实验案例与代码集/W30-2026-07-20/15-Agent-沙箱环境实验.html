<head>
<meta charset="UTF-8">

<title>实验 15：Agent 沙箱环境 — LLM-in-Sandbox 与语义感知 Checkpoint/Restore 实验</title>
<style>
:root {
  --bg: #f5f7fa;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --muted: #7f8c8d;
  --accent: #3b82f6;
  --accent-light: #e8f0fe;
  --success: #27ae60;
  --success-bg: #e8f8f0;
  --danger: #e74c3c;
  --danger-bg: #fdecea;
  --warning: #f39c12;
  --warning-bg: #fef5e7;
  --border: #e1e8ed;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 960px; margin: 0 auto; padding: 20px; }
header {
  text-align: center; padding: 32px 16px 24px;
}
header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
header .subtitle { color: var(--muted); font-size: 0.95rem; }
.score-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 18px; margin-bottom: 18px; box-shadow: var(--shadow);
  flex-wrap: wrap; gap: 10px;
}
.score-bar .score { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
.score-bar .progress { flex: 1; height: 10px; background: #e9ecef; border-radius: 5px; margin: 0 14px; overflow: hidden; }
.score-bar .progress-inner { height: 100%; background: var(--accent); border-radius: 5px; width: 0%; transition: width .3s ease; }
.score-bar .nav-btns { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;
  transition: all .2s; user-select: none;
}
.btn:hover { background: var(--accent-light); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #2563eb; }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.danger:hover { background: #c0392b; }
.btn.success { background: var(--success); color: #fff; border-color: var(--success); }
.btn.success:hover { background: #1e8449; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 22px; margin-bottom: 18px; box-shadow: var(--shadow); display: none;
}
.card.active { display: block; }
.card .q-index { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.card .q-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; }
.card .q-desc { color: var(--muted); font-size: .95rem; margin-bottom: 14px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
  transition: all .15s; background: #fafbfc;
}
.option:hover { border-color: var(--accent); background: var(--accent-light); }
.option input { flex-shrink: 0; }
.option.correct { border-color: var(--success); background: var(--success-bg); }
.option.wrong { border-color: var(--danger); background: var(--danger-bg); }
.option.disabled { pointer-events: none; opacity: .85; }
.option .opt-label { font-weight: 600; min-width: 22px; }

/* Drag-drop fill-in */
.fill-blank { display: inline-block; min-width: 120px; height: 36px; line-height: 34px; border: 2px dashed var(--border); border-radius: 8px; text-align: center; vertical-align: middle; margin: 0 4px; background: #fafbfc; transition: all .2s; }
.fill-blank.filled { border-style: solid; border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 600; }
.fill-blank.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); }
.fill-blank.wrong { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.draggables { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.draggable {
  padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card-bg); cursor: grab; box-shadow: var(--shadow); font-weight: 500;
}
.draggable.dragging { opacity: .5; }
.drop-zone { display: inline; }

/* True/False */
.tf-options { display: flex; gap: 14px; margin-top: 10px; }
.tf-btn {
  flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
  background: #fafbfc; cursor: pointer; text-align: center; font-weight: 600;
  transition: all .15s;
}
.tf-btn:hover { border-color: var(--accent); background: var(--accent-light); }
.tf-btn.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); }
.tf-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.tf-btn.disabled { pointer-events: none; opacity: .85; }

/* Result panel */
.result-panel { display: none; margin-top: 16px; padding: 14px; border-radius: 10px; font-size: .95rem; }
.result-panel.show { display: block; }
.result-panel.correct { background: var(--success-bg); border: 1px solid var(--success); }
.result-panel.wrong { background: var(--danger-bg); border: 1px solid var(--danger); }
.result-panel .title { font-weight: 700; margin-bottom: 6px; }

/* Overview */
.overview { display: none; }
.overview.active { display: block; }
.overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; margin-top: 14px; }
.overview-item {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 10px; border: 1px solid var(--border); background: #fafbfc;
  cursor: pointer; font-weight: 700; font-size: .9rem; transition: all .15s;
}
.overview-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.overview-item.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.overview-item.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
.overview-item.answered { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
.overview-filters { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.overview-filters .btn { font-size: .85rem; padding: 6px 12px; }

/* Final result */
.final-result { display: none; text-align: center; padding: 40px 20px; }
.final-result.active { display: block; }
.final-result .big-score { font-size: 3rem; font-weight: 800; color: var(--accent); margin: 12px 0; }
.final-result .grade { font-size: 1.2rem; color: var(--muted); margin-bottom: 20px; }

/* Responsive */
@media (max-width: 640px) {
  .score-bar { flex-direction: column; align-items: stretch; }
  .score-bar .progress { margin: 8px 0; }
}
</style>

    </div>
  </div>
</div>

// =========================
// 状态管理
// =========================
var state = {
  current: 0,
  answers: {},      // qIndex -> answer
  checked: {},      // qIndex -> bool (是否已检查)
  score: 0,
  totalAnswered: 0,
  filter: 'all',
};

function init() {
  renderQuestion(state.current);
  updateScoreBar();
  renderOverview();
}

// =========================
// 渲染题目
// =========================
function renderQuestion(idx) {
  var container = document.getElementById('questionContainer');
  var q = allQuestions[idx];
  var html = '<div class="card active" data-idx="' + idx + '">';
  html += '<div class="q-index">题目 ' + (idx+1) + ' / ' + allQuestions.length + ' · ' + typeLabel(q.type) + '</div>';
  html += '<div class="q-title">' + escapeHtml(q.title) + '</div>';
  if (q.desc) html += '<div class="q-desc">' + escapeHtml(q.desc) + '</div>';

  if (q.type === 'single') {
    html += '<div class="options">';
    q.options.forEach(function(opt, i) {
      var cls = '';
      var checked = '';
      if (state.checked[idx]) {
        cls = (i === q.correct) ? 'correct' : (state.answers[idx] === i ? 'wrong' : '');
        cls += ' disabled';
      } else if (state.answers[idx] === i) {
        checked = 'checked';
      }
      html += '<label class="option ' + cls + '">';
      html += '<input type="radio" name="q' + idx + '" value="' + i + '" ' + checked + ' onchange="selectSingle(' + idx + ',' + i + ')">';
      html += '<span class="opt-label">' + opt.label + '</span>';
      html += '<span>' + escapeHtml(opt.text) + '</span>';
      html += '</label>';
    });
    html += '</div>';
  } else if (q.type === 'multi') {
    html += '<div class="options">';
    var ans = state.answers[idx] || [];
    q.options.forEach(function(opt, i) {
      var cls = '';
      var checked = ans.includes(i) ? 'checked' : '';
      if (state.checked[idx]) {
        var isCorrect = q.correct.includes(i);
        var isSelected = ans.includes(i);
        if (isCorrect) cls = 'correct';
        else if (isSelected) cls = 'wrong';
        cls += ' disabled';
      }
      html += '<label class="option ' + cls + '">';
      html += '<input type="checkbox" name="q' + idx + '" value="' + i + '" ' + checked + ' onchange="toggleMulti(' + idx + ',' + i + ')">';
      html += '<span class="opt-label">' + opt.label + '</span>';
      html += '<span>' + escapeHtml(opt.text) + '</span>';
      html += '</label>';
    });
    html += '</div>';
  } else if (q.type === 'tf') {
    html += '<div class="tf-options">';
    var ans = state.answers[idx];
    var clsTrue = '', clsFalse = '';
    if (state.checked[idx]) {
      if (q.answer === true) clsTrue = 'correct'; else clsTrue = 'wrong';
      if (q.answer === false) clsFalse = 'correct'; else clsFalse = 'wrong';
      clsTrue += ' disabled'; clsFalse += ' disabled';
    } else {
      if (ans === true) clsTrue = 'correct';
      if (ans === false) clsFalse = 'correct';
    }
    html += '<div class="tf-btn ' + clsTrue + '" onclick="selectTF(' + idx + ',true)">✅ 是</div>';
    html += '<div class="tf-btn ' + clsFalse + '" onclick="selectTF(' + idx + ',false)">❌ 否</div>';
    html += '</div>';
  } else if (q.type === 'drag') {
    html += renderDragQuestion(q, idx);
  }

  // 解析面板
  html += '<div class="result-panel ' + (state.checked[idx] ? 'show' : '') + ' ' + (isCorrect(idx) ? 'correct' : 'wrong') + '" id="resultPanel' + idx + '">';
  html += '<div class="title">' + (isCorrect(idx) ? '✅ 回答正确' : '❌ 回答错误') + '</div>';
  html += '<div>' + escapeHtml(getExplanation(idx)) + '</div>';
  html += '</div>';

  // 操作按钮
  html += '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">';
  if (!state.checked[idx]) {
    html += '<button class="btn primary" onclick="checkAnswer(' + idx + ')">✅ 检查答案</button>';
    html += '<button class="btn" onclick="resetQuestion(' + idx + ')">🔄 重置本题</button>';
  } else {
    html += '<button class="btn" disabled>已检查</button>';
    html += '<button class="btn" onclick="resetQuestion(' + idx + ')">🔄 重新答题</button>';
  }
  html += '</div>';

  html += '</div>';
  container.innerHTML = html;

  // 恢复拖拽事件
  if (q.type === 'drag') initDragEvents(idx);

  updateNavButtons();
  updateProgress();
}

function typeLabel(t) {
  return { single: '单选题', multi: '多选题', tf: '判断题', drag: '拖拽填空' }[t] || t;
}

// =========================
// 拖拽填空渲染
// =========================
function renderDragQuestion(q, idx) {
  var html = '<div style="line-height:2.2;font-size:1.05rem;">';
  var ans = state.answers[idx] || {};
  q.blanks.forEach(function(b) {
    var val = ans[b.id] || '';
    var cls = '';
    if (state.checked[idx]) {
      cls = (val === b.correct) ? 'correct' : 'wrong';
    } else if (val) {
      cls = 'filled';
    }
    html += '<span class="fill-blank ' + cls + '" data-blank="' + b.id + '" data-idx="' + idx + '">';
    html += val ? escapeHtml(val) : b.label;
    html += '</span>';
  });
  html += '</div>';
  html += '<div class="draggables">';
  var used = Object.values(ans);
  q.choices.forEach(function(ch) {
    var usedClass = used.includes(ch) ? 'style="opacity:.5;pointer-events:none;"' : '';
    html += '<div class="draggable" draggable="true" data-choice="' + escapeHtml(ch) + '" ' + usedClass + '>' + escapeHtml(ch) + '</div>';
  });
  html += '</div>';
  return html;
}

function initDragEvents(idx) {
  var q = allQuestions[idx];
  if (state.checked[idx]) return;
  var draggables = document.querySelectorAll('.draggable');
  var blanks = document.querySelectorAll('.fill-blank');
  draggables.forEach(function(el) {
    el.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', el.dataset.choice);
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', function() {
      el.classList.remove('dragging');
    });
  });
  blanks.forEach(function(el) {
    el.addEventListener('dragover', function(e) { e.preventDefault(); });
    el.addEventListener('drop', function(e) {
      e.preventDefault();
      var choice = e.dataTransfer.getData('text/plain');
      if (!choice) return;
      var blankId = el.dataset.blank;
      var qIdx = parseInt(el.dataset.idx);
      if (!state.answers[qIdx]) state.answers[qIdx] = {};
      state.answers[qIdx][blankId] = choice;
      renderQuestion(qIdx);
    });
    // 点击移除
    el.addEventListener('click', function() {
      if (state.checked[idx]) return;
      var blankId = el.dataset.blank;
      var qIdx = parseInt(el.dataset.idx);
      if (state.answers[qIdx] && state.answers[qIdx][blankId]) {
        delete state.answers[qIdx][blankId];
        renderQuestion(qIdx);
      }
    });
  });
}

// =========================
// 答题交互
// =========================
function selectSingle(idx, optIdx) {
  if (state.checked[idx]) return;
  state.answers[idx] = optIdx;
  renderQuestion(idx);
}

function toggleMulti(idx, optIdx) {
  if (state.checked[idx]) return;
  var ans = state.answers[idx] || [];
  var pos = ans.indexOf(optIdx);
  if (pos >= 0) ans.splice(pos, 1); else ans.push(optIdx);
  state.answers[idx] = ans;
  renderQuestion(idx);
}

function selectTF(idx, val) {
  if (state.checked[idx]) return;
  state.answers[idx] = val;
  renderQuestion(idx);
}

// =========================
// 检查答案
// =========================
function checkAnswer(idx) {
  if (state.checked[idx]) return;
  var q = allQuestions[idx];
  var ans = state.answers[idx];
  if (ans === undefined || ans === null || (typeof ans === 'object' && Object.keys(ans).length === 0)) {
    alert('请先作答再检查答案');
    return;
  }
  state.checked[idx] = true;
  state.totalAnswered++;
  if (isCorrect(idx)) state.score++;
  renderQuestion(idx);
  updateScoreBar();
  renderOverview();
  // 自动跳转到下一题
  if (idx < allQuestions.length - 1) {
    setTimeout(function() { goNext(); }, 600);
  } else {
    setTimeout(function() { showFinalResult(); }, 800);
  }
}

function isCorrect(idx) {
  var q = allQuestions[idx];
  var ans = state.answers[idx];
  if (ans === undefined || ans === null) return false;
  if (q.type === 'single') return ans === q.correct;
  if (q.type === 'multi') {
    if (!Array.isArray(ans) || ans.length !== q.correct.length) return false;
    return q.correct.every(function(c) { return ans.includes(c); });
  }
  if (q.type === 'tf') return ans === q.answer;
  if (q.type === 'drag') {
    if (!ans || typeof ans !== 'object') return false;
    return q.blanks.every(function(b) { return ans[b.id] === b.correct; });
  }
  return false;
}

function getExplanation(idx) {
  var q = allQuestions[idx];
  if (q.type === 'single') return q.explanation;
  if (q.type === 'multi') return q.explanation;
  if (q.type === 'tf') return q.explanation;
  if (q.type === 'drag') {
    var ans = state.answers[idx] || {};
    var parts = [];
    q.blanks.forEach(function(b) {
      var user = ans[b.id] || '(未填)';
      var correct = b.correct;
      var mark = (user === correct) ? '✅' : '❌';
      parts.push(mark + ' ' + b.label + '：你填"' + user + '"，正确答案是"' + correct + '" — ' + (q.explanation[correct] || ''));
    });
    return parts.join('\n');
  }
  return '';
}

// =========================
// 导航
// =========================
function goPrev() {
  if (state.current > 0) {
    state.current--;
    renderQuestion(state.current);
  }
}
function goNext() {
  if (state.current < allQuestions.length - 1) {
    state.current++;
    renderQuestion(state.current);
  }
}
function updateNavButtons() {
  document.getElementById('btnPrev').disabled = state.current === 0;
  document.getElementById('btnNext').disabled = state.current === allQuestions.length - 1;
}
function updateProgress() {
  var pct = ((state.current + 1) / allQuestions.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
}

// =========================
// 分数与总览
// =========================
function updateScoreBar() {
  document.getElementById('scoreDisplay').textContent = '得分: ' + state.score + ' / ' + state.totalAnswered + ' (已答 ' + state.totalAnswered + '/' + allQuestions.length + ')';
}

function toggleOverview() {
  var panel = document.getElementById('overviewPanel');
  var container = document.getElementById('questionContainer');
  var finalResult = document.getElementById('finalResult');
  if (panel.classList.contains('active')) {
    panel.classList.remove('active');
    container.style.display = 'block';
    finalResult.style.display = 'none';
  } else {
    panel.classList.add('active');
    container.style.display = 'none';
    finalResult.style.display = 'none';
    renderOverview();
  }
}

function renderOverview() {
  var grid = document.getElementById('overviewGrid');
  var html = '';
  allQuestions.forEach(function(q, i) {
    var cls = '';
    if (state.checked[i]) {
      cls = isCorrect(i) ? 'correct' : 'wrong';
    } else if (state.answers[i] !== undefined && state.answers[i] !== null && (typeof state.answers[i] !== 'object' || Object.keys(state.answers[i]).length > 0)) {
      cls = 'answered';
    }
    // 过滤
    if (state.filter === 'correct' && cls !== 'correct') return;
    if (state.filter === 'wrong' && cls !== 'wrong') return;
    if (state.filter === 'unanswered' && cls !== '') return;
    html += '<div class="overview-item ' + cls + '" onclick="jumpToQuestion(' + i + ')">' + (i+1) + '</div>';
  });
  grid.innerHTML = html || '<div style="color:var(--muted);grid-column:1/-1;">无符合条件的题目</div>';
}

function filterOverview(f) {
  state.filter = f;
  renderOverview();
}

function jumpToQuestion(idx) {
  state.current = idx;
  document.getElementById('overviewPanel').classList.remove('active');
  document.getElementById('questionContainer').style.display = 'block';
  document.getElementById('finalResult').style.display = 'none';
  renderQuestion(idx);
}

// =========================
// 最终结果
// =========================
function showFinalResult() {
  document.getElementById('questionContainer').style.display = 'none';
  document.getElementById('overviewPanel').classList.remove('active');
  document.getElementById('finalResult').classList.add('active');
  document.getElementById('finalResult').style.display = 'block';
  var score = state.score;
  var total = state.totalAnswered;
  var pct = total > 0 ? Math.round((score / total) * 100) : 0;
  document.getElementById('finalScore').textContent = score + ' / ' + total + ' (' + pct + '%)';
  var grade = '';
  if (pct >= 90) grade = '🏆 优秀！你对 Agent 沙箱的理解非常深入';
  else if (pct >= 75) grade = '👍 良好！大部分概念已掌握，再巩固一下细节';
  else if (pct >= 60) grade = '👌 及格！基础概念有了，建议回顾实验文档加深理解';
  else grade = '📚 继续加油！建议重新阅读实验文档，重点关注错题';
  document.getElementById('finalGrade').textContent = grade;
}

function showResultDetails() {
  document.getElementById('finalResult').classList.remove('active');
  document.getElementById('finalResult').style.display = 'none';
  toggleOverview();
}

// =========================
// 重置
// =========================
function resetQuestion(idx) {
  state.checked[idx] = false;
  state.answers[idx] = undefined;
  // 重新计算分数
  var oldScore = state.score;
  state.score = 0;
  state.totalAnswered = 0;
  allQuestions.forEach(function(q, i) {
    if (state.checked[i]) {
      state.totalAnswered++;
      if (isCorrect(i)) state.score++;
    }
  });
  renderQuestion(idx);
  updateScoreBar();
  renderOverview();
}

function resetAll() {
  state.current = 0;
  state.answers = {};
  state.checked = {};
  state.score = 0;
  state.totalAnswered = 0;
  state.filter = 'all';
  document.getElementById('overviewPanel').classList.remove('active');
  document.getElementById('finalResult').classList.remove('active');
  document.getElementById('finalResult').style.display = 'none';
  document.getElementById('questionContainer').style.display = 'block';
  renderQuestion(0);
  updateScoreBar();
  renderOverview();
}

// =========================
// 洗牌选项
// =========================
function shuffleOptions() {
  allQuestions.forEach(function(q) {
    if (q.type === 'single' || q.type === 'multi') {
      var oldCorrect = q.correct;
      var opts = q.options.slice();
      // Fisher-Yates shuffle
      for (var i = opts.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp;
      }
      // 重新标记 A/B/C/D
      opts.forEach(function(o, idx) {
        o.label = String.fromCharCode(65 + idx);
      });
      // 更新 correct 索引
      if (q.type === 'single') {
        q.correct = opts.findIndex(function(o) { return o.text === q.options[oldCorrect].text; });
      } else {
        q.correct = oldCorrect.map(function(ci) {
          return opts.findIndex(function(o) { return o.text === q.options[ci].text; });
        });
      }
      q.options = opts;
    }
  });
  renderQuestion(state.current);
  alert('🎲 选项已重新洗牌！');
}

// =========================
// 工具函数
// =========================
function escapeHtml(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
