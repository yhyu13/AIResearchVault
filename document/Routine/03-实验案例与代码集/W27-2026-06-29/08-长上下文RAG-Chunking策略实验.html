<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08-长上下文 RAG：Chunking 策略实验 — 知识卡牌</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --accent: #f59e0b;
            --accent-light: #fff7ed;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --radius: 12px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center; padding: 30px 0 20px;
        }
        header h1 { font-size: 1.6rem; margin: 0 0 8px; color: var(--primary); }
        header p { margin: 0; color: var(--text-secondary); font-size: 0.95rem; }
        .score-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); padding: 14px 20px; border-radius: var(--radius);
            box-shadow: var(--shadow); margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .score-bar .score { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
        .score-bar .progress { flex: 1; height: 10px; background: var(--border); border-radius: 5px; margin: 0 15px; overflow: hidden; }
        .score-bar .progress-fill { height: 100%; background: var(--primary); border-radius: 5px; transition: width 0.3s; width: 0%; }
        .score-bar .nav-buttons { display: flex; gap: 8px; }
        button {
            border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
            transition: background 0.2s, transform 0.1s; font-family: inherit;
        }
        button:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { background: #d1d5db; }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: #d97706; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #059669; }
        .card {
            background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
            padding: 24px; margin-bottom: 20px; display: none;
        }
        .card.active { display: block; }
        .card-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
        }
        .card-header .q-type {
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
            padding: 4px 10px; border-radius: 20px; background: var(--primary-light); color: var(--primary);
        }
        .card-header .q-number { font-size: 0.85rem; color: var(--text-secondary); }
        .question-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            border: 2px solid var(--border); border-radius: 10px; cursor: pointer;
            transition: border-color 0.2s, background 0.2s; font-size: 0.95rem;
        }
        .option:hover { border-color: var(--primary); background: #f8fafc; }
        .option.selected { border-color: var(--primary); background: var(--primary-light); }
        .option.correct { border-color: var(--success); background: var(--success-light); }
        .option.wrong { border-color: var(--danger); background: var(--danger-light); }
        .option input { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink: 0; }
        .option .opt-label { font-weight: 600; min-width: 24px; color: var(--text-secondary); }
        .option .opt-text { flex: 1; }
        .true-false-options { display: flex; gap: 12px; margin-bottom: 12px; }
        .true-false-options .option { flex: 1; justify-content: center; }
        .drag-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .drag-item {
            padding: 8px 14px; background: var(--primary-light); color: var(--primary);
            border-radius: 8px; font-weight: 600; cursor: grab; border: 2px dashed var(--primary);
            user-select: none; font-size: 0.9rem;
        }
        .drag-item.dragging { opacity: 0.5; }
        .drop-zone {
            display: inline-block; min-width: 100px; height: 36px; line-height: 32px;
            border: 2px dashed var(--border); border-radius: 8px; text-align: center;
            vertical-align: middle; margin: 0 4px; background: #fafafa; color: var(--text-secondary);
            font-size: 0.9rem; transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
        .drop-zone.filled { border-style: solid; border-color: var(--primary); color: var(--primary); font-weight: 600; }
        .drop-zone.correct-zone { border-color: var(--success); background: var(--success-light); color: var(--success); }
        .drop-zone.wrong-zone { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
        .fill-sentence { font-size: 1rem; line-height: 2.2; margin-bottom: 16px; }
        .explanation {
            margin-top: 16px; padding: 14px; border-radius: 10px; background: #f0f9ff;
            border-left: 4px solid var(--primary); font-size: 0.9rem; display: none;
        }
        .explanation.show { display: block; }
        .explanation-title { font-weight: 700; margin-bottom: 6px; color: var(--primary); }
        .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .overview-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 16px;
        }
        .overview-item {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer;
            border: 2px solid var(--border); background: var(--card-bg); transition: transform 0.15s;
        }
        .overview-item:hover { transform: scale(1.08); }
        .overview-item.answered { border-color: var(--success); background: var(--success-light); color: var(--success); }
        .overview-item.wrong-ans { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
        .overview-item.current { box-shadow: 0 0 0 3px var(--primary); }
        .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; border: 2px solid var(--border); background: var(--card-bg); cursor: pointer; }
        .filter-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .result-screen { text-align: center; padding: 40px 20px; }
        .result-screen h2 { font-size: 1.8rem; margin-bottom: 10px; }
        .result-score { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 20px 0; }
        .result-detail { display: flex; justify-content: center; gap: 30px; margin-bottom: 24px; flex-wrap: wrap; }
        .result-detail .item { text-align: center; }
        .result-detail .item .num { font-size: 1.4rem; font-weight: 700; display: block; }
        .result-detail .item .label { font-size: 0.85rem; color: var(--text-secondary); }
        .hidden { display: none !important; }
        @media (max-width: 600px) {
            .score-bar { flex-direction: column; align-items: stretch; }
            .score-bar .progress { margin: 10px 0; }
            header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>08-长上下文 RAG：Chunking 策略实验</h1>
        <p>知识卡牌 — 拖拽填空 · 单选 · 多选 · 判断</p>
    </header>

    <div class="score-bar" id="scoreBar">
        <div class="score">得分: <span id="scoreVal">0</span> / <span id="scoreTotal">0</span></div>
        <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
        <div class="nav-buttons">
            <button class="btn-secondary" onclick="prevQuestion()">⬅ 上一题</button>
            <button class="btn-secondary" onclick="nextQuestion()">下一题 ➡</button>
            <button class="btn-accent" onclick="showOverview()">☰ 总览</button>
        </div>
    </div>

    <div id="cardsContainer"></div>

    <div class="card" id="overviewCard">
        <div class="card-header">
            <span class="q-type">总览面板</span>
            <span class="q-number">点击题号跳转</span>
        </div>
        <div class="filter-row">
            <button class="filter-btn active" onclick="filterOverview('all')">全部</button>
            <button class="filter-btn" onclick="filterOverview('correct')">✅ 正确</button>
            <button class="filter-btn" onclick="filterOverview('wrong')">❌ 错误</button>
            <button class="filter-btn" onclick="filterOverview('unanswered')">⭕ 未答</button>
        </div>
        <div class="overview-grid" id="overviewGrid"></div>
        <div class="btn-row">
            <button class="btn-primary" onclick="showCurrentQuestion()">↩ 返回当前题目</button>
            <button class="btn-danger" onclick="resetAll()">🗑 重置全部</button>
        </div>
    </div>

    <div class="card" id="resultCard">
        <div class="result-screen">
            <h2>🎉 答题完成！</h2>
            <div class="result-score" id="finalScore">0</div>
            <div class="result-detail">
                <div class="item"><span class="num" id="statSingle">0</span><span class="label">单选</span></div>
                <div class="item"><span class="num" id="statMulti">0</span><span class="label">多选</span></div>
                <div class="item"><span class="num" id="statTF">0</span><span class="label">判断</span></div>
                <div class="item"><span class="num" id="statDrag">0</span><span class="label">拖拽</span></div>
            </div>
            <div class="btn-row" style="justify-content:center;">
                <button class="btn-primary" onclick="showOverview()">🔍 返回查看</button>
                <button class="btn-secondary" onclick="resetAll()">🔄 重新做题</button>
            </div>
        </div>
    </div>
</div>

<script>
// ===================== 题目数据 =====================
const allQuestions = [
    // ---------- 拖拽填空 (5道) ----------
    {
        id: 1, type: 'drag', category: 'drag',
        question: '请将正确的术语拖拽到句子中的空白处，补全关于 Chunking 策略实验的核心概念。',
        sentence: '在 RAG 系统中，{0} 是关键的预处理步骤，直接影响检索质量。实验对比了六种策略：固定长度、递归字符、{1}、主题分块、结构感知和 {2}。评估指标中，{3} 衡量检索结果的信噪比，而 {4} 衡量检索系统的覆盖度。',
        blanks: ['分块（Chunking）', '语义分块', 'Agentic 分块', 'Context Precision@k', 'Context Recall'],
        dragItems: ['语义分块', 'Context Precision@k', 'Agentic 分块', '分块（Chunking）', 'Context Recall', '端到端准确率', '边界完整性', 'Chunk 利用率'],
        explanation: '分块（Chunking）是 RAG 的关键预处理步骤；实验对比的六种策略包括固定长度、递归字符、语义分块、主题分块、结构感知和 Agentic 分块；Context Precision@k 衡量信噪比，Context Recall 衡量覆盖度。'
    },
    {
        id: 2, type: 'drag', category: 'drag',
        question: '请将正确的代码类/函数名填入以下关于实现细节的句子中。',
        sentence: '在代码实现中，{0} 类封装了五种常用分块策略。固定长度分块使用 {1}，递归字符分块使用 {2}。语义分块的核心逻辑中，使用 {3} 计算句子与 chunk 语义中心的相似度。结构感知分块使用 {4} 按标题层级切分。',
        blanks: ['ChunkingStrategies', 'CharacterTextSplitter', 'RecursiveCharacterTextSplitter', 'cosine_similarity', 'MarkdownHeaderTextSplitter'],
        dragItems: ['ChunkingEvaluator', 'MarkdownHeaderTextSplitter', 'CharacterTextSplitter', 'ChunkingStrategies', 'cosine_similarity', 'RecursiveCharacterTextSplitter', 'SentenceTransformer', 'run_chunking_experiment'],
        explanation: 'ChunkingStrategies 类封装了五种策略；固定长度用 CharacterTextSplitter，递归用 RecursiveCharacterTextSplitter，语义分块用 cosine_similarity 计算相似度，结构感知用 MarkdownHeaderTextSplitter。'
    },
    {
        id: 3, type: 'drag', category: 'drag',
        question: '请将正确的评估指标名称填入关于指标定义与局限性的描述中。',
        sentence: '指标 {0} 的局限性是不关心「有没有找全」，可能遗漏大量相关 chunk 但分数仍高。指标 {1} 的局限性是不衡量 chunk 质量排序，召回 100 个 chunk 其中 8 个相关也能得满分。指标 {2} 需要人工标注，成本高且主观。指标 {3} 受 LLM 本身能力影响大，无法单独归因于 chunking 策略。指标 {4} 需要分析 LLM 的 attention 权重或引用行为，实现复杂。',
        blanks: ['Context Precision@k', 'Context Recall', '边界完整性', '端到端问答准确率', 'Chunk 利用率'],
        dragItems: ['Context Precision@k', '边界完整性', 'Chunk 利用率', 'Context Recall', '端到端问答准确率', 'cosine_similarity', 'MarkdownHeaderTextSplitter', 'Semantic 分块'],
        explanation: 'Precision 不关心找全，Recall 不衡量排序，边界完整性需人工标注，端到端准确率受 LLM 能力影响，Chunk 利用率需分析 attention 或引用行为。'
    },
    {
        id: 4, type: 'drag', category: 'drag',
        question: '请将正确的策略名称填入实验结果对比表中。',
        sentence: '实验结果显示：{0} 在边界完整性上最优（0.88），如果文档有结构化标记应优先使用。{1} 是通用无结构文档的最佳选择（θ=0.85），Recall@5 达到 0.81。{2} 是性价比最高的选择，实现简单、无需额外模型、效果接近 Semantic。{3} 不推荐，除非有极端性能约束。{4} 成本高但质量好，仅在对分块质量要求极高且文档数量不大的场景使用。',
        blanks: ['Markdown 结构感知分块', 'Semantic 分块', 'Recursive 分块', 'Fixed Length 分块', 'Agentic 分块'],
        dragItems: ['Semantic 分块', 'Fixed Length 分块', 'Agentic 分块', 'Recursive 分块', 'Markdown 结构感知分块', '主题分块', '端到端问答准确率', 'Chunk 利用率'],
        explanation: 'Markdown Headers 边界完整性最高（0.88）；Semantic (θ=0.85) 是无结构文档最佳选择；Recursive 性价比最高；Fixed Length 不推荐；Agentic 成本高但质量好。'
    },
    {
        id: 5, type: 'drag', category: 'drag',
        question: '请将正确的参数值填入关于配置建议的句子中。',
        sentence: 'Chunk overlap 建议为 chunk_size 的 {0}。对于快速原型/资源受限环境，推荐 chunk_size={1}、overlap={2} 的 Recursive 策略。对于需要精确位置信息的查询，推荐 chunk_size={3}、overlap={4} 的 Fixed 策略。语义分块中，通用无结构文本推荐 threshold={5}，跨段落综合查询推荐 threshold={6}。',
        blanks: ['10-15%', '512', '50', '256', '25', '0.85', '0.75'],
        dragItems: ['0.85', '512', '256', '10-15%', '50', '0.75', '25', '0.88'],
        explanation: 'overlap 建议 10-15%；快速原型用 Recursive 512/50；精确位置查询用 Fixed 256/25；通用文本 Semantic threshold=0.85；跨段落查询 threshold=0.75。'
    },

    // ---------- 单选题 (10道) ----------
    {
        id: 6, type: 'single', category: 'single',
        question: '以下哪种分块策略在实验中的边界完整性得分最高？',
        options: ['Fixed Length 1024', 'Recursive 512', 'Semantic (θ=0.85)', 'Markdown Headers'],
        answer: 3,
        explanation: '实验结果表显示 Markdown Headers 的边界完整性为 0.88，是所有策略中最高的。Semantic (θ=0.85) 为 0.82，Recursive 512 为 0.71，Fixed 1024 为 0.58。'
    },
    {
        id: 7, type: 'single', category: 'single',
        question: 'Context Precision@k 的计算公式中，分母是什么？',
        options: ['所有相关 chunk 的总数', '检索返回的 top-k 个 chunk 数', '被 LLM 实际引用的 chunk 数', '总查询数'],
        answer: 1,
        explanation: 'Context Precision@k = |Relevant ∩ Retrieved_k| / k，分母是检索返回的 top-k 个 chunk 数，衡量检索结果的信噪比。'
    },
    {
        id: 8, type: 'single', category: 'single',
        question: '在语义分块（semantic）的实现中，为什么使用「与 chunk 平均向量」比较而非仅与前一句比较？',

        answer: 1,
        explanation: '代码注释明确说明：主题可能由多个句子共同表达，平均向量能捕捉当前 chunk 的整体语义中心，而非仅依赖相邻句子的局部关系。'
    },
    {
        id: 9, type: 'single', category: 'single',
        question: 'RecursiveCharacterTextSplitter 的 separators 列表中，优先级最高的分隔符是什么？',
        options: ['句号（。）', '换行（\n）', '段落（\n\n）', '空格（ ）'],
        answer: 2,
        explanation: '代码中 separators=["\\n\\n", "\\n", "。", "，", " ", ""]，优先级顺序就是列表顺序：先尝试按段落（\\n\\n）切，如果仍太长再依次降级。'
    },
    {
        id: 10, type: 'single', category: 'single',
        question: '以下哪种场景最不适合使用 Fixed Length 分块策略？',
        options: ['需要精确位置信息的查询', '跨段落综合查询', '快速原型验证', '资源极度受限的嵌入式设备'],
        answer: 1,
        explanation: 'Fixed Length 常切断语义边界，边界完整性差（0.52-0.58）。跨段落综合查询需要语义连贯性，更适合 Semantic (θ=0.75) 或 Recursive 策略。'
    },
    {
        id: 11, type: 'single', category: 'single',
        question: 'Agentic 分块策略中，LLM 的 temperature 参数设置为多少？',
        options: ['0.5', '0.0', '0.7', '1.0'],
        answer: 1,

    },
    {
        id: 12, type: 'single', category: 'single',
        question: 'ChunkingEvaluator.boundary_completeness() 方法中，当数据不足时返回的默认分数是多少？',
        options: ['0.0', '0.5', '1.0', 'null'],
        answer: 1,
        explanation: '代码中明确：if not intra_sims or not inter_sims: return 0.5，数据不足时返回中性分数 0.5。'
    },
    {
        id: 13, type: 'single', category: 'single',
        question: '在实验结果中，哪种策略的端到端 Recall@5 最低？',
        options: ['Fixed 256', 'Fixed 1024', 'Recursive 512', 'Semantic (θ=0.75)'],
        answer: 0,
        explanation: '结果表显示 Fixed 256 的 Recall@5 为 0.68，是所有策略中最低的。Fixed 1024 为 0.70，Recursive 512 为 0.78，Semantic (θ=0.75) 为 0.79。'
    },
    {
        id: 14, type: 'single', category: 'single',
        question: 'chunk_size_variance 方法返回的变异系数（CV）计算公式是什么？',
        options: ['std / mean', 'mean / std', 'std * mean', 'std + mean'],

    {
        id: 15, type: 'single', category: 'single',
        question: '根据实验结论，对于 Markdown/HTML 技术文档，首选的分块策略是什么？',
        options: ['Semantic (θ=0.85)', 'Recursive 512', 'Markdown Headers', 'Agentic'],
        answer: 2,
        explanation: '配置矩阵明确指出：Markdown/HTML 技术文档应使用 Markdown Headers，利用显式结构信息，边界完整性最高（0.88），零额外成本。'
    },

    // ---------- 多选题 (6道) ----------
    {
        id: 16, type: 'multi', category: 'multi',
        question: '以下哪些属于本实验对比的六种分块策略？（多选）',

// ===================== 状态管理 =====================
let currentIndex = 0;
let userAnswers = {}; // { qid: answer }
let dragStates = {};  // { qid: [blank0, blank1, ...] }
let isShuffled = false;
let originalOptions = {}; // 保存原始选项顺序

function init() {
    // 保存原始选项顺序
    allQuestions.forEach(q => {
        if (q.type === 'single' || q.type === 'multi') {
            originalOptions[q.id] = [...q.options];
        }
    });
    renderCards();
    updateScore();
    showCard(0);
}

function renderCards() {
    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    allQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'card' + (idx === 0 ? ' active' : '');
        card.id = 'card-' + q.id;
        card.dataset.index = idx;

        let html = `<div class="card-header">
            <span class="q-type">${getTypeLabel(q.type)}</span>
            <span class="q-number">${idx + 1} / ${allQuestions.length}</span>
        </div>
        <div class="question-text">${q.question}</div>`;

        if (q.type === 'single') {
            html += `<div class="options">`;
            q.options.forEach((opt, i) => {
                html += `<div class="option" onclick="selectSingle(${q.id}, ${i}, this)">
                    <input type="radio" name="q${q.id}" value="${i}" id="q${q.id}-opt${i}">
                    <span class="opt-label">${String.fromCharCode(65 + i)}</span>
                    <span class="opt-text">${opt}</span>
                </div>`;
            });
            html += `</div>`;
        } else if (q.type === 'multi') {
            html += `<div class="options">`;
            q.options.forEach((opt, i) => {
                html += `<div class="option" onclick="toggleMulti(${q.id}, ${i}, this)">
                    <input type="checkbox" name="q${q.id}" value="${i}" id="q${q.id}-opt${i}">
                    <span class="opt-label">${String.fromCharCode(65 + i)}</span>
                    <span class="opt-text">${opt}</span>
                </div>`;
            });
            html += `</div>`;
        } else if (q.type === 'tf') {
            html += `<div class="true-false-options">
                <div class="option" onclick="selectTF(${q.id}, true, this)">
                    <input type="radio" name="q${q.id}" value="true"> 是 / True
                </div>
                <div class="option" onclick="selectTF(${q.id}, false, this)">
                    <input type="radio" name="q${q.id}" value="false"> 否 / False
                </div>
            </div>`;
        } else if (q.type === 'drag') {
            html += renderDragQuestion(q);
        }

        html += `<div class="explanation" id="exp-${q.id}">
            <div class="explanation-title">解析</div>
            <div>${q.explanation}</div>
        </div>
        <div class="btn-row">
            <button class="btn-primary" onclick="checkAnswer(${q.id})">✓ 检查答案</button>
            <button class="btn-secondary" onclick="resetQuestion(${q.id})">↺ 重置本题</button>
            ${q.type === 'single' || q.type === 'multi' ? `<button class="btn-accent" onclick="shuffleOptions(${q.id})">🎲 重新洗牌选项</button>` : ''}
        </div>`;

        card.innerHTML = html;
        container.appendChild(card);
    });

    // 初始化拖拽事件
    initDragEvents();
}

function getTypeLabel(type) {
    const map = { single: '单选题', multi: '多选题', tf: '判断题', drag: '拖拽填空' };
    return map[type] || type;
}

// ===================== 单选逻辑 =====================
function selectSingle(qid, optIndex, el) {
    const card = document.getElementById('card-' + qid);
    card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
    userAnswers[qid] = optIndex;
    updateScore();
}

// ===================== 多选逻辑 =====================
function toggleMulti(qid, optIndex, el) {
    const cb = el.querySelector('input');
    cb.checked = !cb.checked;
    el.classList.toggle('selected', cb.checked);
    if (!userAnswers[qid]) userAnswers[qid] = [];
    const idx = userAnswers[qid].indexOf(optIndex);
    if (cb.checked && idx === -1) userAnswers[qid].push(optIndex);
    if (!cb.checked && idx !== -1) userAnswers[qid].splice(idx, 1);
    updateScore();
}

// ===================== 判断逻辑 =====================
function selectTF(qid, val, el) {
    const card = document.getElementById('card-' + qid);
    card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
    userAnswers[qid] = val;
    updateScore();
}

// ===================== 拖拽逻辑 =====================
function renderDragQuestion(q) {
    let html = '<div class="drag-container" id="drag-pool-' + q.id + '">';
    // 复制一份 dragItems，避免修改原数组
    const items = [...q.dragItems];
    // Fisher-Yates 洗牌
    for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
    }
    items.forEach(item => {
        html += `<div class="drag-item" draggable="true" data-value="${item}">${item}</div>`;
    });
    html += '</div>';

    let sentence = q.sentence;
    for (let i = 0; i < q.blanks.length; i++) {
        sentence = sentence.replace(`{${i}}`, `<span class="drop-zone" data-blank="${i}" id="blank-${q.id}-${i}"></span>`);
    }
    html += `<div class="fill-sentence">${sentence}</div>`;
    return html;
}

function initDragEvents() {
    document.querySelectorAll('.drag-item').forEach(item => {
        item.addEventListener('dragstart', e => {
            e.dataTransfer.setData('text/plain', item.dataset.value);
            item.classList.add('dragging');
        });
        item.addEventListener('dragend', () => item.classList.remove('dragging'));
    });

    document.querySelectorAll('.drop-zone').forEach(zone => {
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            const val = e.dataTransfer.getData('text/plain');
            zone.textContent = val;
            zone.classList.add('filled');
            const qid = parseInt(zone.id.split('-')[1]);
            const blankIdx = parseInt(zone.dataset.blank);
            if (!dragStates[qid]) dragStates[qid] = [];
            dragStates[qid][blankIdx] = val;
            updateScore();
        });
        // 点击移除
        zone.addEventListener('click', () => {
            if (zone.textContent) {
                zone.textContent = '';
                zone.classList.remove('filled', 'correct-zone', 'wrong-zone');
                const qid = parseInt(zone.id.split('-')[1]);
                const blankIdx = parseInt(zone.dataset.blank);
                if (dragStates[qid]) delete dragStates[qid][blankIdx];
                updateScore();
            }
        });
    });
}

// ===================== 检查答案 =====================
function checkAnswer(qid) {
    const q = allQuestions.find(x => x.id === qid);
    const exp = document.getElementById('exp-' + qid);
    const card = document.getElementById('card-' + qid);
    let correct = false;

    if (q.type === 'single') {
        const ans = userAnswers[qid];
        if (ans === undefined) { alert('请先选择答案'); return; }
        correct = ans === q.answer;
        card.querySelectorAll('.option').forEach((el, i) => {
            el.classList.remove('correct', 'wrong');
            if (i === q.answer) el.classList.add('correct');
            else if (i === ans) el.classList.add('wrong');
        });
    } else if (q.type === 'multi') {
        const ans = userAnswers[qid] || [];
        if (ans.length === 0) { alert('请先选择答案'); return; }
        const correctSet = new Set(q.answer);
        const userSet = new Set(ans);
        correct = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
        card.querySelectorAll('.option').forEach((el, i) => {
            el.classList.remove('correct', 'wrong');
            if (correctSet.has(i)) el.classList.add('correct');
            else if (userSet.has(i)) el.classList.add('wrong');
        });
    } else if (q.type === 'tf') {
        const ans = userAnswers[qid];
        if (ans === undefined) { alert('请先选择答案'); return; }
        correct = ans === q.answer;
        card.querySelectorAll('.option').forEach(el => {
            el.classList.remove('correct', 'wrong');
            const val = el.querySelector('input').value === 'true';
            if (val === q.answer) el.classList.add('correct');
            else if (val === ans) el.classList.add('wrong');
        });
    } else if (q.type === 'drag') {
        const state = dragStates[qid] || [];
        let allFilled = true;
        for (let i = 0; i < q.blanks.length; i++) {
            if (!state[i]) allFilled = false;
        }
        if (!allFilled) { alert('请填满所有空白'); return; }
        correct = true;
        for (let i = 0; i < q.blanks.length; i++) {
            const zone = document.getElementById('blank-' + qid + '-' + i);
            zone.classList.remove('correct-zone', 'wrong-zone');
            if (state[i] === q.blanks[i]) {
                zone.classList.add('correct-zone');
            } else {
                zone.classList.add('wrong-zone');
                correct = false;
            }
        }
    }

    exp.classList.add('show');
    userAnswers[qid + '_checked'] = correct;
    updateScore();
}

// ===================== 重置题目 =====================
function resetQuestion(qid) {
    const q = allQuestions.find(x => x.id === qid);
    const card = document.getElementById('card-' + qid);
    document.getElementById('exp-' + qid).classList.remove('show');
    delete userAnswers[qid];
    delete userAnswers[qid + '_checked'];

    if (q.type === 'single' || q.type === 'tf') {
        card.querySelectorAll('.option').forEach(o => {
            o.classList.remove('selected', 'correct', 'wrong');
            o.querySelector('input').checked = false;
        });
    } else if (q.type === 'multi') {
        card.querySelectorAll('.option').forEach(o => {
            o.classList.remove('selected', 'correct', 'wrong');
            o.querySelector('input').checked = false;
        });
        userAnswers[qid] = [];
    } else if (q.type === 'drag') {
        dragStates[qid] = [];
        card.querySelectorAll('.drop-zone').forEach(z => {
            z.textContent = '';
            z.classList.remove('filled', 'correct-zone', 'wrong-zone');
        });
    }
    updateScore();
}

// ===================== 洗牌选项 =====================
function shuffleOptions(qid) {
    const q = allQuestions.find(x => x.id === qid);
    if (q.type !== 'single' && q.type !== 'multi') return;

    // 保存当前用户选择（按选项内容）
    let selectedValues = [];
    if (q.type === 'single' && userAnswers[qid] !== undefined) {
        selectedValues = [q.options[userAnswers[qid]]];
    } else if (q.type === 'multi' && userAnswers[qid]) {
        selectedValues = userAnswers[qid].map(i => q.options[i]);
    }

    // Fisher-Yates 洗牌
    const indices = q.options.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    // 重新排列选项
    const newOptions = indices.map(i => q.options[i]);
    q.options = newOptions;

    // 更新用户答案索引
    if (q.type === 'single' && selectedValues.length === 1) {
        userAnswers[qid] = q.options.indexOf(selectedValues[0]);
    } else if (q.type === 'multi' && selectedValues.length > 0) {
        userAnswers[qid] = selectedValues.map(v => q.options.indexOf(v)).filter(i => i !== -1);
    }

    // 重新渲染该题
    const card = document.getElementById('card-' + qid);
    const oldActive = card.classList.contains('active');

    // 重建选项 HTML
    let optsHtml = '<div class="options">';
    q.options.forEach((opt, i) => {
        const isSelected = q.type === 'single'
            ? userAnswers[qid] === i
            : (userAnswers[qid] || []).includes(i);
        const selClass = isSelected ? ' selected' : '';
        const inputType = q.type === 'single' ? 'radio' : 'checkbox';
        const checked = isSelected ? 'checked' : '';
        optsHtml += `<div class="option${selClass}" onclick="${q.type === 'single' ? 'selectSingle' : 'toggleMulti'}(${qid}, ${i}, this)">
            <input type="${inputType}" name="q${qid}" value="${i}" ${checked}>
            <span class="opt-label">${String.fromCharCode(65 + i)}</span>
            <span class="opt-text">${opt}</span>
        </div>`;
    });
    optsHtml += '</div>';

    // 替换选项区域
    const optDiv = card.querySelector('.options');
    if (optDiv) optDiv.outerHTML = optsHtml;

    // 恢复 active 状态
    if (oldActive) card.classList.add('active');
}

// ===================== 导航 =====================
function showCard(index) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.getElementById('overviewCard').classList.remove('active');
    document.getElementById('resultCard').classList.remove('active');

    if (index >= 0 && index < allQuestions.length) {
        currentIndex = index;
        document.getElementById('card-' + allQuestions[index].id).classList.add('active');
    } else if (index === allQuestions.length) {
        showResult();
        return;
    }
    updateProgress();
}

function nextQuestion() {
    if (currentIndex < allQuestions.length) {
        showCard(currentIndex + 1);
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        showCard(currentIndex - 1);
    }
}

function showCurrentQuestion() {
    showCard(currentIndex);
}

// ===================== 总览面板 =====================
function showOverview() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.getElementById('overviewCard').classList.add('active');
    renderOverview('all');
}

function renderOverview(filter) {
    const grid = document.getElementById('overviewGrid');
    grid.innerHTML = '';

    allQuestions.forEach((q, idx) => {
        const checked = userAnswers[q.id + '_checked'];
        const answered = userAnswers[q.id] !== undefined || (dragStates[q.id] && dragStates[q.id].some(Boolean));
        let status = 'unanswered';
        if (answered && checked === true) status = 'correct';
        else if (answered && checked === false) status = 'wrong';
        else if (answered) status = 'answered';

        if (filter === 'correct' && status !== 'correct') return;
        if (filter === 'wrong' && status !== 'wrong') return;
        if (filter === 'unanswered' && status !== 'unanswered') return;

        const item = document.createElement('div');
        item.className = 'overview-item';
        if (status === 'correct') item.classList.add('answered');
        if (status === 'wrong') item.classList.add('wrong-ans');
        if (idx === currentIndex) item.classList.add('current');
        item.textContent = idx + 1;
        item.onclick = () => showCard(idx);
        grid.appendChild(item);
    });
}

function filterOverview(type) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderOverview(type);
}

// ===================== 打分系统 =====================
function updateScore() {
    let total = 0, score = 0;
    allQuestions.forEach(q => {
        if (q.type === 'drag') {
            total += q.blanks.length;
            const state = dragStates[q.id] || [];
            let correctCount = 0;
            for (let i = 0; i < q.blanks.length; i++) {
                if (state[i] === q.blanks[i]) correctCount++;
            }
            score += correctCount;
        } else {
            total += 1;
            if (userAnswers[q.id + '_checked'] === true) score += 1;
        }
    });
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('scoreTotal').textContent = total;
    updateProgress();
}

function updateProgress() {
    const answered = Object.keys(userAnswers).filter(k => !k.endsWith('_checked')).length;
    const pct = (answered / allQuestions.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
}

// ===================== 结果页 =====================
function showResult() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.getElementById('resultCard').classList.add('active');

    let total = 0, score = 0;
    let single = 0, multi = 0, tf = 0, drag = 0;
    let singleTotal = 0, multiTotal = 0, tfTotal = 0, dragTotal = 0;

    allQuestions.forEach(q => {
        if (q.type === 'single') { singleTotal++; if (userAnswers[q.id + '_checked'] === true) { score++; single++; } total++; }
        else if (q.type === 'multi') { multiTotal++; if (userAnswers[q.id + '_checked'] === true) { score++; multi++; } total++; }
        else if (q.type === 'tf') { tfTotal++; if (userAnswers[q.id + '_checked'] === true) { score++; tf++; } total++; }
        else if (q.type === 'drag') {
            const state = dragStates[q.id] || [];
            let correctCount = 0;
            for (let i = 0; i < q.blanks.length; i++) {
                if (state[i] === q.blanks[i]) correctCount++;
            }
            dragTotal += q.blanks.length;
            drag += correctCount;
            score += correctCount;
            total += q.blanks.length;
        }
    });

    document.getElementById('finalScore').textContent = score + ' / ' + total;
    document.getElementById('statSingle').textContent = single + '/' + singleTotal;
    document.getElementById('statMulti').textContent = multi + '/' + multiTotal;
    document.getElementById('statTF').textContent = tf + '/' + tfTotal;
    document.getElementById('statDrag').textContent = drag + '/' + dragTotal;
}

// ===================== 重置全部 =====================
function resetAll() {
    userAnswers = {};
    dragStates = {};
    currentIndex = 0;

    // 恢复原始选项顺序
    allQuestions.forEach(q => {
        if ((q.type === 'single' || q.type === 'multi') && originalOptions[q.id]) {
            q.options = [...originalOptions[q.id]];
        }
    });

    renderCards();
    updateScore();
    showCard(0);
}

// ===================== 键盘导航 =====================
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') nextQuestion();
    if (e.key === 'ArrowLeft') prevQuestion();
});

// 初始化
init();
</script>
