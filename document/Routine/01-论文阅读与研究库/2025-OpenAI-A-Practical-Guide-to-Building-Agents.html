         bad:"❌ 常见误解：以为 7 类分类法自带 eval 协议。实际还需要参考 [[01e-agent-verification-eval-latest]]（pass@k、Wilson CI、ablation）补全量化。"},
  follow:"追问：'那 7 类 guardrails 怎么量化？' → 答：(a) relevance/safety classifier 用 labelled eval set + F1；(b) PII filter 用 regex precision/recall；(c) tool safeguards 用 ablation（去掉后失败率提升多少）。",
  link:"2025-OpenAI-A-Practical-Guide-to-Building-Agents.md#局限性与思考" }
];


/* ================= 引擎 ================= */
const allQuestions = [];
dragQuestions.forEach((q,i)=>allQuestions.push({type:'drag',data:q,id:'d'+i}));
singleQuestions.forEach((q,i)=>allQuestions.push({type:'single',data:q,id:'s'+i}));
multiQuestions.forEach((q,i)=>allQuestions.push({type:'multi',data:q,id:'m'+i}));
trueFalseQuestions.forEach((q,i)=>allQuestions.push({type:'tf',data:q,id:'t'+i}));

const state = {};
let cur = 0;
const typeName = {drag:'拖拽填空', single:'单选', multi:'多选', tf:'判断'};
const maxScore = () => allQuestions.length;

function render() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  const item = allQuestions[cur];
  const st = state[item.id] || (state[item.id] = {answered:false, correct:false, sel:null});
  const card = document.createElement('div');
  card.className = 'q-card';
  let html = `<span class="q-tag">${typeName[item.type]}</span><span class="q-paper">${item.data.paper}</span>`;
  if (item.type === 'drag') {
    let txt = item.data.text;
    for (let i=0;i<item.data.answers.length;i++) {
      const filled = st.sel && st.sel[i] ? st.sel[i] : '';
      txt = txt.replace('{'+i+'}', `<span class="blank ${filled?'filled':''}" data-bi="${i}" onclick="clearBlank(${i})">${filled||'　点选填入　'}</span>`);
    }
    html += `<div class="q-text">${txt}</div><div class="pool">` +
      item.data.pool.map((p,pi)=>`<span class="chip ${st.sel&&st.sel.includes(p)?'used':''}" onclick="fillBlank(${pi})">${p}</span>`).join('') + `</div>`;
  } else if (item.type === 'tf') {
    html += `<div class="q-text">${item.data.q}</div>` +
      ['正确','错误'].map((o,i)=>`<button class="opt ${st.sel===i?'sel':''}" onclick="pick(${i})">${o==='正确'?'✔ 正确':'✘ 错误'}</button>`).join('');
  } else {
    html += `<div class="q-text">${item.data.q}</div>` +
      item.data.options.map((o,i)=>{
        const isSel = item.type==='multi' ? (st.sel||[]).includes(i) : st.sel===i;
        let cls = isSel?'sel':'';
        if (st.answered) {
          const good = item.type==='multi' ? item.data.correct.includes(i) : item.data.correct===i;
          if (good) cls='correct'; else if (isSel) cls='wrong';
        }
        return `<button class="opt ${cls}" onclick="pick(${i})">${o}</button>` +
               (st.answered?`<div class="expl" style="display:block">${item.data.expl[i]}</div>`:'');
      }).join('');
  }
  html += `<div class="btns"><button onclick="check()">检查答案</button><button class="ghost" onclick="resetQ()">重置本题</button>`;
  if (st.answered) {
    html += `<a class="dlink" href="${item.data.link}">📖 查看笔记详解</a>`;
    if (item.type==='tf' && item.data.follow) html += `<div class="expl" style="display:block">${item.data.follow}</div>`;
  }
  html += `</div>`;
  card.innerHTML = html;
  area.appendChild(card);
  document.getElementById('progressText').textContent = `第 ${cur+1} / ${allQuestions.length} 题`;
  document.getElementById('progressFill').style.width = ((cur+1)/allQuestions.length*100)+'%';
  updateScore();
}

let blankCursor = 0;
function fillBlank(pi) {
  const item = allQuestions[cur]; if (item.type!=='drag') return;
  const st = state[item.id]; if (st.answered) return;
  const word = item.data.pool[pi];
  st.sel = st.sel || [];
  if (st.sel.includes(word)) return;
  if (st.sel.length >= item.data.answers.length) return;
  st.sel[blankCursor] = word;
  blankCursor = Math.min(blankCursor+1, item.data.answers.length-1);
  render();
}
function clearBlank(bi) {
  const item = allQuestions[cur]; if (item.type!=='drag') return;
  const st = state[item.id]; if (st.answered || !st.sel) return;
  st.sel.splice(bi,1); blankCursor = bi; render();
}
function pick(i) {
  const item = allQuestions[cur]; const st = state[item.id];
  if (st.answered) return;
  if (item.type==='multi') {
    st.sel = st.sel || [];
    const idx = st.sel.indexOf(i);
    if (idx>=0) st.sel.splice(idx,1); else st.sel.push(i);
  } else {
    st.sel = i;
  }
  render();
}
function check() {
  const item = allQuestions[cur]; const st = state[item.id];
  if (!st.sel && st.sel !== 0) return;
  if (item.type==='drag') {
    const correct = item.data.answers.every((a,i)=>st.sel[i]===a);
    st.correct = correct;
  } else if (item.type==='multi') {
    const c = item.data.correct.slice().sort().join(',');
    const s = (st.sel||[]).slice().sort().join(',');
    st.correct = c===s;
  } else if (item.type==='tf') {
    st.correct = (st.sel === (item.data.correct?0:1));
  } else {
    st.correct = (st.sel === item.data.correct);
  }
  st.answered = true;
  if (item.type==='drag') blankCursor = 0;
  render();
}
function resetQ() {
  const item = allQuestions[cur]; state[item.id] = {answered:false, correct:false, sel:null};
  if (item.type==='drag') blankCursor = 0;
  render();
}
function updateScore() {
  let s=0,a=0;
  allQuestions.forEach(it=>{ const st=state[it.id]; if (st.answered) { a++; if (st.correct) s++; } });
  document.getElementById('scoreBar').textContent = `总得分：${s} / ${a}（共 ${allQuestions.length} 题）`;
}
function prevQ() { if (cur>0) { cur--; render(); } }
function nextQ() { if (cur<allQuestions.length-1) { cur++; render(); } }
function openDashboard() { document.getElementById('panel').classList.add('open'); document.getElementById('overlay').classList.add('open'); renderGrid('all'); }
function closeDashboard() { document.getElementById('panel').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
function renderGrid(filter) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  allQuestions.forEach((it,i)=>{
    const st = state[it.id];
    let cls = 'cell';
    if (st && st.answered) cls += st.correct ? ' ok' : ' bad';
    if (filter==='ok' && !(st && st.answered && st.correct)) return;
    if (filter==='bad' && !(st && st.answered && !st.correct)) return;
    if (filter==='todo' && (st && st.answered)) return;
    const cell = document.createElement('div');
    cell.className = cls;
    cell.textContent = `${i+1} (${typeName[it.type].slice(0,2)})`;
    cell.onclick = ()=>{ cur=i; closeDashboard(); render(); };
    grid.appendChild(cell);
  });
}
function resetAll() {
  if (!confirm('重置所有答题记录？')) return;
  allQuestions.forEach(it=>state[it.id]={answered:false,correct:false,sel:null});
  cur=0; render();
}
function showResult() {
  let s=0,a=0;
  allQuestions.forEach(it=>{ const st=state[it.id]; if (st.answered) { a++; if (st.correct) s++; } });
  const total = allQuestions.length;
  const pct = total? Math.round(s/total*100):0;
  const r = document.getElementById('result');
  r.style.display='block';
  r.innerHTML = `<h2>🏁 你的成绩</h2>
    <p style="font-size:2.2rem;margin:12px 0;color:#5c6b4f">${s} / ${total}</p>
    <p>正确率：${pct}% ｜ 已答：${a} / ${total}</p>
    <p style="margin-top:10px;font-size:.85rem;color:#8a8274">${pct>=90?'🏆 工业派双壁之一完全掌握':pct>=75?'👍 基础到位，建议复盘错题':'📖 建议重读 .md 笔记后重做'}</p>
    <div class="btns" style="justify-content:center;margin-top:14px"><button class="ghost" onclick="document.getElementById('result').style.display='none'">关闭</button></div>`;
}
function shuffleAll() {
  singleQuestions.forEach(q=>{ const arr=q.options.map((_,i)=>i); for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } const newOpt=arr.map(i=>q.options[i]); const map=arr.map((o,i)=>[o,i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); q.options=newOpt; if (Array.isArray(q.correct)) q.correct=q.correct.map(i=>map[i]); else q.correct=map[q.correct]; });
  multiQuestions.forEach(q=>{ const arr=q.options.map((_,i)=>i); for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } const newOpt=arr.map(i=>q.options[i]); const map=arr.map((o,i)=>[o,i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); q.options=newOpt; q.correct=q.correct.map(i=>map[i]); });
  trueFalseQuestions.forEach(q=>{ q.correct=Math.random()<0.5; });
  alert('已重新洗牌选项顺序（不影响正确性），刷新页面查看');
}

document.addEventListener('keydown', e=>{
  if (e.key==='ArrowLeft') prevQ();
  if (e.key==='ArrowRight') nextQ();
});

render();
</script>
