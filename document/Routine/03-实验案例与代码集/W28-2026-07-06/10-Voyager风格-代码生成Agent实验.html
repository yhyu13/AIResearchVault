<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验 10：Voyager 风格 — 代码生成 Agent 实验 — 互动知识卡牌</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --primary: #2b6cb0;
    --primary-light: #ebf4ff;
    --accent: #38a169;
    --accent-light: #f0fff4;
    --danger: #e53e3e;
    --danger-light: #fff5f5;
    --warn: #dd6b20;
    --warn-light: #fffaf0;
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #2b6cb0 0%, #3182ce 100%);
    color: #fff; padding: 24px 16px; text-align: center;
    box-shadow: var(--shadow);
  }
  header h1 { margin: 0; font-size: 1.45rem; line-height: 1.3; }
  header p { margin: 8px 0 0; opacity: 0.9; font-size: 0.95rem; }
  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    background: var(--card); padding: 12px 16px; border-radius: var(--radius); margin: 16px 0;
    box-shadow: var(--shadow); position: sticky; top: 0; z-index: 50;
  }
  .toolbar .left, .toolbar .right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.92rem;
    transition: transform .05s, opacity .2s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-warn { background: var(--warn); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-secondary { background: #edf2f7; color: var(--text); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .score-badge {
    background: var(--primary-light); color: var(--primary); padding: 6px 12px; border-radius: 20px;
    font-weight: 700; font-size: 0.95rem;
  }
  .progress-wrap { flex: 1 1 160px; min-width: 140px; }
  .progress-track { height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width .3s; }
  .progress-text { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; text-align: center; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px; margin: 16px 0;
    box-shadow: var(--shadow); display: none;
  }
  .card.active { display: block; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .q-type { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 10px; display: inline-block; padding: 4px 10px; border-radius: 6px; }
  .q-type.single { background: var(--primary-light); color: var(--primary); }
  .q-type.multi { background: var(--warn-light); color: var(--warn); }
  .q-type.tf { background: var(--accent-light); color: var(--accent); }
  .q-type.drag { background: #e9d8fd; color: #6b46c1; }
  .q-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 14px; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: #f7fafc; border: 2px solid var(--border); border-radius: 10px; padding: 12px 14px;
    cursor: pointer; display: flex; align-items: center; gap: 10px; transition: border-color .15s, background .15s;
  }
  .option:hover { border-color: #cbd5e0; background: #edf2f7; }
  .option.selected { border-color: var(--primary); background: var(--primary-light); }
  .option.correct { border-color: var(--accent); background: var(--accent-light); }
  .option.wrong { border-color: var(--danger); background: var(--danger-light); }
  .option .marker {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #cbd5e0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; color: var(--text-secondary);
  }
  .option.selected .marker { border-color: var(--primary); color: var(--primary); }
  .option.correct .marker { border-color: var(--accent); color: var(--accent); }
  .option.wrong .marker { border-color: var(--danger); color: var(--danger); }
  .feedback { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 0.95rem; line-height: 1.6; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--accent-light); color: #22543d; }
  .feedback.wrong { background: var(--danger-light); color: #742a2a; }
  .drag-pool { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .drag-item {
    background: var(--primary-light); color: var(--primary); padding: 8px 14px; border-radius: 8px;
    font-weight: 600; cursor: grab; border: 2px dashed var(--primary); font-size: 0.92rem; user-select: none;
  }
  .drag-item.dragging { opacity: 0.5; }
  .drop-zone {
    display: inline-block; min-width: 100px; height: 36px; line-height: 32px; border: 2px dashed #cbd5e0;
    border-radius: 8px; text-align: center; vertical-align: middle; background: #f7fafc; color: #a0aec0; font-size: 0.9rem; margin: 0 4px; padding: 0 8px;
  }
  .drop-zone.hovered { border-color: var(--primary); background: var(--primary-light); }
  .drop-zone.filled { border-style: solid; border-color: var(--primary); color: var(--primary); background: #ebf4ff; font-weight: 600; }
  .drop-zone.correct { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .drop-zone.wrong { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }
  .sentence { line-height: 2.2; font-size: 1.05rem; }
  .result-panel { text-align: center; padding: 30px 20px; }
  .result-panel h2 { margin: 0 0 10px; font-size: 1.6rem; }
  .result-panel .big-score { font-size: 3rem; font-weight: 800; color: var(--primary); }
  .result-panel .summary { margin: 16px 0; color: var(--text-secondary); }
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; margin-top: 12px; }
  .thumb {
    aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem; cursor: pointer; border: 2px solid transparent; transition: transform .1s;
  }
  .thumb:hover { transform: scale(1.05); }
  .thumb.correct { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .thumb.wrong { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
  .thumb.unanswered { background: #edf2f7; color: #718096; border-color: #e2e8f0; }
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .filter-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 0.85rem; }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .nav-btns { display: flex; justify-content: space-between; margin-top: 18px; }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .left, .toolbar .right { justify-content: space-between; }
    .overview-grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <h1>实验 10：Voyager 风格 — 代码生成 Agent 实验</h1>
  <p>互动知识卡牌 · 终身学习 Minecraft Agent 核心架构</p>
</header>

<div class="container">
  <div class="toolbar">
    <div class="left">
      <span class="score-badge">得分: <span id="scoreDisplay">0</span> / <span id="totalDisplay">0</span></span>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
        <div class="progress-text"><span id="currentNum">0</span> / <span id="totalNum">0</span></div>
      </div>
    </div>
    <div class="right">
      <button class="btn btn-secondary" id="btnPrev">⬅ 上一题</button>
      <button class="btn btn-secondary" id="btnNext">下一题 ➡</button>
      <button class="btn btn-warn" id="btnShuffle">🎲 重新洗牌选项</button>
      <button class="btn btn-primary" id="btnCheck">✓ 检查答案</button>
      <button class="btn btn-secondary" id="btnResetQ">↺ 重置题目</button>
      <button class="btn btn-danger" id="btnResetAll">清空全部</button>
    </div>
  </div>

  <div class="card active" id="overviewCard">
    <h2 style="margin-top:0">📋 总览面板</h2>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="correct">✅ 正确</button>
      <button class="filter-btn" data-filter="wrong">❌ 错误</button>
      <button class="filter-btn" data-filter="unanswered">⭕ 未答</button>
    </div>
    <div class="overview-grid" id="overviewGrid"></div>
    <p style="color:var(--text-secondary);font-size:0.9rem;margin-top:10px">点击缩略图跳转到对应题目。绿色=正确，红色=错误，灰色=未答。</p>
  </div>

  <div id="questionsContainer"></div>

  <div class="card" id="resultCard">
    <div class="result-panel">
      <h2>🎉 答题完成</h2>
      <div class="big-score" id="finalScore">0</div>
      <div class="summary" id="finalSummary"></div>
      <div style="margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="btnReview">🔍 返回查看</button>
        <button class="btn btn-accent" id="btnContinue">📝 继续做题</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ===================== DATA =====================
  const allQuestions = [
    // ---------- 单选题 (10道) ----------
    {
      type: "single",
      question: "Voyager 的核心创新是将动作空间从低层 API 升级为什么？",
      options: [
        "强化学习策略网络",
        "代码生成（Python/Mineflayer API）",
        "预定义行为树",
        "端到端神经网络控制器"
      ],
      answer: 1,
      explanation: "Voyager 的关键洞察是将动作空间设为代码生成，使 Agent 能组合原子技能形成复杂行为。"
    },
    {
      type: "single",
      question: "Voyager 的三层架构不包括以下哪一项？",
      options: [
        "自动课程（Automatic Curriculum）",
        "技能库（Skill Library）",
        "迭代提示（Iterative Prompting）",
        "强化学习训练器（RL Trainer）"
      ],
      answer: 3,
      explanation: "Voyager 的三层架构是自动课程、技能库和迭代提示，不包含强化学习训练器。"
    },
    {
      type: "single",
      question: "在本实验中，技能库的检索策略主要基于什么？",
      options: [
        "Embedding 语义相似度",
        "关键词重叠 + 难度等级接近度 + 成功次数",
        "随机采样",
        "时间最近优先"
      ],
      answer: 1,
      explanation: "本实验使用关键词重叠、level 接近度和 success_count 综合评分，真实 Voyager 使用 embedding 语义检索。"
    },
    {
      type: "single",
      question: "代码生成作为动作空间的主要优势不包括？",
      options: [
        "组合性：代码可以调用其他代码",
        "可验证性：执行即可验证正确性",
        "低延迟：每次动作毫秒级完成",
        "可复用性：成功代码存入技能库"
      ],
      answer: 2,
      explanation: "代码生成的代价之一是延迟高（每次动作需要 LLM 调用，秒级），不是毫秒级。"
    },
    {
      type: "single",
      question: "自动课程（Automatic Curriculum）的核心作用是什么？",
      options: [
        "存储成功代码片段",
        "根据当前能力动态生成递进任务",
        "捕获执行错误并修复代码",
        "执行生成的代码并验证结果"
      ],
      answer: 1,
      explanation: "自动课程根据 Agent 当前能力动态生成由易到难的任务序列，驱动终身学习。"
    },
    {
      type: "single",
      question: "在 `GridWorld` 中，单元格 '#' 代表什么？",
      options: [
        "空地（可通行）",
        "障碍物（不可通行）",
        "木头（可收集资源）",
        "目标点（任务目的地）"
      ],
      answer: 1,
      explanation: "'#' 是障碍物（wall），Agent 不可移动到该位置。"
    },
    {
      type: "single",
      question: "`SkillLibrary` 与标准 RAG 的核心区别是什么？",
      options: [
        "技能库使用向量检索，RAG 使用关键词检索",
        "技能库存储可执行代码，RAG 存储文本段落",
        "技能库需要 GPU 加速，RAG 不需要",
        "技能库只能用于 Minecraft，RAG 通用"
      ],
      answer: 1,
      explanation: "技能库的核心优势是存储可执行代码，可直接运行验证；RAG 存储文本段落，不可直接执行。"
    },
    {
      type: "single",
      question: "`VoyagerAgent.solve_task()` 中，max_retries 的默认值是多少？",
      options: [
        "1 次",
        "2 次",
        "3 次",
        "5 次"
      ],
      answer: 2,
      explanation: "默认 max_retries=3，控制代码生成失败后的最大重试次数。"
    },
    {
      type: "single",
      question: "以下哪项是 `failure_patterns` 中统计的失败类型？",
      options: [
        "LLM API 超时",
        "out_of_bounds（越界）",
        "内存不足",
        "网络连接中断"
      ],
      answer: 1,
      explanation: "代码中分析了 out_of_bounds、wall_blocked、undefined_variable 等失败模式。"
    },
    {
      type: "single",
      question: "如果要将本实验替换为真实 LLM（如 GPT-4），需要修改哪个类？",
      options: [
        "GridWorld",
        "SkillLibrary",
        "SimulatedLLM",
        "VoyagerAgent"
      ],
      answer: 2,
      explanation: "只需重写 SimulatedLLM 的 generate_curriculum、generate_code、repair_code 三个方法为 API 调用即可。"
    },

    // ---------- 多选题 (6道) ----------
    {
      type: "multi",
      question: "Voyager 选择代码生成作为动作空间的理由包括哪些？",
      options: [
        "代码具有组合性，可以调用其他代码",
        "代码可执行，可直接验证正确性",
        "代码可复用，成功片段可存入技能库",
        "代码生成延迟极低，适合实时游戏",
        "代码抽象层次高，一次调用可生成多步行为",
        "代码生成不需要 LLM 支持"
      ],
      answer: [0, 1, 2, 4],
      explanation: "代码生成的延迟高（秒级），且必须依赖 LLM。其余四项均为正确理由。"
    },
    {
      type: "multi",
      question: "`GridWorld` 环境提供的 API 包括哪些？",
      options: [
        "move_up() / move_down() / move_left() / move_right()",
        "collect() — 收集当前位置资源",
        "is_at(r, c) — 检查是否在某位置",
        "train() — 启动终身学习循环",
        "scan() — 扫描周围单元格",
        "get_pos() — 获取当前位置"
      ],
      answer: [0, 1, 2, 4, 5],
      explanation: "train() 是 VoyagerAgent 的方法，不是 GridWorld 的环境 API。"
    },
    {
      type: "multi",
      question: "`SkillLibrary.retrieve_skills()` 的评分因素包括？",
      options: [
        "技能描述与任务描述的关键词重叠度",
        "技能等级与任务等级的接近程度",
        "技能的成功复用次数",
        "技能代码的行数",
        "技能创建的时间戳",
        "技能标签的数量"
      ],
      answer: [0, 1, 2],
      explanation: "评分公式包含：level 接近度（10/(1+abs)）、关键词重叠（overlap*2）、成功次数（success_count*1.5）。"
    },
    {
      type: "multi",
      question: "本实验的评估指标包括哪些？",
      options: [
        "success_rate — 成功任务数 / 总任务数",
        "avg_attempts — 平均每个任务尝试次数",
        "max_level_reached — 成功完成的最高难度等级",
        "skill_library.total_skills — 技能库中存储的成功代码片段数",
        "GPU 利用率",
        "failure_patterns — 失败类型统计"
      ],
      answer: [0, 1, 2, 3, 5],
      explanation: "GPU 利用率不是本实验的评估指标，本实验使用纯 Python 模拟，无需 GPU。"
    },
    {
      type: "multi",
      question: "`SimulatedLLM.repair_code()` 支持哪些错误修复规则？",
      options: [
        "out of bounds — 添加边界检查",
        "blocked by wall — 注入 is_wall 辅助函数",
        "name 'step_count' is not defined — 替换为 env.step_count",
        "API 配额不足 — 切换备用 API key",
        "网络超时 — 增加重试延迟",
        "默认：添加 try-except 包装器"
      ],
      answer: [0, 1, 2, 5],
      explanation: "repair_code 只包含三种规则修复和默认 try-except 包装，不包含 API 配额或网络超时处理。"
    },
    {
      type: "multi",
      question: "以下哪些是本实验提到的扩展方向？",
      options: [
        "替换 SimulatedLLM 为 GPT-4/Claude API",
        "技能库使用 sentence-transformer 做语义检索",
        "维护技能依赖图，检索时自动解析依赖",
        "引入任务复杂度度量平滑课程难度曲线",
        "将 GridWorld 改为 TensorFlow 实现",
        "用 subprocess 或 docker 隔离代码执行"
      ],
      answer: [0, 1, 2, 3, 5],
      explanation: "扩展方向中未提及 TensorFlow 实现，而是提到 3D 扩展（Mineflayer）和沙箱隔离。"
    },

    // ---------- 判断题 (6道) ----------
    {
      type: "tf",
      question: "Voyager 使用梯度下降（gradient descent）来更新 Agent 的策略。",
      answer: false,
      explanation: "错误。Voyager 无需梯度更新，通过自动课程 + 技能库 + 迭代提示实现终身学习。"
    },
    {
      type: "tf",
      question: "在 `generate_curriculum` 中，每第 3 次调用会重试一个已失败的等级进行巩固。",
      answer: true,
      explanation: "正确。代码中 `if failure_history and self.call_count % 3 == 0` 会触发 retry 逻辑。"
    },
    {
      type: "tf",
      question: "技能库中的代码片段可以直接执行验证，而 RAG 检索到的文本段落不能直接执行。",
      answer: true,
      explanation: "正确。这是技能库相比 RAG 的核心优势：可执行、可验证。"
    },
    {
      type: "tf",
      question: "`GridWorld.reset_random()` 中，grid 大小固定为 10×10，不随 level 变化。",
      answer: false,
      explanation: "错误。grid 大小为 `8 + level * 2`，随难度等级动态增加。"
    },
    {
      type: "tf",
      question: "如果 success_rate 高但 avg_attempts 也高，说明 Agent 在记忆而非学习。",
      answer: false,
      explanation: "错误。success_rate 高 + avg_attempts 高说明 Agent 在试错学习，这是正常的终身学习模式，不是记忆。"
    },
    {
      type: "tf",
      question: "本实验使用 2D 网格而非真实 Minecraft 的主要原因是 2D 网格的计算效率更高。",
      answer: false,
      explanation: "错误。主要原因是零外部依赖、确定性、教学价值清晰；计算效率只是附带优势，不是主要原因。"
    },

    // ---------- 拖拽填空题 (4道) ----------
    {
      type: "drag",
      question: "Voyager 三模块架构中，____ 负责生成递进任务，____ 负责存储成功代码，____ 负责从错误中修复代码。",
      blanks: ["自动课程", "技能库", "迭代提示"],
      pool: ["自动课程", "技能库", "迭代提示", "强化学习", "环境模拟器", "奖励函数"],
      explanation: "三模块各司其职：自动课程生成任务，技能库存储代码，迭代提示修复错误。"
    },
    {
      type: "drag",
      question: "在 `GridWorld` 中，'W' 代表 ____，'S' 代表 ____，'T' 代表 ____。",
      blanks: ["木头", "石头", "目标点"],
      pool: ["木头", "石头", "目标点", "玩家", "障碍物", "空地"],
      explanation: "W=木头（wood），S=石头（stone），T=目标点（goal），P=玩家（player），#=障碍物（wall），.=空地（empty）。"
    },
    {
      type: "drag",
      question: "`VoyagerAgent` 的终身学习循环顺序是：生成 ____ → 生成 ____ → 执行代码 → 失败则 ____ → 成功则存入 ____。",
      blanks: ["任务", "代码", "修复", "技能库"],
      pool: ["任务", "代码", "修复", "技能库", "奖励", "梯度"],
      explanation: "循环流程：自动课程生成任务 → LLM 生成代码 → 执行 → 失败则迭代修复 → 成功则存入技能库。"
    },
    {
      type: "drag",
      question: "`SkillLibrary.retrieve_skills()` 的评分公式中，____ 接近度加分，____ 重叠加分，____ 次数加分。",
      blanks: ["等级", "关键词", "成功复用"],
      pool: ["等级", "关键词", "成功复用", "代码行数", "创建时间", "标签数量"],
      explanation: "评分依据：等级接近度（10/(1+abs)）、关键词重叠（overlap*2）、成功复用次数（success_count*1.5）。"
    }
  ];

  // ===================== STATE =====================
  let currentIndex = 0;
  let answers = {};       // qIndex -> answer
  let checked = {};       // qIndex -> boolean
  let score = 0;
  let shuffledOptions = {}; // qIndex -> array of original indices
  let currentFilter = "all";

  const container = document.getElementById("questionsContainer");
  const overviewCard = document.getElementById("overviewCard");
  const resultCard = document.getElementById("resultCard");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const totalDisplay = document.getElementById("totalDisplay");
  const progressBar = document.getElementById("progressBar");
  const currentNum = document.getElementById("currentNum");
  const totalNum = document.getElementById("totalNum");
  const overviewGrid = document.getElementById("overviewGrid");

  // ===================== INIT =====================
  function init() {
    totalDisplay.textContent = getTotalPoints();
    totalNum.textContent = allQuestions.length;
    buildCards();
    buildOverview();
    updateProgress();
    showCard(0);
  }

  function getTotalPoints() {
    let total = 0;
    allQuestions.forEach(q => {
      if (q.type === "single" || q.type === "tf") total += 1;
      else if (q.type === "multi") total += q.answer.length;
      else if (q.type === "drag") total += q.blanks.length;
    });
    return total;
  }

  function buildCards() {
    container.innerHTML = "";
    allQuestions.forEach((q, idx) => {
      const card = document.createElement("div");
      card.className = "card";
      card.id = "card-" + idx;
      card.dataset.index = idx;

      const typeLabel = { single: "单选题", multi: "多选题", tf: "判断题", drag: "拖拽填空" }[q.type];
      const typeClass = { single: "single", multi: "multi", tf: "tf", drag: "drag" }[q.type];

      let html = `<div class="q-type ${typeClass}">${typeLabel}</div>`;
      html += `<div class="q-title">${idx + 1}. ${escapeHtml(q.question)}</div>`;

      if (q.type === "single" || q.type === "multi") {
        html += `<div class="options" id="opts-${idx}"></div>`;
      } else if (q.type === "tf") {
        html += `<div class="options" id="opts-${idx}">
          <div class="option" data-val="true" onclick="selectTF(${idx}, true)"><span class="marker">✓</span> 是</div>
          <div class="option" data-val="false" onclick="selectTF(${idx}, false)"><span class="marker">✗</span> 否</div>
        </div>`;
      } else if (q.type === "drag") {
        html += `<div class="drag-pool" id="pool-${idx}"></div>`;
        html += `<div class="sentence" id="sentence-${idx}"></div>`;
      }

      html += `<div class="feedback" id="fb-${idx}"></div>`;
      card.innerHTML = html;
      container.appendChild(card);

      if (q.type === "single" || q.type === "multi") {
        renderOptions(idx);
      } else if (q.type === "drag") {
        renderDrag(idx);
      }
    });
  }

  function renderOptions(idx) {
    const q = allQuestions[idx];
    const optsDiv = document.getElementById("opts-" + idx);
    if (!optsDiv) return;
    let order = shuffledOptions[idx];
    if (!order) {
      order = q.options.map((_, i) => i);
      if (q.type === "single") {
        // Fisher-Yates shuffle
        for (let i = order.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
      }
      shuffledOptions[idx] = order;
    }
    optsDiv.innerHTML = "";
    order.forEach((origIdx, pos) => {
      const opt = document.createElement("div");
      opt.className = "option";
      opt.dataset.orig = origIdx;
      opt.dataset.pos = pos;
      const marker = q.type === "single" ? String.fromCharCode(65 + pos) : "☐";
      opt.innerHTML = `<span class="marker">${marker}</span> ${escapeHtml(q.options[origIdx])}`;
      opt.onclick = () => selectOption(idx, pos, origIdx);
      optsDiv.appendChild(opt);
    });
  }

  function renderDrag(idx) {
    const q = allQuestions[idx];
    const pool = document.getElementById("pool-" + idx);
    const sentence = document.getElementById("sentence-" + idx);
    if (!pool || !sentence) return;

    // Shuffle pool items
    const poolItems = [...q.pool];
    for (let i = poolItems.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [poolItems[i], poolItems[j]] = [poolItems[j], poolItems[i]];
    }

    pool.innerHTML = "";
    poolItems.forEach((text, i) => {
      const item = document.createElement("div");
      item.className = "drag-item";
      item.draggable = true;
      item.textContent = text;
      item.dataset.text = text;
      item.dataset.poolIdx = i;
      item.addEventListener("dragstart", e => {
        item.classList.add("dragging");
        e.dataTransfer.setData("text/plain", text);
        e.dataTransfer.setData("sourceIdx", idx);
      });
      item.addEventListener("dragend", () => item.classList.remove("dragging"));
      pool.appendChild(item);
    });

    // Build sentence with drop zones
    let parts = q.question.split("____");
    let html = parts[0];
    for (let i = 1; i < parts.length; i++) {
      html += `<span class="drop-zone" data-blank="${i-1}" data-qidx="${idx}" ondragover="allowDrop(event)" ondrop="dropFill(event)" ondragleave="leaveDrop(event)">拖拽填入</span>` + parts[i];
    }
    sentence.innerHTML = html;

    // Restore filled answers
    const ans = answers[idx];
    if (ans && Array.isArray(ans)) {
      const zones = sentence.querySelectorAll(".drop-zone");
      zones.forEach((z, i) => {
        if (ans[i] !== undefined && ans[i] !== null) {
          z.textContent = ans[i];
          z.classList.add("filled");
        }
      });
    }
  }

  // ===================== INTERACTION =====================
  function selectOption(idx, pos, origIdx) {
    if (checked[idx]) return;
    const q = allQuestions[idx];
    const optsDiv = document.getElementById("opts-" + idx);
    const opts = optsDiv.querySelectorAll(".option");

    if (q.type === "single") {
      opts.forEach(o => o.classList.remove("selected"));
      opts[pos].classList.add("selected");
      answers[idx] = origIdx;
    } else {
      opts[pos].classList.toggle("selected");
      let sel = answers[idx] || [];
      if (sel.includes(origIdx)) {
        sel = sel.filter(x => x !== origIdx);
      } else {
        sel.push(origIdx);
      }
      answers[idx] = sel.sort((a, b) => a - b);
    }
    updateOverviewThumb(idx);
  }

  function selectTF(idx, val) {
    if (checked[idx]) return;
    const optsDiv = document.getElementById("opts-" + idx);
    const opts = optsDiv.querySelectorAll(".option");
    opts.forEach(o => o.classList.remove("selected"));
    opts[val === true ? 0 : 1].classList.add("selected");
    answers[idx] = val;
    updateOverviewThumb(idx);
  }

  window.allowDrop = function(ev) { ev.preventDefault(); };
  window.leaveDrop = function(ev) { ev.target.classList.remove("hovered"); };
  window.dropFill = function(ev) {
    ev.preventDefault();
    const zone = ev.target;
    zone.classList.remove("hovered");
    const text = ev.dataTransfer.getData("text/plain");
    const qidx = parseInt(zone.dataset.qidx);
    const blankIdx = parseInt(zone.dataset.blank);
    if (checked[qidx]) return;
    zone.textContent = text;
    zone.classList.add("filled");
    let ans = answers[qidx] || [];
    ans[blankIdx] = text;
    answers[qidx] = ans;
    updateOverviewThumb(qidx);
  };

  // ===================== CHECK =====================
  function checkCurrent() {
    const idx = currentIndex;
    const q = allQuestions[idx];
    if (checked[idx]) return;
    checked[idx] = true;

    let isCorrect = false;
    let fb = "";
    let points = 0;

    if (q.type === "single") {
      const ans = answers[idx];
      isCorrect = ans === q.answer;
      points = isCorrect ? 1 : 0;
      fb = isCorrect ? `✅ 正确！${q.explanation}` : `❌ 错误。正确答案是 ${String.fromCharCode(65 + getShuffledPos(idx, q.answer))}。${q.explanation}`;
      highlightSingle(idx, q.answer, ans);
    } else if (q.type === "multi") {
      const ans = answers[idx] || [];
      const correct = q.answer;
      const isAllCorrect = correct.every(c => ans.includes(c)) && ans.every(a => correct.includes(a));
      isCorrect = isAllCorrect;
      points = isAllCorrect ? correct.length : 0;
      fb = isAllCorrect ? `✅ 完全正确！${q.explanation}` : `❌ 错误。正确选项为 ${correct.map(c => String.fromCharCode(65 + getShuffledPos(idx, c))).join(", ")}。${q.explanation}`;
      highlightMulti(idx, correct, ans);
    } else if (q.type === "tf") {
      const ans = answers[idx];
      isCorrect = ans === q.answer;
      points = isCorrect ? 1 : 0;
      fb = isCorrect ? `✅ 正确！${q.explanation}` : `❌ 错误。正确答案是 ${q.answer ? "是" : "否"}。${q.explanation}`;
      highlightTF(idx, q.answer, ans);
    } else if (q.type === "drag") {
      const ans = answers[idx] || [];
      const correct = q.blanks;
      let allCorrect = true;
      let correctCount = 0;
      ans.forEach((a, i) => { if (a === correct[i]) correctCount++; });
      allCorrect = correctCount === correct.length;
      isCorrect = allCorrect;
      points = correctCount;
      fb = allCorrect ? `✅ 完全正确！${q.explanation}` : `❌ 部分错误。正确填入：${correct.join("、")}。${q.explanation}`;
      highlightDrag(idx, correct, ans);
    }

    score += points;
    scoreDisplay.textContent = score;
    showFeedback(idx, fb, isCorrect);
    updateOverviewThumb(idx);
    updateProgress();
  }

  function getShuffledPos(qIdx, origIdx) {
    const order = shuffledOptions[qIdx];
    return order.indexOf(origIdx);
  }

  function highlightSingle(idx, correctOrig, selectedOrig) {
    const opts = document.querySelectorAll(`#opts-${idx} .option`);
    opts.forEach(o => {
      const orig = parseInt(o.dataset.orig);
      o.classList.remove("selected");
      if (orig === correctOrig) o.classList.add("correct");
      else if (orig === selectedOrig && selectedOrig !== correctOrig) o.classList.add("wrong");
    });
  }

  function highlightMulti(idx, correctOrigs, selectedOrigs) {
    const opts = document.querySelectorAll(`#opts-${idx} .option`);
    opts.forEach(o => {
      const orig = parseInt(o.dataset.orig);
      o.classList.remove("selected");
      if (correctOrigs.includes(orig)) o.classList.add("correct");
      else if (selectedOrigs && selectedOrigs.includes(orig)) o.classList.add("wrong");
    });
  }

  function highlightTF(idx, correctVal, selectedVal) {
    const opts = document.querySelectorAll(`#opts-${idx} .option`);
    opts.forEach(o => {
      const val = o.dataset.val === "true";
      o.classList.remove("selected");
      if (val === correctVal) o.classList.add("correct");
      else if (val === selectedVal && selectedVal !== correctVal) o.classList.add("wrong");
    });
  }

  function highlightDrag(idx, correct, ans) {
    const zones = document.querySelectorAll(`#sentence-${idx} .drop-zone`);
    zones.forEach((z, i) => {
      z.classList.remove("filled");
      if (ans[i] === correct[i]) z.classList.add("correct");
      else z.classList.add("wrong");
    });
  }

  function showFeedback(idx, text, isCorrect) {
    const fb = document.getElementById("fb-" + idx);
    fb.textContent = text;
    fb.className = "feedback show " + (isCorrect ? "correct" : "wrong");
  }

  // ===================== NAVIGATION =====================
  function showCard(idx) {
    if (idx < 0) idx = 0;
    if (idx >= allQuestions.length) {
      // Show result
      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      resultCard.classList.add("active");
      showResult();
      currentIndex = allQuestions.length;
      updateProgress();
      return;
    }
    currentIndex = idx;
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
    const target = document.getElementById("card-" + idx);
    if (target) target.classList.add("active");
    else if (idx === -1) overviewCard.classList.add("active");
    updateProgress();
  }

  function showResult() {
    const total = getTotalPoints();
    const pct = total > 0 ? Math.round((score / total) * 100) : 0;
    document.getElementById("finalScore").textContent = score + " / " + total;
    let msg = "";
    if (pct >= 90) msg = "🌟  excellent！你对 Voyager 架构理解非常深入！";
    else if (pct >= 70) msg = "👍 良好！大部分核心概念已掌握，继续加油！";
    else if (pct >= 50) msg = "📚 及格。建议重新阅读实验文档，重点关注错题。";
    else msg = "💪 需要加强。建议逐题对照文档复习后再试。";
    document.getElementById("finalSummary").textContent = msg + " 正确率：" + pct + "%";
  }

  function updateProgress() {
    let displayIdx = currentIndex;
    if (displayIdx >= allQuestions.length) displayIdx = allQuestions.length;
    if (displayIdx < 0) displayIdx = 0;
    currentNum.textContent = displayIdx;
    const pct = allQuestions.length > 0 ? (displayIdx / allQuestions.length) * 100 : 0;
    progressBar.style.width = pct + "%";
  }

  // ===================== OVERVIEW =====================
  function buildOverview() {
    overviewGrid.innerHTML = "";
    allQuestions.forEach((q, idx) => {
      const thumb = document.createElement("div");
      thumb.className = "thumb unanswered";
      thumb.textContent = idx + 1;
      thumb.dataset.index = idx;
      thumb.onclick = () => { showCard(idx); };
      overviewGrid.appendChild(thumb);
    });
  }

  function updateOverviewThumb(idx) {
    const thumbs = overviewGrid.querySelectorAll(".thumb");
    const thumb = thumbs[idx];
    if (!thumb) return;
    thumb.classList.remove("unanswered", "correct", "wrong");
    if (checked[idx]) {
      const isCorrect = isQuestionCorrect(idx);
      thumb.classList.add(isCorrect ? "correct" : "wrong");
    } else if (hasAnswer(idx)) {
      thumb.classList.add("unanswered"); // answered but not checked yet
      thumb.style.borderColor = "var(--primary)";
    } else {
      thumb.classList.add("unanswered");
      thumb.style.borderColor = "";
    }
    applyFilter();
  }

  function hasAnswer(idx) {
    const ans = answers[idx];
    if (ans === undefined || ans === null) return false;
    if (Array.isArray(ans) && ans.length === 0) return false;
    if (allQuestions[idx].type === "drag" && Array.isArray(ans)) {
      return ans.some(a => a !== undefined && a !== null);
    }
    return true;
  }

  function isQuestionCorrect(idx) {
    const q = allQuestions[idx];
    const ans = answers[idx];
    if (q.type === "single") return ans === q.answer;
    if (q.type === "tf") return ans === q.answer;
    if (q.type === "multi") {
      const correct = q.answer;
      return correct.every(c => (ans || []).includes(c)) && (ans || []).every(a => correct.includes(a));
    }
    if (q.type === "drag") {
      return (ans || []).every((a, i) => a === q.blanks[i]);
    }
    return false;
  }

  function applyFilter() {
    const thumbs = overviewGrid.querySelectorAll(".thumb");
    thumbs.forEach(thumb => {
      const idx = parseInt(thumb.dataset.index);
      let show = true;
      if (currentFilter === "correct") show = checked[idx] && isQuestionCorrect(idx);
      else if (currentFilter === "wrong") show = checked[idx] && !isQuestionCorrect(idx);
      else if (currentFilter === "unanswered") show = !checked[idx];
      thumb.style.display = show ? "flex" : "none";
    });
  }

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      applyFilter();
    });
  });

  // ===================== RESET =====================
  function resetQuestion(idx) {
    checked[idx] = false;
    delete answers[idx];
    const q = allQuestions[idx];
    if (q.type === "single" || q.type === "multi") {
      renderOptions(idx);
    } else if (q.type === "tf") {
      const opts = document.querySelectorAll(`#opts-${idx} .option`);
      opts.forEach(o => o.classList.remove("selected", "correct", "wrong"));
    } else if (q.type === "drag") {
      renderDrag(idx);
    }
    const fb = document.getElementById("fb-" + idx);
    if (fb) { fb.className = "feedback"; fb.textContent = ""; }
    updateOverviewThumb(idx);
    recalcScore();
  }

  function resetAll() {
    answers = {};
    checked = {};
    score = 0;
    shuffledOptions = {};
    scoreDisplay.textContent = "0";
    buildCards();
    buildOverview();
    applyFilter();
    showCard(0);
  }

  function recalcScore() {
    let newScore = 0;
    allQuestions.forEach((q, idx) => {
      if (!checked[idx]) return;
      if (q.type === "single" || q.type === "tf") {
        if (isQuestionCorrect(idx)) newScore += 1;
      } else if (q.type === "multi") {
        if (isQuestionCorrect(idx)) newScore += q.answer.length;
      } else if (q.type === "drag") {
        const ans = answers[idx] || [];
        ans.forEach((a, i) => { if (a === q.blanks[i]) newScore += 1; });
      }
    });
    score = newScore;
    scoreDisplay.textContent = score;
  }

  // ===================== SHUFFLE =====================
  function shuffleCurrentOptions() {
    const idx = currentIndex;
    if (idx < 0 || idx >= allQuestions.length) return;
    const q = allQuestions[idx];
    if (q.type !== "single" && q.type !== "multi") return;
    if (checked[idx]) return; // cannot shuffle after check
    delete shuffledOptions[idx];
    renderOptions(idx);
    // Restore selections based on original index
    const ans = answers[idx];
    if (ans !== undefined && ans !== null) {
      const opts = document.querySelectorAll(`#opts-${idx} .option`);
      if (q.type === "single") {
        opts.forEach(o => { if (parseInt(o.dataset.orig) === ans) o.classList.add("selected"); });
      } else {
        opts.forEach(o => { if ((ans || []).includes(parseInt(o.dataset.orig))) o.classList.add("selected"); });
      }
    }
  }

  // ===================== UTILS =====================
  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ===================== EVENTS =====================
  document.getElementById("btnPrev").addEventListener("click", () => showCard(currentIndex - 1));
  document.getElementById("btnNext").addEventListener("click", () => showCard(currentIndex + 1));
  document.getElementById("btnCheck").addEventListener("click", checkCurrent);
  document.getElementById("btnResetQ").addEventListener("click", () => resetQuestion(currentIndex));
  document.getElementById("btnResetAll").addEventListener("click", resetAll);
  document.getElementById("btnShuffle").addEventListener("click", shuffleCurrentOptions);
  document.getElementById("btnReview").addEventListener("click", () => { showCard(0); });
  document.getElementById("btnContinue").addEventListener("click", () => { showCard(0); });

  // Keyboard shortcuts
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") showCard(currentIndex - 1);
    if (e.key === "ArrowRight") showCard(currentIndex + 1);
  });

  init();
})();
</script>
</body>
</html>
