<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验 13：Cicero 风格——谈判 Agent 实验</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --accent-light: #85c1e9;
            --success: #27ae60;
            --success-light: #a9dfbf;
            --danger: #e74c3c;
            --danger-light: #f5b7b1;
            --warning: #f39c12;
            --warning-light: #fad7a0;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #e1e8ed;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
        }

        header h1 { font-size: 1.8rem; margin-bottom: 8px; }
        header .subtitle { font-size: 0.95rem; opacity: 0.85; }

        .progress-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 0 0 12px 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-text { font-size: 0.85rem; color: var(--text-light); white-space: nowrap; }

        .score-panel {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .score-badge {
            background: var(--primary);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-family: inherit;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2980b9; transform: translateY(-1px); }

        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #219a52; }

        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #c0392b; }

        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d68910; }

        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { background: #d5dbdb; }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .q-number {
            background: var(--accent);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .card-title .q-type {
            font-size: 0.75rem;
            color: var(--text-light);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: auto;
        }

        .question-text { font-size: 1rem; margin-bottom: 16px; line-height: 1.7; }

        .options { display: flex; flex-direction: column; gap: 10px; }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 8px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg);
        }

        .option:hover { border-color: var(--accent-light); background: #f0f8ff; }

        .option.selected { border-color: var(--accent); background: #ebf5fb; }

        .option.correct { border-color: var(--success); background: var(--success-light); }
        .option.wrong { border-color: var(--danger); background: var(--danger-light); }
        .option.correct-answer { border-color: var(--success); background: #d5f5e3; }

        .option input { margin-top: 3px; flex-shrink: 0; }

        .option-label { font-weight: 500; min-width: 24px; }

        .drop-zone {
            display: inline-block;
            min-width: 120px;
            min-height: 36px;
            padding: 6px 12px;
            border: 2px dashed var(--accent);
            border-radius: 6px;
            background: #f0f8ff;
            vertical-align: middle;
            text-align: center;
            margin: 0 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .drop-zone.drag-over { background: var(--accent-light); border-style: solid; }
        .drop-zone.filled { border-style: solid; border-color: var(--success); background: var(--success-light); }
        .drop-zone.wrong-fill { border-color: var(--danger); background: var(--danger-light); }

        .draggable-item {
            display: inline-block;
            padding: 8px 16px;
            background: var(--accent);
            color: white;
            border-radius: 6px;
            cursor: grab;
            margin: 4px;
            font-size: 0.9rem;
            user-select: none;
            transition: transform 0.15s;
        }

        .draggable-item:active { cursor: grabbing; transform: scale(1.05); }
        .draggable-item.dragging { opacity: 0.6; }

        .drag-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 16px;
            min-height: 60px;
        }

        .fill-sentence { font-size: 1rem; line-height: 2.2; margin-bottom: 16px; }

        .true-false-options { display: flex; gap: 16px; }

        .tf-option {
            flex: 1;
            padding: 14px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid var(--border);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tf-option:hover { border-color: var(--accent); }
        .tf-option.selected { border-color: var(--accent); background: #ebf5fb; }
        .tf-option.correct { border-color: var(--success); background: var(--success-light); }
        .tf-option.wrong { border-color: var(--danger); background: var(--danger-light); }

        .feedback {
            margin-top: 16px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }

        .feedback.show { display: block; }
        .feedback.correct { background: var(--success-light); border: 1px solid var(--success); }
        .feedback.wrong { background: var(--danger-light); border: 1px solid var(--danger); }

        .feedback-title { font-weight: 600; margin-bottom: 8px; }
        .feedback.correct .feedback-title { color: var(--success); }
        .feedback.wrong .feedback-title { color: var(--danger); }

        .feedback-text { color: var(--text); font-size: 0.9rem; line-height: 1.6; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            margin-top: 16px;
        }

        .overview-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid var(--border);
            background: var(--bg);
        }

        .overview-item:hover { transform: scale(1.1); }
        .overview-item.correct { background: var(--success-light); border-color: var(--success); color: var(--success); }
        .overview-item.wrong { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
        .overview-item.unanswered { background: var(--warning-light); border-color: var(--warning); color: var(--warning); }

        .filter-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .result-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .result-score {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent);
            margin: 20px 0;
        }

        .result-message { font-size: 1.2rem; color: var(--text-light); margin-bottom: 24px; }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: 0 auto 24px;
        }

        .stat-box {
            background: var(--bg);
            padding: 16px;
            border-radius: 8px;
        }

        .stat-number { font-size: 1.5rem; font-weight: 700; }

        .hidden { display: none !important; }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 32px 0 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.4rem; }
            .result-stats { grid-template-columns: repeat(2, 1fr); }
            .nav-buttons { flex-wrap: wrap; }
            .btn { padding: 8px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>实验 13：Cicero 风格——谈判 Agent 实验</h1>
            <p class="subtitle">简化版 Diplomacy 谈判模拟 · 双系统架构 · 意图过滤</p>
        </header>

        <div class="progress-bar">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="progressText">0 / 0</span>
            <div class="score-panel">
                <span class="score-badge" id="scoreBadge">得分: 0</span>
                <button class="btn btn-secondary" onclick="toggleOverview()">📊 总览</button>
                <button class="btn btn-warning" onclick="shuffleOptions()">🎲 重新洗牌</button>
            </div>
        </div>

        <div id="quizContainer"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
            <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">✓ 检查答案</button>
            <button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
        </div>

        <div class="card hidden" id="overviewCard">
            <div class="card-title">📊 答题总览</div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterOverview('all')">全部</button>
                <button class="filter-btn" onclick="filterOverview('correct')">✓ 正确</button>
                <button class="filter-btn" onclick="filterOverview('wrong')">✗ 错误</button>
                <button class="filter-btn" onclick="filterOverview('unanswered')">? 未答</button>
            </div>
            <div class="overview-grid" id="overviewGrid"></div>
            <div style="margin-top: 16px; text-align: center;">
                <button class="btn btn-danger" onclick="resetAll()">🔄 重置全部</button>
            </div>
        </div>

        <div class="card hidden" id="resultCard">
            <div class="result-screen">
                <h2>🎉 答题完成！</h2>
                <div class="result-score" id="finalScore">0</div>
                <div class="result-message" id="resultMessage"></div>
                <div class="result-stats">
                    <div class="stat-box">
                        <div class="stat-number" id="statSingle">0/0</div>
                        <div>单选题</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="statMulti">0/0</div>
                        <div>多选题</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="statTF">0/0</div>
                        <div>判断题</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="statDrag">0/0</div>
                        <div>拖拽题</div>
                    </div>
                </div>
                <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
                    <button class="btn btn-secondary" onclick="backToReview()">返回查看</button>
                    <button class="btn btn-primary" onclick="continueQuiz()">继续做题</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ==================== 题目数据 ====================
    const allQuestions = [
        // ===== 单选题 (10道) =====
        {
            type: "single",
            question: "Cicero 的双系统架构中，哪个模块负责生成谈判文本？",
            options: [
                "战略规划模型（Strategic Module）",
                "语言模型（Language Module）",
                "意图过滤（Intent Filter）",
                "棋局评估器（State Evaluator）"
            ],
            answer: 1,
            explanation: "语言模型负责理解对话、生成谈判文本、解析玩家意图。战略规划模型负责评估棋局价值和选择最优行动，意图过滤负责检查承诺是否可兑现。"
        },
        {
            type: "single",
            question: "在简化版 Diplomacy 中，胜利条件是什么？",
            options: [
                "消灭所有敌方单位",
                "控制 3 个领土即可获胜，或 10 轮后领土最多者胜",
                "占领中心领土 T2 即获胜",
                "达成三方联盟协议"
            ],
            answer: 1,
            explanation: "根据实验设计，控制 3 个领土即可获胜；若 10 轮后无人达到 3 个领土，则领土最多者获胜。"
        },
        {
            type: "single",
            question: "本实验中，战略模块使用的搜索算法是什么？",
            options: [
                "蒙特卡洛树搜索（MCTS）",
                "Alpha-Beta 剪枝",
                "Minimax + 棋局评估（简化版）",
                "深度强化学习（DQN）"
            ],
            answer: 2,
            explanation: "本实验使用手工设计的棋局评估函数 + 简化版 Minimax 搜索（depth=2）。真实 Cicero 使用类似 AlphaZero 的神经网络 + MCTS。"
        },
        {
            type: "single",
            question: "在棋局评估函数 V(s) 中，中心领土 T2 的价值权重是多少？",
            options: [
                "1.0",
                "1.5",
                "2.0",
                "3.0"
            ],
            answer: 2,
            explanation: "代码中 territory_values 定义：T1=1.0, T2=2.0, T3=1.0, T4=1.5, T5=1.5。T2 是中心节点，连接 T1/T3/T4，战略价值最高。"
        },
        {
            type: "single",
            question: "当 Agent 收到 'threat' 类型的消息时，信任度变化是多少？",
            options: [
                "+0.1",
                "-0.1",
                "-0.3",
                "+0.3"
            ],
            answer: 2,
            explanation: "根据 parse_incoming() 中的信任度更新规则：threat 类型消息的 trust_delta = -0.3，表示威胁大幅降低信任。"
        },
        {
            type: "single",
            question: "在 resolve_moves() 的冲突结算中，攻击方成功占领的条件是什么？",
            options: [
                "攻击方力量大于等于防守方力量",
                "攻击方力量严格大于防守方力量，且为唯一最大力量者",
                "攻击方力量大于防守方力量，平局时攻击方胜",
                "只要有支持，攻击方必定成功"
            ],
            answer: 1,
            explanation: "代码中明确：attack_power > defend_power，且 len(attackers)==1 且 attackers[0]==a.power 且 attack_power==max_power。即必须严格大于且是唯一最大力量者。"
        },
        {
            type: "single",
            question: "意图过滤的核心作用是什么？",
            options: [
                "生成更有说服力的谈判文本",
                "确保 Agent 的承诺与计划行动一致，避免'说一套做一套'",
                "提高棋局评估的准确性",
                "加速 Minimax 搜索速度"
            ],
            answer: 1,
            explanation: "意图过滤在消息发送前检查承诺是否能被计划行动兑现。若不能兑现则拦截消息，防止 Agent 做出无法兑现的承诺。"
        },
        {
            type: "single",
            question: "本实验中，Agent 的决策顺序是什么？",
            options: [
                "生成消息 → 计划行动 → 意图过滤 → 执行",
                "计划行动 → 生成消息 → 意图过滤 → 执行",
                "意图过滤 → 计划行动 → 生成消息 → 执行",
                "计划行动 → 意图过滤 → 生成消息 → 执行"
            ],
            answer: 1,
            explanation: "根据 act() 方法：1) 先由战略模块计划行动；2) 再由语言模块生成消息；3) 意图过滤拦截不一致的承诺；4) 执行战略行动。先计划行动再生成消息确保了意图过滤的有效性。"
        },
        {
            type: "single",
            question: "在简化版 Minimax 中，Agent 对对手行动的假设是什么？",
            options: [
                "对手随机选择行动",
                "对手总是选择对我方最不利的行动（最小化我方评估值）",
                "对手会模仿我方的上一轮行动",
                "对手总是选择 HOLD"
            ],
            answer: 1,
            explanation: "代码注释说明：本实现是简化版 Minimax，核心假设是'其他所有势力联合对抗我'。对于我的每个可能行动，假设每个对手选择对我最不利的行动，然后选择使最坏结果最好的行动（Maximin 策略）。"
        },
        {
            type: "single",
            question: "以下哪种消息类型在意图过滤中总是允许通过（不涉及具体承诺检查）？",
            options: [
                "promise_support",
                "propose_attack",
                "accept",
                "threat"
            ],
            answer: 2,
            explanation: "在 check_commitment() 中，accept 类型直接返回 True（'接受不需要行动检查，但更新信念'）。promise_support 和 propose_attack 需要检查 planned_action 是否匹配。"
        },

        // ===== 多选题 (6道) =====
        {
            type: "multi",
            question: "Cicero 双系统架构包含哪些核心组件？（多选）",
            options: [
                "语言模型（负责生成/理解谈判文本）",
                "战略规划模型（负责评估棋局、选择行动）",
                "意图过滤（确保承诺与行动一致）",
                "记忆系统（记录历史交互）",
                "情感分析模块（检测玩家情绪）",
                "信誉评估器（计算长期信任度）"
            ],
            answer: [0, 1, 2],
            explanation: "Cicero 的核心创新是双系统+意图过滤：语言模型负责'说什么'，战略规划模型负责'做什么'，意图过滤确保'说做一致'。本实验简化了记忆系统和信誉评估，但核心架构只有这三个组件。"
        },
        {
            type: "multi",
            question: "本实验中的 ActionType 包含哪些行动类型？（多选）",
            options: [
                "MOVE（移动到相邻领土）",
                "HOLD（原地防守）",
                "SUPPORT（支持盟友攻击）",
                "ATTACK（直接攻击）",
                "RETREAT（撤退）",
                "ALLIANCE（结盟）"
            ],
            answer: [0, 1, 2],
            explanation: "代码中 ActionType 枚举只有三种：MOVE、HOLD、SUPPORT。ATTACK 被合并到 MOVE 中（移动到敌方领土即攻击），RETREAT 和 ALLIANCE 不是行动类型而是消息类型。"
        },
        {
            type: "multi",
            question: "棋局评估函数 V(s) 考虑了哪些因素？（多选）",
            options: [
                "自己控制的领土价值（权重×2）",
                "敌方控制的领土价值（权重×0.5 减分）",
                "单位到中心 T2 的距离（越近越好）",
                "当前轮数",

    // ==================== 状态管理 ====================
    let currentIndex = 0;
    let userAnswers = new Array(allQuestions.length).fill(null);
    let checked = new Array(allQuestions.length).fill(false);
    let score = 0;
    let overviewFilter = 'all';

    // ==================== 初始化 ====================
    function init() {
        renderQuestion(currentIndex);
        updateProgress();
        renderOverview();
    }

    // ==================== 渲染题目 ====================
    function renderQuestion(index) {
        const q = allQuestions[index];
        const container = document.getElementById('quizContainer');
        let html = '';

        if (q.type === 'single') {
            html = renderSingle(q, index);
        } else if (q.type === 'multi') {
            html = renderMulti(q, index);
        } else if (q.type === 'tf') {
            html = renderTF(q, index);
        } else if (q.type === 'drag') {
            html = renderDrag(q, index);
        }

        container.innerHTML = html;
        restoreAnswer(index);
        if (checked[index]) showFeedback(index);

        document.getElementById('prevBtn').disabled = index === 0;
        document.getElementById('nextBtn').disabled = index === allQuestions.length - 1;
    }

    function renderSingle(q, idx) {
        const labels = ['A', 'B', 'C', 'D'];
        let optionsHtml = q.options.map((opt, i) => `
            <label class="option" data-idx="${i}" onclick="selectSingle(${idx}, ${i})">
                <input type="radio" name="q${idx}" value="${i}" ${userAnswers[idx] === i ? 'checked' : ''}>
                <span class="option-label">${labels[i]}.</span>
                <span>${opt}</span>
            </label>
        `).join('');

        return `
            <div class="card" id="qcard-${idx}">
                <div class="card-title">
                    <span class="q-number">${idx + 1}</span>
                    <span>${q.question}</span>
                    <span class="q-type">单选题</span>
                </div>
                <div class="options">${optionsHtml}</div>
                <div class="feedback" id="feedback-${idx}">
                    <div class="feedback-title"></div>
                    <div class="feedback-text"></div>
                </div>
            </div>
        `;
    }

    function renderMulti(q, idx) {
        const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
        let optionsHtml = q.options.map((opt, i) => `
            <label class="option" data-idx="${i}" onclick="toggleMulti(${idx}, ${i})">
                <input type="checkbox" name="q${idx}" value="${i}" ${(userAnswers[idx] || []).includes(i) ? 'checked' : ''}>
                <span class="option-label">${labels[i]}.</span>
                <span>${opt}</span>
            </label>
        `).join('');

        return `
            <div class="card" id="qcard-${idx}">
                <div class="card-title">
                    <span class="q-number">${idx + 1}</span>
                    <span>${q.question}</span>
                    <span class="q-type">多选题</span>
                </div>
                <div class="options">${optionsHtml}</div>
                <div class="feedback" id="feedback-${idx}">
                    <div class="feedback-title"></div>
                    <div class="feedback-text"></div>
                </div>
            </div>
        `;
    }

    function renderTF(q, idx) {
        const selected = userAnswers[idx];
        return `
            <div class="card" id="qcard-${idx}">
                <div class="card-title">
                    <span class="q-number">${idx + 1}</span>
                    <span>${q.question}</span>
                    <span class="q-type">判断题</span>
                </div>
                <div class="true-false-options">
                    <div class="tf-option ${selected === true ? 'selected' : ''}" onclick="selectTF(${idx}, true)">
                        ✓ 是（正确）
                    </div>
                    <div class="tf-option ${selected === false ? 'selected' : ''}" onclick="selectTF(${idx}, false)">
                        ✗ 否（错误）
                    </div>
                </div>
                <div class="feedback" id="feedback-${idx}">
                    <div class="feedback-title"></div>
                    <div class="feedback-text"></div>
                </div>
            </div>
        `;
    }

    function renderDrag(q, idx) {
        const ans = userAnswers[idx] || [];
        let sentenceHtml = '';
        let blankIdx = 0;

        for (const seg of q.segments) {
            if (seg === 'BLANK') {
                const val = ans[blankIdx] || '';
                sentenceHtml += `<span class="drop-zone ${val ? 'filled' : ''}" data-blank="${blankIdx}" ondrop="drop(event, ${idx}, ${blankIdx})" ondragover="allowDrop(event)">${val || '拖拽填入'}</span>`;
                blankIdx++;
            } else {
                sentenceHtml += seg;
            }
        }

        const used = new Set(ans);
        const poolItems = q.options.map((opt, i) => {
            const disabled = used.has(opt) ? 'style="opacity:0.4;pointer-events:none;"' : '';
            return `<span class="draggable-item" draggable="true" ondragstart="drag(event, '${opt}')" ${disabled}>${opt}</span>`;
        }).join('');

        return `
            <div class="card" id="qcard-${idx}">
                <div class="card-title">
                    <span class="q-number">${idx + 1}</span>
                    <span>${q.question}</span>
                    <span class="q-type">拖拽填空</span>
                </div>
                <div class="fill-sentence">${sentenceHtml}</div>
                <div class="drag-pool">${poolItems}</div>
                <div class="feedback" id="feedback-${idx}">
                    <div class="feedback-title"></div>
                    <div class="feedback-text"></div>
                </div>
            </div>
        `;
    }

    // ==================== 交互逻辑 ====================
    function selectSingle(idx, optIdx) {
        if (checked[idx]) return;
        userAnswers[idx] = optIdx;
        const options = document.querySelectorAll(`#qcard-${idx} .option`);
        options.forEach((el, i) => {
            el.classList.toggle('selected', i === optIdx);
            el.querySelector('input').checked = i === optIdx;
        });
        updateProgress();
        renderOverview();
    }

    function toggleMulti(idx, optIdx) {
        if (checked[idx]) return;
        if (!userAnswers[idx]) userAnswers[idx] = [];
        const arr = userAnswers[idx];
        const pos = arr.indexOf(optIdx);
        if (pos > -1) arr.splice(pos, 1);
        else arr.push(optIdx);
        arr.sort();

        const options = document.querySelectorAll(`#qcard-${idx} .option`);
        options.forEach((el, i) => {
            el.classList.toggle('selected', arr.includes(i));
            el.querySelector('input').checked = arr.includes(i);
        });
        updateProgress();
        renderOverview();
    }

    function selectTF(idx, val) {
        if (checked[idx]) return;
        userAnswers[idx] = val;
        const options = document.querySelectorAll(`#qcard-${idx} .tf-option`);
        options[0].classList.toggle('selected', val === true);
        options[1].classList.toggle('selected', val === false);
        updateProgress();
        renderOverview();
    }

    // ==================== 拖拽逻辑 ====================
    function drag(ev, text) {
        ev.dataTransfer.setData('text', text);
        ev.target.classList.add('dragging');
    }

    function allowDrop(ev) {
        ev.preventDefault();
        ev.target.classList.add('drag-over');
    }

    function drop(ev, qIdx, blankIdx) {
        ev.preventDefault();
        const text = ev.dataTransfer.getData('text');
        if (!userAnswers[qIdx]) userAnswers[qIdx] = [];
        userAnswers[qIdx][blankIdx] = text;
        renderQuestion(qIdx);
        updateProgress();
        renderOverview();
    }

    document.addEventListener('dragend', (e) => {
        if (e.target.classList.contains('draggable-item')) {
            e.target.classList.remove('dragging');
        }
    });

    document.addEventListener('dragleave', (e) => {
        if (e.target.classList.contains('drop-zone')) {
            e.target.classList.remove('drag-over');
        }
    });

    // ==================== 检查答案 ====================
    function checkAnswer() {
        const idx = currentIndex;
        const q = allQuestions[idx];
        let isCorrect = false;

        if (q.type === 'single') {
            isCorrect = userAnswers[idx] === q.answer;
            highlightSingle(idx, q.answer, userAnswers[idx]);
        } else if (q.type === 'multi') {
            const user = userAnswers[idx] || [];
            isCorrect = arraysEqual(user, q.answer);
            highlightMulti(idx, q.answer, user);
        } else if (q.type === 'tf') {
            isCorrect = userAnswers[idx] === q.answer;
            highlightTF(idx, q.answer, userAnswers[idx]);
        } else if (q.type === 'drag') {
            const user = userAnswers[idx] || [];
            isCorrect = arraysEqual(user, q.answers);
            highlightDrag(idx, q.answers, user);
        }

        checked[idx] = true;
        showFeedback(idx, isCorrect);
        updateScore();
        renderOverview();
    }

    function highlightSingle(idx, correct, user) {
        const options = document.querySelectorAll(`#qcard-${idx} .option`);
        options.forEach((el, i) => {
            el.classList.remove('selected');
            if (i === correct) el.classList.add('correct-answer');
            if (i === user && i !== correct) el.classList.add('wrong');
        });
    }

    function highlightMulti(idx, correct, user) {
        const options = document.querySelectorAll(`#qcard-${idx} .option`);
        options.forEach((el, i) => {
            el.classList.remove('selected');
            if (correct.includes(i)) el.classList.add('correct-answer');
            if (user.includes(i) && !correct.includes(i)) el.classList.add('wrong');
        });
    }

    function highlightTF(idx, correct, user) {
        const options = document.querySelectorAll(`#qcard-${idx} .tf-option`);
        options.forEach((el, i) => {
            const val = i === 0;
            el.classList.remove('selected');
            if (val === correct) el.classList.add('correct');
            if (val === user && val !== correct) el.classList.add('wrong');
        });
    }

    function highlightDrag(idx, correct, user) {
        const zones = document.querySelectorAll(`#qcard-${idx} .drop-zone`);
        zones.forEach((el, i) => {
            el.classList.remove('filled');
            if (user[i] === correct[i]) el.classList.add('filled');
            else el.classList.add('wrong-fill');
        });
    }

    function showFeedback(idx, isCorrect) {
        const fb = document.getElementById(`feedback-${idx}`);
        const q = allQuestions[idx];
        fb.classList.add('show');
        fb.classList.remove('correct', 'wrong');
        fb.classList.add(isCorrect ? 'correct' : 'wrong');
        fb.querySelector('.feedback-title').textContent = isCorrect ? '✓ 回答正确' : '✗ 回答错误';
        fb.querySelector('.feedback-text').textContent = q.explanation;
    }

    // ==================== 导航 ====================
    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
            updateProgress();
        }
    }

    function nextQuestion() {
        if (currentIndex < allQuestions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
            updateProgress();
        } else {
            showResult();
        }
    }

    function jumpToQuestion(idx) {
        currentIndex = idx;
        renderQuestion(idx);
        updateProgress();
        toggleOverview(false);
    }

    // ==================== 进度与得分 ====================
    function updateProgress() {
        const answered = userAnswers.filter(a => a !== null && (Array.isArray(a) ? a.length > 0 : true)).length;
        const pct = (answered / allQuestions.length) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = `${currentIndex + 1} / ${allQuestions.length} (${answered} 已答)`;
    }

    function updateScore() {
        let total = 0;
        for (let i = 0; i < allQuestions.length; i++) {
            if (!checked[i]) continue;
            const q = allQuestions[i];
            if (q.type === 'single') {
                if (userAnswers[i] === q.answer) total++;
            } else if (q.type === 'multi') {
                if (arraysEqual(userAnswers[i] || [], q.answer)) total += 2;
            } else if (q.type === 'tf') {
                if (userAnswers[i] === q.answer) total++;
            } else if (q.type === 'drag') {
                if (arraysEqual(userAnswers[i] || [], q.answers)) total += 2;
            }
        }
        score = total;
        document.getElementById('scoreBadge').textContent = `得分: ${score}`;
    }

    // ==================== 总览面板 ====================
    function toggleOverview(force) {
        const card = document.getElementById('overviewCard');
        if (force !== undefined) {
            card.classList.toggle('hidden', !force);
        } else {
            card.classList.toggle('hidden');
        }
    }

    function filterOverview(type) {
        overviewFilter = type;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderOverview();
    }

    function renderOverview() {
        const grid = document.getElementById('overviewGrid');
        let html = '';
        for (let i = 0; i < allQuestions.length; i++) {
            let status = 'unanswered';
            if (checked[i]) {
                const q = allQuestions[i];
                let isCorrect = false;
                if (q.type === 'single') isCorrect = userAnswers[i] === q.answer;
                else if (q.type === 'multi') isCorrect = arraysEqual(userAnswers[i] || [], q.answer);
                else if (q.type === 'tf') isCorrect = userAnswers[i] === q.answer;
                else if (q.type === 'drag') isCorrect = arraysEqual(userAnswers[i] || [], q.answers);
                status = isCorrect ? 'correct' : 'wrong';
            }
            if (overviewFilter !== 'all' && status !== overviewFilter) continue;
            const symbols = { correct: '✓', wrong: '✗', unanswered: '?' };
            html += `<div class="overview-item ${status}" onclick="jumpToQuestion(${i})">${i + 1}${symbols[status]}</div>`;
        }
        grid.innerHTML = html;
    }

    // ==================== 结果页 ====================
    function showResult() {
        document.getElementById('quizContainer').classList.add('hidden');
        document.getElementById('navButtons').classList.add('hidden');
        document.getElementById('overviewCard').classList.add('hidden');
        document.getElementById('resultCard').classList.remove('hidden');

        let singleCorrect = 0, singleTotal = 0;
        let multiCorrect = 0, multiTotal = 0;
        let tfCorrect = 0, tfTotal = 0;
        let dragCorrect = 0, dragTotal = 0;

        for (let i = 0; i < allQuestions.length; i++) {
            const q = allQuestions[i];
            let isCorrect = false;
            if (q.type === 'single') {
                singleTotal++;
                if (userAnswers[i] === q.answer) { isCorrect = true; singleCorrect++; }
            } else if (q.type === 'multi') {
                multiTotal++;
                if (arraysEqual(userAnswers[i] || [], q.answer)) { isCorrect = true; multiCorrect++; }
            } else if (q.type === 'tf') {
                tfTotal++;
                if (userAnswers[i] === q.answer) { isCorrect = true; tfCorrect++; }
            } else if (q.type === 'drag') {
                dragTotal++;
                if (arraysEqual(userAnswers[i] || [], q.answers)) { isCorrect = true; dragCorrect++; }
            }
        }

        const maxScore = singleTotal * 1 + multiTotal * 2 + tfTotal * 1 + dragTotal * 2;
        document.getElementById('finalScore').textContent = score;
        document.getElementById('statSingle').textContent = `${singleCorrect}/${singleTotal}`;
        document.getElementById('statMulti').textContent = `${multiCorrect}/${multiTotal}`;
        document.getElementById('statTF').textContent = `${tfCorrect}/${tfTotal}`;
        document.getElementById('statDrag').textContent = `${dragCorrect}/${dragTotal}`;

        const pct = maxScore > 0 ? (score / maxScore) * 100 : 0;
        let msg = '';
        if (pct >= 90) msg = '太棒了！你对 Cicero 架构的理解非常深入！🎉';
        else if (pct >= 70) msg = '不错！大部分概念已掌握，再巩固一下细节。💪';
        else if (pct >= 50) msg = '基础已有，建议重新阅读实验文档的重点部分。📚';
        else msg = '需要加强学习哦，建议仔细阅读实验文档后再来挑战。📝';
        document.getElementById('resultMessage').textContent = msg;
    }

    function backToReview() {
        document.getElementById('resultCard').classList.add('hidden');
        document.getElementById('quizContainer').classList.remove('hidden');
        document.getElementById('navButtons').classList.remove('hidden');
        currentIndex = 0;
        renderQuestion(0);
        updateProgress();
    }

    function continueQuiz() {
        backToReview();
    }

    // ==================== 重置 ====================
    function resetAll() {
        currentIndex = 0;
        userAnswers = new Array(allQuestions.length).fill(null);
        checked = new Array(allQuestions.length).fill(false);
        score = 0;
        document.getElementById('scoreBadge').textContent = '得分: 0';
        document.getElementById('resultCard').classList.add('hidden');
        document.getElementById('quizContainer').classList.remove('hidden');
        document.getElementById('navButtons').classList.remove('hidden');
        document.getElementById('overviewCard').classList.add('hidden');
        renderQuestion(0);
        updateProgress();
        renderOverview();
    }

    // ==================== 洗牌 ====================
    function shuffleOptions() {
        const q = allQuestions[currentIndex];
        if (q.type === 'drag') {
            q.options = fisherYates([...q.options]);
            renderQuestion(currentIndex);
        } else if (q.type === 'single' || q.type === 'multi') {
            const oldToNew = {};
            const newOptions = [];
            const indices = fisherYates([...Array(q.options.length).keys()]);
            indices.forEach((oldIdx, newIdx) => {
                oldToNew[oldIdx] = newIdx;
                newOptions.push(q.options[oldIdx]);
            });
            q.options = newOptions;
            if (q.type === 'single') {
                q.answer = oldToNew[q.answer];
            } else {
                q.answer = q.answer.map(a => oldToNew[a]).sort((a, b) => a - b);
            }
            if (userAnswers[currentIndex] !== null) {
                if (q.type === 'single') {
                    userAnswers[currentIndex] = oldToNew[userAnswers[currentIndex]];
                } else {
                    userAnswers[currentIndex] = userAnswers[currentIndex].map(a => oldToNew[a]).sort((a, b) => a - b);
                }
            }
            renderQuestion(currentIndex);
        }
    }

    function fisherYates(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ==================== 工具函数 ====================
    function arraysEqual(a, b) {
        if (!a || !b) return false;
        if (a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) {
            if (a[i] !== b[i]) return false;
        }
        return true;
    }

    function restoreAnswer(idx) {
        // 答案恢复已在 renderQuestion 中处理
    }

    // ==================== 启动 ====================
    init();
    </script>
